:root {

  font-feature-settings: 'ss01';

.app { max-width: 80rem; margin: 0 auto; padding-bottom: 4rem; }

/* ---------- Header (dark color block, poster look) ---------- */
.masthead {
  position: relative;
  overflow: hidden;
  background: var(--gray-900);
  color: #fff;
  padding: 2.5rem 2.5rem 2rem;
}
.masthead__deco { position: absolute; inset: 0; pointer-events: none; }
.masthead__deco span {
  position: absolute; border-radius: 9999px; opacity: 0.06; background: #fff;
}
.masthead__deco .c1 { width: 22rem; height: 22rem; right: -6rem; top: -9rem; }
.masthead__deco .c2 { width: 12rem; height: 12rem; right: 9rem; bottom: -6rem; opacity: 0.05; }
.masthead__deco .sq {
  position: absolute; width: 10rem; height: 10rem; left: 40%; top: -4rem;
  background: var(--primary); opacity: 0.10; transform: rotate(20deg); border-radius: var(--radius-lg);
}
.masthead__row { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand__mark { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.brand__mark .dot { color: var(--primary); }
.brand__tag { margin-top: 0.4rem; color: #d1d5db; font-weight: 500; letter-spacing: 0.01em; }

.toolbar { display: flex; gap: 0.6rem; }
.btn {
  font-family: inherit; font-weight: 600; font-size: 0.9rem; border: 0; cursor: pointer;
  border-radius: var(--radius-md); padding: 0 1.1rem; height: 2.75rem;
  display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap;
  transition: all 200ms ease;
}
.btn svg { width: 1.05rem; height: 1.05rem; flex: none; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary); }
.btn--primary { background: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-600); transform: scale(1.05); }
.btn--ghost { background: rgba(255,255,255,0.12); color: #fff; }
.btn--ghost:hover { background: rgba(255,255,255,0.22); transform: scale(1.05); }

/* meta chips */
.chips { position: relative; display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.45rem;
  background: rgba(255,255,255,0.1); color: #f9fafb; font-weight: 500; font-size: 0.85rem;
  padding: 0.4rem 0.8rem; border-radius: 9999px;
}
.chip svg { width: 1rem; height: 1rem; }
.chip--on { background: var(--secondary); color: #052e21; font-weight: 600; }
.chip--off { background: rgba(255,255,255,0.1); }

/* ---------- Section scaffolding ---------- */
.section { padding: 2rem 2.5rem 0; }
.section__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.1rem; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: var(--gray-500); }
.section__title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }

/* ---------- Score cards (color blocks) ---------- */
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
.card {
  border-radius: var(--radius-lg); padding: 1.75rem; border: 0;
  transition: transform 200ms ease, background-color 200ms ease;

.card:hover { transform: scale(1.02); }
.card--memory { background: var(--primary-50); }
.card--memory:hover { background: #dbeafe; }
.card--perf { background: var(--secondary-50); }
.card--perf:hover { background: #d1fae5; }
.card--ready { background: var(--accent-50); }

.card__top { display: flex; align-items: center; gap: 0.85rem; margin-bottom: 1.1rem; }

.metric__num { font-size: 3.6rem; font-weight: 800; letter-spacing: -0.03em; }
.metric__unit { font-size: 1.2rem; font-weight: 700; color: var(--gray-500); padding-bottom: 0.55rem; }
.metric--memory .metric__num { color: var(--primary-600); }
.metric--perf .metric__num { color: var(--secondary-600); }
.metric--ready .metric__num { color: var(--accent-600); }

.range { margin-top: 0.55rem; font-weight: 600; color: var(--fg); }
.range .muted { color: var(--gray-500); font-weight: 500; }

.badge {
  display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 1rem;
  font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 0.3rem 0.7rem; border-radius: 9999px;

.badge--high { background: var(--secondary); color: #052e21; }
.badge--medium { background: var(--accent); color: #442c04; }
.badge--low { background: var(--muted-200); color: #374151; }
.badge--insufficient { background: #1f2937; color: #fff; }

.reasons { list-style: none; margin-top: 1.1rem; display: grid; gap: 0.4rem; }
.reasons li { position: relative; padding-left: 1rem; color: #374151; font-size: 0.9rem; font-weight: 400; }
.reasons li::before { content: ""; position: absolute; left: 0; top: 0.55rem; width: 0.4rem; height: 0.4rem; border-radius: 9999px; background: currentColor; opacity: 0.4; }

/* abstain state */
.abstain__title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--accent-600); }
.abstain__lead { margin-top: 0.4rem; color: #374151; font-weight: 500; }

/* ---------- Coverage ---------- */
.coverage { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.25rem; align-items: start; }
.coverblock { background: var(--muted); border-radius: var(--radius-lg); padding: 1.75rem; }
.cover__overall { display: flex; align-items: baseline; gap: 0.6rem; }
.cover__num { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; }
.cover__of { color: var(--gray-500); font-weight: 600; }
.bars { margin-top: 1.4rem; display: grid; gap: 1.05rem; }
.bar__head { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem; }
.bar__track { height: 0.9rem; background: var(--muted-200); border-radius: 9999px; overflow: hidden; }
.bar__fill { height: 100%; border-radius: 9999px; transition: width 300ms ease; }
.bar--chem_phys .bar__fill { background: var(--primary); }
.bar--bio_biochem .bar__fill { background: var(--secondary); }
.bar--psych_soc .bar__fill { background: var(--accent); }

/* best next topic block (bold accent) */
.nextblock { background: var(--gray-900); color: #fff; border-radius: var(--radius-lg); padding: 1.75rem; position: relative; overflow: hidden; }
.nextblock .deco { position: absolute; width: 12rem; height: 12rem; right: -4rem; bottom: -5rem; border-radius: 9999px; background: var(--accent); opacity: 0.14; }
.nextblock__eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: #9ca3af; }
.nextblock__title { position: relative; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.5rem; }
.nextblock__meta { position: relative; margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tag { background: rgba(255,255,255,0.12); color: #fff; font-weight: 600; font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 9999px; }
.tag--accent { background: var(--accent); color: #442c04; }

/* ---------- readiness sections mini-bars ---------- */
.subsections { margin-top: 1.25rem; display: grid; gap: 0.95rem; }
.subrow { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
.subrow__label { font-weight: 600; font-size: 0.95rem; }
.subrow__score { display: flex; align-items: baseline; gap: 0.55rem; }
.subrow__val { font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; color: var(--accent-600); }
.subrow__range { color: var(--gray-500); font-weight: 500; font-size: 0.85rem; }

/* ---------- footer note ---------- */
.note { margin: 2rem 2.5rem 0; background: var(--muted); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; display: flex; gap: 0.85rem; align-items: flex-start; }
.note svg { width: 1.25rem; height: 1.25rem; color: var(--gray-500); flex: none; margin-top: 0.1rem; }
.note p { color: #374151; font-weight: 500; font-size: 0.92rem; }
.note b { font-weight: 700; color: var(--fg); }

.footmeta { margin: 1.25rem 2.5rem 0; color: var(--gray-500); font-size: 0.82rem; font-weight: 500; display: flex; gap: 1rem; flex-wrap: wrap; }

@media (max-width: 900px) {
  .scores { grid-template-columns: 1fr; }
  .coverage { grid-template-columns: 1fr; }
}
