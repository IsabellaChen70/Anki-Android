/* Vantage dashboard. Flat Design system (no shadows, color blocks, Outfit). */

:root {
  --bg: #ffffff;
  --fg: #111827;
  --primary: #3b82f6;
  --primary-600: #2563eb;
  --primary-50: #eff6ff;
  --secondary: #10b981;
  --secondary-600: #059669;
  --secondary-50: #ecfdf5;
  --accent: #f59e0b;
  --accent-600: #d97706;
  --accent-50: #fffbeb;
  --muted: #f3f4f6;
  --muted-200: #e5e7eb;
  --border: #e5e7eb;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-900: #111827;
  /* Reasoning + primary call-to-action purple (previously hardcoded in a few
     buttons; named here so the redesign's tiles and CTAs stay consistent). */
  --cars: #7c3aed;
  --cars-600: #6d28d9;
  /* "At risk / red" state (Tailwind red family, matching the -50/-500/-600 pattern
     the rest of the palette uses). Fill = 500, text/value = 600, banner bg = 50,
     pill bg = 100, subtle border = 200. */
  --danger: #ef4444;
  --danger-600: #dc2626;
  --danger-50: #fef2f2;
  --danger-100: #fee2e2;
  --danger-200: #fecaca;
  /* Accessible text shades: the -600 colors are fine for buttons and large numbers
     (>= 3:1), but small colored text (pills, chips, bar values, eyebrows) needs the
     deeper -700 shades to clear 4.5:1 on the light/tinted fills. --gray-600 is the
     readable secondary-text grey (the -500 grey dips just under 4.5:1 on --muted). */
  --danger-700: #b91c1c;
  --accent-700: #b45309;
  --secondary-700: #047857;
  --gray-600: #4b5563;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-2xl: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01';
  /* Stops the phone WebView's stretch overscroll (Android 12+) from elongating
     the page as you scroll past the top or bottom. No effect on desktop. */
  overscroll-behavior: none;
}

.app { padding-bottom: 4rem; }
/* The masthead spans the full window width; everything below it stays in a
   centered reading column so lines don't stretch across a wide monitor. */
.app__body { max-width: 80rem; margin: 0 auto; }

/* ---------- Header (dark color block, poster look) ---------- */
.masthead {
  position: relative;
  overflow: hidden;
  background: var(--gray-900);
  color: #fff;
  /* Full-bleed banner: fills the window width, but its content lines up with the
     centered body column -- side padding grows to match the column on wide screens
     and floors at 2.5rem on narrow ones. Uses % (of .app = body width, excludes the
     scrollbar) rather than vw, so it never triggers a horizontal scrollbar. */
  padding: 2.5rem max(2.5rem, calc((100% - 80rem) / 2 + 2.5rem)) 2rem;
}
.masthead__deco { position: absolute; inset: 0; pointer-events: none; }
.masthead__deco span {
  position: absolute; border-radius: 9999px; opacity: 0.06; background: #fff;
}
.masthead__deco .c1 { width: 22rem; height: 22rem; right: -6rem; top: -9rem; }
.masthead__deco .c2 { width: 12rem; height: 12rem; right: 9rem; bottom: -6rem; opacity: 0.05; }
.masthead__deco .sq {
  position: absolute; width: 10rem; height: 10rem; left: 40%; top: -4rem;
  background: var(--primary); opacity: 0.10; transform: rotate(20deg); border-radius: var(--radius-lg);
}
.masthead__row { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand__mark { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.brand__mark .dot { color: var(--primary); }

.toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.btn {
  font-family: inherit; font-weight: 600; font-size: 0.9rem; border: 0; cursor: pointer;
  border-radius: var(--radius-md); padding: 0 1.1rem; height: 2.75rem;
  display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap;
  transition: background-color 150ms ease;
}
.btn svg { width: 1.05rem; height: 1.05rem; flex: none; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary); }
.btn--primary { background: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-600); }
.btn--ghost { background: rgba(255,255,255,0.12); color: #fff; }
.btn--ghost:hover { background: rgba(255,255,255,0.22); }
.btn--practice { background: #7c3aed; color: #fff; }
.btn--practice:hover { background: #6d28d9; }

/* meta chips */
.chips { position: relative; display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.45rem;
  background: rgba(255,255,255,0.1); color: #f9fafb; font-weight: 500; font-size: 0.85rem;
  padding: 0.4rem 0.8rem; border-radius: 9999px;
}
.chip svg { width: 1rem; height: 1rem; }

/* ---------- Section scaffolding ---------- */
.section { padding: 2rem 2.5rem 0; }
.section__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.1rem; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: var(--gray-500); }
.section__title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
/* Top-level group headers (e.g. "Knowledge check") take the product's uppercase tracked
   label register so they read as a tier above the mixed-case panel titles inside them. */
.section__title--group { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray-900); }

/* ---------- Score cards (color blocks) ----------
   Rebalanced: Memory + Performance stack in a narrower left column, Readiness gets
   the wider right column, all three settling to the same height. Collapses to one
   column on mobile (see the max-width:900 block below). */
.scores { display: grid; grid-template-columns: 1fr 1.25fr; gap: 1.25rem; align-items: stretch; }
.scorestack { display: flex; flex-direction: column; gap: 0.9rem; }
.scorestack > .card { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0.9rem 1.4rem; }
.card {
  border-radius: var(--radius-lg); padding: 1.2rem 1.5rem; border: 0;
}
.card--memory { background: var(--primary-50); }
.card--perf { background: var(--secondary-50); }
.card--ready { background: var(--accent-50); }
.card--abstain { background: var(--muted); }

.card__top { display: flex; align-items: center; gap: 0.85rem; margin-bottom: 1.1rem; }
.iconwrap {
  width: 3.25rem; height: 3.25rem; border-radius: 9999px; background: #fff;
  display: grid; place-items: center; flex: none;
}
.iconwrap svg { width: 1.6rem; height: 1.6rem; stroke-width: 2.4; }
.i-memory { color: var(--primary-600); }
.i-perf { color: var(--secondary-600); }
.i-ready { color: var(--accent-600); }
.i-abstain { color: var(--gray-500); }
/* Card labels stand out (800 / near-black) so the score names read as a tier above
   their quiet sub-lines, per the redesign. */
.card__label { text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; font-size: 0.85rem; color: var(--gray-900); }
.card__sub { font-size: 0.82rem; color: var(--gray-500); font-weight: 500; }

.metricline { display: flex; align-items: center; justify-content: flex-start; gap: 0.5rem; margin-top: 0.4rem; flex-wrap: wrap; }
.metricline__val { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.card--memory .metricline__val { color: var(--primary-600); }
.card--perf .metricline__val { color: var(--secondary-600); }
.metricline__range { color: var(--gray-600); font-weight: 500; font-size: 0.95rem; }

/* Confidence chip, shown inline to the right of the score % (and at the foot of the
   Readiness card). One line; colored by confidence level. Keeps the honest
   "Confidence: <level> - <n> <unit>" content the meta() line used to carry. */
.confchip { margin-left: auto; background: #fff; border-radius: var(--radius-lg); padding: 0.55rem 0.8rem; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.confchip--high { color: var(--secondary-700); }
.confchip--medium { color: var(--accent-700); }
.confchip--low { color: var(--gray-600); }
.confchip--insufficient { color: #374151; }
.card--ready .confchip { margin-left: 0; margin-top: 0.5rem; display: inline-block; align-self: flex-start; }

.reasons { list-style: none; margin-top: 1.1rem; display: grid; gap: 0.4rem; }
.reasons li { position: relative; padding-left: 1rem; color: #374151; font-size: 0.9rem; font-weight: 400; }
.reasons li::before { content: ""; position: absolute; left: 0; top: 0.55rem; width: 0.4rem; height: 0.4rem; border-radius: 9999px; background: currentColor; opacity: 0.4; }

/* confidence ("how sure") + coverage, shown on every score */
.cardmeta { margin-top: 1.1rem; display: grid; gap: 0.35rem; }
.conf { font-weight: 700; font-size: 0.9rem; }
.conf--high { color: var(--secondary-600); }
.conf--medium { color: var(--accent-600); }
.conf--low { color: #6b7280; }
.conf--insufficient { color: #374151; }
.cover { color: var(--gray-500); font-weight: 500; font-size: 0.85rem; }

/* abstain state */
.abstain__title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--accent-600); }
.abstain__lead { margin-top: 0.4rem; color: #374151; font-weight: 500; }
.card__cta {
  margin-top: 1.1rem; font-family: inherit; font-weight: 700; font-size: 0.9rem; color: #fff;
  background: #7c3aed; border: 0; border-radius: var(--radius-md); padding: 0.6rem 1.1rem; cursor: pointer;
}
.card__cta:hover { background: #6d28d9; }
.card__cta:focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }

/* ---------- Coverage ---------- */
/* Two panels kept at one shared height: the grid stretches both columns to the
   taller one, so the light coverage panel and the dark study-next panel always end
   level. Either side can grow or shrink when its "see all / show fewer" button is
   tapped, and the shared height re-settles to whichever side is taller in the new
   state. Each panel is a vertical column with its trailing button dropped to the
   bottom, so the spare height on the shorter side reads as padding under a
   bottom-aligned button instead of a gap after it. */
.coverage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.25rem; align-items: stretch; }
.coverage > .coverblock, .coverage > .nextblock { display: flex; flex-direction: column; }
/* Left panel: the topics-left list is nested, so let it and its list fill the spare
   height and drop the show-more to the bottom. The list's 0.5rem flex gap keeps the
   spacing above the button. */
.coverage > .coverblock > .tgaps { flex: 1 1 auto; display: flex; flex-direction: column; }
.coverage .tgaps__list { flex: 1 1 auto; display: flex; flex-direction: column; }
.coverage .tgapsmore { margin-top: auto; }
/* Right panel: the show-more is already a direct child, so let the queue stack take
   the spare height (rows stay top-packed) and the button keeps its own top gap. */
.coverage .nextstack { flex: 1 1 auto; align-content: start; }
.coverblock { background: var(--muted); border-radius: var(--radius-lg); padding: 1.75rem; }
.cover__overall { display: flex; align-items: baseline; gap: 0.6rem; }
.cover__num { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; }
.cover__of { color: var(--gray-500); font-weight: 600; }
/* Section coverage: a small subject-colored dot, the section name in quiet grey,
   and its percentage in the matching subject color (the per-subject palette used
   across the dashboard). No progress bar, just a quiet summary under the headline. */
.cover__sections { margin-top: 1.15rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.75rem; }
.cover__sec { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.92rem; }
.cover__sec-dot { flex: none; align-self: center; width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: var(--muted-200); }
.cover__sec-name { color: var(--gray-500); font-weight: 600; }
.cover__sec-pct { font-weight: 700; font-variant-numeric: tabular-nums; }
/* Per-subject color, matching the .tgap--/.nextrow--/.srow-- section palette. */
.cover__sec--chem_phys .cover__sec-dot { background: var(--primary); }
.cover__sec--chem_phys .cover__sec-pct { color: var(--primary); }
.cover__sec--bio_biochem .cover__sec-dot { background: var(--secondary); }
.cover__sec--bio_biochem .cover__sec-pct { color: var(--secondary); }
.cover__sec--psych_soc .cover__sec-dot { background: var(--accent); }
.cover__sec--psych_soc .cover__sec-pct { color: var(--accent); }

/* Topics left to study: one compact row per area (id + name, the covered/total
   count, and, on the desktop add-on, an inline Generate button). The only color is
   a subtle section-tinted left edge, matching the study-next rows. */
.tgaps { margin-top: 1.6rem; display: grid; gap: 0.6rem; }
.tgaps__head { font-weight: 700; font-size: 0.9rem; color: var(--gray-500); }
.tgaps__note { font-size: 0.8rem; color: var(--gray-500); font-weight: 500; line-height: 1.45; margin: -0.15rem 0 0.15rem; }
.tgaps__list { display: grid; gap: 0.5rem; }
.tgap { min-width: 0; display: flex; align-items: center; gap: 0.7rem; background: var(--muted); border-radius: var(--radius-md); border-left: 3px solid var(--muted-200); padding: 0.5rem 0.7rem; }
.tgap--chem_phys { border-left-color: var(--primary); }
.tgap--bio_biochem { border-left-color: var(--secondary); }
.tgap--psych_soc { border-left-color: var(--accent); }
.tgap__name { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; font-weight: 600; }
.tgap__name b { font-weight: 800; margin-right: 0.35rem; }
.tgap__count { flex: none; font-size: 0.8rem; color: var(--gray-500); font-weight: 600; font-variant-numeric: tabular-nums; }
.tgapsmore { margin-top: 0.1rem; width: 100%; background: transparent; color: var(--gray-500); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.5rem; font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.tgapsmore:hover { background: var(--muted-200); color: var(--fg); }
.tgapsmore:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary); }
.genbtn { flex: none; display: inline-flex; align-items: center; gap: 0.35rem; height: 2rem; padding: 0 0.7rem; border: 0; border-radius: var(--radius-md); cursor: pointer; background: var(--primary); color: #fff; font: inherit; font-size: 0.8rem; font-weight: 600; }
.genbtn:hover { background: var(--primary-600); }
.genbtn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary); }
.genbtn svg { width: 0.95rem; height: 0.95rem; flex: none; }

/* best next topic block (bold accent) */
.nextblock { background: var(--gray-900); color: #fff; border-radius: var(--radius-lg); padding: 1.75rem; position: relative; overflow: hidden; }
.nextblock .deco { position: absolute; width: 12rem; height: 12rem; right: -4rem; bottom: -5rem; border-radius: 9999px; background: var(--accent); opacity: 0.14; }
.nextblock__eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: #9ca3af; }
.nextblock__title { position: relative; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.5rem; }
.nextblock__meta { position: relative; margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tag { background: rgba(255,255,255,0.12); color: #fff; font-weight: 600; font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 9999px; }
.tag--accent { background: var(--accent); color: #442c04; }

/* "where to study" resource pointers inside the open queue row */
.nextblock__where { position: relative; margin: 0.1rem 0.85rem 0.9rem; padding-top: 0.85rem; border-top: 1px solid rgba(255,255,255,0.12); display: grid; gap: 0.5rem; }
.where__row { display: flex; gap: 0.6rem; align-items: baseline; font-size: 0.9rem; color: #e5e7eb; font-weight: 500; }
.where__k { flex: none; min-width: 4.75rem; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; color: #9ca3af; font-weight: 600; }
.where__val { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.where__row--book { align-items: flex-start; }
.where__book { font-weight: 600; color: #e5e7eb; }
.where__chapter { font-size: 0.82rem; color: #cbd5e1; }
.bookpick { flex: none; margin-left: auto; align-self: flex-start; max-width: 11rem;
  background: rgba(255,255,255,0.08); color: #e5e7eb; font: inherit; font-size: 0.78rem; font-weight: 600;
  border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 0.28rem 0.5rem; cursor: pointer; }
.bookpick:hover { border-color: rgba(255,255,255,0.4); }
.where__links { display: flex; flex-wrap: wrap; gap: 0.35rem 0.55rem; align-items: baseline; }
.where__sep { color: #6b7280; }
.where__cap { font-size: 0.76rem; color: #9ca3af; font-weight: 500; }
.nextblock__where a { color: #93c5fd; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
.nextblock__where a:hover { text-decoration: underline; }

/* study-next queue: a compact stack of the ranked topics. The open row expands
   with its where-to-study detail; tapping another row opens that one instead. */
.nextblock__head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; }
.nextblock__count { flex: none; font-size: 0.78rem; font-weight: 600; color: #9ca3af; font-variant-numeric: tabular-nums; }
.nextblock__title--empty { color: #e5e7eb; opacity: 0.85; }

.nextstack { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.5rem; }

.nextrow { min-width: 0; background: rgba(255,255,255,0.05); border-radius: var(--radius-md); border-left: 3px solid rgba(255,255,255,0.18); overflow: hidden; }
.nextrow--chem_phys { border-left-color: var(--primary); }
.nextrow--bio_biochem { border-left-color: var(--secondary); }
.nextrow--psych_soc { border-left-color: var(--accent); }
.nextrow--open { background: rgba(255,255,255,0.09); }

.nextrow__head { width: 100%; min-width: 0; display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.8rem; background: transparent; border: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.nextrow__head:hover { background: rgba(255,255,255,0.04); }
.nextrow__head:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5); }
.nextrow__rank { flex: none; width: 1.5rem; height: 1.5rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; background: rgba(255,255,255,0.1); color: #cbd5e1; font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.nextrow__body { min-width: 0; flex: 1 1 auto; display: grid; gap: 0.15rem; }
.nextrow__name { font-weight: 700; font-size: 0.96rem; letter-spacing: -0.01em; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nextrow__meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.6rem; font-size: 0.78rem; }
.nextrow__sec { font-weight: 600; color: #e5e7eb; }
.nextrow__state { color: #9ca3af; font-weight: 500; }
.nextrow__count { color: #9ca3af; font-weight: 500; font-variant-numeric: tabular-nums; }
.nextrow__chev { flex: none; color: #9ca3af; display: inline-flex; transition: transform 150ms ease; }
.nextrow__chev svg { width: 1rem; height: 1rem; }
.nextrow--open .nextrow__chev { transform: rotate(90deg); color: #e5e7eb; }
.nextrow--open .nextrow__name { white-space: normal; font-size: 1.06rem; }

.nextmore { position: relative; margin-top: 0.85rem; width: 100%; background: rgba(255,255,255,0.08); color: #e5e7eb; border: 0; border-radius: var(--radius-md); padding: 0.55rem; font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.nextmore:hover { background: rgba(255,255,255,0.14); }
.nextmore:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,0.5); }

/* ---------- readiness sections mini-bars ---------- */
/* 2x2 grid so the four projected section scores fill the wider Readiness column
   (collapses to one column on a phone, see the max-width:560 block). */
.card--ready { display: flex; flex-direction: column; }
.subsections { margin-top: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem 2rem; }
.subrow { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
.subrow__label { font-weight: 600; font-size: 0.95rem; }
.subrow__score { display: flex; align-items: baseline; gap: 0.55rem; }
.subrow__val { font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; color: var(--accent-600); }
.subrow__range { color: var(--gray-500); font-weight: 500; font-size: 0.85rem; }

/* ---------- Study & practice (per-section launcher) ---------- */
.studygrid { display: grid; gap: 0.75rem; }
.srow {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--muted); border-radius: var(--radius-lg); padding: 1.05rem 1.35rem;
  border-left: 4px solid var(--muted-200);
}
.srow--chem_phys { border-left-color: var(--primary); }
.srow--bio_biochem { border-left-color: var(--secondary); }
.srow--psych_soc { border-left-color: var(--accent); }
.srow--cars { border-left-color: #7c3aed; }
.srow--all { background: var(--gray-900); color: #fff; border-left-color: var(--primary); }
.srow__meta { min-width: 0; }
.srow__name { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
.srow__sub { color: var(--gray-500); font-size: 0.85rem; font-weight: 500; margin-top: 2px; }
.srow--all .srow__sub { color: #9ca3af; }
.srow__actions { display: flex; gap: 0.5rem; flex: none; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; }
.btn--study { background: var(--primary); color: #fff; }
.btn--study:hover { background: var(--primary-600); }
/* Per-section Flashcards button wrapper (a column so the button reads as a full-width row on narrow screens). */
.srow__study { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem; }
.btn--reason { background: #7c3aed; color: #fff; }
.btn--reason:hover { background: #6d28d9; }
.srow .btn { height: 2.55rem; }

/* ---- "Study now" (Feature 2) + "Your weakest area" (Feature 5) CTA pair ----
   Flexbox so a single card fills the width when its pair is deduped/absent, and
   the two sit side by side on wider viewports, stacking on narrow ones. */
.focusgrid { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.focusnow { flex: 1 1 320px; background: var(--gray-900); color: #fff; border-radius: var(--radius-lg); padding: 1.5rem 1.6rem; border-left: 5px solid var(--primary); display: flex; flex-direction: column; }
.focusnow--chem_phys { border-left-color: var(--primary); }
.focusnow--bio_biochem { border-left-color: var(--secondary); }
.focusnow--psych_soc { border-left-color: var(--accent); }
.focusnow--weak { border-left-color: #7c3aed; }
.focusnow__eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; font-weight: 700; color: #93c5fd; }
.focusnow__eyebrow--weak { color: #c4b5fd; }
.focusnow__title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.2rem; }
.focusnow__lead { color: rgba(255, 255, 255, 0.8); font-size: 0.92rem; margin: 0.5rem 0 1rem; max-width: 52ch; }
.focusnow__go { height: 2.7rem; margin-top: auto; align-self: flex-start; }
.focusnow--wait { background: var(--primary-50); color: var(--fg); border-left-color: var(--muted-200); }
.focusnow--wait .focusnow__eyebrow { color: var(--primary); }
.focusnow--wait .focusnow__lead { color: var(--gray-500); }

/* ---- Session-length chooser (Feature 3). .pchip / .psetup__num are defined in
   practice.css, which is always co-loaded with dashboard.css on both platforms. */
.vseslen { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin: 0 0 1rem; }
.vseslen__label { font-weight: 700; color: var(--gray-500); font-size: 0.9rem; }
.vseslen__chips { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.vsescustom { width: 5.5rem; }

/* ---------- exam countdown + daily plan ---------- */
.plancard { background: var(--primary-50); color: var(--fg); border-radius: var(--radius-lg); padding: 1.75rem; position: relative; overflow: hidden; }
.plan__eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: var(--gray-500); }
.plan__count { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.35rem; color: var(--fg); }
.plan__days { font-size: 2.6rem; color: var(--primary-600); }
.plan__daterow { margin-top: 0.55rem; display: flex; align-items: center; gap: 0.75rem; color: var(--gray-500); font-weight: 600; font-size: 0.9rem; }
.plan__setrow { margin-top: 0.55rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.plan__title { font-size: 1.15rem; font-weight: 700; }
.datein { font-family: inherit; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.5rem 0.7rem; background: #fff; color: var(--fg); color-scheme: light; cursor: pointer; }
.plan__grid { margin-top: 1.4rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.plan__item { display: flex; align-items: baseline; gap: 0.6rem; background: #fff; border-radius: var(--radius-md); padding: 0.95rem 1.1rem; }
.plan__num { font-size: 2rem; font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.plan__lbl { font-weight: 600; font-size: 0.9rem; color: var(--fg); display: flex; flex-direction: column; }
.plan__hint { color: var(--gray-500); font-weight: 500; font-size: 0.78rem; margin-top: 2px; }

/* ---------- pacing coach ---------- */
.pacelist { display: grid; gap: 0.7rem; }
.pacerow { display: grid; grid-template-columns: 8rem 1fr auto; align-items: baseline; gap: 1rem; }
.pacerow__sec { font-weight: 700; font-size: 0.95rem; }
.pacerow__you { font-weight: 800; font-variant-numeric: tabular-nums; }
.pacerow__you--ok { color: var(--secondary-600); }
.pacerow__you--off { color: var(--accent-600); }
.pacerow__t { color: var(--gray-500); font-size: 0.85rem; font-weight: 500; }
.pacerow__verdict { font-size: 0.85rem; font-weight: 600; text-align: right; }
.pacerow__verdict--ok { color: var(--secondary-600); }
.pacerow__verdict--off { color: var(--accent-600); }

/* ---------- score trajectory ---------- */
.trajstats { display: flex; gap: 1.75rem; flex-wrap: wrap; }
.trajstat { display: flex; flex-direction: column; }
.trajstat__num { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.trajstat__lbl { font-size: 0.78rem; color: var(--gray-500); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.targetin { font-family: inherit; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.4rem 0.6rem; width: 6rem; color: var(--fg); }
/* qualitative pace status (replaces the raw points-per-week rate) */
.pacestatus { display: flex; align-items: baseline; gap: 0.6rem; margin-top: 1.1rem; flex-wrap: wrap; }
.pacestatus__badge { font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 9999px; padding: 0.28rem 0.7rem; white-space: nowrap; }
.pacestatus--behind .pacestatus__badge { color: var(--accent-600); background: var(--accent-50); }
.pacestatus--on .pacestatus__badge { color: var(--secondary-600); background: var(--secondary-50); }
.pacestatus--ahead .pacestatus__badge { color: var(--primary-600); background: var(--primary-50); }
.pacestatus__hint { font-size: 0.92rem; color: var(--gray-500); font-weight: 500; line-height: 1.45; }

/* ---------- learn first vs ready to practice ---------- */
.plansplit { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.plancol { background: var(--muted); border-radius: var(--radius-lg); padding: 1.4rem 1.5rem; border-left: 4px solid var(--muted-200); }
.plancol--ready { border-left-color: var(--secondary); }
.plancol__h { font-weight: 700; font-size: 0.98rem; margin-bottom: 0.95rem; }
.planchips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.planchip { background: #fff; border: 1px solid var(--border); border-radius: 9999px; padding: 0.4rem 0.85rem; font-size: 0.85rem; font-weight: 600; }
.planempty { color: var(--gray-500); font-weight: 500; font-size: 0.9rem; }

/* ---------- memory vs. real performance (two-bar comparison) ---------- */
.calibsummary { font-size: 1.05rem; line-height: 1.5; margin-bottom: 1.25rem; }
.calibsummary b { font-weight: 700; }
.calibverdict--ok b { color: var(--secondary-600); }
.calibverdict--off b { color: var(--accent-600); }
.calib { display: grid; gap: 0.7rem; }
.calibbar { display: grid; grid-template-columns: 9rem 1fr 3rem; align-items: center; gap: 0.8rem; }
.calibbar__k { font-size: 0.8rem; color: var(--gray-500); font-weight: 600; }
.calibbar__track { height: 0.85rem; background: var(--muted-200); border-radius: 9999px; overflow: hidden; }
.calibbar__fill { height: 100%; border-radius: 9999px; }
.calibbar__fill--pred { background: var(--primary); }
.calibbar__fill--obs { background: var(--secondary); }
.calibbar__v { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- fluency illusion (recall vs applying it, per concept) ---------- */
.flulist { display: grid; gap: 1.15rem; }
.flurow { display: grid; gap: 0.45rem; }
.flurow__head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
.flurow__name { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
.fluchip { flex: none; background: #fff; border: 1px solid var(--border); color: var(--gray-500); font-weight: 600; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 9999px; }
.flubar { display: grid; grid-template-columns: 6.5rem 1fr 3rem; align-items: center; gap: 0.8rem; }
.flubar__k { font-size: 0.8rem; color: var(--gray-500); font-weight: 600; }
.flubar__track { height: 0.75rem; background: var(--muted-200); border-radius: 9999px; overflow: hidden; }
.flubar__fill { height: 100%; border-radius: 9999px; }
.flubar__fill--rec { background: var(--primary); }
.flubar__fill--app { background: var(--secondary); }
.flubar__v { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- top outlook: exam countdown + score trajectory side by side ---------- */
.outlook { display: grid; grid-template-columns: 1fr; gap: 1.25rem; padding: 2rem 2.5rem 0; align-items: stretch; }
.outlook .section { padding: 0; display: flex; flex-direction: column; }
/* keep the two outlook cards level: the shorter one grows to match the taller */
.outlook .plancard, .outlook .coverblock { flex: 1 1 auto; }

/* ---------- grouped insight rows ---------- */
/* Each themed group is a single row of 2-3 analysis cards under its own heading,
   so the six panels read as distinct sections instead of one long wall. A single
   row of cards ending at different heights reads fine; the ragged whitespace only
   appeared when many panels wrapped into multiple grid rows. */
.insightgrid { display: grid; gap: 1rem; align-items: start; }
.insightgrid .section { padding: 0; min-width: 0; }
.insightgrid--3 { grid-template-columns: 1fr; }
.insightgrid--2 { grid-template-columns: 1fr; }
/* the two Test-day readiness cards fill the row's height so their boxes match */
.insightgrid--2 { align-items: stretch; }
.insightgrid--2 .section { display: flex; flex-direction: column; }
.insightgrid--2 .coverblock { flex: 1 1 auto; }
@media (min-width: 700px) {
  .insightgrid--2 { grid-template-columns: repeat(2, 1fr); }
  .insightgrid--3 { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 960px) {
  .outlook { grid-template-columns: 1.4fr 1fr; }
  .insightgrid--3 { grid-template-columns: repeat(3, 1fr); }
  /* once the three Knowledge-check cards sit in one row, their bodies fill the
     row's height so the grey boxes end level, matching the Test-day pair */
  .insightgrid--3 { align-items: stretch; }
  .insightgrid--3 .section { display: flex; flex-direction: column; }
  .insightgrid--3 .coverblock { flex: 1 1 auto; }
}

.footmeta { margin: 1.25rem 2.5rem 0; color: var(--gray-500); font-size: 0.82rem; font-weight: 500; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

@media (max-width: 900px) {
  .scores { grid-template-columns: 1fr; }
  .coverage { grid-template-columns: minmax(0, 1fr); }
  .plansplit { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .masthead { padding: 1.5rem 1.25rem 1.25rem; }
  .brand__mark { font-size: 2.1rem; }
  .masthead__row { flex-direction: column; align-items: stretch; }
  .toolbar { width: 100%; display: grid; grid-template-columns: 1fr; gap: 0.5rem; margin-top: 0.25rem; }
  .toolbar .btn { width: 100%; min-width: 0; justify-content: center; height: 2.7rem; padding: 0 0.5rem; font-size: 0.9rem; }
  .syncago { grid-column: 1 / -1; text-align: center; margin-top: 0.15rem; }
  .chips { margin-top: 0.7rem; }
  .section { padding: 1.5rem 1.25rem 0; }
  .outlook { padding: 1.5rem 1.25rem 0; }
  .card { padding: 1.35rem; }
  /* narrow: give the study-next panel more room and stack the where-to-study
     rows so the book title, picker, and Khan links use the full width */
  .nextblock { padding: 1.35rem; }
  .where__row, .where__row--book { flex-direction: column; align-items: stretch; gap: 0.3rem; }
  .where__k { min-width: 0; }
  .bookpick { margin-left: 0; align-self: flex-start; }
  .srow { flex-direction: column; align-items: stretch; gap: 0.75rem; }
  .srow__actions { justify-content: stretch; }
  .srow__actions .btn { flex: 1; min-width: 0; justify-content: center; }
  /* Flashcards + its toggle take a full row, so Reasoning wraps to a full-width line below. */
  .srow__study { flex: 1 1 100%; align-items: stretch; }
  .calibbar { grid-template-columns: 6.5rem 1fr 2.5rem; gap: 0.5rem; }
  .flubar { grid-template-columns: 5.5rem 1fr 2.5rem; gap: 0.5rem; }
  .plan__grid { grid-template-columns: 1fr; }
  .footmeta { margin-left: 1.25rem; margin-right: 1.25rem; }
  /* Redesign: stack the readiness 2x2 to one column and pull the new banner /
     report card in to the phone gutter, matching the other full-bleed rows. */
  .subsections { grid-template-columns: 1fr; }
  .vnext { margin-left: 1.25rem; margin-right: 1.25rem; padding: 1.2rem 1.3rem; }
  /* Phone: stack the CTA and its "Why this?" so neither is clipped, and give the
     primary action a full-width tap target. */
  .vnext__actions { width: 100%; flex-direction: column; align-items: stretch; }
  /* Phone: when the confidence pill wraps under the score it should sit flush left,
     not float to the far right leaving a lopsided gap. */
  .confchip { margin-left: 0; }
  .rcard { padding-left: 1.25rem; padding-right: 1.25rem; }
}

/* ---- Tabs: Dashboard / Practice / Progress (in the dark masthead) ---- */
.tabs { display: flex; gap: 0.4rem; margin-top: 1.4rem; flex-wrap: wrap; }
.tab {
  font-family: inherit; font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em;
  color: rgba(255, 255, 255, 0.72); background: rgba(255, 255, 255, 0.10);
  border: 0; border-radius: 9999px; padding: 0.5rem 1.3rem; cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease;
}
.tab:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
.tab--on { background: #fff; color: var(--gray-900); }
.tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.tabpane[hidden] { display: none; }

/* Sync button busy state */
.btn--busy { opacity: 0.7; cursor: default; }

/* "Last synced Xm ago" caption (Feature 1): wraps to its own line under the
   toolbar buttons, so it never adds a third flex column to .masthead__row. */
.syncago {
  flex-basis: 100%;
  margin-top: 0.35rem;
  font-size: 0.8rem;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.6);
  text-align: left;
}

/* Bottom-center transient message (sync errors, etc.) */
.vmsg {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 10px);
  z-index: 2147483647; background: rgba(17, 24, 39, 0.94); color: #f9fafb;
  font-weight: 600; font-size: 0.9rem; letter-spacing: -0.01em;
  padding: 0.7rem 1.15rem; border-radius: 9999px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
  opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none;
}
.vmsg--show { opacity: 1; transform: translate(-50%, 0); }

/* ---- Dashboard-open due-cards reminder banner ---- */
.duebanner { display: flex; align-items: center; gap: 0.7rem; margin: 1.25rem 2.5rem 0; padding: 0.85rem 1.15rem; background: var(--primary-50); border: 1px solid var(--primary); border-radius: var(--radius-lg); }
.duebanner__dot { flex: none; width: 0.6rem; height: 0.6rem; border-radius: 9999px; background: var(--primary); }
.duebanner__text { font-weight: 600; color: var(--fg); font-size: 0.95rem; }
.duebanner__text b { font-weight: 800; color: var(--primary-600); font-variant-numeric: tabular-nums; }
.duebanner__btn { margin-left: auto; font-family: inherit; font-weight: 700; font-size: 0.85rem; color: #fff; background: var(--primary); border: 0; border-radius: var(--radius-md); padding: 0.5rem 1rem; cursor: pointer; white-space: nowrap; }
.duebanner__btn:hover { background: var(--primary-600); }
.duebanner__btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary); }
@media (max-width: 560px) { .duebanner { margin-left: 1.25rem; margin-right: 1.25rem; } }

/* ============================================================================
   REDESIGN COMPONENTS (Progress report card, Practice section bars, Dashboard
   next-step). Colors/typography reuse the tokens above; nothing here computes a
   number -- the JS derives every status from the existing score data.
   ============================================================================ */

/* ---- Dashboard: "Where to go next" banner (reddest signal -> one tap) ---- */
.vnext {
  position: relative; overflow: hidden;
  background: var(--danger-50); border: 1px solid var(--danger-200); border-radius: var(--radius-xl);
  padding: 1.5rem 1.8rem; margin: 1.25rem 2.5rem 0;
  display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap;
}
.vnext__body { min-width: 0; flex: 1 1 460px; }
.vnext__eyebrow { display: flex; align-items: center; gap: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.72rem; font-weight: 800; color: var(--danger-700); }
.vnext__dot { width: 0.6rem; height: 0.6rem; border-radius: 999px; background: var(--danger); flex: none; }
.vnext__title { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.45rem; color: var(--fg); }
.vnext__reason { color: var(--gray-600); font-weight: 500; font-size: 0.95rem; margin-top: 0.3rem; line-height: 1.45; }
.vnext__why-detail { margin-top: 0.5rem; font-size: 0.88rem; color: var(--gray-600); font-weight: 500; line-height: 1.5; }
.vnext__actions { display: flex; gap: 0.6rem; align-items: center; flex: 0 1 auto; min-width: 0; flex-wrap: wrap; }
.vnext__go { font-family: inherit; font-weight: 700; font-size: 0.95rem; color: #fff; background: var(--cars); border: 0; border-radius: var(--radius-md); padding: 0.8rem 1.5rem; cursor: pointer; }
.vnext__go:hover { background: var(--cars-600); }
.vnext__go:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--cars); }
.vnext__why { font-family: inherit; font-weight: 600; font-size: 0.9rem; color: var(--gray-600); background: transparent; border: 0; border-radius: var(--radius-md); padding: 0.8rem 0.6rem; cursor: pointer; }
.vnext__why:hover { color: var(--fg); }
.vnext__why:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--muted-200); }

/* ---- Practice: per-section cards with color-coded progress bars ---- */
.secgrid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 0.1rem; }
@media (min-width: 700px) { .secgrid { grid-template-columns: 1fr 1fr; } }
.seccard { background: var(--muted); border-left: 4px solid var(--muted-200); border-radius: var(--radius-lg); padding: 1.3rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.seccard--chem_phys { border-left-color: var(--primary); }
.seccard--bio_biochem { border-left-color: var(--secondary); }
.seccard--psych_soc { border-left-color: var(--accent); }
.seccard--cars { border-left-color: var(--cars); }
/* the single reddest reasoning section is flagged as the place to start */
.seccard--flag { background: #fff; border-left: 4px solid var(--danger); box-shadow: 0 0 0 2px var(--danger); }
.seccard__head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.seccard__name { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5rem; }
.seccard__flag { background: var(--danger-100); color: var(--danger-700); font-weight: 800; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.2rem 0.5rem; border-radius: 999px; }
.seccard__actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.secbtn { font-family: inherit; font-weight: 600; font-size: 0.85rem; border: 0; border-radius: var(--radius-md); padding: 0.55rem 1rem; cursor: pointer; color: #fff; display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
.secbtn svg { width: 0.95rem; height: 0.95rem; flex: none; }
.secbtn--flash { background: var(--primary); }
.secbtn--flash:hover { background: var(--primary-600); }
.secbtn--reason { background: var(--cars); }
.secbtn--reason:hover { background: var(--cars-600); }
.secbtn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary); }
.secbars { display: flex; flex-direction: column; gap: 0.65rem; }
.secbar { display: flex; align-items: center; gap: 0.75rem; }
.secbar__k { width: 5rem; flex: none; font-size: 0.8rem; color: var(--gray-600); font-weight: 600; }
.secbar__track { flex: 1 1 auto; height: 8px; background: var(--muted-200); border-radius: 999px; overflow: hidden; }
.secbar__fill { height: 100%; border-radius: 999px; }
.secbar__fill--red { background: var(--danger); }
.secbar__fill--amber { background: var(--accent); }
.secbar__fill--green { background: var(--secondary); }
.secbar__v { width: 2.6rem; flex: none; text-align: right; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.secbar__v--red { color: var(--danger-700); }
.secbar__v--amber { color: var(--accent-700); }
.secbar__v--green { color: var(--secondary-700); }
/* honest fallback when a section has too little data for a bar */
.secbar__note { font-size: 0.82rem; color: var(--gray-600); font-weight: 500; line-height: 1.45; }

/* ---- Progress: the report card (status tiles + progressive disclosure) ---- */
.rcard { display: flex; flex-direction: column; gap: 1.1rem; padding: 2rem 2.5rem 0; }
.rgroup__label { display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-size: 0.8rem; color: var(--gray-500); }
.rgroup__dot { width: 0.55rem; height: 0.55rem; border-radius: 999px; flex: none; }
.rgroup__dot--red { background: var(--danger); }
.rgroup__dot--amber { background: var(--accent); }
.rgroup__dot--green { background: var(--secondary); }
.rgroup__dot--neutral { background: var(--muted-200); }
.rtiles { display: grid; gap: 1rem; grid-template-columns: 1fr; }
@media (min-width: 700px) {
  .rtiles--3 { grid-template-columns: repeat(3, 1fr); }
  .rtiles--2 { grid-template-columns: repeat(2, 1fr); }
}

/* Vantage CARS practice. Flat Design, shares the dashboard's tokens and adds a
   distinct section accent for CARS so it reads as its own part of the exam. */
:root {
  --fg: #111827;
  --gray-600: #4b5563;
  --gray-500: #6b7280;
  --gray-400: #9ca3af;
  --gray-200: #e5e7eb;
  --muted: #f3f4f6;
  --bg: #ffffff;
  --cars: #7c3aed;
  --cars-600: #6d28d9;
  --cars-50: #f5f3ff;
  --ok: #059669;
  --ok-50: #ecfdf5;
  --no: #dc2626;
  --no-50: #fef2f2;
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--fg);
  font-family: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  /* Stops the phone WebView's stretch overscroll (Android 12+) from elongating
     the page as you scroll past the top or bottom. No effect on desktop. */
  overscroll-behavior: none;
}
.wrap { max-width: 72rem; margin: 0 auto; padding: 0 2rem 4rem; }

/* top bar */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: 1.75rem 0 1.25rem; flex-wrap: wrap; }
.top__title { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; }
.top__right { display: flex; align-items: baseline; gap: 1.25rem; }
.progress { color: var(--gray-500); font-weight: 600; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress--met { color: var(--ok); }  /* today's reasoning goal reached (going over is fine) */
.linkbtn { font-family: inherit; font-weight: 600; font-size: 0.9rem; color: var(--gray-500); background: none; border: 0; cursor: pointer; padding: 0.3rem 0; }
.linkbtn:hover { color: var(--fg); }
.linkbtn:focus-visible { outline: 2px solid var(--cars); outline-offset: 3px; border-radius: 4px; }

/* progress bar */
.pbar { height: 0.3rem; background: var(--gray-200); border-radius: 999px; overflow: hidden; }
.pbar__fill { height: 100%; background: var(--cars); border-radius: 999px; transition: width 250ms ease; }

/* two-column reading layout */
.grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2.25rem; margin-top: 1.75rem; align-items: start; }
.passage__label { font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gray-400); margin-bottom: 0.8rem; }
.passage__body p { max-width: 40rem; line-height: 1.72; margin-bottom: 1.05rem; font-size: 1.02rem; color: #1f2937; }
.passage__src { margin-top: 0.5rem; font-size: 0.78rem; color: var(--gray-400); font-style: italic; }

/* question card */
.qcard { background: var(--muted); border-radius: var(--radius); padding: 1.6rem; position: sticky; top: 1rem; }
.qcard__stem { font-weight: 700; font-size: 1.12rem; line-height: 1.45; margin-bottom: 1.2rem; }
.choices { display: grid; gap: 0.6rem; }
.choice {
  display: flex; gap: 0.7rem; align-items: flex-start; text-align: left; width: 100%;
  font-family: inherit; font-size: 0.98rem; font-weight: 500; color: var(--fg);
  background: var(--bg); border: 2px solid var(--gray-200); border-radius: var(--radius);
  padding: 0.85rem 1rem; cursor: pointer; transition: border-color 120ms ease, background-color 120ms ease;
}
.choice:hover { border-color: var(--cars); }
.choice:focus-visible { outline: 2px solid var(--cars); outline-offset: 2px; }
.choice[aria-pressed="true"] { border-color: var(--cars); background: var(--cars-50); }
.choice__key { font-weight: 800; color: var(--cars-600); flex: none; min-width: 1rem; }
.choice[disabled] { cursor: default; }
.choice--correct { border-color: var(--ok); background: var(--ok-50); }
.choice--correct .choice__key { color: var(--ok); }
.choice--wrong { border-color: var(--no); background: var(--no-50); }
.choice--wrong .choice__key { color: var(--no); }

/* feedback + action */
.feedback { margin-top: 1.15rem; font-weight: 700; font-size: 0.95rem; }
.feedback--ok { color: var(--ok); }
.feedback--no { color: var(--no); }
.explain { margin-top: 0.5rem; color: var(--gray-600); font-weight: 400; font-size: 0.92rem; line-height: 1.55; }
/* source-checked explanation on a miss: only rendered when one passed the gate */
.srcex { margin-top: 0.9rem; padding: 0.95rem 1.1rem; background: var(--ok-50); border-left: 3px solid var(--ok); border-radius: var(--radius); }
.srcex__eyebrow { font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ok); margin-bottom: 0.4rem; }
.srcex__text { color: #1f2937; font-size: 0.92rem; line-height: 1.6; }
.srcex__src { margin-top: 0.5rem; font-size: 0.78rem; color: var(--gray-500); font-style: italic; }
.srcex__loc { font-style: normal; color: var(--gray-400); }
.actions { margin-top: 1.4rem; display: flex; justify-content: flex-end; }
.pbtn {
  font-family: inherit; font-weight: 700; font-size: 0.95rem; border: 0; border-radius: var(--radius);
  padding: 0 1.35rem; height: 2.8rem; cursor: pointer; background: var(--cars); color: #fff;
  transition: background-color 120ms ease;
}
.pbtn:hover { background: var(--cars-600); }
.pbtn:focus-visible { outline: 2px solid var(--cars); outline-offset: 3px; }
.pbtn[disabled] { background: var(--gray-200); color: var(--gray-400); cursor: default; }
.pbtn--ghost { background: var(--bg); color: var(--fg); border: 2px solid var(--gray-200); }
.pbtn--ghost:hover { background: var(--muted); border-color: var(--gray-400); }

/* results */
.summary { margin-top: 2rem; background: var(--muted); border-radius: var(--radius); padding: 2.25rem; }
.summary__score { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; }
.summary__sub { color: var(--gray-500); font-weight: 500; margin-top: 0.35rem; }
.summary__actions { margin-top: 1.6rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }

/* confidence chips (metacognition: mark how sure before checking) */
.confrow { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.1rem; flex-wrap: wrap; }
.confrow__label { font-size: 0.85rem; color: var(--gray-500, #6b7280); font-weight: 600; }
.confchips { display: flex; gap: 0.4rem; }
.conf { font-family: inherit; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--gray-200, #e5e7eb); background: var(--bg, #fff); color: var(--fg, #111827); border-radius: 9999px; padding: 0.4rem 0.9rem; cursor: pointer; }
.conf--on { background: var(--fg, #111827); color: #fff; border-color: var(--fg, #111827); }
.conf:disabled { opacity: 0.55; cursor: default; }

/* miss reason (how you lose points) */
.missrow { margin-top: 1.1rem; padding: 1rem 1.1rem; background: var(--accent-50, #fffbeb); border-radius: var(--radius, 8px); }
.missrow__q { font-weight: 700; font-size: 0.92rem; margin-bottom: 0.65rem; }
.missbtns { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.missbtn { font-family: inherit; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--gray-200, #e5e7eb); background: var(--bg, #fff); color: var(--fg, #111827); border-radius: 8px; padding: 0.5rem 0.85rem; cursor: pointer; }
.missbtn:hover { background: var(--fg, #111827); color: #fff; border-color: var(--fg, #111827); }

@media (max-width: 820px) {
  .grid { grid-template-columns: 1fr; gap: 1.5rem; }
  .qcard { position: static; }
}

/* ---- Practice tab: Study + Test yourself zones ---- */
/* The section-scoped Timed test and the Full-length exam are the same kind of feature
   at different scope, so they share one grid: side by side on wide viewports, stacked
   on narrow ones (<= 820px, the existing breakpoint). Same card box and equal width so
   they read as siblings. Layout only. */
/* Keep the two cards level: the grid stretches both columns to the taller one, and
   each card is a column so its Start button drops to the bottom and the two line up
   (same approach as .insightgrid--2 / .outlook on the dashboard). */
/* The full-length exam is a distinct, larger tier beside the quick section test:
   equal on a phone, but 1fr : 1.5fr on a wide viewport so the exam gets the room
   its dark card needs. */
.ptests { display: grid; gap: 1.25rem; grid-template-columns: 1fr; align-items: stretch; }
@media (min-width: 821px) { .ptests { grid-template-columns: 1fr 1.5fr; } }
.ptests > .psetup__card, .ptests > .pexam__card { display: flex; flex-direction: column; }
.ptests .pbtn--start { margin-top: auto; }
.psetup__card { background: var(--muted); border-radius: var(--radius); padding: 1.6rem; }
.psetup__title { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
.psetup__row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.9rem; font-weight: 600; font-size: 0.95rem; }
.psetup__sec, .psetup__num { font-family: inherit; font-size: 0.95rem; font-weight: 600; color: var(--fg); background: var(--bg); border: 2px solid var(--gray-200); border-radius: var(--radius); padding: 0.55rem 0.8rem; }
.psetup__num { width: 6rem; }
.psetup__sec { min-width: 12rem; }
.psetup__presets { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.2rem 0 1.3rem; }
.pchip { font-family: inherit; font-weight: 600; font-size: 0.85rem; color: var(--fg); background: var(--bg); border: 1px solid var(--gray-200); border-radius: 9999px; padding: 0.45rem 0.95rem; cursor: pointer; }
.pchip:hover { border-color: var(--cars); color: var(--cars-600); }
.pbtn--start { width: 100%; height: 3rem; margin-top: 0.4rem; }

/* ---- Test mode: countdown + badge ---- */
.ptimer { font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; color: var(--fg); background: var(--muted); border-radius: 9999px; padding: 0.3rem 0.85rem; }
.ptestbadge { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em; color: var(--cars-600); background: var(--cars-50); border-radius: 9999px; padding: 0.2rem 0.6rem; vertical-align: middle; }
/* Feature 4: flag-to-revisit control in the practice / test top bar. */

.pflag--on { color: #d97706; }
.pflag:focus-visible { outline: 2px solid var(--cars); outline-offset: 3px; border-radius: 4px; }

/* ---- Test summary ---- */
.psum__body { background: var(--muted); border-radius: var(--radius); padding: 2rem; max-width: 46rem; }
.psum__score { display: flex; align-items: baseline; gap: 0.8rem; }
.psum__num { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.02em; }

/* ---- Full-length exam: cross-section summary ---- */
.pxrows { margin-top: 1.6rem; display: grid; gap: 0.7rem; }
.pxrow { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "sec tally" "sub tally"; align-items: center; column-gap: 1rem; background: var(--bg); border: 1px solid var(--gray-200); border-left: 3px solid var(--cars); border-radius: var(--radius); padding: 0.9rem 1.1rem; }

/* ---- Second look: delayed re-test of previously-missed questions ---- */

  margin: 1.75rem auto 0; max-width: 72rem; padding: 1.4rem 1.6rem;
