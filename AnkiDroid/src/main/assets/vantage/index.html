on the diver at 10 m is about:", "choices": ["2 atm", "1 atm", "5 atm", "10 atm"], "answer": 0, "explain": "The 10 m of water adds about 1 atm on top of the 1 atm of air above, for roughly 2 atm total. Counting only the water and ignoring the atmosphere gives just 1 atm.", "concept": "4B", "skill": "concepts", "cover_story": "a scuba dive", "b": -0.2}, {"stem": "The diver uses a buoyancy device to hover at a fixed depth, neither rising nor sinking. At that moment the buoyant force on the diver is:", "choices": ["Zero", "Less than the diver's weight", "Equal to the diver's weight", "Greater than the diver's weight"], "answer": 2, "explain": "Hovering is equilibrium, so the upward buoyant force exactly balances the diver's weight. A larger buoyant force would push the diver upward instead.", "concept": "4B", "skill": "concepts", "cover_story": "a scuba dive", "b": -0.6}, {"stem": "Two divers rest at the same 10 m depth, one in a narrow cove and one in the open ocean. The water pressure on them is:", "choices": ["The same, because pressure depends on depth, not the amount of water", "Greater in the open ocean, which holds more water", "Greater in the narrow cove", "Impossible to compare without the water volumes"], "answer": 0, "explain": "Static fluid pressure depends only on depth and density, not on the shape or total volume of the water, so both divers feel the same pressure. The larger ocean adds nothing extra at equal depth.", "concept": "4B", "skill": "concepts", "cover_story": "a scuba dive", "b": 0.3}, {"stem": "If a diver plus gear weighs more than the buoyant force acting on them, the diver will:", "choices": ["Float upward", "Sink", "Hover in place", "Feel no net force"], "answer": 1, "explain": "When weight exceeds the buoyant force the net force points down, so the diver sinks. Hovering would require the two forces to be equal.", "concept": "4B", "skill": "concepts", "cover_story": "a scuba dive", "b": -0.4}, {"stem": "A diver and gear together displace 0.080 m^3 of seawater. The buoyant force on them is about:", "choices": ["800 N", "80 N", "8,000 N", "80,000 N"], "answer": 0, "explain": "By Archimedes' principle the buoyant force is the weight of displaced water, rho V g = 1000 times 0.080 times 10 = 800 N. Using 0.80 m^3 by mistake gives ten times too much.", "concept": "4B", "skill": "reasoning", "cover_story": "a scuba dive", "b": 0.8}]}, {"label": "Electroplating a spoon", "paragraphs": ["A metals lab silver-plates a steel spoon using an electrolytic cell. The spoon and a bar of pure silver are dipped into a solution of silver ions and connected to a direct-current power supply. When the supply is switched on, silver ions in the solution gain electrons and deposit as solid metal on the spoon, while the silver bar slowly dissolves to replenish the ions. Because the reaction is driven by the external power supply rather than happening on its own, the cell needs a steady input of electrical energy. The technician can change how fast the coating builds up by adjusting the current, and monitors the voltage across the cell and the resistance of the connecting wires.", "The silver ion carries a single positive charge, so each ion needs one electron to become a silver atom. The class relates the current to the flow of charge: current is the amount of charge passing a point each second, and running twice the current for the same time moves twice as much charge. They also review Ohm's law for the wiring, noting that for a fixed resistance a higher applied voltage drives a proportionally higher current, and that the electrical power delivered is the product of voltage and current. Finally they contrast this driven cell with a battery, which instead releases energy from a reaction that proceeds on its own."], "source_ref": "OpenStax Chemistry 2e, Ch. 17 (Electrochemistry), and OpenStax University Physics Vol 2, Ch. 9-10 (Current, Resistance, and DC Circuits)", "questions": [{"stem": "Silver ions gain electrons and deposit as metal on the spoon. In this cell the spoon therefore acts as the:", "choices": ["Anode, where oxidation occurs", "Salt bridge", "Insulator", "Cathode, where reduction occurs"], "answer": 3, "explain": "Gaining electrons is reduction, which by definition happens at the cathode. The silver bar that dissolves by losing electrons is the anode.", "concept": "4C", "skill": "concepts", "cover_story": "electroplating a spoon", "b": -0.4}, {"stem": "If the technician doubles the current while plating for the same length of time, the mass of silver deposited will:", "choices": ["Stay the same", "Double", "Be cut in half", "Quadruple"], "answer": 1, "explain": "Charge delivered is current times time, so doubling the current doubles the charge and thus the amount of silver reduced onto the spoon.", "concept": "4C", "skill": "concepts", "cover_story": "electroplating a spoon", "b": -0.7}, {"stem": "Each silver ion (Ag+) needs one electron to become a silver atom. How many moles of electrons are needed to deposit 2.0 mol of silver?", "choices": ["0.5 mol", "1.0 mol", "2.0 mol", "4.0 mol"], "answer": 2, "explain": "The half-reaction Ag+ plus one electron gives Ag is one to one, so 2.0 mol of silver requires 2.0 mol of electrons. A 2+ ion would instead need twice as many.", "concept": "4C", "skill": "reasoning", "cover_story": "electroplating a spoon", "b": 0.3}, {"stem": "For the connecting wire of fixed resistance, doubling the voltage across it changes the current to:", "choices": ["One half", "The same", "Double", "Four times"], "answer": 2, "explain": "Ohm's law gives current = voltage over resistance, so at fixed resistance the current is proportional to voltage and doubles.", "concept": "4C", "skill": "concepts", "cover_story": "electroplating a spoon", "b": -0.3}, {"stem": "The supply drives 2.0 A through the cell at 5.0 V. The electrical power delivered is:", "choices": ["2.5 W", "7.0 W", "10 W", "20 W"], "answer": 2, "explain": "Electrical power is current times voltage, 2.0 times 5.0 = 10 W. Dividing instead of multiplying gives the wrong 2.5 W.", "concept": "4C", "skill": "reasoning", "cover_story": "electroplating a spoon", "b": 0.2}, {"stem": "Unlike a battery, this plating cell needs an external power supply because its overall reaction is:", "choices": ["Spontaneous and releases energy", "Nonspontaneous and needs an energy input", "Impossible", "Independent of energy"], "answer": 1, "explain": "Electrolysis drives a nonspontaneous reaction using external electrical energy, whereas a battery runs a spontaneous reaction that releases energy on its own.", "concept": "4C", "skill": "concepts", "cover_story": "electroplating a spoon", "b": 0.6}]}, {"label": "Ultrasound scan", "paragraphs": ["A sonographer uses an ultrasound probe that sends short pulses of high-frequency sound into the body and listens for the echoes. Sound is a mechanical wave: it travels as a pattern of compressions and rarefactions and needs a material medium to move through, so it cannot travel across a vacuum. In soft tissue the pulses travel at about 1500 m/s. The machine forms an image by timing how long each echo takes to return from a boundary between tissues and by measuring how strong the returning echo is. A layer of gel is spread on the skin so the sound passes into the body instead of reflecting off a thin layer of air.", "The department also has a Doppler unit that measures blood flow. When sound reflects off blood cells moving toward the probe, the echo returns at a higher frequency than it was sent, and cells moving away return a lower frequency. The sonographer can also choose the probe's frequency. A higher-frequency probe has a shorter wavelength and can resolve finer detail, but it does not penetrate as deeply into the body. For the basic wave relationships the technician treats the speed of sound in tissue as fixed at 1500 m/s, so the wavelength and frequency of a pulse are tied together through the wave speed, and changing one immediately changes the other."], "source_ref": "OpenStax University Physics Vol 1, Ch. 17 (Sound)", "questions": [{"stem": "Which statement about the ultrasound pulses is correct?", "choices": ["They need a material medium to travel", "They are electromagnetic waves", "They can travel through a vacuum", "They travel at the speed of light"], "answer": 0, "explain": "Sound is a mechanical wave, so it needs a medium and cannot cross a vacuum. Unlike light, it is not electromagnetic and travels far slower.", "concept": "4D", "skill": "concepts", "cover_story": "an ultrasound scan", "b": -1.3}, {"stem": "A probe emits 3.0 MHz sound where the speed in tissue is 1500 m/s. The wavelength is about:", "choices": ["2 mm", "0.5 mm", "5 mm", "2 m"], "answer": 1, "explain": "Wavelength is speed over frequency, 1500 divided by 3,000,000 = 0.0005 m, or 0.5 mm.", "concept": "4D", "skill": "reasoning", "cover_story": "an ultrasound scan", "b": 0.3}, {"stem": "In the Doppler unit, blood cells moving toward the probe reflect sound that returns at a frequency that is:", "choices": ["Higher than the emitted frequency", "Lower than the emitted frequency", "Equal to the emitted frequency", "Zero"], "answer": 0, "explain": "Motion toward the probe compresses the reflected waves, raising the detected frequency in the Doppler effect. Motion away would lower it.", "concept": "4D", "skill": "concepts", "cover_story": "an ultrasound scan", "b": -0.2}, {"stem": "An echo returns 40 microseconds after a pulse is sent, with sound at 1500 m/s. How deep is the reflecting boundary?", "choices": ["1.5 cm", "6 cm", "3 cm", "12 cm"], "answer": 2, "explain": "The pulse makes a round trip, so depth is v t over 2 = 1500 times 0.000040 divided by 2 = 0.03 m, or 3 cm. Forgetting to halve the distance gives 6 cm.", "concept": "4D", "skill": "reasoning", "cover_story": "an ultrasound scan", "b": 0.8}, {"stem": "Choosing a higher-frequency probe improves resolution because, at fixed speed, higher frequency means:", "choices": ["A longer wavelength", "A shorter wavelength", "A faster wave", "A slower wave"], "answer": 1, "explain": "With speed fixed, wavelength is inversely proportional to frequency, so higher frequency gives a shorter wavelength that resolves finer detail. The trade-off is less penetration depth.", "concept": "4D", "skill": "concepts", "cover_story": "an ultrasound scan", "b": 0.5}, {"stem": "If the probe's frequency is doubled while the speed of sound in tissue stays the same, the wavelength becomes:", "choices": ["Doubled", "Unchanged", "Quadrupled", "Halved"], "answer": 3, "explain": "Since speed equals frequency times wavelength and the speed is fixed, doubling the frequency halves the wavelength.", "concept": "4D", "skill": "concepts", "cover_story": "an ultrasound scan", "b": 0.0}]}, {"label": "Flame test and atomic spectra", "paragraphs": ["In a general chemistry lab, students heat metal salts in a flame and see distinct colors: sodium glows yellow, and copper glows blue-green. A teacher explains that heat lifts electrons to higher energy levels, and when an electron falls back to a lower level the atom emits a photon of light. The energy of that photon equals the gap between the two levels, and photon energy is proportional to the light's frequency. Because each element has its own fixed pattern of energy levels, it emits its own set of colors, giving every element a unique line spectrum. The students then view the emitted light through a diffraction grating, which spreads it into separate bright lines rather than a continuous rainbow.", "The class then reviews how electrons fill an atom's orbitals in order of increasing energy, starting from the lowest level. They write the ground-state arrangement for several neutral atoms and count the outer, valence electrons that control bonding. They also discuss ionization energy, the energy needed to pull an electron away from an atom, and note that electrons held more tightly by the nucleus are harder to remove. Finally, the teacher points out that an atom absorbs light at the very same wavelengths it emits, because absorption lifts an electron across exactly the same energy gaps that emission releases. These ideas connect the colors seen in the flame to the structure of the atom itself."], "source_ref": "OpenStax Chemistry 2e, Ch. 6 (Electronic Structure and Periodic Properties of Elements)", "questions": [{"stem": "The colored light appears when an electron in the atom:", "choices": ["Drops from a higher to a lower energy level, emitting a photon", "Is removed from the atom entirely", "Absorbs a photon and jumps higher", "Merges with the nucleus"], "answer": 0, "explain": "Emission happens when an electron falls to a lower level and releases a photon equal to the energy gap. Absorbing a photon would instead lift the electron higher.", "concept": "4E", "skill": "concepts", "cover_story": "a flame test", "b": -0.7}, {"stem": "A transition that releases more energy per photon produces light of:", "choices": ["Lower frequency and longer wavelength", "Higher frequency and shorter wavelength", "Lower frequency and shorter wavelength", "The same frequency as every other transition"], "answer": 1, "explain": "Photon energy is proportional to frequency, and higher frequency means shorter wavelength, so a bigger energy gap gives bluer light.", "concept": "4E", "skill": "concepts", "cover_story": "a flame test", "b": 0.4}, {"stem": "Each element shows its own distinct set of spectral lines because each element has a unique:", "choices": ["Number of neutrons", "Boiling point", "Flame temperature", "Set of electron energy levels"], "answer": 3, "explain": "The spacing of an element's energy levels is unique, so its emission lines act like a fingerprint. Neutron count and boiling point do not set the emitted colors.", "concept": "4E", "skill": "concepts", "cover_story": "a flame test", "b": 0.2}, {"stem": "A neutral atom has the ground-state configuration 1s2 2s2 2p6 3s2 3p4. How many valence electrons does it have?", "choices": ["2", "4", "6", "16"], "answer": 2, "explain": "Valence electrons are those in the outermost shell, here n = 3: 3s2 3p4 gives 6. The value 16 counts all the electrons, not just the valence ones.", "concept": "4E", "skill": "concepts", "cover_story": "a flame test", "b": 0.3}, {"stem": "Ionization energy is the energy needed to remove an electron. An electron the nucleus holds more tightly will have a:", "choices": ["Lower ionization energy", "Higher ionization energy", "Zero ionization energy", "Negative ionization energy"], "answer": 1, "explain": "The more tightly bound the electron, the more energy is required to pull it away, so a higher ionization energy.", "concept": "4E", "skill": "concepts", "cover_story": "a flame test", "b": 0.2}, {"stem": "An atom absorbs light most strongly at wavelengths that are:", "choices": ["Completely unrelated to its emission lines", "The same as the wavelengths it emits", "Always longer than its emission lines", "Only in the radio range"], "answer": 1, "explain": "Absorption lifts an electron across the same energy gaps that emission spans, so an atom absorbs at the very wavelengths it emits.", "concept": "4E", "skill": "concepts", "cover_story": "a flame test", "b": 1.0}]}, {"label": "Salting icy roads", "paragraphs": ["During an icy week, a city spreads salt on the roads and drivers add antifreeze to their engines. A chemistry teacher explains that dissolving a solute in water changes the properties of the liquid. Adding salt lowers the temperature at which water freezes, so a salted road stays liquid below the normal freezing point of pure water. These effects depend on how many solute particles are dissolved, not on what the particles are. Because table salt splits into two ions when it dissolves, one unit of salt lowers the freezing point about twice as much as one molecule of sugar, which stays whole. The class measures concentrations in molarity, the number of moles of solute per liter of solution.", "The teacher also connects these ideas to the body. Cells sit in a watery solution, and water moves across their membranes by osmosis, flowing from the side with more free water toward the side with more dissolved particles. A cell placed in very salty water loses water and shrinks, while a cell in pure water swells. Adding solute also raises the boiling point of water, which is why coolant helps an engine run hotter without boiling over. Throughout, the class treats these freezing-point, boiling-point, and osmotic effects as colligative properties that scale with the count of dissolved particles, so it makes no difference whether the solute is salt or sugar for a given particle count."], "source_ref": "OpenStax Chemistry 2e, Ch. 11 (Solutions and Colloids)", "questions": [{"stem": "Spreading salt keeps water liquid at low temperatures because the dissolved salt:", "choices": ["Lowers the freezing point of the water", "Raises the freezing point of the water", "Has no effect on freezing", "Makes the water evaporate"], "answer": 0, "explain": "Dissolved particles cause freezing-point depression, lowering the temperature at which water freezes so the salted water stays liquid below zero degrees Celsius.", "concept": "5A", "skill": "concepts", "cover_story": "salting icy roads", "b": -1.1}, {"stem": "Equal moles of table salt and sugar are each dissolved in identical beakers of water. The salt lowers the freezing point more because it:", "choices": ["Weighs more per mole", "Starts out colder", "Reacts chemically with the water", "Splits into two ions, making more dissolved particles"], "answer": 3, "explain": "Colligative effects scale with the number of dissolved particles, and salt dissociates into two ions per unit while sugar stays as one molecule, so salt has about twice the effect.", "concept": "5A", "skill": "concepts", "cover_story": "salting icy roads", "b": 0.4}, {"stem": "A red blood cell is placed in very salty water. Water will:", "choices": ["Move into the cell, swelling it", "Move out of the cell, shrinking it", "Not move at all", "Turn into salt"], "answer": 1, "explain": "Osmosis moves water toward the more concentrated side, so water leaves the cell for the saltier surroundings and the cell shrinks.", "concept": "5A", "skill": "concepts", "cover_story": "salting icy roads", "b": 0.3}, {"stem": "A solution holds 0.50 mol of solute in 2.0 L. Its molarity is:", "choices": ["0.10 M", "0.25 M", "1.0 M", "2.5 M"], "answer": 1, "explain": "Molarity is moles divided by liters, 0.50 over 2.0 = 0.25 M.", "concept": "5A", "skill": "concepts", "cover_story": "salting icy roads", "b": -0.3}, {"stem": "Adding coolant (a solute) to the water in an engine changes the water's boiling point by:", "choices": ["Raising it", "Lowering it", "Leaving it unchanged", "Removing it entirely"], "answer": 0, "explain": "Dissolved solute raises the boiling point, letting the water run hotter before boiling. This is the opposite direction from the freezing-point change.", "concept": "5A", "skill": "concepts", "cover_story": "salting icy roads", "b": -0.5}, {"stem": "Equal moles of CaCl2 (which releases three ions) and NaCl (which releases two ions) are dissolved in equal volumes of water. Compared with the NaCl solution, the CaCl2 solution lowers the freezing point by a factor of about:", "choices": ["2/3 as much", "the same", "3/2 as much", "3 times as much"], "answer": 2, "explain": "Freezing-point depression scales with particle count, so three ions versus two gives a ratio of 3 to 2. Answering 3 times ignores that NaCl already makes two particles.", "concept": "5A", "skill": "reasoning", "cover_story": "salting icy roads", "b": 0.9}]}, {"label": "Volatile anesthetics", "paragraphs": ["An anesthesiology lab compares several small molecules used as inhaled anesthetics and solvents. The team focuses on the forces between molecules, because those forces set how easily each liquid evaporates. They line up a series of nonpolar molecules that differ mainly in size and molar mass, and they measure each liquid's boiling point and its vapor pressure at room temperature. The chemist reminds the group that in a nonpolar substance the main attraction between molecules is the London dispersion force, a weak pull that arises from momentary shifts in the electron cloud. These fleeting attractions grow stronger as a molecule gets larger and holds more electrons.", "The group also compares two liquids of similar size, one made of polar molecules and one nonpolar. The polar liquid has an extra dipole-dipole attraction on top of dispersion, so its molecules cling together more tightly. Stronger intermolecular forces mean a liquid holds a lower vapor pressure and needs a higher temperature to boil, so it evaporates more slowly. Weaker forces do the reverse, making a liquid more volatile. The chemist adds one caution: while a liquid boils, the added heat goes into pulling molecules apart rather than raising the temperature, so the temperature holds steady until the liquid has all turned to gas, and a more volatile agent leaves the liquid and enters the vapor more readily at body temperature."], "source_ref": "OpenStax Chemistry 2e, Ch. 10 (Liquids and Solids)", "questions": [{"stem": "For the series of nonpolar anesthetic molecules, the main attraction between neighboring molecules is:", "choices": ["Ionic bonding", "Hydrogen bonding", "London dispersion forces", "Covalent bonds between molecules"], "answer": 2, "explain": "Nonpolar molecules attract mainly through London dispersion forces. Hydrogen bonding would require hydrogen bonded to nitrogen, oxygen, or fluorine, which these molecules lack.", "concept": "5B", "skill": "concepts", "cover_story": "volatile anesthetics", "b": -0.4}, {"stem": "Within the nonpolar series, the molecule with the largest molar mass will most likely have the:", "choices": ["Lowest boiling point", "Highest boiling point", "Same boiling point as the rest", "No boiling point"], "answer": 1, "explain": "Larger molecules hold more electrons, giving stronger London dispersion forces and therefore a higher boiling point.", "concept": "5B", "skill": "concepts", "cover_story": "volatile anesthetics", "b": 0.3}, {"stem": "A liquid with relatively weak intermolecular forces will tend to have a:", "choices": ["High vapor pressure and evaporate quickly", "Low vapor pressure and evaporate slowly", "Very high boiling point", "Strong hydrogen-bond network"], "answer": 0, "explain": "Weak intermolecular forces let molecules escape easily, giving a high vapor pressure and fast evaporation. Strong forces would do the reverse.", "concept": "5B", "skill": "concepts", "cover_story": "volatile anesthetics", "b": 0.4}, {"stem": "Two liquids have molecules of similar size, but one is polar and one is nonpolar. The polar liquid most likely boils at a higher temperature because it also has:", "choices": ["Fewer electrons", "A lower molar mass", "No intermolecular forces", "Dipole-dipole attractions"], "answer": 3, "explain": "The polar liquid adds dipole-dipole attraction on top of dispersion, so its molecules are harder to pull apart and it boils higher.", "concept": "5B", "skill": "concepts", "cover_story": "volatile anesthetics", "b": 0.2}, {"stem": "While one of these liquids boils at constant pressure, the added heat causes its temperature to:", "choices": ["Rise steadily", "Stay constant until it has all vaporized", "Fall", "Rise and then fall"], "answer": 1, "explain": "During a phase change the added energy breaks intermolecular attractions rather than speeding the molecules, so the temperature holds constant until all the liquid becomes gas.", "concept": "5B", "skill": "concepts", "cover_story": "volatile anesthetics", "b": 0.8}, {"stem": "A liquid described as very volatile is one that:", "choices": ["Evaporates readily and has a high vapor pressure", "Never evaporates", "Has very strong intermolecular forces", "Can exist only as a solid"], "answer": 0, "explain": "A volatile liquid evaporates easily and has a high vapor pressure, which goes with relatively weak intermolecular forces.", "concept": "5B", "skill": "concepts", "cover_story": "volatile anesthetics", "b": -0.6}]}, {"label": "Spinning down a blood sample", "paragraphs": ["A clinical lab separates the parts of a blood sample and purifies a protein from it. First, a tube of blood is spun in a centrifuge. The rapid spinning creates a strong effective gravity that pulls the denser components toward the bottom of the tube, so the heavy red cells pack at the bottom, a thin layer of white cells sits above them, and the light, watery plasma stays on top. Spinning faster or longer drives this separation further. The technician notes that centrifugation sorts particles mainly by their density and size, with the densest and largest particles sedimenting fastest.", "To purify a protein from the plasma, the team uses two more methods. In dialysis, the plasma is sealed in a membrane bag with tiny pores and placed in pure water; small ions and molecules slip through the pores and diffuse out, while the large protein is too big to pass and stays inside. In size-exclusion chromatography, the mixture flows through a column packed with porous beads: small molecules enter the beads and are delayed, but large proteins cannot fit inside the beads and travel around them, so the largest molecules leave the column first. Finally, a small solid product is purified by recrystallization, dissolving it hot and letting pure crystals reform as the solution cools."], "source_ref": "OpenStax Chemistry 2e, Ch. 11 (Solutions and Colloids)", "questions": [{"stem": "After the blood is centrifuged, the red cells collect at the bottom of the tube because they are:", "choices": ["The densest component", "The least dense component", "Electrically charged", "The smallest molecules"], "answer": 0, "explain": "A centrifuge drives the densest components to the bottom, so the heavy red cells pack below the lighter plasma.", "concept": "5C", "skill": "concepts", "cover_story": "spinning down blood", "b": -0.7}, {"stem": "Spinning the sample at a higher speed makes the denser particles settle:", "choices": ["More slowly", "Faster", "Not at all", "Upward, toward the top"], "answer": 1, "explain": "A higher spin speed raises the effective gravity, so denser particles sediment toward the bottom faster.", "concept": "5C", "skill": "concepts", "cover_story": "spinning down blood", "b": 0.0}, {"stem": "During dialysis the large protein stays inside the membrane bag while small ions pass out. The membrane separates molecules by their:", "choices": ["Color", "Size", "Charge only", "Boiling point"], "answer": 1, "explain": "The membrane's pores let small molecules through but block the large protein, so separation is by size. Charge and color do not decide passage here.", "concept": "5C", "skill": "concepts", "cover_story": "spinning down blood", "b": 0.3}, {"stem": "In size-exclusion chromatography, which molecules leave the column first?", "choices": ["The smallest, because they move fastest", "The most brightly colored", "The largest, because they cannot enter the beads and take a shorter path", "The most highly charged"], "answer": 2, "explain": "Large molecules are shut out of the porous beads and flow around them on a shorter path, so they elute first, while small molecules enter the beads and are delayed.", "concept": "5C", "skill": "concepts", "cover_story": "spinning down blood", "b": 1.2}, {"stem": "Recrystallization purifies a solid by exploiting that the compound is:", "choices": ["More soluble hot and less soluble cold", "Equally soluble at every temperature", "A gas at room temperature", "Unable to dissolve at all"], "answer": 0, "explain": "The solid dissolves in hot solvent and reforms as pure crystals when cooled, while soluble impurities stay behind. A compound with no temperature dependence could not be recrystallized this way.", "concept": "5C", "skill": "concepts", "cover_story": "spinning down blood", "b": 0.2}, {"stem": "In the dialysis step, the small ions leave the bag because they:", "choices": ["Are pushed out by the protein", "Are heavier than water", "React with the membrane", "Diffuse down their concentration gradient through the pores into the surrounding water"], "answer": 3, "explain": "The small ions diffuse from their high concentration inside the bag to the pure water outside, through pores too small for the protein to follow.", "concept": "5C", "skill": "concepts", "cover_story": "spinning down blood", "b": 0.4}]}, {"label": "Enzymes and digestion", "paragraphs": ["A physiology class studies how the body breaks down and builds up biological molecules. Proteins in food are long chains of amino acids joined end to end by peptide bonds, a type of amide linkage. The body assembles these chains by condensation, joining two amino acids and releasing a molecule of water for each new bond. Digestion runs the reaction in reverse: enzymes add water across each peptide bond to split the chain back into amino acids, a process called hydrolysis. The teacher stresses that a protein's function depends on its folded three-dimensional shape, which is held together by many weak interactions among the amino acids.", "Enzymes that carry out digestion are themselves proteins, and each has an active site shaped to fit a specific substrate, so a given enzyme speeds only its own reaction. Heat or a strong change in pH can denature an enzyme, unfolding its shape so it no longer works, even though the peptide bonds of its backbone stay intact. The class also looks at other biomolecules. Dietary fats are triglycerides, built from glycerol and three fatty acids linked by ester bonds, and they store a great deal of energy. Nucleic acids carry information: DNA is a chain of nucleotides whose bases pair across the double helix, adenine with thymine and guanine with cytosine, through hydrogen bonds."], "source_ref": "OpenStax Chemistry 2e, Ch. 20 (Organic Chemistry)", "questions": [{"stem": "The bond that links one amino acid to the next in a protein chain is a:", "choices": ["Peptide (amide) bond", "Ester bond", "Ionic bond", "Hydrogen bond"], "answer": 0, "explain": "Amino acids join through peptide bonds, a type of amide linkage. Ester bonds instead join glycerol and fatty acids in fats.", "concept": "5D", "skill": "concepts", "cover_story": "digestion chemistry", "b": -0.8}, {"stem": "When the body links two amino acids into a peptide bond, it also releases:", "choices": ["A molecule of carbon dioxide", "A molecule of water", "A single hydrogen ion", "A molecule of oxygen"], "answer": 1, "explain": "Peptide-bond formation is a condensation that splits out water. The reverse reaction, hydrolysis, adds water back to break the bond.", "concept": "5D", "skill": "concepts", "cover_story": "digestion chemistry", "b": 0.2}, {"stem": "Each digestive enzyme speeds up only one kind of reaction because its active site is:", "choices": ["Made from a different element than other enzymes", "Always positively charged", "Larger than the whole cell", "Shaped to fit only a specific substrate"], "answer": 3, "explain": "An enzyme's active site is complementary in shape and chemistry to its particular substrate, which gives it specificity. All enzymes are built from the same set of amino acids.", "concept": "5D", "skill": "concepts", "cover_story": "digestion chemistry", "b": 0.3}, {"stem": "Heating an enzyme until it stops working denatures it. This means the heat has:", "choices": ["Broken all its peptide bonds into free amino acids", "Unfolded its three-dimensional shape while the peptide bonds stay intact", "Turned it into a fat", "Changed its amino acid sequence"], "answer": 1, "explain": "Denaturation disrupts the folded shape held by weak interactions, so the enzyme loses function, but the covalent peptide bonds of its sequence remain intact.", "concept": "5D", "skill": "concepts", "cover_story": "digestion chemistry", "b": 0.9}, {"stem": "A dietary fat (triglyceride) is built from glycerol joined to three fatty acids through:", "choices": ["Peptide bonds", "Ester bonds", "Hydrogen bonds", "Ionic bonds"], "answer": 1, "explain": "Fatty acids attach to glycerol by ester bonds. Peptide bonds instead join amino acids in proteins.", "concept": "5D", "skill": "concepts", "cover_story": "digestion chemistry", "b": 0.1}, {"stem": "In DNA, adenine on one strand pairs across the helix with:", "choices": ["Guanine", "Cytosine", "Thymine", "Another adenine"], "answer": 2, "explain": "Adenine pairs with thymine and guanine pairs with cytosine through hydrogen bonds, so adenine's partner is thymine.", "concept": "5D", "skill": "concepts", "cover_story": "digestion chemistry", "b": 0.5}]}, {"label": "Hand warmer and cold pack", "paragraphs": ["A chemistry class tests two commercial products that use reactions to change temperature. A hand warmer contains chemicals that react to release heat, warming a hiker's pocket. An instant cold pack, by contrast, contains a salt that dissolves and draws heat in, cooling an athlete's injury. The teacher frames the two devices in terms of enthalpy: a reaction that releases heat to its surroundings is exothermic and has a negative enthalpy change, while a reaction that absorbs heat from its surroundings is endothermic and has a positive enthalpy change. The students feel the difference by holding each pack and reading a thermometer taped to it.", "To measure heat, the class uses calorimetry, warming water and applying q = m c times the temperature change, where c for water is about 4.2 J per gram per degree Celsius. They also study how temperature affects reaction speed: warming the reactants makes the molecules collide more often and with more energy, so a larger fraction get over the activation energy barrier and the reaction runs faster. On an energy diagram, the activation energy is the hump the reactants must climb, and the difference in height between reactants and products is the overall enthalpy change. Because breaking bonds costs energy and forming bonds releases it, the sign of that overall change depends on which effect wins."], "source_ref": "OpenStax Chemistry 2e, Ch. 5 and 12 (Thermochemistry and Kinetics)", "questions": [{"stem": "The hand warmer releases heat to its surroundings. Its reaction is:", "choices": ["Exothermic, with a negative enthalpy change", "Endothermic, with a positive enthalpy change", "Neither, since no heat is involved", "Exothermic, with a positive enthalpy change"], "answer": 0, "explain": "Releasing heat to the surroundings is exothermic, which corresponds to a negative enthalpy change. A positive change would instead absorb heat.", "concept": "5E", "skill": "concepts", "cover_story": "hot and cold packs", "b": -0.8}, {"stem": "The instant cold pack gets cold because the salt dissolving:", "choices": ["Releases heat to the surroundings", "Absorbs heat from the surroundings", "Produces a gas", "Raises the surrounding temperature"], "answer": 1, "explain": "An endothermic process absorbs heat from the surroundings, cooling the pack and the skin. An exothermic process would warm them instead.", "concept": "5E", "skill": "concepts", "cover_story": "hot and cold packs", "b": -0.5}, {"stem": "How much heat is needed to warm 100 g of water by 10 degrees Celsius, using c = 4.2 J per gram per degree?", "choices": ["420 J", "1,000 J", "4,200 J", "42,000 J"], "answer": 2, "explain": "Heat is q = m c times the temperature change = 100 times 4.2 times 10 = 4,200 J. Dropping a factor of ten gives 420 J.", "concept": "5E", "skill": "reasoning", "cover_story": "hot and cold packs", "b": 0.3}, {"stem": "Warming the reactants speeds the reaction mainly because more molecules:", "choices": ["Have energy above the activation barrier and collide more often", "Are destroyed by the heat", "Lose their activation energy", "Stop moving"], "answer": 0, "explain": "Higher temperature raises the fraction of molecules with enough energy to cross the activation barrier and makes collisions more frequent, so the rate increases.", "concept": "5E", "skill": "concepts", "cover_story": "hot and cold packs", "b": -0.2}, {"stem": "On the reaction's energy diagram, the overall enthalpy change is given by the:", "choices": ["Height of the activation-energy hump", "Difference in energy between reactants and products", "Speed of the reaction", "Temperature of the room"], "answer": 1, "explain": "The enthalpy change is the energy difference between reactants and products, while the activation energy is only the height of the barrier between them.", "concept": "5E", "skill": "concepts", "cover_story": "hot and cold packs", "b": 0.7}, {"stem": "A reaction is exothermic when the energy released by forming the product bonds is:", "choices": ["Less than the energy needed to break the reactant bonds", "Greater than the energy needed to break the reactant bonds", "Exactly zero", "Equal to the activation energy"], "answer": 1, "explain": "Breaking bonds costs energy and forming bonds releases it, so the reaction gives off net heat only when bond formation releases more than bond breaking absorbs.", "concept": "5E", "skill": "concepts", "cover_story": "hot and cold packs", "b": 1.3}]}, {"label": "Roller coaster loop", "paragraphs": ["A physics class analyzes a roller coaster car that runs along a track with a vertical circular loop. The car of mass 500 kg coasts down from a high hill and then races around the inside of the loop. The class treats the track as nearly frictionless and uses g = 10 m/s^2, so the car's mechanical energy is nearly constant and only gravity does significant work as the car changes height. They focus on the loop, where the car follows a circular path of radius 10 m, and they track how the car's speed, its acceleration, and the forces on it change from the bottom to the top of the loop.", "Moving in a circle requires a net inward force, called the centripetal force, that always points toward the center of the loop and has size m v squared over r. Even when the car moves around the loop at a steady speed, this inward force means the car is accelerating, because its direction keeps changing. At the very top of the loop the center is directly below the car, so gravity points toward the center and helps supply the needed force. If the car moves too slowly there, gravity alone is more than the required centripetal force and the car would leave the track, so there is a minimum speed at the top of the loop."], "source_ref": "OpenStax University Physics Vol 1, Ch. 6 and 8 (Centripetal Force and Conservation of Energy)", "questions": [{"stem": "As the car passes the top of the loop, its centripetal acceleration points:", "choices": ["Downward, toward the center", "Upward, away from the center", "Forward, along its motion", "Backward, against its motion"], "answer": 0, "explain": "Centripetal acceleration always points toward the center of the circle, which at the top of the loop is straight down. It is never along the direction of motion.", "concept": "4A", "skill": "concepts", "cover_story": "a roller coaster loop", "b": -0.3}, {"stem": "If the car took the loop at twice the speed, the centripetal force needed to hold it on the circular path would be:", "choices": ["Twice as large", "Half as large", "Four times as large", "Unchanged"], "answer": 2, "explain": "Centripetal force is m v squared over r, so it grows with the square of the speed. Doubling the speed multiplies the required force by four.", "concept": "4A", "skill": "reasoning", "cover_story": "a roller coaster loop", "b": 0.5}, {"stem": "While the car moves around the loop at constant speed, the net force on it is:", "choices": ["Nonzero and directed toward the center", "Zero, because the speed is constant", "Nonzero and directed along its motion", "Nonzero and directed outward"], "answer": 0, "explain": "Constant speed is not constant velocity, since the direction keeps changing, so a nonzero net force points toward the center to supply the centripetal acceleration.", "concept": "4A", "skill": "concepts", "cover_story": "a roller coaster loop", "b": 0.2}, {"stem": "For the 10 m radius loop, what is the minimum speed the car can have at the top and still keep contact with the track, using v = sqrt(g r)?", "choices": ["5 m/s", "10 m/s", "20 m/s", "100 m/s"], "answer": 1, "explain": "At the minimum speed gravity alone supplies the centripetal force, so m g = m v squared over r gives v = sqrt(g r) = sqrt(10 times 10) = 10 m/s.", "concept": "4A", "skill": "reasoning", "cover_story": "a roller coaster loop", "b": 1.2}, {"stem": "The track pushes inward on the car as it rounds the loop. By Newton's third law, the car pushes on the track with a force that is:", "choices": ["Larger than the track's push", "Smaller than the track's push", "Zero", "Equal in size and opposite in direction"], "answer": 3, "explain": "Newton's third-law pairs are always equal in magnitude and opposite in direction, so the car pushes on the track exactly as hard as the track pushes on it.", "concept": "4A", "skill": "concepts", "cover_story": "a roller coaster loop", "b": -0.1}, {"stem": "Ignoring friction, compared with the bottom of the loop the car at the top of the loop moves:", "choices": ["Faster, because it has gained energy", "At the same speed", "Not at all", "Slower, because kinetic energy became gravitational potential energy"], "answer": 3, "explain": "With mechanical energy conserved, rising to the top converts kinetic energy into gravitational potential energy, so the car is slower at the top than at the bottom.", "concept": "4A", "skill": "concepts", "cover_story": "a roller coaster loop", "b": 0.4}]}, {"label": "Airbag inflation and gas laws", "paragraphs": ["An engineer studies how a car airbag inflates. On impact, a sensor triggers a fast reaction that produces a burst of nitrogen gas, filling the bag in a small fraction of a second. To model the bag, the team treats nitrogen as an ideal gas and uses the ideal gas law, which ties together the pressure, volume, amount, and temperature of a gas: pressure times volume equals the number of moles times the gas constant times the absolute temperature. Because the reaction makes a fixed number of moles of gas, the engineers can predict the inflated volume. They also review how the pressure, volume, and temperature of a gas trade off when one quantity is held fixed.", "Several familiar rules follow from the ideal gas law. At a fixed temperature, squeezing a gas into a smaller volume raises its pressure, and stretching it into a larger volume lowers the pressure. At a fixed pressure, heating a gas makes it expand. At a fixed amount and temperature, equal volumes of any ideal gas hold the same number of molecules, and one mole of an ideal gas fills about 22.4 liters at standard temperature and pressure. The engineer adds that gas molecules are in constant random motion, that at a given temperature all ideal gases share the same average kinetic energy, and that real gases stray from ideal behavior at very high pressure and very low temperature."], "source_ref": "OpenStax Chemistry 2e, Ch. 9 (Gases)", "questions": [{"stem": "At a fixed temperature, if the nitrogen were squeezed into half its volume, its pressure would:", "choices": ["Double", "Fall to half", "Stay the same", "Fall to one quarter"], "answer": 0, "explain": "At constant temperature pressure and volume are inversely related by Boyle's law, so halving the volume doubles the pressure.", "concept": "4B", "skill": "concepts", "cover_story": "an inflating airbag", "b": -0.4}, {"stem": "At constant pressure, heating the nitrogen to a higher absolute temperature makes its volume:", "choices": ["Decrease", "Increase", "Stay the same", "Drop to zero"], "answer": 1, "explain": "At constant pressure volume is proportional to absolute temperature by Charles's law, so heating the gas expands it.", "concept": "4B", "skill": "concepts", "cover_story": "an inflating airbag", "b": -0.2}, {"stem": "How much volume does 2.0 mol of nitrogen occupy at standard temperature and pressure?", "choices": ["11.2 L", "22.4 L", "44.8 L", "89.6 L"], "answer": 2, "explain": "One mole of an ideal gas fills 22.4 L at standard temperature and pressure, so 2.0 mol fills about 44.8 L.", "concept": "4B", "skill": "reasoning", "cover_story": "an inflating airbag", "b": 0.3}, {"stem": "At fixed temperature and pressure, if the reaction produced twice as many moles of nitrogen, the inflated volume would be:", "choices": ["Half as large", "The same", "Four times as large", "Twice as large"], "answer": 3, "explain": "At fixed temperature and pressure, volume is proportional to the number of moles by Avogadro's principle, so twice the moles fills twice the volume.", "concept": "4B", "skill": "reasoning", "cover_story": "an inflating airbag", "b": 0.2}, {"stem": "At the same temperature, nitrogen molecules and heavier carbon dioxide molecules share the same average kinetic energy. The lighter nitrogen molecules therefore move on average:", "choices": ["Slower", "Faster", "At the same speed", "Not at all"], "answer": 1, "explain": "Equal average kinetic energy at the same temperature means the lighter molecules must move faster, since kinetic energy is one half m v squared.", "concept": "4B", "skill": "concepts", "cover_story": "an inflating airbag", "b": 1.1}, {"stem": "Real nitrogen behaves least like an ideal gas at:", "choices": ["High temperature and low pressure", "Standard temperature and pressure", "Very high pressure and very low temperature", "Every condition equally"], "answer": 2, "explain": "Real gases deviate most at high pressure and low temperature, where the molecules are close enough that their size and attractions matter. Near standard conditions they behave nearly ideally.", "concept": "4B", "skill": "concepts", "cover_story": "an inflating airbag", "b": 0.4}]}, {"label": "Designing a reaction-rate experiment", "paragraphs": ["A chemistry class tests what makes a slow reaction go faster. In one trial a student sprinkles a metal powder into the flask and stirs it, and the reaction visibly speeds up.", "The class then plans careful trials to pin down which factor is responsible before drawing any conclusion."], "source_ref": "OpenStax Chemistry 2e, Ch. 12 (Kinetics) and Ch. 1 (Essential Ideas)", "questions": [{"stem": "The student both added the metal and stirred the flask. To show the metal, and not the stirring, sped up the reaction, the control flask should be:", "choices": ["stirred the same way but with no metal added", "left completely still with the metal added", "heated to a higher temperature", "given twice as much metal"], "answer": 0, "explain": "The control is treated identically except for the one variable being tested, so any difference can be attributed to that variable and not to another factor such as the stirring.", "concept": "5E", "skill": "research", "cover_story": "a reaction-rate experiment"}, {"stem": "The class next wants to measure how temperature alone affects the rate. To test that fairly, they should:", "choices": ["raise the temperature and also add more reactant", "hold the concentrations and everything else constant and change only the temperature", "change the temperature and the catalyst together", "use a different reaction for each temperature"], "answer": 1, "explain": "To isolate the effect of temperature, the team holds all other conditions constant and changes only the temperature between trials, because temperature itself changes reaction rates.", "concept": "5E", "skill": "research", "cover_story": "a reaction-rate experiment"}, {"stem": "Two trials differed in both the amount of catalyst and the temperature, and the second trial was faster. The team cannot say what caused the speed-up because:", "choices": ["faster reactions are always caused by temperature", "the two changed variables are confounded, so the faster rate cannot be assigned to either one alone", "catalysts cannot change reaction rates", "the trials used too much reactant"], "answer": 1, "explain": "Because both the catalyst amount and the temperature were changed at the same time, the two variables are confounded and the difference in the result cannot be assigned to either variable by itself.", "concept": "5E", "skill": "research", "cover_story": "a reaction-rate experiment"}]}]}, "bio_biochem": {"title": "Bio/Biochem reasoning", "passages": [{"label": "Experiment", "paragraphs": ["A research team isolates a small globular protein, which they call vantagin, from pancreatic tissue. The mature protein is a single chain of 128 amino acids that folds into a compact shape with most of its nonpolar side chains buried in the interior. Three pairs of cysteine residues form disulfide bonds that lock the folded shape in place.", "To probe how structure supports function, the team measures the protein's net charge across a pH gradient and finds it carries no net charge at pH 6.8. Separately, they treat active protein with heat, with a reducing agent that breaks disulfide bonds, and with a detergent that disrupts noncovalent contacts. Each treatment abolishes activity, yet analysis shows the peptide backbone remains intact."], "source_ref": "OpenStax Biology 2e, Ch. 3 (Biological Macromolecules)", "questions": [{"stem": "The team loads vantagin onto a column buffered at pH 4.0. Based on its behavior in the pH gradient, what net charge will the protein most likely carry?", "choices": ["Net positive, because the pH is below its isoelectric point", "Net negative, because the pH is below its isoelectric point", "No net charge, because pH 4.0 equals its isoelectric point", "No charge at all, because the buried residues are nonpolar"], "answer": 0, "explain": "At a pH below the isoelectric point of 6.8, acidic and basic groups gain protons, so the protein carries a net positive charge.", "concept": "1A", "skill": "reasoning", "cover_story": "protein folding", "b": -1.3}, {"stem": "The reducing agent abolishes activity even though the amino acid sequence is unchanged. What does this best demonstrate about the disulfide bonds?", "choices": ["They form part of the primary sequence that encodes the protein", "They stabilize the folded three dimensional shape needed for activity", "They are the peptide bonds that link adjacent residues", "They shield the protein from changes in solution pH"], "answer": 1, "explain": "Disulfide bonds are covalent cross links that stabilize tertiary structure, so breaking them lets the chain unfold and lose function even though the sequence is intact.", "concept": "1A", "skill": "concepts", "cover_story": "protein folding", "b": -0.2}, {"stem": "Heating the solution destroys activity but leaves every peptide bond intact. Which conclusion is best supported?", "choices": ["Heat changed the order of amino acids in the chain", "Heat added new amino acids to the active site", "Heat disrupted higher order folding while the primary structure was preserved", "Heat converted the protein into a different polymer"], "answer": 2, "explain": "Denaturation disrupts the noncovalent interactions that hold secondary and tertiary structure, so the protein unfolds and loses function while its covalent sequence stays the same.", "concept": "1A", "skill": "concepts", "cover_story": "protein folding", "b": 0.4}, {"stem": "Why are most nonpolar side chains found buried in the protein's interior rather than on its surface?", "choices": ["Nonpolar groups form strong hydrogen bonds with surrounding water", "Nonpolar groups carry negative charges that repel one another", "Only nonpolar groups can form peptide bonds", "Burying nonpolar groups away from water is favorable in an aqueous cell"], "answer": 3, "explain": "In water, clustering hydrophobic side chains in the interior minimizes their contact with water and helps drive folding.", "concept": "1A", "skill": "concepts", "cover_story": "protein folding", "b": -0.7}, {"stem": "A later study shows the active enzyme is actually two identical vantagin chains bound together. A single substitution at the contact surface blocks the two chains from associating without changing how either chain folds on its own. The lost activity is best explained by disruption of which structural level?", "choices": ["Quaternary structure", "Primary structure", "Secondary structure", "Tertiary structure"], "answer": 0, "explain": "Quaternary structure is the assembly of multiple folded subunits, so preventing the subunits from associating removes quaternary structure while each chain's own fold is unchanged.", "concept": "1A", "skill": "concepts", "cover_story": "protein folding", "b": 0.7}, {"stem": "Spectroscopy reveals a repeating pattern of hydrogen bonds between backbone carbonyl oxygens and backbone amide hydrogens, producing regular coils and sheets. These features are examples of which level of protein structure?", "choices": ["Primary structure", "Secondary structure", "Tertiary structure", "Quaternary structure"], "answer": 1, "explain": "Regular local folding such as alpha helices and beta sheets, stabilized by backbone hydrogen bonds, defines secondary structure.", "concept": "1A", "skill": "concepts", "cover_story": "protein folding", "b": -0.4}]}, {"label": "Experiment", "paragraphs": ["A different team studies an enzyme, hydrolase X, that cleaves a colorless substrate into a colored product, letting them track reaction rate by color intensity. They hold the amount of enzyme fixed and vary substrate concentration, recording the initial rate at each level.", "As substrate rises, the rate climbs steeply at first and then levels off at a maximum, Vmax. The team then repeats the experiment with two candidate drugs. Drug A raises the substrate concentration needed to reach half of Vmax but does not change Vmax. Drug B lowers Vmax while leaving the half maximal substrate concentration unchanged."], "source_ref": "OpenStax Biology 2e, Ch. 6 (Metabolism)", "questions": [{"stem": "Why does the reaction rate level off at high substrate concentration?", "choices": ["The substrate begins to inhibit itself at high levels", "The product is being converted back into substrate", "Nearly all enzyme active sites are occupied, so the enzyme is saturated", "The enzyme is permanently denatured by excess substrate"], "answer": 2, "explain": "At saturating substrate, essentially all active sites are occupied at any instant, so adding more substrate cannot raise the rate and the enzyme works at its maximum.", "concept": "1A", "skill": "concepts", "cover_story": "enzyme kinetics", "b": -0.8}, {"stem": "Drug A increases the substrate concentration needed to reach half of Vmax but does not change Vmax. This pattern is most consistent with which type of inhibition?", "choices": ["Noncompetitive inhibition", "Irreversible denaturation", "Feedback activation", "Competitive inhibition"], "answer": 3, "explain": "A competitive inhibitor competes for the active site, so more substrate is needed to reach half maximal rate, yet enough substrate can still drive the reaction to the normal Vmax.", "concept": "1A", "skill": "data", "cover_story": "enzyme kinetics", "b": 0.1}, {"stem": "Drug B lowers Vmax while leaving the half maximal substrate concentration unchanged, and adding more substrate does not restore the original maximum rate. Which mechanism best explains Drug B?", "choices": ["It binds a site other than the active site and reduces the number of functional enzymes", "It binds the active site and competes with substrate", "It increases the enzyme's affinity for substrate", "It is consumed as a second substrate"], "answer": 0, "explain": "A noncompetitive inhibitor binds away from the active site and lowers Vmax, and because it does not compete for the active site, extra substrate cannot overcome it and the half maximal point is unchanged.", "concept": "1A", "skill": "data", "cover_story": "enzyme kinetics", "b": 0.5}, {"stem": "For the enzyme exposed to Drug A, what should happen to the reaction rate if the team greatly increases substrate concentration?", "choices": ["The rate stays suppressed no matter how much substrate is added", "The rate can approach the original Vmax as substrate outcompetes the drug", "Vmax will rise above the drug free value", "The enzyme will switch to making a different product"], "answer": 1, "explain": "Because a competitive inhibitor and substrate compete for the same site, high substrate concentration outcompetes the inhibitor and the rate approaches the normal Vmax.", "concept": "1A", "skill": "reasoning", "cover_story": "enzyme kinetics", "b": 0.0}, {"stem": "The team finds hydrolase X works best near 37 C and loses almost all activity at 70 C, with activity that does not return on cooling. What is the most likely reason for the loss at 70 C?", "choices": ["The substrate evaporated at 70 C", "The enzyme ran out of active sites", "The high temperature permanently denatured the enzyme", "High temperature made the reaction thermodynamically impossible"], "answer": 2, "explain": "Well above its optimum, heat disrupts the folded active site, and because the shape does not refold on cooling, activity does not return.", "concept": "1A", "skill": "reasoning", "cover_story": "enzyme kinetics", "b": -0.6}, {"stem": "In the cell, the end product of hydrolase X's pathway binds a distant regulatory site on the enzyme and slows it down, so flux through the pathway drops when product accumulates. This regulation is best described as...", "choices": ["Competitive inhibition at the active site", "An increase in Vmax caused by the product", "Irreversible covalent modification of the substrate", "Allosteric feedback inhibition"], "answer": 3, "explain": "Binding of the pathway's end product to a separate regulatory site that reduces activity is allosteric feedback inhibition, a common way cells match output to demand.", "concept": "1A", "skill": "concepts", "cover_story": "enzyme kinetics", "b": 0.9}]}, {"label": "Experiment", "paragraphs": ["A lab engineers a bacterial strain to study how a single gene is expressed into a functional protein. They can label newly made RNA and newly made protein separately, and they can introduce precise changes into the gene's DNA sequence.", "In one experiment they insert a single extra nucleotide near the start of the protein coding region. In another they change a single base so that a codon that once specified an amino acid becomes a stop codon. They then compare the length and activity of the protein produced in each case."], "source_ref": "OpenStax Biology 2e, Ch. 15 (Genes and Proteins)", "questions": [{"stem": "Inserting a single extra nucleotide near the start of the coding region abolishes the protein's function almost completely. What is the best explanation?", "choices": ["The insertion shifts the reading frame, so most codons downstream are misread", "The insertion only changes one amino acid and leaves the rest normal", "Extra nucleotides cannot be transcribed into RNA", "The ribosome simply skips the extra nucleotide"], "answer": 0, "explain": "Because codons are read in nonoverlapping groups of three, adding one nucleotide shifts the reading frame and changes essentially every downstream codon, usually destroying function.", "concept": "1B", "skill": "data", "cover_story": "gene expression", "b": 0.5}, {"stem": "Changing one base converts an internal codon into a stop codon. Compared with normal protein, the product of this gene will most likely be...", "choices": ["Longer than normal because translation continues past the change", "Truncated because translation stops early", "The same length but with one different amino acid", "Unchanged because stop codons are ignored inside a gene"], "answer": 1, "explain": "A premature stop codon ends translation early, producing a shortened protein that is usually nonfunctional.", "concept": "1B", "skill": "concepts", "cover_story": "gene expression", "b": 0.0}, {"stem": "A third change swaps one base but the encoded amino acid stays the same, and the protein is fully active. This outcome is best explained by which feature of the genetic code?", "choices": ["The code is read one base at a time", "tRNA can carry any amino acid to any codon", "The code is degenerate, so several codons can specify the same amino acid", "The ribosome proofreads and corrects the base"], "answer": 2, "explain": "The genetic code is degenerate, meaning most amino acids are specified by more than one codon, so some single base changes are silent and do not alter the protein.", "concept": "1B", "skill": "concepts", "cover_story": "gene expression", "b": 0.8}, {"stem": "The team labels newly made RNA and finds label appears in RNA before any labeled protein shows up. Which ordering of events does this support?", "choices": ["Protein is made first and then copied into RNA", "RNA and protein are made independently of the gene", "Protein is translated directly from DNA without RNA", "DNA is transcribed into RNA, which is then translated into protein"], "answer": 3, "explain": "RNA is synthesized from the DNA template during transcription and then serves as the message for protein synthesis during translation, so labeled RNA precedes labeled protein.", "concept": "1B", "skill": "concepts", "cover_story": "gene expression", "b": -0.3}, {"stem": "Which cellular machine directly reads the messenger RNA codons and joins amino acids into a chain?", "choices": ["The ribosome", "RNA polymerase", "DNA polymerase", "The spliceosome"], "answer": 0, "explain": "The ribosome binds mRNA, pairs each codon with the matching aminoacyl tRNA, and catalyzes peptide bond formation during translation.", "concept": "1B", "skill": "concepts", "cover_story": "gene expression", "b": -0.7}, {"stem": "The bacterium normally makes this protein only when a specific sugar is present. When the sugar is absent, a repressor binds the DNA and blocks transcription, and adding the sugar relieves the block. This behavior is characteristic of...", "choices": ["A constitutive gene that is always on", "An inducible operon controlled by a repressor", "A gene lacking any promoter", "A eukaryotic enhancer far from the gene"], "answer": 1, "explain": "An inducible operon is normally off because a repressor blocks transcription, and the inducer, here the sugar, inactivates the repressor so transcription can proceed, matching the lac operon logic.", "concept": "1B", "skill": "concepts", "cover_story": "gene expression", "b": 0.6}]}, {"label": "Cross", "paragraphs": ["A plant breeder studies flower color and stem height in a garden species. Flower color shows two forms, purple and white, and stem height shows tall and short. From earlier crosses the breeder knows that purple is dominant to white and tall is dominant to short, and the two genes sit on different chromosomes.", "The breeder crosses a plant that is heterozygous for both traits with a plant that is white flowered and short. Hundreds of offspring are scored for both traits, and the breeder also tracks how alleles are distributed into gametes."], "source_ref": "OpenStax Biology 2e, Ch. 12 (Mendel's Experiments and Heredity)", "questions": [{"stem": "The cross is a purple tall double heterozygote by a white short plant. Among the offspring, what phenotype ratio is expected for the four combinations?", "choices": ["9 purple tall : 3 purple short : 3 white tall : 1 white short", "3 purple tall : 1 white short", "1 purple tall : 1 purple short : 1 white tall : 1 white short", "All offspring purple and tall"], "answer": 2, "explain": "A test cross of a double heterozygote to a fully recessive parent gives a 1 to 1 to 1 to 1 ratio of the four phenotype combinations.", "concept": "1C", "skill": "concepts", "cover_story": "inheritance cross", "b": 0.2}, {"stem": "The equal 1 to 1 to 1 to 1 result, with new trait combinations appearing, is best explained by which principle?", "choices": ["The two genes are tightly linked and inherited together", "One trait blends into the other in offspring", "Both traits are controlled by a single gene", "Genes on different chromosomes assort independently during meiosis"], "answer": 3, "explain": "Because the two genes are on different chromosomes, they assort independently in meiosis, producing all four gamete types in equal proportions.", "concept": "1C", "skill": "concepts", "cover_story": "inheritance cross", "b": 0.1}, {"stem": "A white flowered plant always breeds true for white when self crossed. What does this indicate about the white allele?", "choices": ["White is the recessive phenotype, so white plants are homozygous recessive", "White is dominant to purple", "White plants must be heterozygous", "White results from a new mutation in each plant"], "answer": 0, "explain": "Because purple is dominant, a white plant must carry two recessive alleles, and homozygous recessive plants breed true for the recessive trait.", "concept": "1C", "skill": "concepts", "cover_story": "inheritance cross", "b": -1.1}, {"stem": "In a related species, two genes sit close together on the same chromosome. Compared with genes on different chromosomes, the alleles of these two linked genes will...", "choices": ["Assort completely independently", "Tend to be inherited together, with new combinations arising mainly through crossing over", "Never recombine under any circumstances", "Always produce a 9 to 3 to 3 to 1 ratio"], "answer": 1, "explain": "Linked genes tend to travel together, and recombination between them occurs mainly by crossing over, so the closer they are, the rarer new combinations become.", "concept": "1C", "skill": "concepts", "cover_story": "inheritance cross", "b": 0.9}, {"stem": "In a large, randomly mating population at equilibrium, the recessive white phenotype appears in 16 percent of plants. What fraction of plants are expected to be heterozygous carriers?", "choices": ["0.16", "0.36", "0.48", "0.64"], "answer": 2, "explain": "If the recessive homozygote frequency is 0.16 then the recessive allele frequency is 0.4 and the dominant is 0.6, so heterozygotes equal two times 0.6 times 0.4, which is 0.48.", "concept": "1C", "skill": "concepts", "cover_story": "inheritance cross", "b": 1.0}, {"stem": "A fungus arrives that kills short plants before they reproduce but spares tall plants. Over several generations, what is the most likely effect on the allele for tall stems?", "choices": ["Its frequency will fall because tall is dominant", "It will stay exactly the same because mutation is random", "The tall allele will disappear entirely in one generation", "Its frequency will rise because tall plants leave more offspring"], "answer": 3, "explain": "Selection that lets tall plants reproduce more raises the frequency of the tall allele over generations, the core idea of natural selection acting on heritable variation.", "concept": "1C", "skill": "reasoning", "cover_story": "inheritance cross", "b": -0.2}]}, {"label": "Experiment", "paragraphs": ["A physiology class studies how muscle cells generate ATP from glucose. They can measure oxygen use, glucose consumption, and the buildup of small molecules such as pyruvate and lactate in cultured cells under different oxygen conditions.", "In one run, cells have plenty of oxygen. In another, oxygen is nearly removed. The class also uses a chemical that makes the inner mitochondrial membrane leaky to protons, and they record what happens to ATP production and oxygen use."], "source_ref": "OpenStax Biology 2e, Ch. 7 (Cellular Respiration)", "questions": [{"stem": "When oxygen is nearly absent, the cells still make a small amount of ATP and accumulate lactate. Which pathway is supplying this ATP?", "choices": ["Glycolysis followed by fermentation in the cytoplasm", "Oxidative phosphorylation in the mitochondria", "The citric acid cycle in the mitochondrial matrix", "Beta oxidation of fatty acids"], "answer": 0, "explain": "Without oxygen, glycolysis in the cytoplasm still yields a net of two ATP per glucose, and fermentation to lactate regenerates NAD+ so glycolysis can continue.", "concept": "1D", "skill": "concepts", "cover_story": "cellular respiration", "b": -0.3}, {"stem": "Why is converting pyruvate to lactate useful for a cell that has no oxygen?", "choices": ["It produces most of the cell's ATP directly", "It regenerates NAD+ so glycolysis can keep running", "It stores oxygen for later use", "It converts lactate into glucose for energy"], "answer": 1, "explain": "Lactate fermentation reoxidizes NADH back to NAD+, the electron acceptor glycolysis needs, so without it glycolysis would stall once NAD+ ran out.", "concept": "1D", "skill": "concepts", "cover_story": "cellular respiration", "b": 0.5}, {"stem": "With oxygen present, the cells consume far more oxygen and make much more ATP per glucose. What direct role does oxygen play?", "choices": ["It is the starting fuel that is split to release energy", "It donates electrons to start the chain", "It is the final electron acceptor at the end of the electron transport chain", "It is a product of the citric acid cycle"], "answer": 2, "explain": "In aerobic respiration oxygen is the terminal electron acceptor of the electron transport chain, forming water, and without it the chain backs up and ATP output drops.", "concept": "1D", "skill": "concepts", "cover_story": "cellular respiration", "b": 0.2}, {"stem": "The chemical that makes the inner mitochondrial membrane leaky to protons causes oxygen use to stay high while ATP production collapses. What best explains this result?", "choices": ["The electron transport chain stops moving electrons", "Oxygen can no longer accept electrons", "Glycolysis is directly blocked by the chemical", "The proton gradient is dissipated, so ATP synthase can no longer use it to make ATP"], "answer": 3, "explain": "Uncouplers let protons leak back across the membrane, collapsing the gradient that drives ATP synthase, so electron transport and oxygen use continue but are no longer coupled to ATP synthesis.", "concept": "1D", "skill": "concepts", "cover_story": "cellular respiration", "b": 1.1}, {"stem": "Which statement best describes what the citric acid cycle contributes to ATP production?", "choices": ["It produces electron carriers, NADH and FADH2, that feed the electron transport chain", "It directly makes most of the cell's ATP", "It consumes oxygen directly to make water", "It converts glucose into pyruvate"], "answer": 0, "explain": "The citric acid cycle harvests high energy electrons as NADH and FADH2, which then drive the electron transport chain where most ATP is made.", "concept": "1D", "skill": "concepts", "cover_story": "cellular respiration", "b": 0.0}, {"stem": "Cells use the energy released by breaking down glucose to attach a phosphate to ADP, forming ATP. Coupling an energy releasing reaction to an energy requiring one in this way means the overall process is...", "choices": ["Impossible without an outside enzyme adding energy", "Energetically favorable overall, releasing net free energy", "Always exactly at equilibrium", "Independent of the cell's energy needs"], "answer": 1, "explain": "Cells couple exergonic reactions such as glucose breakdown to endergonic ones such as ATP synthesis so the combined process has a negative free energy change and proceeds.", "concept": "1D", "skill": "concepts", "cover_story": "cellular respiration", "b": -0.6}]}, {"label": "Experiment", "paragraphs": ["Students place animal cells that normally sit in a balanced salt solution into three beakers. Beaker 1 holds pure distilled water, beaker 2 holds a solution matched to the inside of the cell, and beaker 3 holds a concentrated salt solution far saltier than the cell interior.", "They watch the cells under a microscope over several minutes and also track the activity of a membrane pump that uses ATP to move sodium out of the cell and potassium in against their gradients."], "source_ref": "OpenStax Biology 2e, Ch. 5 (Structure and Function of Plasma Membranes)", "questions": [{"stem": "In beaker 1, holding distilled water, what will most likely happen to the animal cells?", "choices": ["They will shrink as water leaves", "They will stay the same size", "They will swell and may burst as water enters", "They will actively pump water outward and stay unchanged"], "answer": 2, "explain": "Distilled water is hypotonic to the cell, so water moves in by osmosis toward the higher solute concentration inside, swelling and possibly bursting the cell.", "concept": "2A", "skill": "concepts", "cover_story": "membrane transport", "b": -1.2}, {"stem": "In beaker 3, holding concentrated salt, what is the expected change in the cells?", "choices": ["They swell as salt enters", "They stay the same size", "They gain salt until they burst", "They shrink as water leaves toward the saltier solution"], "answer": 3, "explain": "The outside is hypertonic, so water leaves the cell by osmosis toward the higher external solute concentration and the cell shrinks.", "concept": "2A", "skill": "reasoning", "cover_story": "membrane transport", "b": -0.7}, {"stem": "The sodium potassium pump moves both ions against their concentration gradients and requires ATP. This is an example of...", "choices": ["Primary active transport", "Simple diffusion", "Facilitated diffusion", "Osmosis"], "answer": 0, "explain": "Moving ions against their gradients using energy taken directly from ATP is primary active transport.", "concept": "2A", "skill": "concepts", "cover_story": "membrane transport", "b": 0.1}, {"stem": "A poison blocks ATP production in these cells. What is the most likely effect on the sodium potassium pump and the ion gradients?", "choices": ["The pump speeds up to compensate", "The pump stops and the sodium and potassium gradients gradually run down", "The gradients grow stronger without ATP", "Sodium is still pumped out but potassium stops moving"], "answer": 1, "explain": "The pump depends on ATP, so without it pumping stops and ions leak down their gradients, dissipating the concentration differences over time.", "concept": "2A", "skill": "reasoning", "cover_story": "membrane transport", "b": 0.9}, {"stem": "The cells that keep their pumps running longest are those richest in mitochondria. Why would that be expected?", "choices": ["Mitochondria store sodium for the pump", "Mitochondria are where osmosis occurs", "Mitochondria supply the ATP the pump needs", "Mitochondria pump ions directly across the plasma membrane"], "answer": 2, "explain": "Mitochondria generate most of the cell's ATP, so cells rich in mitochondria can sustain ATP dependent pumping longer.", "concept": "2A", "skill": "concepts", "cover_story": "membrane transport", "b": -0.2}, {"stem": "A small nonpolar gas crosses the plasma membrane freely, but a charged ion cannot cross without a protein channel. Which membrane feature best explains this difference?", "choices": ["The membrane is a single layer of protein", "The membrane contains no proteins at all", "Charged ions are too small to interact with the membrane", "The hydrophobic interior of the lipid bilayer blocks charged particles but allows small nonpolar molecules"], "answer": 3, "explain": "The nonpolar core of the phospholipid bilayer lets small uncharged nonpolar molecules pass but repels charged ions, which need transport proteins.", "concept": "2A", "skill": "concepts", "cover_story": "membrane transport", "b": 0.3}]}, {"label": "Experiment", "paragraphs": ["A microbiology team grows a bacterial culture and tracks its numbers over time. In fresh medium the population doubles at a steady interval, then slows as nutrients run low. The team also exposes the culture to an antibiotic and to a bacteriophage, a virus that infects bacteria.", "They find that a few bacteria carry a small circular DNA molecule separate from the main chromosome that lets them survive the antibiotic. These survivors can pass copies of this molecule to neighboring bacteria through direct contact. Meanwhile, the bacteriophage injects its genetic material and forces the host to build new virus particles."], "source_ref": "OpenStax Biology 2e, Ch. 21 (Viruses) and Ch. 22 (Prokaryotes: Bacteria and Archaea)", "questions": [{"stem": "During the steady doubling phase, the number of bacteria over time increases...", "choices": ["Exponentially, doubling each interval", "Linearly, by the same number added each interval", "By a decreasing amount each interval", "Not at all until nutrients run out"], "answer": 0, "explain": "Binary fission with a constant doubling time produces exponential growth, so the count multiplies rather than adding a fixed amount each interval.", "concept": "2B", "skill": "concepts", "cover_story": "bacteria and phage", "b": -0.2}, {"stem": "The small circular DNA molecule that carries antibiotic survival and exists apart from the chromosome is best identified as a...", "choices": ["Ribosome", "Plasmid", "Capsid", "Nucleus"], "answer": 1, "explain": "A plasmid is a small circular DNA molecule separate from the bacterial chromosome that often carries extra genes such as antibiotic resistance.", "concept": "2B", "skill": "concepts", "cover_story": "bacteria and phage", "b": 0.1}, {"stem": "Survivors transfer copies of this resistance molecule to neighboring bacteria through direct contact. This form of horizontal gene transfer is...", "choices": ["Binary fission", "Mutation", "Conjugation", "Translation"], "answer": 2, "explain": "Transfer of DNA, often a plasmid, between bacteria through direct cell to cell contact is conjugation, a route by which resistance spreads.", "concept": "2B", "skill": "concepts", "cover_story": "bacteria and phage", "b": 0.6}, {"stem": "After antibiotic treatment, the surviving population is almost entirely resistant. What best explains this shift?", "choices": ["The antibiotic taught the bacteria to resist it", "Every bacterium mutated in response to the antibiotic", "The antibiotic converted itself into food for the bacteria", "The antibiotic killed susceptible cells and left resistant ones to reproduce"], "answer": 3, "explain": "The antibiotic selects against susceptible cells, so pre existing resistant cells survive and reproduce and the population becomes dominated by resistant bacteria.", "concept": "2B", "skill": "concepts", "cover_story": "bacteria and phage", "b": 0.8}, {"stem": "The bacteriophage must inject its genes and use the host's machinery to reproduce. This illustrates that viruses are...", "choices": ["Obligate intracellular agents that require a host cell to replicate", "Free living cells that grow by binary fission", "Bacteria with an extra membrane", "Organelles found inside bacteria"], "answer": 0, "explain": "Viruses lack their own machinery to make proteins and energy, so they must hijack a host cell to replicate, making them obligate intracellular parasites.", "concept": "2B", "skill": "concepts", "cover_story": "bacteria and phage", "b": 0.0}, {"stem": "In this infection the phage quickly forces the host to make many new virus particles that burst the cell to spread. This describes which viral pathway?", "choices": ["The lysogenic cycle with a dormant integrated genome", "The lytic cycle", "Binary fission", "Conjugation"], "answer": 1, "explain": "Rapid production of new virions followed by lysis of the host cell is the lytic cycle, in contrast to the lysogenic cycle where the viral genome integrates and stays dormant.", "concept": "2B", "skill": "concepts", "cover_story": "bacteria and phage", "b": -0.4}]}, {"label": "Experiment", "paragraphs": ["A cancer biology lab studies how cells decide whether to divide. They grow cells in a dish and can measure DNA content per cell, detect damaged DNA, and switch specific regulatory proteins on or off. Normal cells pause at checkpoints if conditions are not right.", "In one line, a checkp
