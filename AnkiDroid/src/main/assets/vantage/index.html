nce of the person it addresses."], "source_ref": "", "questions": [{"stem": "The passage's central argument is that", "choices": ["all difficult art is superior to accessible art", "art should make itself immediately available to everyone", "obscurity is always a form of the artist's vanity", "some artistic difficulty is valuable because it respects and rewards the audience's effort"], "answer": 3, "explain": "The author defends the difficulty that 'guards a genuine complexity' as 'a wager on the intelligence' of the audience.", "cover_story": "difficulty in art", "b": -1.4}, {"stem": "The author distinguishes between two kinds of difficulty primarily in order to", "choices": ["concede that some difficulty is worthless while defending the kind that guards real complexity", "prove that most difficult art is fraudulent", "show that accessibility and difficulty are ultimately the same", "argue that critics cannot tell good art from bad"], "answer": 0, "explain": "The author separates 'the difficulty that hides an emptiness' from 'the difficulty that guards a genuine complexity,' condemning the first and defending the second.", "cover_story": "difficulty in art", "b": 0.8}, {"stem": "The author's attitude toward the demand that art be accessible is", "choices": ["hostile toward anyone who enjoys popular art", "critical, seeing it as a misunderstanding despite its appeal", "sympathetic and fully in agreement", "neutral and undecided"], "answer": 1, "explain": "The demand's 'democratic ring' is acknowledged even as the author says it 'confuses two very different things.'", "cover_story": "difficulty in art", "b": -0.1}, {"stem": "As used in the passage, 'reserve' most nearly means", "choices": ["a feeling of shyness or reticence", "a sum set aside for emergencies", "an undisclosed depth held back for later discovery", "a protected area of land"], "answer": 2, "explain": "The work 'keeps a reserve' that it 'discloses on each return,' meaning hidden depth, not shyness or savings.", "cover_story": "difficulty in art", "b": 0.2}, {"stem": "The author suggests that art tailored to a low estimate of its audience is condescending because it", "choices": ["is usually more difficult than it appears", "refuses to entertain the audience at all", "is produced only for financial gain", "presumes in advance that the audience is incapable of more"], "answer": 3, "explain": "Such art 'has decided in advance how little we are capable of and has tailored itself to that low estimate.'", "cover_story": "difficulty in art", "b": 0.6}, {"stem": "Which scenario would most strengthen the author's argument?", "choices": ["a novel that puzzles readers at first but reveals new meaning on repeated readings", "a film that is confusing on first viewing and remains meaningless on every later one", "a painting that is admired instantly and never thought of again", "a poem that sells poorly despite being simple"], "answer": 0, "explain": "Valuable difficulty 'rewards the second reading and the tenth,' which the novel exemplifies while the empty film does not.", "cover_story": "difficulty in art", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["Every age seems to discover that it has arrived too late. The golden age lies always just behind us, in the generation of our parents or the century of our grandparents, when work was honest, neighbors were known, and the world had not yet been coarsened by whatever the writer happens to dislike. This conviction is so widespread and so durable that we might treat it less as a description of history than as a permanent feature of the human imagination, a lens that darkens whatever it turns toward the present and gilds whatever it turns toward the past. That the same lament recurs in every century, each time locating the fall a generation earlier, should make us cautious about trusting it in our own.", "This is not to say that nothing is ever lost. Particular goods do vanish, and to notice their passing is an act of honesty, not sentiment. The error lies in the leap from particular losses to a general verdict, the assumption that because some things have decayed the whole must be in decline. The narrative of decline is seductive precisely because it flatters the one who tells it, casting him as the clear-eyed witness of a corruption that others are too comfortable to see. But the historian's task is harder than lament. It is to weigh what has been lost against what has been gained, and to resist the pleasure of a story whose ending is decided before the evidence is in."], "source_ref": "", "questions": [{"stem": "The central thesis of the passage is that", "choices": ["nothing valuable is ever lost over the course of history", "the present is genuinely worse than the past in most respects", "the belief that the present is a decline from a better past is a recurring bias to be treated with caution", "historians should never write about loss"], "answer": 2, "explain": "The author treats the recurring lament 'less as a description of history than as a permanent feature of the human imagination.'", "cover_story": "the myth of decline", "b": -1.5}, {"stem": "The observation that the same lament recurs in every century serves to", "choices": ["prove that every past age was in fact superior to the present", "demonstrate that historians rarely agree with one another", "explain why writers dislike their own era", "cast doubt on the reliability of any single generation's sense of decline"], "answer": 3, "explain": "Because the lament repeats endlessly, the author says we should 'be cautious about trusting it in our own' century.", "cover_story": "the myth of decline", "b": 0.7}, {"stem": "The author's attitude toward the narrative of decline is best described as", "choices": ["wary, treating it as seductive but unreliable", "enraged by those who tell it", "persuaded by its clear-eyed honesty", "wholly indifferent"], "answer": 0, "explain": "The narrative is called 'seductive precisely because it Romantic picture of the solitary genius, visited by inspiration as by lightning, is comforting precisely because it removes creation from the ordinary world of effort, revision, and borrowing, and places it in a realm we could never have entered anyway.", "But look closely at any celebrated work and the lightning dissolves into a long accumulation of labor. There are the discarded drafts, the debts to predecessors that the finished masterpiece conceals, the collaborators whose names history mislays, the accidents of timing that let this attempt succeed where an earlier one, no less brilliant, was ignored. None of this diminishes the achievement; it only relocates it, from a miracle to be worshipped into a human effort that might, in part, be understood and even emulated. To call someone a genius, in the end, may be less a tribute than a refusal, a way of declining to ask how the work was actually done."], "source_ref": "", "questions": [{"stem": "The passage chiefly argues that", "choices": ["the idea of solitary genius obscures the labor, borrowing, and luck behind great work", "great works are not actually impressive achievements", "creation is best explained as sudden inspiration", "most celebrated works were produced by teams rather than individuals"], "answer": 0, "explain": "The author says close inspection reveals 'a long accumulation of labor,' debts, collaborators, and 'accidents of timing.'", "cover_story": "the myth of genius", "b": -1.3}, {"stem": "The author suggests that calling a work genius lets us 'excuse ourselves' because the label", "choices": ["is always insincere praise", "means the artist is rarely appreciated in time", "conveniently relieves us of having to learn from the achievement", "proves that talent does not exist"], "answer": 2, "explain": "If the work sprang from 'a gift the rest of us simply lack,' then 'there is nothing to learn from it,' so admiration 'becomes a way of keeping our distance.'", "cover_story": "the myth of genius", " ]}, {"label": "Passage", "paragraphs": ["Nothing sells quite so well now as the promise of the unsold. The handmade, the artisanal, the small batch and the locally sourced arrive wrapped in the suggestion that they stand outside the very market that delivers them to our door. We are invited to buy our way out of commerce, to purchase objects whose chief attraction is that they seem not to have been manufactured for purchase at all. There is a neat paradox here, and the industries built on it depend on our not looking at it too closely. The rougher the burlap and the more deliberate the imperfection, the more carefully the price has usually been calculated.", "It would be too easy, though, to end in mere debunking, as if exposing the marketing dissolved the longing it exploits. The longing is real. People genuinely want their possessions to mean something, to connect them to a maker, a place, a time not wholly governed by the logic of the transaction. The trouble is that this desire, once named, becomes the most reliable thing in the world to sell, and the authentic turns into simply another style, reproducible on demand and shipped in unmarked boxes. What began as a wish to escape the market ends as one of its most profitable departments, and the escape and the capture become impossible to tell apart."], "source_ref": "", "questions": [{"stem": "The passage's main point is that", "choices": ["no product can ever be genuinely handmade", "the desire for authenticity, though genuine, has itself become a marketable commodity", "consumers should feel guilty for wanting meaningful objects", "marketing is the only reason people value craftsmanship"], "answer": 1, "explain": "The author affirms that 'the longing is real,' yet notes 'the authentic turns into simply another style' and one of the market's 'most profitable departments.'", "cover_story": "authenticity as commodity", "b": -1.2}, {"stem": "The author's attitude toward the longing for authenticity is", "choices": [ ising its low prices and efficiency", "a corporation launching a line of mass-produced goods advertised as rebellious and independent", "a shopper who refuses to buy anything marketed as handmade"], "answer": 2, "explain": "Selling mass output under the banner of standing 'outside the very market' is precisely the paradox the author names.", "cover_story": "authenticity as commodity", "b": 1.3}]}, {"label": "Passage", "paragraphs": ["We praise tolerance as though its meaning were settled, but the word conceals a difficulty that its admirers rarely confront. To tolerate something is not to approve of it; on the contrary, tolerance only begins where approval ends. I do not tolerate the music I love or the friends I cherish, for there is nothing to endure in them. Tolerance is what I extend to what I find mistaken, distasteful, or wrong, and choose nonetheless to permit. This means that the tolerant person must first be a person of judgment, someone who has views strong enough to be offended and yet restrains the impulse to suppress what offends. Strip away the disapproval and you have not a purer tolerance but no tolerance at all, only indifference wearing its costume.", "This distinction matters because a society that mistakes indifference for tolerance will misunderstand what it is asking of its members. It will imagine that the tolerant citizen is one who has no strong convictions, when in fact he is one who holds them and still makes room for their denial. The genuinely difficult cases are never the ones we do not care about. They are the ones we care about intensely and permit anyway, out of a recognition that the power to silence is a power we would not wish turned against ourselves. Tolerance so understood is not a warm feeling but a hard discipline, and a culture that cannot tell it apart from mere unconcern has already begun to lose the thing it thinks it prizes."], "source_ref": "", "questions": [{"stem": "The central claim of the passage is that", "choices": ["people should never permit what they find wrong", "the most tolerant person is one who holds no strong convictions", "genuine tolerance requires disapproval and is distinct from indifference", "approval and tolerance are the same attitude"], "answer": 2, "explain": "'Tolerance only begins where approval ends,' and stripped of disapproval it becomes 'only indifference wearing its costume.'", "cover_story": "tolerance and disapproval", "b": -1.3}, {"stem": "The author's remark that he does not tolerate the music he loves serves to", "choices": ["show that tolerance applies only to what one does not approve of", "illustrate the author's personal taste in art", "argue that love and tolerance are equally valuable", "suggest that we should tolerate only what we enjoy"], "answer": 0, "explain": "'I do not tolerate the music I love ... for there is nothing to endure in them,' showing tolerance targets only the disliked.", "cover_story": "tolerance and disapproval", "b": 0.6}, {"stem": "The author's attitude toward a society that mistakes indifference for tolerance is", "choices": ["contemptuous of its citizens as fools", "concerned that it misunderstands what tolerance demands", "confident that such confusion is harmless", "amused and lightly ironic"], "answer": 1, "explain": "Such a society 'will misunderstand what it is asking of its members' and 'begin to lose the thing it thinks it prizes.'", "cover_story": "tolerance and disapproval", "b": -0.1}, {"stem": "As used in the passage, 'endure' most nearly means", "choices": ["survive a physical hardship", "last for a long time", "enjoy without reservation", "put up with something one finds objectionable"], "answer": 3, "explain": "'Nothing to endure' in what one loves means nothing to put up with, since endurance applies to the objectionable.", "cover_story": "tolerance and disapproval", "b": 0.0}, {"stem": "It can be inferred that the author considers the genuinely difficult cases of tolerance to be those in which a person", "choices": ["permits what he strongly opposes", "is indifferent to the outcome", "approves of what others reject", "lacks any firm convictions"], "answer": 0, "explain": "The hard cases 'are the ones we care about intensely and permit anyway.'", "cover_story": "tolerance and disapproval", "b": 0.5}, {"stem": "Which of the following would most weaken the author's account of tolerance?", "choices": ["a case of someone permitting a view he finds deeply wrong", "a society that suppresses ideas it dislikes", "evidence that the people most willing to permit offensive views are those who care least about the issues involved", "a person who tolerates only the ideas he already agrees with"], "answer": 2, "explain": "The author ties real tolerance to strong conviction; if the most permissive people are the most indifferent, that undercuts the claim.", "cover_story": "tolerance and disapproval", "b": 1.5}]}, {"label": "Passage", "paragraphs": ["A confident strain of modern taste holds that the beautiful and the useful are one, that an object achieves its highest elegance precisely when nothing about it is superfluous. On this view ornament is a kind of lie, a distraction from the honest expression of function, and the well-made thing wears its purpose plainly, like a tool. There is a genuine austerity in this creed, and for a time it produced work of great power. But it rests on an assumption worth questioning: that usefulness is the only honest reason for a thing to exist, and that whatever exceeds use must be justified at the bar of function or else confess itself a fraud.", "Consider how much of what we value refuses this accounting. The carved detail that no one needs, the flourish at the end of a letter, the song that does no work at all: these are not failures of discipline but expressions of a surplus that is among the better things about being human. To insist that everything earn its keep by usefulness is to apply to the whole of life a logic borrowed from the workshop, and to forget that the workshop itself exists so that, somewhere beyond it, there may be leisure, play, and the frankly unnecessary. The useless is not the enemy of the meaningful. Very often it is where meaning, freed at last from the demand that it pay for itself, is finally at liberty to appear."], "source_ref": "", "questions": [{"stem": "The passage chiefly argues that", "choices": ["useful objects can never be beautiful", "ornament is a dishonest distraction from function", "modern design has produced no work of value", "the useless and ornamental have genuine value that pure functionalism overlooks"], "answer": 3, "explain": "The author holds that 'the useless is not the enemy of the meaningful' but often 'where meaning ... is finally at liberty to appear.'", "cover_story": "ornament and use", "b": -1.4}, {"stem": "The author's attitude toward the confident strain of modern taste is", "choices": ["scornful of everything it has produced", "respectful of its power but critical of its underlying assumption", "fully convinced by its austerity", "bored and dismissive"], "answer": 1, "explain": "The creed 'produced work of great power,' yet 'rests on an assumption worth questioning.'", "cover_story": "ornament and use", "b": -0.2}, {"stem": "The examples of the carved detail, the flourish, and the song serve primarily to", "choices": ["prove that ornament is more important than function", "show that art is superior to craft", "illustrate valued things that cannot be justified by usefulness", "demonstrate that useful objects are always plain"], "answer": 2, "explain": "They are offered as prized things that are 'frankly unnecessary,' a surplus beyond use.", "cover_story": "ornament and use", "b": 0.5}, {"stem": "As used in the passage, 'surplus' most nearly means", "choices": ["an excess beyond what necessity requires", "a financial profit", "a shortage of resources", "a stockpile of emergency goods"], "answer": 0, "explain": "The 'surplus' names what 'exceeds use,' called 'among the better things about being human,' not a profit or store.", "cover_story": "ornament and use", "b": 0.0}, {"stem": "The phrase 'justified at the bar of function' implies that the functionalist view", "choices": ["considers all objects equally beautiful", "rejects the idea that objects have any purpose", "values ornament over utility", "treats usefulness as a standard that objects must satisfy to be legitimate"], "answer": 3, "explain": "The image pictures usefulness as a tribunal before which a thing must 'confess itself a fraud' or else pass.", "cover_story": "ornament and use", "b": 1.0}, {"stem": "Which statement, if true, would most strengthen the author's position?", "choices": ["the most popular consumer products are those with the most features", "people report that experiences with no practical payoff, such as idle music-making, are among the most meaningful in their lives", "ornamented buildings are more expensive to maintain than plain ones", "tools designed purely for function tend to last longer"], "answer": 1, "explain": "If purposeless experiences are the most meaningful, that supports the claim that the useless is where meaning appears.", "cover_story": "ornament and use", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["Two drivers are equally careless, each glancing away from the road for the same reckless instant. One arrives home with nothing worse than a fright; the other, through no greater fault, strikes a child who had stepped from the curb at exactly the wrong moment. We do not hesitate to judge them differently. The second is a killer, hunted by guilt and by the law, while the first is merely someone who was lucky. Yet if we ask what the two did differently, the honest answer is nothing. The gap between them was opened not by their wills but by the world, by a coincidence of timing over which neither had the smallest control.", "This is uncomfortable because our whole vocabulary of blame assumes that people are answerable only for what lies within their power. We tell ourselves that luck should make no moral difference, that a person deserves praise or blame strictly for the choices that were his to make. And then we go on judging as if the opposite were true, holding the unlucky driver responsible for an outcome that luck alone distinguished from the lucky one's. Perhaps the lesson is not that we should stop judging, which we plainly cannot do, but that we should judge with a humility our confident condemnations rarely show, remembering how much of anyone's record is a gift, or a curse, of circumstance."], "source_ref": "", "questions": [{"stem": "The passage is primarily concerned with", "choices": ["the unsettling role that luck plays in our moral judgments of people", "proving that no one is ever responsible for anything", "showing that luck has no bearing on morality", "arguing that careless drivers should be punished more harshly"], "answer": 0, "explain": "The two drivers 'did nothing differently,' yet are judged differently, exposing luck's grip on blame.", "cover_story": "moral luck", "b": -1.2}, {"stem": "The example of the two drivers functions primarily to", "choices": ["argue that traffic laws are unjust", "expose a tension between what people did and how differently they are judged", "prove that carelessness is always immoral", "show that accidents are usually unavoidable"], "answer": 1, "explain": "Both were 'equally careless,' but only one 'strikes a child,' and 'we do not hesitate to judge them differently.'", "cover_story": "moral luck", "b": 0.6}, {"stem": "The author's attitude in the passage is best described as", "choices": ["outraged at the injustice of the legal system", "confident that the puzzle has a simple solution", "troubled by an inconsistency he does not fully resolve", "lighthearted and unconcerned"], "answer": 2, "explain": "The author calls the situation 'uncomfortable' and offers only 'perhaps' a lesson, not a resolution.", "cover_story": "moral luck", "b": 0.2}, {"stem": "As used in the passage, 'answerable' most nearly means", "choices": ["capable of being solved", "willing to reply", "easy to predict", "accountable or responsible"], "answer": 3, "explain": "To be 'answerable ... for what lies within their power' is to be held responsible for it.", "cover_story": "moral luck", "b": -0.1}, {"stem": "The author suggests that our practice of blame is inconsistent because we", "choices": ["claim luck should not matter yet judge people by luck-determined outcomes", "refuse to hold anyone responsible for their choices", "blame people only for what they intended", "treat the two drivers as morally identical"], "answer": 0, "explain": "'We tell ourselves that luck should make no moral difference ... And then we go on judging as if the opposite were true.'", "cover_story": "moral luck", "b": 0.8}, {"stem": "Which conclusion does the author actually reach?", "choices": ["we should abandon moral judgment altogether", "we should punish the lucky and the unlucky identically in every case", "we should continue to judge but do so with greater humility", "we should treat outcomes as the only measure of blame"], "answer": 2, "explain": "The lesson is 'not that we should stop judging ... but that we should judge with a humility our confident condemnations rarely show.'", "cover_story": "moral luck", "b": 0.9}]}, {"label": "Passage", "paragraphs": ["We speak of privacy as if it were a natural possession, something every person holds by birthright and that intrusive powers can only take away. But the historical record suggests almost the reverse. For most of human history the very idea of a private life, a sphere of the self shielded from the eyes of the household and the village, would have seemed not sacred but strange. People slept many to a room, conducted their affairs in the open, and were known to their neighbors with a thoroughness we would now find suffocating. What we treat as a fundamental right is in large part a recent construction, assembled out of particular arrangements of walls, wealth, and law that did not always exist and need not always persist.", "To notice this is not to belittle privacy but to understand it better. A thing that was made can be unmade, and a right that depends on contingent conditions is more fragile than one written into nature. If privacy is not a gift of the human condition but an achievement of specific societies, then its survival is not guaranteed by any law of the universe; it must be defended by the same effort that first brought it into being. Those who assume that privacy is safe because it is natural have mistaken a hard-won and reversible accomplishment for a permanent feature of the landscape, and in that complacency lies precisely the danger."], "source_ref": "", "questions": [{"stem": "The passage's central argument is that", "choices": ["privacy has no value and should be abandoned", "privacy is a historical construction rather than a natural given, and is therefore more fragile than assumed", "privacy is a permanent and inevitable feature of human life", "people in the past enjoyed more privacy than we do"], "answer": 1, "explain": "Privacy is called 'in large part a recent construction' whose 'survival is not guaranteed by any law of the universe.'", "cover_story": "privacy as invention", "b": -1.3}, {"stem": "The author's purpose in noting that privacy was made is best described as", "choices": ["dismissive of the value of privacy", "reassuring that privacy is secure", "nostalgic for a time before privacy existed", "cautionary, warning that what was constructed can be lost"], "answer": 3, "explain": "'A thing that was made can be unmade,' and complacency about privacy's naturalness is 'precisely the danger.'", "cover_story": "privacy as invention", "b": 0.0}, {"stem": "The description of people who slept many to a room serves primarily to", "choices": ["provide historical evidence that privacy has not always been valued or available", "argue that crowded living is healthier than solitude", "show that the past was poorer than the present", "prove that privacy is a universal human need"], "answer": 0, "explain": "People who lived 'in the open' and were closely known show that a private sphere 'did not always exist.'", "cover_story": "privacy as invention", "b": 0.5}, {"stem": "As used in the passage, 'contingent' most nearly means", "choices": ["urgent and pressing", "shared among many people", "dependent on particular conditions that could have been otherwise", "morally required"], "answer": 2, "explain": "'Contingent conditions' are set against what is 'written into nature,' meaning they might not have obtained.", "cover_story": "privacy as invention", "b": 0.2}, {"stem": "The author would most likely agree that a right grounded in nature would be", "choices": ["equally fragile as any other right", "more secure than one grounded in contingent social arrangements", "impossible to defend in practice", "less valuable than a constructed right"], "answer": 1, "explain": "'A right that depends on contingent conditions is more fragile than one written into nature,' so a natural right would be more secure.", "cover_story": "privacy as invention", "b": 0.9}, {"stem": "Which finding would most weaken the author's thesis?", "choices": ["evidence that modern privacy law is complex and varies by country", "evidence that wealthy people have always had more private space than the poor", "evidence that surveillance technology is advancing rapidly", "evidence that every known human society, however arranged, has carved out some protected sphere of private life"], "answer": 3, "explain": "Universality across all societies would suggest privacy is natural rather than a contingent invention, undercutting the thesis.", "cover_story": "privacy as invention", "b": 1.4}]}, {"label": "Passage", "paragraphs": ["To attend to something is to grant it a portion of a resource we possess in strictly limited supply. We may have a whole lifetime, but only ever a moment at a time, and each moment given to one object is withheld from every other. This is why attention has always had a moral dimension that its recent framing as a mere commodity, harvested and sold, tends to obscure. When I attend to you, I am not simply processing information about you; I am giving you something I cannot give to everyone at once, and in the giving I acknowledge that you are worth it. The opposite of attention is not distraction but a subtle form of contempt, the refusal to grant that anything before me deserves the whole of my regard.", "The machinery of distraction, then, does more than fragment our concentration. It quietly trains us in a habit of withholding, teaching us to skim where we might have dwelt and to sample where we might have stayed. We come to treat every object, and eventually every person, as one more item in an endless feed, worth a glance and no more. What is lost is not merely productivity but a certain capacity for reverence, the willingness to let something matter enough to command us fully. To learn again how to attend would be to relearn a kind of courtesy toward the world, and perhaps toward one another, that the age has made quietly difficult."], "source_ref": "", "questions": [{"stem": "The passage principally argues that", "choices": ["attention is a limited resource with a moral dimension that a culture of distraction erodes", "technology should be banned to protect concentration", "attention is merely a commodity to be bought and sold", "distraction is harmful mainly because it reduces workplace productivity"], "answer": 0, "explain": "Attention is 'a resource we possess in strictly limited supply' with a 'moral dimension,' and distraction trains 'a habit of withholding.'", "cover_story": "attention and reverence", "b": -1.2}, {"stem": "The claim that the opposite of attention is 'a subtle form of contempt' primarily serves to", "choices": ["argue that distracted people are deliberately cruel", "define the term distraction more precisely", "reframe inattention as a moral failing rather than a mere lapse of focus", "claim that contempt is the most common human emotion"], "answer": 2, "explain": "Calling inattention 'contempt' recasts it as a refusal of regard, not just lost focus.", "cover_story": "attention and reverence", "b": 0.8}, {"stem": "The author's attitude toward the machinery of distraction is", "choices": ["panicked and despairing", "critical, viewing it as corrosive to something valuable", "approving of its efficiency", "neutral and merely descriptive"], "answer": 1, "explain": "It is said to erode 'a certain capacity for reverence,' a loss the author laments.", "cover_story": "attention and reverence", "b": -0.1}, {"stem": "As used in the passage, 'reverence' most nearly means", "choices": ["religious worship of a deity", "fearful obedience to authority", "polite formality", "deep regard that lets something fully matter"], "answer": 3, "explain": "'Reverence' is glossed as 'the willingness to let something matter enough to command us fully.'", "cover_story": "attention and reverence", "b": 0.1}, {"stem": "It can be inferred that the author regards the endless feed as harmful mainly because it", "choices": ["trains us to give everything only a fleeting glance", "contains inaccurate information", "is designed to make money from its users", "is too difficult for most people to understand"], "answer": 0, "explain": "The feed leads us to treat every object 'as one more item ... worth a glance and no more.'", "cover_story": "attention and reverence", "b": 0.7}, {"stem": "Which behavior best exemplifies the courtesy toward the world the author hopes to recover?", "choices": ["memorizing as much information as possible in a short time", "responding instantly to every message as it arrives", "reading a single poem slowly and returning to it, rather than scrolling past dozens of them", "avoiding all forms of technology on principle"], "answer": 2, "explain": "The recovered courtesy means to 'dwell' rather than 'skim,' letting one thing 'command us fully.'", "cover_story": "attention and reverence", "b": 1.1}]}, {"label": "Passage", "paragraphs": ["We tend to rank the finished composition above the improvised performance, as though spontaneity were a rougher draft of what deliberation would eventually perfect. The composer, we assume, has the advantage of time; he can revise, discard, and return, so that what reaches us has been purified of every accident. The improviser, by contrast, must accept his mistakes as part of the record, unable to unsay a phrase once it has left him. Judged by the standard of polish, improvisation can only ever lose. But polish is not the only value, and the very feature that seems to be improvisation's weakness may be the source of its peculiar power.", "What we hear in a genuine improvisation is not merely a sequence of notes but a mind deciding in real time, exposed to a risk the composer has carefully removed. Every phrase is chosen once and cannot be taken back, and this irreversibility lends the performance a quality that no amount of editing can supply: the sense that we are present at something happening rather than something prepared. The polished work invites admiration; the improvised one invites a stranger and more immediate response, closer to the way we watch someone cross a narrow bridge without a rope. To prefer the finished object in every case is to value the result while forgetting that, in art as in life, part of what can move us is the visible fact of the chance being taken."], "source_ref": "", "questions": [{"stem": "The central thesis of the passage is that", "choices": ["improvised music is always better than composed music", "composition is superior because it removes all mistakes", "composers happen to have more working time than improvisers", "improvisation possesses a value, tied to risk and immediacy, that polished composition lacks"], "answer": 3, "explain": "The author says 'the very feature that seems to be improvisation's weakness may be the source of its peculiar power.'", "cover_story": "improvisation and risk", "b": -1.4}, {"stem": "The comparison to someone crossing a narrow bridge without a rope primarily serves to", "choices": ["convey the sense of risk that makes improvisation compelling", "suggest that improvisation is physically dangerous", "argue that improvisers are more skilled than composers", "illustrate how difficult composition can be"], "answer": 0, "explain": "The image figures the exposed risk of a choice that 'cannot be taken back.'", "cover_story": "improvisation and risk", "b": 0.7}, {"stem": "Toward the common tendency to rank the finished composition above the improvised performance, the author is", "choices": ["outraged at its unfairness", "skeptical, treating it as an incomplete standard of value", "firmly in agreement", "wholly uninterested"], "answer": 1, "explain": "The author grants that 'judged by the standard of polish, improvisation can only ever lose,' then insists 'polish is not the only value.'", "cover_story": "improvisation and risk", "b": -0.1}, {"stem": "As used in the passage, 'polish' most nearly means", "choices": ["a coating applied to produce shine", "elegance of social manners", "refinement achieved through revision", "speed of execution"], "answer": 2, "explain": "'Polish' names what revision yields, work 'purified of every accident,' not a coating or manners.", "cover_story": "improvisation and risk", "b": 0.1}, {"stem": "The author implies that the irreversibility of improvisation is valuable because it", "choices": ["guarantees that no mistakes will occur", "allows the performer to revise in real time", "makes improvisation easier than composition", "makes the audience feel present at something happening rather than prepared"], "answer": 3, "explain": "Irreversibility supplies 'the sense that we are present at something happening rather than something prepared.'", "cover_story": "improvisation and risk", "b": 0.8}, {"stem": "Which situation is most analogous to the value the author finds in improvisation?", "choices": ["watching a live debate in which speakers must respond on the spot, without prepared scripts", "reading a carefully edited transcript of a speech", "viewing a film that required many retakes to perfect", "studying a painting the artist reworked over many years"], "answer": 0, "explain": "The live, unscripted, unrepeatable response mirrors 'a mind deciding in real time, exposed to a risk the composer has ... removed.'", "cover_story": "improvisation and risk", "b": 1.2}]}]}, "chem_phys": {"title": "Chem/Phys reasoning", "passages": [{"label": "Cart on a ramp", "paragraphs": ["A teaching lab studies motion with a 2.0 kg cart on a straight track tilted 30 degrees above the horizontal. The track is nearly frictionless, and a motion sensor records the cart after it is released from rest. Students use g = 10 m/s^2 and ignore air resistance.", "In one run the cart starts 1.0 m up the track, measured along the incline, and slides to the bottom. A light spring bumper there briefly stops the cart and pushes it back. The class then repeats the run with a stiffer spring."], "source_ref": "OpenStax University Physics Vol 1, Ch. 5-8 (Newton's Laws, Work, and Energy)", "questions": [{"stem": "The cart is released from rest and slides 1.0 m down the incline. Using energy conservation, what is its speed at the bottom?", "choices": ["2.2 m/s", "3.2 m/s", "4.5 m/s", "5.0 m/s"], "answer": 1, "explain": "Only the vertical drop counts: h = 1.0 sin 30 = 0.5 m, so v = sqrt(2gh) = sqrt(10) which is about 3.2 m/s. Using the full 1.0 m as the height gives the too large 4.5 m/s.", "concept": "4A", "cover_story": "cart on a ramp", "b": -0.3}, {"stem": "While the cart slides down the frictionless incline, how does the normal force from the track compare with the cart's weight?", "choices": ["Greater than the weight", "Equal to the weight", "Zero", "Less than the weight"], "answer": 3, "explain": "On an incline the normal force is mg cos 30, which is smaller than mg because cos 30 is less than 1. It equals the weight only on level ground.", "concept": "4A", "cover_story": "cart on a ramp", "b": -0.9}, {"stem": "What is the magnitude of the cart's acceleration down the frictionless incline?", "choices": ["2.5 m/s^2", "5.0 m/s^2", "8.7 m/s^2", "10 m/s^2"], "answer": 1, "explain": "On a frictionless incline a = g sin(theta) = 10 times 0.5 = 5 m/s^2. The value 8.7 comes from wrongly using cos 30.", "concept": "4A", "cover_story": "cart on a ramp", "b": -0.5}, {"stem": "How much work does gravity do on the 2.0 kg cart as it slides the 1.0 m down to the bottom?", "choices": ["5 J", "10 J", "17 J", "20 J"], "answer": 1, "explain": "Work by gravity is mgh with h = 0.5 m, so 2 times 10 times 0.5 = 10 J. Using the 1.0 m path length as the height double counts and gives 20 J.", "concept": "4A", "cover_story": "cart on a ramp", "b": -0.3}, {"stem": "The cart reaches the spring and compresses it until it stops for an instant. If a stiffer spring (larger force constant k) is used for the same incoming speed, the maximum compression of the spring will be:", "choices": ["Smaller", "Larger", "Unchanged", "Zero"], "answer": 0, "explain": "The kinetic energy delivered is fixed, and it all becomes spring energy one half k x squared, so a larger k forces a smaller maximum compression x.", "concept": "4A", "cover_story": "cart on a ramp", "b": 0.4}, {"stem": "In a later run the cart takes 2.0 s to reach the bottom, and the drop releases 10 J of gravitational potential energy. What is the average power delivered by gravity during the slide?", "choices": ["2.5 W", "5 W", "10 W", "20 W"], "answer": 1, "explain": "Average power is work over time, 10 J divided by 2.0 s = 5 W.", "concept": "4A", "cover_story": "cart on a ramp", "b": -0.6}]}, {"label": "IV line and blood flow", "paragraphs": ["A nurse hangs a bag of saline for an intravenous drip. A tube carries fluid from the bag down to a needle in a patient's arm. The saline has about the density of water, 1000 kg/m^3, and it flows because the bag sits above the arm. Use g = 10 m/s^2.", "In a separate model of a partly blocked artery, a rigid tube narrows so that the radius of the narrow segment is half the radius of the wide segment. The fluid is treated as incompressible and the flow as steady."], "source_ref": "OpenStax University Physics Vol 1, Ch. 14 (Fluid Mechanics)", "questions": [{"stem": "Raising the saline bag higher above the arm increases the flow into the vein mainly by increasing the:", "choices": ["density of the saline", "viscosity of the saline", "surface tension of the saline", "hydrostatic pressure driving the flow"], "answer": 3, "explain": "The driving pressure is the hydrostatic head rho g h, so a greater height h means more pressure pushing fluid into the vein.", "concept": "4B", "cover_story": "IV drip and a narrowed vessel", "b": -1.2}, {"stem": "If the bag hangs 1.0 m above the needle, about how much pressure does that height add at the needle?", "choices": ["100 Pa", "1,000 Pa", "10,000 Pa", "100,000 Pa"], "answer": 2, "explain": "Hydrostatic pressure is rho g h = 1000 times 10 times 1.0 = 10,000 Pa.", "concept": "4B", "cover_story": "IV drip and a narrowed vessel", "b": -0.6}, {"stem": "In the narrowed artery model the radius drops to half. By the continuity equation, the fluid speed in the narrow segment becomes about:", "choices": ["half the wide-segment speed", "twice the wide-segment speed", "four times the wide-segment speed", "eight times the wide-segment speed"], "answer": 2, "explain": "Continuity keeps area times speed constant. Halving the radius cuts the area to one quarter, so the speed must rise fourfold.", "concept": "4B", "cover_story": "IV drip and a narrowed vessel", "b": 0.5}, {"stem": "Compared with the wide segment, the fluid pressure in the fast, narrow segment is best predicted by Bernoulli's principle to be:", "choices": ["Lower than in the wide segment", "Higher than in the wide segment", "The same as in the wide segment", "Zero"], "answer": 0, "explain": "For an ideal fluid, faster flow goes with lower pressure, so the narrow, high-speed region has lower pressure than the wide region.", "concept": "4B", "cover_story": "IV drip and a narrowed vessel", "b": 0.2}, {"stem": "Blood is actually viscous. If a vessel keeps the same pressure difference but its radius falls to half, Poiseuille's law predicts the volume flow rate falls to about:", "choices": ["one half", "one quarter", "one eighth", "one sixteenth"], "answer": 3, "explain": "Poiseuille flow scales with the radius to the fourth power, so halving the radius gives (1/2) to the fourth = 1/16 of the flow.", "concept": "4B", "cover_story": "IV drip and a narrowed vessel", "b": 1.0}, {"stem": "A sealed drug capsule with a density less than saline is dropped into the bag and floats. The buoyant force on the floating capsule is:", "choices": ["Greater than the capsule's weight", "Equal to the capsule's weight", "Less than the capsule's weight", "Zero"], "answer": 1, "explain": "A floating object is in equilibrium, so the buoyant force exactly balances its weight.", "concept": "4B", "cover_story": "IV drip and a narrowed vessel", "b": -0.5}]}, {"label": "Sensor circuit and a magnet", "paragraphs": ["A bioinstrumentation student powers a small sensor from a 9 V battery. She can wire two resistors, 100 ohm and 200 ohm, either in series or in parallel, and she adds a 2 microfarad parallel-plate capacitor to store a little charge.", "Nearby she studies how charges behave. She measures the force between two fixed point charges as she changes their separation, and she watches a positive ion drift to the right through a region where a magnetic field points out of the page."], "source_ref": "OpenStax University Physics Vol 2, Ch. 5-11 (Electric Charges and Fields through Magnetic Forces)", "questions": [{"stem": "The student doubles the distance between two fixed point charges. The electric force between them becomes:", "choices": ["twice as large", "half as large", "one quarter as large", "four times as large"], "answer": 2, "explain": "Coulomb's law makes the force scale as 1 over distance squared, so doubling the distance cuts the force to one quarter.", "concept": "4C", "cover_story": "a sensor circuit", "b": -0.5}, {"stem": "With the 100 ohm and 200 ohm resistors in series across the 9 V battery, what current flows from the battery?", "choices": ["0.01 A", "0.03 A", "0.09 A", "0.30 A"], "answer": 1, "explain": "Series resistances add to 300 ohm, so I = V over R = 9 divided by 300 = 0.03 A.", "concept": "4C", "cover_story": "a sensor circuit", "b": -0.4}, {"stem": "If instead the two resistors are wired in parallel, the total resistance is:", "choices": ["less than 100 ohm", "exactly 150 ohm", "exactly 300 ohm", "more than 300 ohm"], "answer": 0, "explain": "Resistors in parallel always give a total smaller than the smallest branch, so less than 100 ohm (about 67 ohm here).", "concept": "4C", "cover_story": "a sensor circuit", "b": -0.6}, {"stem": "One 100 ohm resistor carries a current of 0.03 A. About how much power does it dissipate as heat?", "choices": ["0.03 W", "0.09 W", "0.3 W", "9 W"], "answer": 1, "explain": "Power is I squared times R = (0.03) squared times 100 = 0.09 W.", "concept": "4C", "cover_story": "a sensor circuit", "b": 0.5}, {"stem": "The 2 microfarad capacitor sits across the full 9 V. How much charge does it store?", "choices": ["about 4.5 microcoulombs", "about 11 microcoulombs", "about 18 microcoulombs", "about 36 microcoulombs"], "answer": 2, "explain": "Stored charge is Q = C times V = 2 microfarad times 9 V = 18 microcoulombs.", "concept": "4C", "cover_story": "a sensor circuit", "b": 0.1}, {"stem": "The positive ion moves to the right while the magnetic field points out of the page. The magnetic force on the ion points:", "choices": ["toward the top of the page", "in the same direction it is moving", "opposite to its motion", "toward the bottom of the page"], "answer": 3, "explain": "Using F = q v cross B with velocity to the right and field out of the page, the right-hand rule gives a force toward the bottom of the page. The magnetic force is always perpendicular to the velocity, so it cannot point along the motion.", "concept": "4C", "cover_story": "a sensor circuit", "b": 1.1}]}, {"label": "Endoscope optics", "paragraphs": ["An endoscope guides light along thin glass fibers and uses small lenses to form images inside the body. Light passes from glass, where it travels slower, into tissue, where it travels faster, and it also reflects back into the fibers.", "One converging lens in the tip has a focal length of 2 cm, and a small structure sits 6 cm in front of it. The doctor also compares red and blue light and checks the optics with a pair of narrow slits."], "source_ref": "OpenStax University Physics Vol 3, Ch. 1-4 (The Nature of Light, Geometric Optics, Interference, and Diffraction)", "questions": [{"stem": "Light passes from glass into tissue, where it travels faster. As it crosses the boundary, the light bends:", "choices": ["toward the normal", "away from the normal", "straight back the way it came", "not at all"], "answer": 1, "explain": "Moving into a medium with a lower index, light speeds up and bends away from the normal, as Snell's law requires.", "concept": "4D", "cover_story": "inside an endoscope", "b": 0.1}, {"stem": "Light stays trapped inside the glass fiber because, when it strikes the fiber wall at a shallow angle, it undergoes:", "choices": ["Complete absorption", "Refraction out of the fiber", "Total internal reflection", "A Doppler shift"], "answer": 2, "explain": "Beyond the critical angle, light in the denser glass is totally internally reflected, so it stays inside the fiber.", "concept": "4D", "cover_story": "inside an endoscope", "b": -0.5}, {"stem": "For the 2 cm focal length lens with the object 6 cm away, the image distance (using 1/f = 1/do + 1/di) is:", "choices": ["1.5 cm", "3 cm", "6 cm", "12 cm"], "answer": 1, "explain": "1/di = 1/f - 1/do = 1/2 - 1/6 = 1/3, so di = 3 cm.", "concept": "4D", "cover_story": "inside an endoscope", "b": 0.6}, {"stem": "That image, formed by a converging lens with the object outside the focal length, is:", "choices": ["Virtual and upright", "Virtual and inverted", "Real and inverted", "Real and upright"], "answer": 2, "explain": "For a converging lens with the object beyond the focal length, the image is real and inverted.", "concept": "4D", "cover_story": "inside an endoscope", "b": 0.3}, {"stem": "The doctor compares blue light and red light. Because blue light has a higher frequency, each blue photon carries:", "choices": ["Less energy than a red photon", "The same energy as a red photon", "No energy", "More energy than a red photon"], "answer": 3, "explain": "Photon energy E = h times f rises with frequency, so higher-frequency blue photons carry more energy than red ones.", "concept": "4D", "cover_story": "inside an endoscope", "b": -0.6}, {"stem": "In the double-slit alignment check, if the two slits are moved closer together, the bright fringes on the screen will be:", "choices": ["Spaced farther apart", "Spaced closer together", "Unchanged", "Removed entirely"], "answer": 0, "explain": "Fringe spacing is inversely proportional to slit separation, so bringing the slits closer spreads the fringes farther apart.", "concept": "4D", "cover_story": "inside an endoscope", "b": 0.7}]}, {"label": "Radiotracer and the periodic table", "paragraphs": ["A hospital uses a radioactive tracer with a half-life of 6 hours. A technician prepares a dose and reviews the chemistry of the elements involved, including where they sit on the periodic table and how their atoms are built.", "One isotope decays by turning a neutron into a proton while emitting a light negative particle. The technician also plans a simple labeling reaction and counts the atoms it needs."], "source_ref": "OpenStax Chemistry 2e, Ch. 3, 6, and 21 (Composition of Substances, Electronic Structure, and Nuclear Chemistry)", "questions": [{"stem": "A sample of the tracer starts with 80 mg. After 12 hours (two half-lives of 6 hours each), how much remains?", "choices": ["40 mg", "20 mg", "10 mg", "0 mg"], "answer": 1, "explain": "Each 6-hour half-life halves the amount: 80 to 40 after 6 hours, then 40 to 20 after 12 hours.", "concept": "4E", "cover_story": "a hospital radiotracer", "b": -0.6}, {"stem": "An isotope decays by converting a neutron into a proton and emitting a light negative particle. This is:", "choices": ["Alpha decay", "Gamma decay", "Electron capture", "Beta-minus decay"], "answer": 3, "explain": "Turning a neutron into a proton while emitting an electron (a beta particle) is beta-minus decay, and it raises the atomic number by one.", "concept": "4E", "cover_story": "a hospital radiotracer", "b": 0.0}, {"stem": "When a different nucleus emits an alpha particle, its mass number changes by:", "choices": ["unchanged", "increases by 2", "decreases by 2", "decreases by 4"], "answer": 3, "explain": "An alpha particle carries away 2 protons and 2 neutrons, so the mass number drops by 4 (and the atomic number by 2).", "concept": "4E", "cover_story": "a hospital radiotracer", "b": -0.5}, {"stem": "Moving from left to right across a period of the periodic table, atomic radius generally:", "choices": ["Decreases", "Increases", "Stays the same", "Doubles"], "answer": 0, "explain": "Across a period the nuclear charge felt by the outer electrons rises while they stay in the same shell, pulling them inward, so the radius shrinks.", "concept": "4E", "cover_story": "a hospital radiotracer", "b": -0.7}, {"stem": "An element in group 16, such as oxygen or sulfur, typically gains how many electrons to reach a noble-gas configuration?", "choices": ["1", "2", "3", "6"], "answer": 1, "explain": "Group 16 atoms have six valence electrons and gain two to complete an octet.", "concept": "4E", "cover_story": "a hospital radiotracer", "b": -0.4}, {"stem": "Labeling one molecule of the tracer needs 2 atoms of the isotope. If the technician has 6 atoms of isotope and unlimited target molecules, how many labeled molecules can be made, and what runs out first?", "choices": ["6 molecules, with isotope limiting", "3 molecules, with the target limiting", "3 molecules, with isotope limiting", "12 molecules, with neither limiting"], "answer": 2, "explain": "Each product needs 2 isotope atoms, so 6 atoms make 3 labeled molecules and the isotope is the limiting reactant.", "concept": "4E", "cover_story": "a hospital radiotracer", "b": 0.5}]}, {"label": "Buffers and titration", "paragraphs": ["A student prepares buffers and runs titrations. One buffer is made from a weak acid with a pKa of 4.7 and its conjugate base. The student measures pH and watches how it responds to small additions of acid or base.", "In a titration, a weak acid in the flask is neutralized by a strong base added from a burette. The student also studies a sparingly soluble salt to see how added ions change its solubility."], "source_ref": "OpenStax Chemistry 2e, Ch. 14-15 (Acid-Base Equilibria and Equilibria of Other Reaction Classes)", "questions": [{"stem": "A 0.01 M solution of a strong acid that fully dissociates has a pH of about:", "choices": ["1", "2", "7", "12"], "answer": 1, "explain": "A strong acid gives a hydrogen ion concentration of 0.01 = 10 to the minus 2 M, so pH = 2.", "concept": "5A", "cover_story": "the buffer bench", "b": -0.8}, {"stem": "In the buffer, when the concentrations of weak acid and conjugate base are equal, the pH equals:", "choices": ["0", "4.7", "7.0", "9.3"], "answer": 1, "explain": "By Henderson-Hasselbalch, pH = pKa plus log(base over acid), and when the two are equal the log term is zero, so pH = pKa = 4.7.", "concept": "5A", "cover_story": "the buffer bench", "b": -0.5}, {"stem": "To hold the buffer's pH above its pKa, the ratio of conjugate base to weak acid must be:", "choices": ["Greater than 1", "Exactly 1", "Less than 1", "Zero"], "answer": 0, "explain": "pH exceeds pKa only when log(base over acid) is positive, which means more conjugate base than acid.", "concept": "5A", "cover_story": "the buffer bench", "b": 0.5}, {"stem": "Adding a small amount of strong acid to the buffer barely changes its pH because the added protons are mostly:", "choices": ["Ignored by the solution", "Converted to water with no reaction", "Consumed by the conjugate base", "Released as a gas"], "answer": 2, "explain": "The conjugate base reacts with the added hydrogen ions, soaking up most of the protons so the pH shifts only slightly.", "concept": "5A", "cover_story": "the buffer bench", "b": 0.1}, {"stem": "At the equivalence point of a weak acid titrated with a strong base, the pH is:", "choices": ["Exactly 7", "Less than 7", "Exactly equal to the pKa", "Greater than 7"], "answer": 3, "explain": "At equivalence only the conjugate base remains, and it makes the solution basic, so the pH is above 7.", "concept": "5A", "cover_story": "the buffer bench", "b": 0.8}, {"stem": "A sparingly soluble salt MX sits in water. Adding more X-minus ions from a separate soluble salt will make the solubility of MX:", "choices": ["Increase", "Decrease", "Stay exactly the same", "Become infinite"], "answer": 1, "explain": "By the common-ion effect, extra X-minus pushes the dissolution equilibrium back toward solid, lowering solubility.", "concept": "5A", "cover_story": "the buffer bench", "b": 0.5}]}, {"label": "Building a drug molecule", "paragraphs": ["A chemist studies a small drug molecule. She examines its Lewis structure, the shape around each central atom, whether the molecule is polar, and how its molecules attract one another. These features shape how the drug dissolves and how easily it evaporates.", "One carbon in the molecule is bonded to four different groups. She also compares two similar molecules, one that can form hydrogen bonds and one that cannot."], "source_ref": "OpenStax Chemistry 2e, Ch. 7-10 and 20 (Chemical Bonding, Molecular Geometry, Intermolecular Forces, and Organic Chemistry)", "questions": [{"stem": "A carbon atom bonded to four other atoms with no lone pairs has what shape around it?", "choices": ["Linear", "Trigonal planar", "Tetrahedral", "Bent"], "answer": 2, "explain": "Four bonding groups and no lone pairs point to the corners of a tetrahedron, with angles near 109.5 degrees.", "concept": "5B", "cover_story": "designing a drug molecule", "b": -0.7}, {"stem": "A molecule has polar bonds but is so symmetric that the bond dipoles cancel. The molecule as a whole is:", "choices": ["Nonpolar", "Polar", "Ionic", "Positively charged"], "answer": 0, "explain": "When symmetry makes the bond dipoles cancel, there is no net dipole and the molecule is nonpolar, as in carbon dioxide.", "concept": "5B", "cover_story": "designing a drug molecule", "b": 0.2}, {"stem": "Two Lewis structures for the molecule differ only in where a double bond and a lone pair sit, not in where the atoms are. These are best described as:", "choices": ["Different molecules", "Isotopes of each other", "Structural isomers", "Resonance structures of one molecule"], "answer": 3, "explain": "Structures that differ only by the placement of electrons, not atoms, are resonance forms of the same molecule.", "concept": "5B", "cover_story": "designing a drug molecule", "b": 0.0}, {"stem": "A carbon in a carbon-carbon double bond that is bonded to three groups total is best described as:", "choices": ["sp", "sp2", "sp3", "sp3d"], "answer": 1, "explain": "Three regions of electron density (the double bond counts as one region plus two single bonds) means sp2 hybridization and trigonal planar geometry.", "concept": "5B", "cover_story": "designing a drug molecule", "b": -0.4}, {"stem": "Two molecules are similar in size, but one can form hydrogen bonds and the other cannot. The hydrogen-bonding molecule will most likely have a:", "choices": ["Lower boiling point", "The same boiling point", "Higher boiling point", "No boiling point at all"], "answer": 2, "explain": "Hydrogen bonding is a strong intermolecular attraction, so more energy is needed to separate the molecules, which raises the boiling point.", "concept": "5B", "cover_story": "designing a drug molecule", "b": -0.6}, {"stem": "The carbon bonded to four different groups makes the molecule:", "choices": ["Achiral", "A resonance form", "A structural isomer", "Chiral, with a nonsuperimposable mirror image"], "answer": 3, "explain": "A carbon with four different groups is a chirality center, so the molecule has a nonsuperimposable mirror image, an enantiomer.", "concept": "5B", "cover_story": "designing a drug molecule", "b": 0.5}]}, {"label": "Purifying a plant compound", "paragraphs": ["A lab isolates a compound from a plant. The team uses liquid-liquid extraction, distillation, thin-layer chromatography, and gel electrophoresis of the sample's proteins. Each method sorts molecules by a different physical property.", "The target is a weak carboxylic acid. The team shakes the mixture with water and an immiscible organic solvent, then adjusts the pH to move the compound from one layer to the other."], "source_ref": "OpenStax Chemistry 2e, Ch. 10-11 and 14 (Liquids and Solids, Solutions and Colloids, and Acid-Base Equilibria)", "questions": [{"stem": "Simple distillation separates two liquids mainly by differences in their:", "choices": ["Boiling point", "Color", "Density", "Molar mass only"], "answer": 0, "explain": "Distillation exploits boiling point differences, so the more volatile component with the lower boiling point vaporizes first.", "concept": "5C", "cover_story": "purifying a plant extract", "b": -0.7}, {"stem": "In the extraction, a nonpolar target compound will tend to collect in:", "choices": ["The polar water layer", "The solid residue", "The nonpolar organic layer", "The gas phase"], "answer": 2, "explain": "Like dissolves like, so a nonpolar compound favors the nonpolar organic layer over water.", "concept": "5C", "cover_story": "purifying a plant extract", "b": -0.5}, {"stem": "The target is a weak carboxylic acid. Adding base to the aqueous layer converts it to its charged carboxylate form, which will:", "choices": ["Move into the organic layer", "Precipitate out at once", "Evaporate as a gas", "Move into the water layer"], "answer": 3, "explain": "Deprotonating the acid makes a charged, water-soluble carboxylate, so it shifts into the aqueous layer.", "concept": "5C", "cover_story": "purifying a plant extract", "b": 0.7}, {"stem": "On normal-phase thin-layer chromatography with a polar plate and a nonpolar solvent, a very polar compound will:", "choices": ["Barely move from the baseline", "Travel far up the plate", "Evaporate off the plate", "Move faster than nonpolar compounds"], "answer": 0, "explain": "A polar compound binds tightly to the polar plate, so it moves only a little and has a low Rf.", "concept": "5C", "cover_story": "purifying a plant extract", "b": 0.6}, {"stem": "In gel electrophoresis, charged molecules migrate through the gel toward the opposite charge. Compared with large molecules, small ones generally:", "choices": ["Move less far through the gel", "Not move at all", "Move farther through the gel", "Move toward the same-sign electrode"], "answer": 2, "explain": "Smaller molecules slip through the gel mesh more easily, so they travel farther in a given time.", "concept": "5C", "cover_story": "purifying a plant extract", "b": 0.0}, {"stem": "Column chromatography separates molecules based mainly on how strongly each one:", "choices": ["Glows under ultraviolet light", "Conducts electricity", "Reflects heat", "Sticks to the stationary phase versus the moving solvent"], "answer": 3, "explain": "Separation comes from the balance between each compound's attraction to the stationary phase and its tendency to travel with the mobile solvent.", "concept": "5C", "cover_story": "purifying a plant extract", "b": -0.2}]}, {"label": "Functional groups of a metabolite", "paragraphs": ["A biochemist studies a small metabolite that carries several functional groups: a hydroxyl group, a carbonyl group, and a carboxylic acid group. She looks at how each group reacts.", "She compares the acidity of the groups, carefully oxidizes an alcohol, and links the acid to an alcohol to form a new bond. She also reviews the building blocks of common biomolecules."], "source_ref": "OpenStax Chemistry 2e, Ch. 20 (Organic Chemistry)", "questions": [{"stem": "A carbon that is double-bonded to one oxygen and also bonded to an OH group is which functional group?", "choices": ["Alcohol", "Carboxylic acid", "Ketone", "Aldehyde"], "answer": 1, "explain": "A carbonyl carbon that also carries an OH is a carboxylic acid group.", "concept": "5D", "cover_story": "reactions of a metabolite", "b": -0.6}, {"stem": "Which group in the metabolite is the most acidic, meaning it gives up a proton most readily?", "choices": ["The carboxylic acid", "The hydroxyl (alcohol)", "The carbon-carbon bonds", "The C-H bonds"], "answer": 0, "explain": "The carboxylic acid is far more acidic than an alcohol because its conjugate base, the carboxylate, is stabilized by resonance.", "concept": "5D", "cover_story": "reactions of a metabolite", "b": 0.2}, {"stem": "Careful, controlled oxidation of a primary alcohol first gives which product?", "choices": ["A ketone", "An ester", "An aldehyde", "An alkane"], "answer": 2, "explain": "A primary alcohol oxidizes first to an aldehyde and can go further to a carboxylic acid, whereas a secondary alcohol would give a ketone.", "concept": "5D", "cover_story": "reactions of a metabolite", "b": 0.5}, {"stem": "Reacting the carboxylic acid with an alcohol under acid catalysis forms an ester and releases a molecule of:", "choices": ["Carbon dioxide", "Hydrogen gas", "Ammonia", "Water"], "answer": 3, "explain": "Ester formation from an acid and an alcohol is a condensation that splits out a molecule of water.", "concept": "5D", "cover_story": "reactions of a metabolite", "b": 0.1}, {"stem": "Unlike an aldehyde, a ketone resists mild oxidation because its carbonyl carbon:", "choices": ["Has no hydrogen attached to the carbonyl carbon", "Carries a full negative charge", "Is aromatic", "Is an ion"], "answer": 0, "explain": "An aldehyde's carbonyl carbon bears a hydrogen that is removed during oxidation, but a ketone's carbonyl carbon is bonded to two carbons and has no such hydrogen, so it resists mild oxidation.", "concept": "5D", "cover_story": "reactions of a metabolite", "b": 1.0}, {"stem": "Every amino acid contains an amine group and which other functional group on its central carbon?", "choices": ["A ketone", "An ether", "A carboxylic acid", "A nitro group"], "answer": 2, "explain": "Each amino acid has both an amino group and a carboxylic acid group on the same central carbon.", "concept": "5D", "cover_story": "reactions of a metabolite", "b": -0.6}]}, {"label": "Reaction energetics and a cell", "paragraphs": ["A chemist studies a reaction's energy and speed. She measures the enthalpy and entropy changes, tests how a catalyst changes the rate, and uses Le Chatelier's principle to predict shifts in equilibrium.", "She also builds a simple galvanic cell from two metals in their salt solutions and traces the path of the electrons it produces."], "source_ref": "OpenStax Chemistry 2e, Ch. 12-17 (Kinetics, Equilibrium, Thermodynamics, and Electrochemistry)", "questions": [{"stem": "A reaction has a negative enthalpy change and a positive entropy change. This reaction is:", "choices": ["Nonspontaneous at all temperatures", "Spontaneous only at high temperature", "Spontaneous only at low temperature", "Spontaneous at all temperatures"], "answer": 3, "explain": "With enthalpy change negative and entropy change positive, the Gibbs free energy change (enthalpy minus temperature times entropy) is negative at every temperature, so the reaction is always spontaneous.", "concept": "5E", "cover_story": "reaction energetics and a cell", "b": 0.6}, {"stem": "A reaction converts 2 moles of gas into 1 mole of gas. The entropy change of the system is most likely:", "choices": ["Negative", "Positive", "Zero", "Infinite"], "answer": 0, "explain": "Fewer gas molecules means fewer ways to spread energy and position, so the system's entropy decreases.", "concept": "5E", "cover_story": "reaction energetics and a cell", "b": 0.2}, {"stem": "For a reaction with the rate law rate = k[A], doubling the concentration of A changes the rate by a factor of:", "choices": ["stays the same", "quadruples", "doubles", "increases eightfold"], "answer": 2, "explain": "The reaction is first order in A, so doubling the concentration of A doubles the rate.", "concept": "5E", "cover_story": "reaction energetics and a cell", "b": -0.3}, {"stem": "A catalyst, such as an enzyme, speeds up a reaction mainly by:", "choices": ["Lowering the activation energy", "Increasing the temperature", "Making the products more stable", "Raising the activation energy"], "answer": 0, "explain": "A catalyst provides a path with a lower activation energy so more collisions succeed, and it does not change the energy of the reactants or products.", "concept": "5E", "cover_story": "reaction energetics and a cell", "b": -0.6}, {"stem": "For the equilibrium N2 + 3 H2 gives 2 NH3, adding more N2 shifts the equilibrium:", "choices": ["Toward the reactants (less NH3)", "No shift at all", "Toward the products (more NH3)", "It stops the reaction"], "answer": 2, "explain": "Adding a reactant pushes the equilibrium toward the products to partly offset the change, making more ammonia.", "concept": "5E", "cover_story": "reaction energetics and a cell", "b": -0.1}, {"stem": "In her galvanic cell, oxidation happens at the anode and reduction at the cathode. Through the external wire, electrons flow:", "choices": ["From the anode to the cathode", "From the cathode to the anode", "From the cathode to the salt bridge only", "They do not flow at all"], "answer": 0, "explain": "Electrons are released by oxidation at the anode and travel through the external wire to the cathode, where reduction occurs.", "concept": "4C", "cover_story": "reaction energetics and a cell", "b": 0.0}]}, {"label": "The bicarbonate buffer in blood", "paragraphs": ["Blood holds a nearly constant pH using the bicarbonate buffer system. Dissolved carbon dioxide reacts with water to form carbonic acid, which splits into hydrogen ions and bicarbonate: CO2 + H2O gives H+ + HCO3-. The enzyme carbonic anhydrase speeds the first step.", "During hard exercise, muscles add more carbon dioxide and acid to the blood, and the lungs and kidneys respond to keep the pH near 7.4. Treat the dissolved gases as ideal and the reactions as reversible."], "source_ref": "OpenStax Chemistry 2e, Ch. 9, 12, and 14 (Gases, Kinetics, and Acid-Base Equilibria)", "questions": [{"stem": "During intense exercise, extra carbon dioxide dissolves in the blood. By the equilibrium shown, this tends to make the blood:", "choices": ["More basic (higher pH)", "Exactly neutral", "Unable to change its pH", "More acidic (lower pH)"], "answer": 3, "explain": "More carbon dioxide pushes the equilibrium to the right, releasing more hydrogen ions, which lowers the pH toward acidosis.", "concept": "5A", "cover_story": "blood as a buffer", "b": 0.2}, {"stem": "When the lungs exhale faster and remove carbon dioxide from the blood, the equilibrium CO2 + H2O gives H+ + HCO3- shifts:", "choices": ["To the left, consuming H+ and raising pH", "To the right, releasing more H+", "Not at all", "Toward making more carbon dioxide"], "answer": 0, "explain": "Removing carbon dioxide pulls the equilibrium to the left, using up hydrogen ions and raising the pH, which is how faster breathing counters acidosis.", "concept": "5E", "cover_story": "blood as a buffer", "b": 0.6}, {"stem": "In the lungs, gas exchange depends on partial pressures. In a mixture of gases, the partial pressure of carbon dioxide equals:", "choices": ["The total pressure times its mole fraction", "Always equal to the total pressure", "Independent of how much carbon dioxide is present", "Zero unless carbon dioxide is the only gas"], "answer": 0, "explain": "By Dalton's law, each gas's partial pressure is the total pressure times that gas's mole fraction.", "concept": "4B", "cover_story": "blood as a buffer", "b": 0.1}, {"stem": "Carbonic anhydrase speeds the conversion of carbon dioxide and water to carbonic acid. As a catalyst, it changes the reaction's:", "choices": ["Rate but not the final equilibrium position", "Final equilibrium position but not the rate", "Overall enthalpy change", "Products into different molecules"], "answer": 0, "explain": "A catalyst lowers the activation energy and speeds the forward and reverse steps equally, so it changes the rate but not where the equilibrium settles.", "concept": "5E", "cover_story": "blood as a buffer", "b": 0.3}, {"stem": "Each carbon dioxide that reacts can release one hydrogen ion and one bicarbonate ion. If 4 millimoles of carbon dioxide react this way, how many millimoles of bicarbonate form?", "choices": ["1 millimole", "2 millimoles", "4 millimoles", "8 millimoles"], "answer": 2, "explain": "The stoichiometry is one to one, so 4 millimoles of reacting carbon dioxide yields 4 millimoles of bicarbonate.", "concept": "4E", "cover_story": "blood as a buffer", "b": -0.5}, {"stem": "The bicarbonate buffer holds pH near 7.4 best when the ratio of bicarbonate to dissolved carbon dioxide is kept roughly:", "choices": ["At exactly 1 to 1", "As large as possible", "Constant, since pH depends on the base-to-acid ratio", "As small as possible"], "answer": 2, "explain": "Henderson-Hasselbalch says pH tracks the ratio of conjugate base (bicarbonate) to acid (dissolved carbon dioxide), so holding that ratio steady holds the pH steady.", "concept": "5A", "cover_story": "blood as a buffer", "b": 0.9}]}]}, "bio_biochem": {"title": "Bio/Biochem reasoning", "passages": [{"label": "Experiment", "paragraphs": ["A research team isolates a small globular protein, which they call vantagin, from pancreatic tissue. The mature protein is a single chain of 128 amino acids that folds into a compact shape with most of its nonpolar side chains buried in the interior. Three pairs of cysteine residues form disulfide bonds that lock the folded shape in place.", "To probe how structure supports function, the team measures the protein's net charge across a pH gradient and finds it carries no net charge at pH 6.8. Separately, they treat active protein with heat, with a reducing agent that breaks disulfide bonds, and with a detergent that disrupts noncovalent contacts. Each treatment abolishes activity, yet analysis shows the peptide backbone remains intact."], "source_ref": "OpenStax Biology 2e, Ch. 3 (Biological Macromolecules)", "questions": [{"stem": "The team loads vantagin onto a column buffered at pH 4.0. Based on its behavior in the pH gradient, what net charge will the protein most likely carry?", "choices": ["Net positive, because the pH is below its isoelectric point", "Net negative, because the pH is below its isoelectric point", "No net charge, because pH 4.0 equals its isoelectric point", "No charge at all, because the buried residues are nonpolar"], "answer": 0, "explain": "At a pH below the isoelectric point of 6.8, acidic and basic groups gain protons, so the protein carries a net positive charge.", "concept": "1A", "cover_story": "protein folding", "b": -1.3}, {"stem": "The reducing agent abolishes activity even though the amino acid sequence is unchanged. What does this best demonstrate about the disulfide bonds?", "choices": ["They form part of the primary sequence that encodes the protein", "They stabilize the folded three dimensional shape needed for activity", "They are the peptide bonds that link adjacent residues", "They shield the protein from changes in solution pH"], "answer": 1, "explain": "Disulfide bonds are covalent cross links that stabilize tertiary structure, so breaking them lets the chain unfold and lose function even though the sequence is intact.", "concept": "1A", "cover_story": "protein folding", "b": -0.2}, {"stem": "Heating the solution destroys activity but leaves every peptide bond intact. Which conclusion is best supported?", "choices": ["Heat changed the order of amino acids in the chain", "Heat added new amino acids to the active site", "Heat disrupted higher order folding while the primary structure was preserved", "Heat converted the protein into a different polymer"], "answer": 2, "explain": "Denaturation disrupts the noncovalent interactions that hold secondary and tertiary structure, so the protein unfolds and loses function while its covalent sequence stays the same.", "concept": "1A", "cover_story": "protein folding", "b": 0.4}, {"stem": "Why are most nonpolar side chains found buried in the protein's interior rather than on its surface?", "choices": ["Nonpolar groups form strong hydrogen bonds with surrounding water", "Nonpolar groups carry negative charges that repel one another", "Only nonpolar groups can form peptide bonds", "Burying nonpolar groups away from water is favorable in an aqueous cell"], "answer": 3, "explain": "In water, clustering hydrophobic side chains in the interior minimizes their contact with water and helps drive folding.", "concept": "1A", "cover_story": "protein folding", "b": -0.7}, {"stem": "A later study shows the active enzyme is actually two identical vantagin chains bound together. A single substitution at the contact surface blocks the two chains from associating without changing how either chain folds on its own. The lost activity is best explained by disruption of which structural level?", "choices": ["Quaternary structure", "Primary structure", "Secondary structure", "Tertiary structure"], "answer": 0, "explain": "Quaternary structure is the assembly of multiple folded subunits, so preventing the subunits from associating removes quaternary structure while each chain's own fold is unchanged.", "concept": "1A", "cover_story": "protein folding", "b": 0.7}, {"stem": "Spectroscopy reveals a repeating pattern of hydrogen bonds between backbone carbonyl oxygens and backbone amide hydrogens, producing regular coils and sheets. These features are examples of which level of protein structure?", "choices": ["Primary structure", "Secondary structure", "Tertiary structure", "Quaternary structure"], "answer": 1, "explain": "Regular local folding such as alpha helices and beta sheets, stabilized by backbone hydrogen bonds, defines secondary structure.", "concept": "1A", "cover_story": "protein folding", "b": -0.4}]}, {"label": "Experiment", "paragraphs": ["A different team studies an enzyme, hydrolase X, that cleaves a colorless substrate into a colored product, letting them track reaction rate by color intensity. They hold the amount of enzyme fixed and vary substrate concentration, recording the initial rate at each level.", "As substrate rises, the rate climbs steeply at first and then levels off at a maximum, Vmax. The team then repeats the experiment with two candidate drugs. Drug A raises the substrate concentration needed to reach half of Vmax but does not change Vmax. Drug B lowers Vmax while leaving the half maximal substrate concentration unchanged."], "source_ref": "OpenStax Biology 2e, Ch. 6 (Metabolism)", "questions": [{"stem": "Why does the reaction rate level off at high substrate concentration?", "choices": ["The substrate begins to inhibit itself at high levels", "The product is being converted back into substrate", "Nearly all enzyme active sites are occupied, so the enzyme is saturated", "The enzyme is permanently denatured by excess substrate"], "answer": 2, "explain": "At saturating substrate, essentially all active sites are occupied at any instant, so adding more substrate cannot raise the rate and the enzyme works at its maximum.", "concept": "1A", "cover_story": "enzyme kinetics", "b": -0.8}, {"stem": "Drug A increases the substrate concentration needed to reach half of Vmax but does not change Vmax. This pattern is most consistent with which type of inhibition?", "choices": ["Noncompetitive inhibition", "Irreversible denaturation", "Feedback activation", "Competitive inhibition"], "answer": 3, "explain": "A competitive inhibitor competes for the active site, so more substrate is needed to reach half maximal rate, yet enough substrate can still drive the reaction to the normal Vmax.", "concept": "1A", "cover_story": "enzyme kinetics", "b": 0.1}, {"stem": "Drug B lowers Vmax while leaving the half maximal substrate concentration unchanged, and adding more substrate does not restore the original maximum rate. Which mechanism best explains Drug B?", "choices": ["It binds a site other than the active site and reduces the number of functional enzymes", "It binds the active site and competes with substrate", "It increases the enzyme's affinity for substrate", "It is consumed as a second substrate"], "answer": 0, "explain": "A noncompetitive inhibitor binds away from the active site and lowers Vmax, and because it does not compete for the active site, extra substrate cannot overcome it and the half maximal point is unchanged.", "concept": "1A", "cover_story": "enzyme kinetics", "b": 0.5}, {"stem": "For the enzyme exposed to Drug A, what should happen to the reaction rate if the team greatly increases substrate concentration?", "choices": ["The rate stays suppressed no matter how much substrate is added", "The rate can approach the original Vmax as substrate outcompetes the drug", "Vmax will rise above the drug free value", "The enzyme will switch to making a different product"], "answer": 1, "explain": "Because a c
