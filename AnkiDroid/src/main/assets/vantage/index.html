ompetitive inhibitor and substrate compete for the same site, high substrate concentration outcompetes the inhibitor and the rate approaches the normal Vmax.", "concept": "1A", "cover_story": "enzyme kinetics", "b": 0.0}, {"stem": "The team finds hydrolase X works best near 37 C and loses almost all activity at 70 C, with activity that does not return on cooling. What is the most likely reason for the loss at 70 C?", "choices": ["The substrate evaporated at 70 C", "The enzyme ran out of active sites", "The high temperature permanently denatured the enzyme", "High temperature made the reaction thermodynamically impossible"], "answer": 2, "explain": "Well above its optimum, heat disrupts the folded active site, and because the shape does not refold on cooling, activity does not return.", "concept": "1A", "cover_story": "enzyme kinetics", "b": -0.6}, {"stem": "In the cell, the end product of hydrolase X's pathway binds a distant regulatory site on the enzyme and slows it down, so flux through the pathway drops when product accumulates. This regulation is best described as...", "choices": ["Competitive inhibition at the active site", "An increase in Vmax caused by the product", "Irreversible covalent modification of the substrate", "Allosteric feedback inhibition"], "answer": 3, "explain": "Binding of the pathway's end product to a separate regulatory site that reduces activity is allosteric feedback inhibition, a common way cells match output to demand.", "concept": "1A", "cover_story": "enzyme kinetics", "b": 0.9}]}, {"label": "Experiment", "paragraphs": ["A lab engineers a bacterial strain to study how a single gene is expressed into a functional protein. They can label newly made RNA and newly made protein separately, and they can introduce precise changes into the gene's DNA sequence.", "In one experiment they insert a single extra nucleotide near the start of the protein coding region. In another they change a single base so that a codon that once specified an amino acid becomes a stop codon. They then compare the length and activity of the protein produced in each case."], "source_ref": "OpenStax Biology 2e, Ch. 15 (Genes and Proteins)", "questions": [{"stem": "Inserting a single extra nucleotide near the start of the coding region abolishes the protein's function almost completely. What is the best explanation?", "choices": ["The insertion shifts the reading frame, so most codons downstream are misread", "The insertion only changes one amino acid and leaves the rest normal", "Extra nucleotides cannot be transcribed into RNA", "The ribosome simply skips the extra nucleotide"], "answer": 0, "explain": "Because codons are read in nonoverlapping groups of three, adding one nucleotide shifts the reading frame and changes essentially every downstream codon, usually destroying function.", "concept": "1B", "cover_story": "gene expression", "b": 0.5}, {"stem": "Changing one base converts an internal codon into a stop codon. Compared with normal protein, the product of this gene will most likely be...", "choices": ["Longer than normal because translation continues past the change", "Truncated because translation stops early", "The same length but with one different amino acid", "Unchanged because stop codons are ignored inside a gene"], "answer": 1, "explain": "A premature stop codon ends translation early, producing a shortened protein that is usually nonfunctional.", "concept": "1B", "cover_story": "gene expression", "b": 0.0}, {"stem": "A third change swaps one base but the encoded amino acid stays the same, and the protein is fully active. This outcome is best explained by which feature of the genetic code?", "choices": ["The code is read one base at a time", "tRNA can carry any amino acid to any codon", "The code is degenerate, so several codons can specify the same amino acid", "The ribosome proofreads and corrects the base"], "answer": 2, "explain": "The genetic code is degenerate, meaning most amino acids are specified by more than one codon, so some single base changes are silent and do not alter the protein.", "concept": "1B", "cover_story": "gene expression", "b": 0.8}, {"stem": "The team labels newly made RNA and finds label appears in RNA before any labeled protein shows up. Which ordering of events does this support?", "choices": ["Protein is made first and then copied into RNA", "RNA and protein are made independently of the gene", "Protein is translated directly from DNA without RNA", "DNA is transcribed into RNA, which is then translated into protein"], "answer": 3, "explain": "RNA is synthesized from the DNA template during transcription and then serves as the message for protein synthesis during translation, so labeled RNA precedes labeled protein.", "concept": "1B", "cover_story": "gene expression", "b": -0.3}, {"stem": "Which cellular machine directly reads the messenger RNA codons and joins amino acids into a chain?", "choices": ["The ribosome", "RNA polymerase", "DNA polymerase", "The spliceosome"], "answer": 0, "explain": "The ribosome binds mRNA, pairs each codon with the matching aminoacyl tRNA, and catalyzes peptide bond formation during translation.", "concept": "1B", "cover_story": "gene expression", "b": -0.7}, {"stem": "The bacterium normally makes this protein only when a specific sugar is present. When the sugar is absent, a repressor binds the DNA and blocks transcription, and adding the sugar relieves the block. This behavior is characteristic of...", "choices": ["A constitutive gene that is always on", "An inducible operon controlled by a repressor", "A gene lacking any promoter", "A eukaryotic enhancer far from the gene"], "answer": 1, "explain": "An inducible operon is normally off because a repressor blocks transcription, and the inducer, here the sugar, inactivates the repressor so transcription can proceed, matching the lac operon logic.", "concept": "1B", "cover_story": "gene expression", "b": 0.6}]}, {"label": "Cross", "paragraphs": ["A plant breeder studies flower color and stem height in a garden species. Flower color shows two forms, purple and white, and stem height shows tall and short. From earlier crosses the breeder knows that purple is dominant to white and tall is dominant to short, and the two genes sit on different chromosomes.", "The breeder crosses a plant that is heterozygous for both traits with a plant that is white flowered and short. Hundreds of offspring are scored for both traits, and the breeder also tracks how alleles are distributed into gametes."], "source_ref": "OpenStax Biology 2e, Ch. 12 (Mendel's Experiments and Heredity)", "questions": [{"stem": "The cross is a purple tall double heterozygote by a white short plant. Among the offspring, what phenotype ratio is expected for the four combinations?", "choices": ["9 purple tall : 3 purple short : 3 white tall : 1 white short", "3 purple tall : 1 white short", "1 purple tall : 1 purple short : 1 white tall : 1 white short", "All offspring purple and tall"], "answer": 2, "explain": "A test cross of a double heterozygote to a fully recessive parent gives a 1 to 1 to 1 to 1 ratio of the four phenotype combinations.", "concept": "1C", "cover_story": "inheritance cross", "b": 0.2}, {"stem": "The equal 1 to 1 to 1 to 1 result, with new trait combinations appearing, is best explained by which principle?", "choices": ["The two genes are tightly linked and inherited together", "One trait blends into the other in offspring", "Both traits are controlled by a single gene", "Genes on different chromosomes assort independently during meiosis"], "answer": 3, "explain": "Because the two genes are on different chromosomes, they assort independently in meiosis, producing all four gamete types in equal proportions.", "concept": "1C", "cover_story": "inheritance cross", "b": 0.1}, {"stem": "A white flowered plant always breeds true for white when self crossed. What does this indicate about the white allele?", "choices": ["White is the recessive phenotype, so white plants are homozygous recessive", "White is dominant to purple", "White plants must be heterozygous", "White results from a new mutation in each plant"], "answer": 0, "explain": "Because purple is dominant, a white plant must carry two recessive alleles, and homozygous recessive plants breed true for the recessive trait.", "concept": "1C", "cover_story": "inheritance cross", "b": -1.1}, {"stem": "In a related species, two genes sit close together on the same chromosome. Compared with genes on different chromosomes, the alleles of these two linked genes will...", "choices": ["Assort completely independently", "Tend to be inherited together, with new combinations arising mainly through crossing over", "Never recombine under any circumstances", "Always produce a 9 to 3 to 3 to 1 ratio"], "answer": 1, "explain": "Linked genes tend to travel together, and recombination between them occurs mainly by crossing over, so the closer they are, the rarer new combinations become.", "concept": "1C", "cover_story": "inheritance cross", "b": 0.9}, {"stem": "In a large, randomly mating population at equilibrium, the recessive white phenotype appears in 16 percent of plants. What fraction of plants are expected to be heterozygous carriers?", "choices": ["0.16", "0.36", "0.48", "0.64"], "answer": 2, "explain": "If the recessive homozygote frequency is 0.16 then the recessive allele frequency is 0.4 and the dominant is 0.6, so heterozygotes equal two times 0.6 times 0.4, which is 0.48.", "concept": "1C", "cover_story": "inheritance cross", "b": 1.0}, {"stem": "A fungus arrives that kills short plants before they reproduce but spares tall plants. Over several generations, what is the most likely effect on the allele for tall stems?", "choices": ["Its frequency will fall because tall is dominant", "It will stay exactly the same because mutation is random", "The tall allele will disappear entirely in one generation", "Its frequency will rise because tall plants leave more offspring"], "answer": 3, "explain": "Selection that lets tall plants reproduce more raises the frequency of the tall allele over generations, the core idea of natural selection acting on heritable variation.", "concept": "1C", "cover_story": "inheritance cross", "b": -0.2}]}, {"label": "Experiment", "paragraphs": ["A physiology class studies how muscle cells generate ATP from glucose. They can measure oxygen use, glucose consumption, and the buildup of small molecules such as pyruvate and lactate in cultured cells under different oxygen conditions.", "In one run, cells have plenty of oxygen. In another, oxygen is nearly removed. The class also uses a chemical that makes the inner mitochondrial membrane leaky to protons, and they record what happens to ATP production and oxygen use."], "source_ref": "OpenStax Biology 2e, Ch. 7 (Cellular Respiration)", "questions": [{"stem": "When oxygen is nearly absent, the cells still make a small amount of ATP and accumulate lactate. Which pathway is supplying this ATP?", "choices": ["Glycolysis followed by fermentation in the cytoplasm", "Oxidative phosphorylation in the mitochondria", "The citric acid cycle in the mitochondrial matrix", "Beta oxidation of fatty acids"], "answer": 0, "explain": "Without oxygen, glycolysis in the cytoplasm still yields a net of two ATP per glucose, and fermentation to lactate regenerates NAD+ so glycolysis can continue.", "concept": "1D", "cover_story": "cellular respiration", "b": -0.3}, {"stem": "Why is converting pyruvate to lactate useful for a cell that has no oxygen?", "choices": ["It produces most of the cell's ATP directly", "It regenerates NAD+ so glycolysis can keep running", "It stores oxygen for later use", "It converts lactate into glucose for energy"], "answer": 1, "explain": "Lactate fermentation reoxidizes NADH back to NAD+, the electron acceptor glycolysis needs, so without it glycolysis would stall once NAD+ ran out.", "concept": "1D", "cover_story": "cellular respiration", "b": 0.5}, {"stem": "With oxygen present, the cells consume far more oxygen and make much more ATP per glucose. What direct role does oxygen play?", "choices": ["It is the starting fuel that is split to release energy", "It donates electrons to start the chain", "It is the final electron acceptor at the end of the electron transport chain", "It is a product of the citric acid cycle"], "answer": 2, "explain": "In aerobic respiration oxygen is the terminal electron acceptor of the electron transport chain, forming water, and without it the chain backs up and ATP output drops.", "concept": "1D", "cover_story": "cellular respiration", "b": 0.2}, {"stem": "The chemical that makes the inner mitochondrial membrane leaky to protons causes oxygen use to stay high while ATP production collapses. What best explains this result?", "choices": ["The electron transport chain stops moving electrons", "Oxygen can no longer accept electrons", "Glycolysis is directly blocked by the chemical", "The proton gradient is dissipated, so ATP synthase can no longer use it to make ATP"], "answer": 3, "explain": "Uncouplers let protons leak back across the membrane, collapsing the gradient that drives ATP synthase, so electron transport and oxygen use continue but are no longer coupled to ATP synthesis.", "concept": "1D", "cover_story": "cellular respiration", "b": 1.1}, {"stem": "Which statement best describes what the citric acid cycle contributes to ATP production?", "choices": ["It produces electron carriers, NADH and FADH2, that feed the electron transport chain", "It directly makes most of the cell's ATP", "It consumes oxygen directly to make water", "It converts glucose into pyruvate"], "answer": 0, "explain": "The citric acid cycle harvests high energy electrons as NADH and FADH2, which then drive the electron transport chain where most ATP is made.", "concept": "1D", "cover_story": "cellular respiration", "b": 0.0}, {"stem": "Cells use the energy released by breaking down glucose to attach a phosphate to ADP, forming ATP. Coupling an energy releasing reaction to an energy requiring one in this way means the overall process is...", "choices": ["Impossible without an outside enzyme adding energy", "Energetically favorable overall, releasing net free energy", "Always exactly at equilibrium", "Independent of the cell's energy needs"], "answer": 1, "explain": "Cells couple exergonic reactions such as glucose breakdown to endergonic ones such as ATP synthesis so the combined process has a negative free energy change and proceeds.", "concept": "1D", "cover_story": "cellular respiration", "b": -0.6}]}, {"label": "Experiment", "paragraphs": ["Students place animal cells that normally sit in a balanced salt solution into three beakers. Beaker 1 holds pure distilled water, beaker 2 holds a solution matched to the inside of the cell, and beaker 3 holds a concentrated salt solution far saltier than the cell interior.", "They watch the cells under a microscope over several minutes and also track the activity of a membrane pump that uses ATP to move sodium out of the cell and potassium in against their gradients."], "source_ref": "OpenStax Biology 2e, Ch. 5 (Structure and Function of Plasma Membranes)", "questions": [{"stem": "In beaker 1, holding distilled water, what will most likely happen to the animal cells?", "choices": ["They will shrink as water leaves", "They will stay the same size", "They will swell and may burst as water enters", "They will actively pump water outward and stay unchanged"], "answer": 2, "explain": "Distilled water is hypotonic to the cell, so water moves in by osmosis toward the higher solute concentration inside, swelling and possibly bursting the cell.", "concept": "2A", "cover_story": "membrane transport", "b": -1.2}, {"stem": "In beaker 3, holding concentrated salt, what is the expected change in the cells?", "choices": ["They swell as salt enters", "They stay the same size", "They gain salt until they burst", "They shrink as water leaves toward the saltier solution"], "answer": 3, "explain": "The outside is hypertonic, so water leaves the cell by osmosis toward the higher external solute concentration and the cell shrinks.", "concept": "2A", "cover_story": "membrane transport", "b": -0.7}, {"stem": "The sodium potassium pump moves both ions against their concentration gradients and requires ATP. This is an example of...", "choices": ["Primary active transport", "Simple diffusion", "Facilitated diffusion", "Osmosis"], "answer": 0, "explain": "Moving ions against their gradients using energy taken directly from ATP is primary active transport.", "concept": "2A", "cover_story": "membrane transport", "b": 0.1}, {"stem": "A poison blocks ATP production in these cells. What is the most likely effect on the sodium potassium pump and the ion gradients?", "choices": ["The pump speeds up to compensate", "The pump stops and the sodium and potassium gradients gradually run down", "The gradients grow stronger without ATP", "Sodium is still pumped out but potassium stops moving"], "answer": 1, "explain": "The pump depends on ATP, so without it pumping stops and ions leak down their gradients, dissipating the concentration differences over time.", "concept": "2A", "cover_story": "membrane transport", "b": 0.9}, {"stem": "The cells that keep their pumps running longest are those richest in mitochondria. Why would that be expected?", "choices": ["Mitochondria store sodium for the pump", "Mitochondria are where osmosis occurs", "Mitochondria supply the ATP the pump needs", "Mitochondria pump ions directly across the plasma membrane"], "answer": 2, "explain": "Mitochondria generate most of the cell's ATP, so cells rich in mitochondria can sustain ATP dependent pumping longer.", "concept": "2A", "cover_story": "membrane transport", "b": -0.2}, {"stem": "A small nonpolar gas crosses the plasma membrane freely, but a charged ion cannot cross without a protein channel. Which membrane feature best explains this difference?", "choices": ["The membrane is a single layer of protein", "The membrane contains no proteins at all", "Charged ions are too small to interact with the membrane", "The hydrophobic interior of the lipid bilayer blocks charged particles but allows small nonpolar molecules"], "answer": 3, "explain": "The nonpolar core of the phospholipid bilayer lets small uncharged nonpolar molecules pass but repels charged ions, which need transport proteins.", "concept": "2A", "cover_story": "membrane transport", "b": 0.3}]}, {"label": "Experiment", "paragraphs": ["A microbiology team grows a bacterial culture and tracks its numbers over time. In fresh medium the population doubles at a steady interval, then slows as nutrients run low. The team also exposes the culture to an antibiotic and to a bacteriophage, a virus that infects bacteria.", "They find that a few bacteria carry a small circular DNA molecule separate from the main chromosome that lets them survive the antibiotic. These survivors can pass copies of this molecule to neighboring bacteria through direct contact. Meanwhile, the bacteriophage injects its genetic material and forces the host to build new virus particles."], "source_ref": "OpenStax Biology 2e, Ch. 21 (Viruses) and Ch. 22 (Prokaryotes: Bacteria and Archaea)", "questions": [{"stem": "During the steady doubling phase, the number of bacteria over time increases...", "choices": ["Exponentially, doubling each interval", "Linearly, by the same number added each interval", "By a decreasing amount each interval", "Not at all until nutrients run out"], "answer": 0, "explain": "Binary fission with a constant doubling time produces exponential growth, so the count multiplies rather than adding a fixed amount each interval.", "concept": "2B", "cover_story": "bacteria and phage", "b": -0.2}, {"stem": "The small circular DNA molecule that carries antibiotic survival and exists apart from the chromosome is best identified as a...", "choices": ["Ribosome", "Plasmid", "Capsid", "Nucleus"], "answer": 1, "explain": "A plasmid is a small circular DNA molecule separate from the bacterial chromosome that often carries extra genes such as antibiotic resistance.", "concept": "2B", "cover_story": "bacteria and phage", "b": 0.1}, {"stem": "Survivors transfer copies of this resistance molecule to neighboring bacteria through direct contact. This form of horizontal gene transfer is...", "choices": ["Binary fission", "Mutation", "Conjugation", "Translation"], "answer": 2, "explain": "Transfer of DNA, often a plasmid, between bacteria through direct cell to cell contact is conjugation, a route by which resistance spreads.", "concept": "2B", "cover_story": "bacteria and phage", "b": 0.6}, {"stem": "After antibiotic treatment, the surviving population is almost entirely resistant. What best explains this shift?", "choices": ["The antibiotic taught the bacteria to resist it", "Every bacterium mutated in response to the antibiotic", "The antibiotic converted itself into food for the bacteria", "The antibiotic killed susceptible cells and left resistant ones to reproduce"], "answer": 3, "explain": "The antibiotic selects against susceptible cells, so pre existing resistant cells survive and reproduce and the population becomes dominated by resistant bacteria.", "concept": "2B", "cover_story": "bacteria and phage", "b": 0.8}, {"stem": "The bacteriophage must inject its genes and use the host's machinery to reproduce. This illustrates that viruses are...", "choices": ["Obligate intracellular agents that require a host cell to replicate", "Free living cells that grow by binary fission", "Bacteria with an extra membrane", "Organelles found inside bacteria"], "answer": 0, "explain": "Viruses lack their own machinery to make proteins and energy, so they must hijack a host cell to replicate, making them obligate intracellular parasites.", "concept": "2B", "cover_story": "bacteria and phage", "b": 0.0}, {"stem": "In this infection the phage quickly forces the host to make many new virus particles that burst the cell to spread. This describes which viral pathway?", "choices": ["The lysogenic cycle with a dormant integrated genome", "The lytic cycle", "Binary fission", "Conjugation"], "answer": 1, "explain": "Rapid production of new virions followed by lysis of the host cell is the lytic cycle, in contrast to the lysogenic cycle where the viral genome integrates and stays dormant.", "concept": "2B", "cover_story": "bacteria and phage", "b": -0.4}]}, {"label": "Experiment", "paragraphs": ["A cancer biology lab studies how cells decide whether to divide. They grow cells in a dish and can measure DNA content per cell, detect damaged DNA, and switch specific regulatory proteins on or off. Normal cells pause at checkpoints if conditions are not right.", "In one line, a checkpoint protein that normally halts the cycle when DNA is damaged has been inactivated. The team compares how normal cells and mutant cells respond after their DNA is damaged, and they also follow how a single fertilized egg gives rise to specialized tissues."], "source_ref": "OpenStax Biology 2e, Ch. 10 (Cell Reproduction)", "questions": [{"stem": "Before a normal cell divides, its measured DNA content doubles during one part of interphase. During which phase does this DNA doubling occur?", "choices": ["G1 phase", "M phase, or mitosis", "S phase", "Cytokinesis"], "answer": 2, "explain": "DNA is replicated during S, the synthesis phase of interphase, so DNA content per cell doubles before mitosis distributes it.", "concept": "2C", "cover_story": "cell cycle control", "b": 0.2}, {"stem": "What is the main purpose of the checkpoint that pauses the cycle when DNA is damaged?", "choices": ["To speed cells through division regardless of damage", "To permanently stop all cell division in the body", "To convert the cell into a gamete", "To allow time for repair before the damage is copied and passed on"], "answer": 3, "explain": "Checkpoints halt the cycle so damage can be repaired before replication or division, preventing errors from being passed to daughter cells.", "concept": "2C", "cover_story": "cell cycle control", "b": 0.0}, {"stem": "In the mutant line missing the damage checkpoint protein, what is the most likely outcome after DNA is damaged?", "choices": ["The cells divide despite the damage, passing mutations to daughter cells", "The cells repair perfectly and never divide again", "The cells immediately die before dividing", "The damage repairs itself without any checkpoint"], "answer": 0, "explain": "Without the checkpoint to pause the cycle, damaged DNA is replicated and segregated, so daughter cells inherit mutations, a step toward cancer.", "concept": "2C", "cover_story": "cell cycle control", "b": 0.9}, {"stem": "Progress through the cycle is driven by enzymes that are active only when bound to a partner protein whose level rises and falls at each stage. Which pair fits this description?", "choices": ["DNA polymerase activated by RNA", "Cyclin dependent kinases activated by cyclins", "Ribosomes activated by tRNA", "Hemoglobin activated by oxygen"], "answer": 1, "explain": "Cyclin dependent kinases are active only when bound to cyclins, whose levels oscillate through the cycle, driving orderly progression.", "concept": "2C", "cover_story": "cell cycle control", "b": 0.8}, {"stem": "A single fertilized egg gives rise to muscle cells and nerve cells that look and act very differently, yet all carry the same DNA. What best explains this difference?", "choices": ["Each cell type deleted the genes it does not use", "Muscle and nerve cells have completely different genomes", "Different cell types express different subsets of the same genes", "The egg divided its genome unequally among cell types"], "answer": 2, "explain": "Differentiation results from differential gene expression, so cells with identical genomes turn on different sets of genes to become specialized types.", "concept": "2C", "cover_story": "cell cycle control", "b": 0.5}, {"stem": "A cell with irreparable DNA damage triggers an orderly self destruction program rather than dividing. This programmed cell death is called...", "choices": ["Necrosis from injury", "Binary fission", "Differentiation", "Apoptosis"], "answer": 3, "explain": "Apoptosis is programmed, controlled cell death that removes damaged or unneeded cells, unlike the messy injury driven death of necrosis.", "concept": "2C", "cover_story": "cell cycle control", "b": -0.1}]}, {"label": "Experiment", "paragraphs": ["A neurophysiology lab records electrical activity from a single neuron. At rest the inside of the cell is negative relative to the outside, and this difference is maintained by ion pumps and channels. When the neuron is stimulated strongly enough, a rapid spike of voltage travels down the axon.", "The team can block specific ion channels and can wrap or strip the axon's insulating sheath. They also study how a hormone released into the blood affects distant target cells, comparing a steroid hormone with a protein hormone."], "source_ref": "OpenStax Anatomy and Physiology, Ch. 12 (The Nervous System and Nervous Tissue) and Ch. 17 (The Endocrine System)", "questions": [{"stem": "At rest, the neuron's interior is negative compared with the outside. Which best accounts for maintaining this resting membrane potential?", "choices": ["Active pumping of sodium out and potassium in, plus selective ion permeability", "Equal, unregulated leak of all ions across the membrane", "Continuous firing of action potentials", "The absence of any ions inside the cell"], "answer": 0, "explain": "The sodium potassium pump together with the membrane's selective permeability, especially to potassium, sets up and maintains the negative resting potential.", "concept": "3A", "cover_story": "neuron signaling", "b": -0.2}, {"stem": "During the rising phase of the action potential, the membrane voltage rapidly becomes positive inside. Which ion movement is chiefly responsible?", "choices": ["Potassium rushing into the cell", "Sodium rushing into the cell", "Chloride rushing out of the cell", "Calcium leaving the cell"], "answer": 1, "explain": "Voltage gated sodium channels open and sodium flows in down its gradient, driving the sharp depolarization of the action potential.", "concept": "3A", "cover_story": "neuron signaling", "b": 0.2}, {"stem": "A weak stimulus produces no action potential, but once the stimulus reaches threshold the spike fires at full size, and a stronger stimulus does not make a bigger spike. This behavior is described as...", "choices": ["A graded response proportional to stimulus size", "A response that grows with stimulus strength without limit", "An all or none response above threshold", "A response that requires no threshold at all"], "answer": 2, "explain": "Action potentials are all or none, so below threshold nothing fires and at or above threshold the spike reaches its full fixed amplitude regardless of extra stimulus strength.", "concept": "3A", "cover_story": "neuron signaling", "b": 0.6}, {"stem": "When the team strips the insulating sheath from the axon, the action potential travels much more slowly. What does the intact sheath normally do?", "choices": ["It generates the action potential at each point along the axon", "It supplies ATP to the axon", "It blocks all ion movement across the axon permanently", "It lets the signal jump between gaps, speeding conduction"], "answer": 3, "explain": "Myelin insulates the axon so the impulse regenerates only at the nodes between segments, jumping node to node in saltatory conduction and greatly speeding transmission.", "concept": "3A", "cover_story": "neuron signaling", "b": 0.9}, {"stem": "A steroid hormone acts on its target cells more slowly but with longer lasting effects than a protein hormone. Which difference best explains this?", "choices": ["Steroid hormones are lipid soluble, enter cells, and often alter gene transcription directly", "Steroid hormones bind surface receptors and act through fast second messengers", "Protein hormones enter the nucleus while steroids stay outside", "Steroid hormones cannot reach target cells through the blood"], "answer": 0, "explain": "Lipid soluble steroids cross the membrane and bind intracellular receptors that regulate gene transcription, a slower but longer lasting route than the surface receptor and second messenger pathway of peptide hormones.", "concept": "3A", "cover_story": "neuron signaling", "b": 1.0}, {"stem": "When blood levels of a hormone rise, they signal the gland to reduce further release of that hormone. This regulatory pattern is...", "choices": ["Positive feedback", "Negative feedback", "Feedforward amplification", "An all or none response"], "answer": 1, "explain": "Negative feedback opposes the initial change, so rising hormone levels inhibit further secretion and keep levels within a set range.", "concept": "3A", "cover_story": "neuron signaling", "b": -0.4}]}, {"label": "Case", "paragraphs": ["A sports physiologist monitors a volunteer during hard exercise. Heart rate and breathing rate rise, the working muscles receive more blood, and the volunteer sweats heavily. The physiologist records oxygen delivery, carbon dioxide removal, and how the kidneys adjust urine output.", "They also examine how oxygen is carried in the blood and how contracting muscle fibers shorten. All measurements are compared with the same volunteer at rest."], "source_ref": "OpenStax Anatomy and Physiology, Ch. 20 (Cardiovascular System: Blood Vessels and Circulation), Ch. 22 (Respiratory System), and Ch. 25 (Urinary System)", "questions": [{"stem": "During exercise the volunteer's heart rate and the volume pumped per beat both rise. The total blood pumped per minute, the product of these two, is called...", "choices": ["Blood pressure", "Vital capacity", "Cardiac output", "Tidal volume"], "answer": 2, "explain": "Cardiac output is heart rate times stroke volume, so raising both increases the blood delivered to tissues per minute during exercise.", "concept": "3B", "cover_story": "exercise physiology", "b": -0.2}, {"stem": "Working muscle is warmer, more acidic, and higher in carbon dioxide than resting tissue. How does this environment affect oxygen release from hemoglobin there?", "choices": ["It makes hemoglobin hold oxygen more tightly, releasing less", "It has no effect on oxygen binding", "It stops hemoglobin from binding oxygen in the lungs", "It promotes oxygen release, so more oxygen is unloaded to active muscle"], "answer": 3, "explain": "Higher carbon dioxide, lower pH, and higher temperature lower hemoglobin's oxygen affinity, shifting the curve so more oxygen is unloaded where active tissue needs it most.", "concept": "3B", "cover_story": "exercise physiology", "b": 1.0}, {"stem": "Breathing rate rises sharply during exercise. What is the most direct benefit of increased ventilation for the working body?", "choices": ["It brings in more oxygen and clears more carbon dioxide", "It cools the blood by evaporation in the lungs", "It raises blood pressure directly", "It increases the number of red blood cells immediately"], "answer": 0, "explain": "Greater ventilation increases oxygen uptake and carbon dioxide removal at the alveoli, matching the higher metabolic demand of exercise.", "concept": "3B", "cover_story": "exercise physiology", "b": 0.1}, {"stem": "Because the volunteer loses a lot of water through sweat, the kidneys produce a smaller volume of more concentrated urine. This adjustment mainly helps to...", "choices": ["Excrete excess glucose", "Conserve body water and maintain blood volume", "Remove extra oxygen from the blood", "Increase sweating even further"], "answer": 1, "explain": "Facing water loss, the kidneys reabsorb more water and produce concentrated urine to conserve body water and help maintain blood volume and pressure.", "concept": "3B", "cover_story": "exercise physiology", "b": 0.6}, {"stem": "In contracting muscle fibers, the filaments slide past one another so the muscle shortens. Which statement best describes this process?", "choices": ["Actin and myosin filaments each shorten individually", "The filaments dissolve and reform shorter", "Myosin heads pull actin filaments inward, shortening the sarcomere without shortening the filaments", "Only myosin filaments move while actin stays fixed permanently"], "answer": 2, "explain": "In the sliding filament model, myosin cross bridges pull actin toward the center of the sarcomere, so the filaments keep their length while the sarcomere shortens.", "concept": "3B", "cover_story": "exercise physiology", "b": 0.3}, {"stem": "During hard exercise, blood flow to the digestive tract drops while flow to muscles rises. What is the most reasonable consequence?", "choices": ["Digestion speeds up because muscles need nutrients", "The stomach produces more blood cells", "The intestines take over gas exchange", "Digestion and absorption slow while more blood serves active muscle"], "answer": 3, "explain": "Blood is redirected toward working muscle during exercise, so digestive activity slows because the gut temporarily receives less blood flow.", "concept": "3B", "cover_story": "exercise physiology", "b": -0.3}]}]}, "psych_soc": {"title": "Psych/Soc reasoning", "passages": [{"label": "Screening lab", "paragraphs": ["A perception laboratory runs three short tasks with volunteers. In the tone task, a quiet sound starts below hearing level and slowly grows louder until the volunteer first reports hearing it. In the weight task, a volunteer holds a standard object and a slightly heavier one and says whether the two feel different. In the screening task, trained inspectors watch a fast stream of bag images and press a key whenever they spot a rare hidden blade.", "The team records several patterns. Inspectors who are told that blades are common report far more blades, including in bags that are actually empty. A steady ventilation hum in the room stops being noticed after a few minutes. Adding a small weight is easier to detect when the standard object is light than when it is heavy. When the room lights are dimmed, volunteers say colors wash out but they still catch movement at the edges of their vision."], "source_ref": "OpenStax Psychology 2e, Ch. 5 (Sensation and Perception)", "questions": [{"stem": "In the tone task, the softest sound level a volunteer can detect on about half of the trials is best described as which of the following?", "choices": ["The difference threshold", "The absolute threshold", "Weber's fraction", "The just noticeable difference"], "answer": 1, "explain": "The absolute threshold is the lowest stimulus intensity a person can detect 50 percent of the time, while the difference threshold and just noticeable difference involve telling two stimuli apart.", "concept": "6A", "cover_story": "screening lab", "b": -1.2}, {"stem": "Volunteers notice an added weight more easily when the standard object is light than when it is heavy. Which principle best explains this?", "choices": ["The just noticeable difference is a roughly constant proportion of the standard stimulus", "The absolute threshold falls as stimulus intensity rises", "Adaptation erases any constant stimulus within seconds", "Detection depends only on the observer's expectations"], "answer": 0, "explain": "Weber's law holds that the just noticeable difference is a constant fraction of the original stimulus, so a heavier standard needs a larger absolute change before the difference is felt.", "concept": "6A", "cover_story": "screening lab", "b": 0.3}, {"stem": "Inspectors told that blades are common report more blades even in empty bags. In signal detection terms, this instruction most directly shifts which of the following?", "choices": ["Their absolute sensitivity to the visual stimulus", "Their decision criterion for reporting a blade", "The Weber fraction for their visual system", "The rate of transduction in their retina"], "answer": 1, "explain": "Expecting frequent targets lowers the response criterion, increasing both hits and false alarms without changing the underlying ability to see the blade.", "concept": "6A", "cover_story": "screening lab", "b": 0.9}, {"stem": "The volunteers stop noticing the steady ventilation hum after a few minutes. This change is best described as which of the following?", "choices": ["Sensory adaptation", "Weber's law", "Bottom-up processing", "Perceptual constancy"], "answer": 0, "explain": "Sensory adaptation is the decline in sensitivity to a constant, unchanging stimulus over time.", "concept": "6A", "cover_story": "screening lab", "b": -0.9}, {"stem": "The tendency for expectation to make inspectors perceive blades that are not present is the clearest example of which of the following?", "choices": ["Bottom-up processing", "Top-down processing", "Sensory transduction", "Sensory adaptation"], "answer": 1, "explain": "Top-down processing uses prior knowledge and expectations to interpret sensory input, which can produce perceptions that do not match the actual stimulus.", "concept": "6A", "cover_story": "screening lab", "b": -0.2}, {"stem": "When the room is dimmed, colors fade but movement at the edges of vision is still detected. Which explanation fits best?", "choices": ["Cones in the periphery specialize in dim-light motion", "Rods, dense in the periphery, work in dim light but do not code color", "The fovea contains only rods that detect motion", "Rods encode fine color while cones handle dim light"], "answer": 1, "explain": "Rods are concentrated in the peripheral retina and are highly sensitive in low light but do not encode color, so peripheral motion is seen while color washes out.", "concept": "6A", "cover_story": "screening lab", "b": 0.5}]}, {"label": "Study habits study", "paragraphs": ["A psychology class tests how study methods affect memory. Students learn a 30-item word list, then take a recall test either right away or after a delay. One group repeats the words over and over silently. A second group links each word to a personal image or story. A third group is quizzed repeatedly instead of rereading.", "The results show that the story group recalls far more words than the repeating group. On the immediate test, students recall the first and last items best. A week later, several students confidently recall a related word, sofa, that was never on the list after learning words like chair, table, and couch. Students who were quizzed during learning outperform those who only reread."], "source_ref": "OpenStax Psychology 2e, Ch. 8 (Memory)", "questions": [{"stem": "The group that linked each word to a personal image or story remembered the most. This advantage is best explained by which of the following?", "choices": ["Maintenance rehearsal strengthens the sensory register", "Deeper, elaborative encoding creates more retrieval routes", "Shorter words move faster into long-term memory", "Rote repetition prevents proactive interference"], "answer": 1, "explain": "Elaborative encoding that connects new material to existing knowledge produces more durable memories and more cues for later retrieval than simple repetition.", "concept": "6B", "cover_story": "study habits study", "b": -0.2}, {"stem": "On the immediate test, students recall the first and last words best. The strong recall of the last few words just presented is best attributed to which of the following?", "choices": ["The primacy effect and long-term storage", "The recency effect and recent items still in working memory", "Proactive interference from earlier items", "Deeper encoding of the final items"], "answer": 1, "explain": "The recency effect reflects the last items still being available in short-term or working memory, while the primacy effect reflects earlier items reaching long-term storage.", "concept": "6B", "cover_story": "study habits study", "b": 0.2}, {"stem": "A week later some students confidently recall the word sofa, which was never shown, after learning words like chair, table, and couch. This best illustrates which of the following?", "choices": ["Proactive interference", "A false memory built from related, activated concepts", "State-dependent retrieval", "Anterograde amnesia"], "answer": 1, "explain": "Recalling a strongly related but unpresented word reflects a false memory produced when associated concepts are activated during encoding and later mistaken for the original.", "concept": "6B", "cover_story": "study habits study", "b": 0.9}, {"stem": "Students quizzed during learning later outperform those who only reread. This finding is best labeled as which of the following?", "choices": ["The spacing effect", "The testing, or retrieval practice, effect", "State-dependent memory", "The misinformation effect"], "answer": 1, "explain": "The testing effect is the finding that actively retrieving information strengthens later memory more than passive rereading.", "concept": "6B", "cover_story": "study habits study", "b": -0.1}, {"stem": "One student recalls more words when tested in the same room where she studied than in a new room. This is best explained by which of the following?", "choices": ["Context-dependent retrieval cues", "Increased storage capacity", "Reduced interference from chunking", "Faster transduction of the stimulus"], "answer": 0, "explain": "Context-dependent memory reflects encoding specificity, where cues present at encoding, such as the room, aid retrieval when they are present again.", "concept": "6B", "cover_story": "study habits study", "b": 0.4}, {"stem": "To hold a 10-digit number long enough to dial it, a student groups the digits into three clusters. Grouping helps mainly by doing which of the following?", "choices": ["Expanding the absolute capacity of long-term memory", "Reducing the number of items working memory must juggle", "Converting the digits into iconic sensory memory", "Preventing retroactive interference at retrieval"], "answer": 1, "explain": "Chunking reorganizes many items into a few meaningful units, easing the limited capacity of working memory.", "concept": "6B", "cover_story": "study habits study", "b": -0.6}]}, {"label": "Emotion study", "paragraphs": ["Researchers study how the body and mind combine to produce emotion. In one setup, volunteers are shown a frightening film while their heart rate and sweating are recorded. In another, volunteers exercise on a bike and then meet a stranger, and researchers measure how attracted they feel.", "Some volunteers are given a shot they are told is a vitamin but that actually speeds the heart. When these aroused volunteers wait with a cheerful actor, they report feeling happy; when they wait with an irritated actor, they report feeling angry. Volunteers who just exercised rate the stranger as more attractive than resting volunteers do."], "source_ref": "OpenStax Psychology 2e, Ch. 10 (Emotion and Motivation)", "questions": [{"stem": "Aroused volunteers feel happy near a cheerful actor but angry near an irritated actor. Which theory best explains this pattern?", "choices": ["James-Lange theory", "Cannon-Bard theory", "Schachter-Singer two-factor theory", "Drive-reduction theory"], "answer": 2, "explain": "The two-factor theory holds that emotion arises from physiological arousal plus a cognitive label drawn from the situation, so the same arousal is interpreted differently depending on context.", "concept": "6C", "cover_story": "emotion study", "b": 0.4}, {"stem": "Volunteers who just exercised rate a stranger as more attractive than resting volunteers do. This is best explained as which of the following?", "choices": ["Misattribution of physiological arousal to the stranger", "A conditioned emotional response to exercise", "The facial feedback hypothesis", "Sensory adaptation to arousal"], "answer": 0, "explain": "Leftover arousal from exercise is misattributed to the stranger, increasing reported attraction, an application of two-factor emotion ideas.", "concept": "6C", "cover_story": "emotion study", "b": 1.0}, {"stem": "A different theory claims the volunteers first notice their racing heart and sweating and then feel afraid because of those bodily changes. This describes which theory?", "choices": ["Cannon-Bard theory", "James-Lange theory", "Schachter-Singer theory", "The Yerkes-Dodson law"], "answer": 1, "explain": "The James-Lange theory proposes that a physiological reaction to a stimulus comes first and the felt emotion is our reading of that bodily state.", "concept": "6C", "cover_story": "emotion study", "b": -0.2}, {"stem": "Suppose data showed that the racing heart and the feeling of fear begin at the same time and independently. This finding would most support which theory?", "choices": ["James-Lange theory", "Cannon-Bard theory", "Two-factor theory", "Drive-reduction theory"], "answer": 1, "explain": "The Cannon-Bard theory holds that physiological arousal and the subjective emotion occur simultaneously and independently.", "concept": "6C", "cover_story": "emotion study", "b": 0.3}, {"stem": "The rapid fear response to the frightening film is most associated with activity in which brain structure?", "choices": ["The amygdala", "The cerebellum", "Broca's area", "The medulla"], "answer": 0, "explain": "The amygdala, part of the limbic system, is central to processing fear and other strong emotional responses.", "concept": "6C", "cover_story": "emotion study", "b": -0.7}, {"stem": "Researchers find that people across very different cultures produce and recognize the same facial expression for disgust. This best supports which idea?", "choices": ["Display rules fully determine facial expressions", "Some basic emotional expressions are universal", "Emotions are learned only through operant conditioning", "Facial expressions have no link to felt emotion"], "answer": 1, "explain": "Cross-cultural recognition of the same expressions supports the view that a set of basic emotions and their expressions are universal, consistent with work by Ekman.", "concept": "6C", "cover_story": "emotion study", "b": -0.3}]}, {"label": "Personality clinic", "paragraphs": ["A counseling center interviews clients and records how they describe themselves and handle conflict. One client, after being passed over for a promotion, insists the job was boring anyway and channels his frustration into intense exercise. Another completes a questionnaire that scores five broad traits.", "The center also asks about beliefs. One client strongly agrees that outcomes in life come from his own actions, while another believes outcomes are mostly due to luck and powerful others. A therapist notes that a warm, accepting environment seems to help clients move toward their goals, and that one client is imaginative, curious, and eager to try new activities."], "source_ref": "OpenStax Psychology 2e, Ch. 11 (Personality)", "questions": [{"stem": "The client who calls the lost job boring and pours frustration into exercise is using which pair of defense mechanisms?", "choices": ["Projection and regression", "Rationalization and sublimation", "Denial and displacement", "Reaction formation and repression"], "answer": 1, "explain": "Rationalization offers a self-justifying reason (the job was boring), while sublimation channels unacceptable impulses into a socially acceptable outlet like exercise.", "concept": "7A", "cover_story": "personality clinic", "b": 0.7}, {"stem": "The client who believes outcomes come from his own actions rather than luck would be described as having which of the following?", "choices": ["An external locus of control", "An internal locus of control", "Low self-efficacy", "A repressive coping style"], "answer": 1, "explain": "An internal locus of control is the belief that one's own actions determine outcomes, in contrast to an external locus that credits luck or powerful others.", "concept": "7A", "cover_story": "personality clinic", "b": -0.3}, {"stem": "According to psychoanalytic theory, the part of personality that would push the passed-over client to lash out immediately, with no concern for consequences, is which of the following?", "choices": ["The ego", "The superego", "The id", "The persona"], "answer": 2, "explain": "The id seeks immediate gratification of impulses without regard for reality or morality, unlike the reality-oriented ego and the moralistic superego.", "concept": "7A", "cover_story": "personality clinic", "b": -0.6}, {"stem": "The therapist's finding that a warm, accepting environment helps clients grow toward their goals fits most closely with which approach?", "choices": ["Trait theory", "Humanistic theory", "Behaviorist theory", "Psychoanalytic theory"], "answer": 1, "explain": "Humanistic theorists such as Rogers emphasize unconditional positive regard and a supportive environment as conditions for growth and self-actualization.", "concept": "7A", "cover_story": "personality clinic", "b": -0.4}, {"stem": "One client scores very high on a broad trait: she is imaginative, curious, and eager to try new activities. She is highest on which of the Big Five traits?", "choices": ["Conscientiousness", "Openness to experience", "Agreeableness", "Neuroticism"], "answer": 1, "explain": "Openness to experience captures imagination, curiosity, and willingness to try new things.", "concept": "7A", "cover_story": "personality clinic", "b": 0.0}, {"stem": "Bandura's social-cognitive view differs from pure trait theory mainly because it emphasizes which of the following?", "choices": ["Fixed traits present from birth", "The ongoing interaction of personal factors, behavior, and environment", "Unconscious conflicts among id, ego, and superego", "A single universal hierarchy of needs"], "answer": 1, "explain": "Social-cognitive theory stresses reciprocal determinism, the two-way interaction among personal factors, behavior, and the environment, rather than fixed traits or unconscious drives.", "concept": "7A", "cover_story": "personality clinic", "b": 0.5}]}, {"label": "Campus experiments", "paragraphs": ["A social psychology team runs several campus studies. In one, students solve simple problems either alone or in front of an audience. In another, students pull a rope alone or as part of a group while the team measures effort. In a third, a staged emergency, someone drops a stack of books, and researchers vary how many bystanders are present.", "The team finds that experts perform simple tasks faster with an audience, while beginners do worse on hard tasks when watched. Individual effort on the rope drops as group size grows. Help for the person who dropped the books is offered quickly when one bystander is present but is delayed when many are present. In a mock jury task, small groups make riskier decisions than the members did on their own."], "source_ref": "OpenStax Psychology 2e, Ch. 12 (Social Psychology)", "questions": [{"stem": "Experts complete simple tasks faster with an audience, but beginners do worse on hard tasks when watched. This overall pattern is best explained by which of the following?", "choices": ["Social loafing", "Social facilitation, where arousal boosts the dominant response", "Deindividuation", "Groupthink"], "answer": 1, "explain": "Social facilitation predicts that the arousal from an audience strengthens the dominant response, helping performance on easy or well-learned tasks and hurting it on difficult or novel ones.", "concept": "7B", "cover_story": "campus experiments", "b": 0.5}, {"stem": "Individual effort on the rope-pull drops as the group grows larger. This reduction in personal effort is best labeled as which of the following?", "choices": ["Social facilitation", "Social loafing", "The bystander effect", "Group polarization"], "answer": 1, "explain": "Social loafing is the tendency to exert less individual effort when working in a group than when working alone.", "concept": "7B", "cover_story": "campus experiments", "b": -0.8}, {"stem": "Help is offered quickly with one bystander but delayed when many are present. The best explanation is which of the following?", "choices": ["Diffusion of responsibility among many bystanders", "Deindividuation in small groups", "Informational conformity to experts", "Social facilitation of helping"], "answer": 0, "explain": "As the number of bystanders rises, responsibility to act is diffused across the group, so any single person feels less compelled to help.", "concept": "7B", "cover_story": "campus experiments", "b": -0.2}, {"stem": "In a follow-up, a student gives an obviously wrong answer to a simple line-length question after hearing several confederates give that same wrong answer. This behavior is best explained by which of the following?", "choices": ["Informational social influence based on genuine confusion", "Normative social influence to fit in with the group", "Obedience to an authority figure", "Diffusion of responsibility"], "answer": 1, "explain": "Conforming to a clearly wrong majority on an easy task reflects normative influence, the desire to be accepted, rather than genuine uncertainty about the answer.", "concept": "7B", "cover_story": "campus experiments", "b": 0.6}, {"stem": "A different study asks participants to follow an experimenter's direct instructions to deliver what they believe are harmful shocks. This situation tests which of the following most directly?", "choices": ["Conformity to peers", "Obedience to authority", "Social loafing", "Group polarization"], "answer": 1, "explain": "Following the direct commands of an authority figure, even against one's conscience, is obedience, as studied by Milgram, and differs from peer conformity.", "concept": "7B", "cover_story": "campus experiments", "b": -0.1}, {"stem": "The mock juries make riskier decisions than the individual members did beforehand. This shift toward a more extreme group position is best described as which of the following?", "choices": ["Groupthink", "Group polarization", "Deindividuation", "Social loafing"], "answer": 1, "explain": "Group polarization is the tendency for group discussion to strengthen the members' initial leanings, producing a more extreme collective decision.", "concept": "7B", "cover_story": "campus experiments", "b": 0.9}]}, {"label": "Clinic and classroom", "paragraphs": ["A clinic uses learning principles to change behavior. A child learns that a soft chime always comes right before a bitter cough syrup, and after several pairings the child grimaces at the chime alone. A teacher gives a sticker for every correct answer at first, then switches to rewarding correct answers only now and then.", "In another program, a therapist praises a nail-biting client for progress, and separately removes an annoying alarm as soon as the client completes a task. A parent notes that a toddler learns to say please more often after watching an older sibling get treats for saying it."], "source_ref": "OpenStax Psychology 2e, Ch. 6 (Learning)", "questions": [{"stem": "The child grimaces at the chime alone after it repeatedly precedes bitter syrup. In classical conditioning terms, the chime has become which of the following?", "choices": ["An unconditioned stimulus", "A conditioned stimulus", "A conditioned response", "A negative reinforcer"], "answer": 1, "explain": "Through pairing with the bitter syrup, the unconditioned stimulus, the previously neutral chime becomes a conditioned stimulus that triggers the grimace.", "concept": "7C", "cover_story": "clinic and classroom", "b": -0.3}, {"stem": "The teacher switches from a sticker for every correct answer to rewarding correct answers only occasionally and unpredictably. This unpredictable schedule tends to produce which outcome?", "choices": ["Rapid extinction once rewards stop", "High, steady responding that resists extinction", "Responding only right after each reward", "No change compared with rewarding every answer"], "answer": 1, "explain": "A variable-ratio schedule produces high, steady response rates that are especially resistant to extinction, which is why occasional unpredictable rewards are powerful.", "concept": "7C", "cover_story": "clinic and classroom", "b": 0.6}, {"stem": "The therapist removes an annoying alarm as soon as the client finishes a task, and task completion rises. Removing the alarm is an example of which of the following?", "choices": ["Positive reinforcement", "Negative reinforcement", "Positive punishment", "Negative punishment"], "answer": 1, "explain": "Negative reinforcement increases a behavior by removing an unpleasant stimulus, here the alarm, when the desired behavior occurs.", "concept": "7C", "cover_story": "clinic and classroom", "b": 0.3}, {"stem": "Praising the client for reducing nail-biting, which then decreases nail-biting further, uses praise as which of the following?", "choices": ["A positive reinforcer for the competing behavior", "A conditioned stimulus", "A negative punisher", "An unconditioned response"], "answer": 0, "explain": "Praise here is a positive reinforcer that strengthens the desired behavior by adding a pleasant consequence.", "concept": "7C", "cover_story": "clinic and classroom", "b": 0.0}, {"stem": "The toddler says please more often after seeing an older sibling rewarded for saying it. This best illustrates which of the following?", "choices": ["Classical conditioning", "Observational learning through vicarious reinforcement", "Habituation", "Negative reinforcement"], "answer": 1, "explain": "Learning by watching another person be rewarded is observational learning driven by vicarious reinforcement, as described by Bandura.", "concept": "7C", "cover_story": "clinic and classroom", "b": -0.5}, {"stem": "A dog that once barked at every passing train gradually stops reacting to the harmless, repeated sound, with no reward involved. This decline in response to a repeated, meaningless stimulus is best called which of the following?", "choices": ["Extinction of a conditioned response", "Habituation", "Stimulus generalization", "Spontaneous recovery"], "answer": 1, "explain": "Habituation is a decrease in responding to a repeated, harmless stimulus and does not require any prior conditioned association, unlike extinction.", "concept": "7C", "cover_story": "clinic and classroom", "b": 0.7}]}, {"label": "Development study", "paragraphs": ["A longitudinal study follows people from childhood into adulthood and records how they resolve life challenges. A teenager tries out different clubs, majors, and friend groups while asking who she really is. A toddler in the same study explores freely when a caregiver is reliably present and grows anxious when the caregiver is unpredictable.", "Researchers also present moral dilemmas. A young child says stealing is wrong because you might get caught and punished. An adult says a law can be unjust and that broader ethical principles can outweigh it. Over the years, the team also tracks how each participant describes the self and how confident each feels about specific tasks."], "source_ref": "OpenStax Psychology 2e, Ch. 9 (Lifespan Development)", "questions": [{"stem": "The teenager who tries out many clubs and roles while asking who she is fits which of Erikson's stages?", "choices": ["Trust versus mistrust", "Identity versus role confusion", "Intimacy versus isolation", "Generativity versus stagnation"], "answer": 1, "explain": "Adolescence centers on the identity versus role confusion stage, in which a person explores roles to form a coherent sense of self.", "concept": "8A", "cover_story": "development study", "b": -0.4}, {"stem": "The young child who says stealing is wrong only because you might be punished is reasoning at which level of moral development?", "choices": ["Preconventional", "Conventional", "Postconventional", "Concrete operational"], "answer": 0, "explain": "Preconventional moral reasoning focuses on avoiding punishment and gaining rewards, not on social approval or abstract principles.", "concept": "8A", "cover_story": "development study", "b": -0.2}, {"stem": "The adult who argues that an unjust law can be outweighed by broader ethical principles is reasoning at which level?", "choices": ["Preconventional", "Conventional", "Postconventional", "Formal operational"], "answer": 2, "explain": "Postconventional reasoning appeals to abstract principles and universal ethics that can override specific laws.", "concept": "8A", "cover_story": "development study", "b": 0.3}, {"stem": "In Erikson's framework, the toddler who explores confidently only when the caregiver is reliably present is working through which stage?", "choices": ["Autonomy versus shame and doubt", "Trust versus mistrust", "Initiative versus guilt", "Industry versus inferiority"], "answer": 1, "explain": "The earliest Eriksonian stage, trust versus mistrust, concerns whether a dependable caregiver leads the infant to view the world as safe.", "concept": "8A", "cover_story": "development study", "b": 0.4}, {"stem": "Researchers note that young children describe themselves mostly by concrete features like hair color, while adolescents describe themselves using abstract traits and beliefs. This shift best reflects which of the following?", "choices": ["A steady decline in self-esteem with age", "The development of a more abstract self-concept", "The onset of identity foreclosure", "An external locus of control"], "answer": 1, "explain": "As cognition matures, the self-concept moves from concrete physical descriptions toward abstract psychological traits and values.", "concept": "8A", "cover_story": "development study", "b": 0.1}, {"stem": "A participant is very confident she can pass a specific chemistry exam if she studies, though her overall sense of self-worth is only average. Her exam confidence is best described as which of the following?", "choices": ["High global self-esteem", "High self-efficacy for that task", "An external locus of control", "Identity diffusion"], "answer": 1, "explain": "Self-efficacy is the belief in one's ability to succeed at a specific task, which can be high even when general self-esteem is only moderate.", "concept": "8A", "cover_story": "development study", "b": 0.6}]}, {"label": "Attribution survey", "paragraphs": ["A social psychology study examines how people explain behavior. Participants read about a driver who cuts off another car and about a student who fails a test. They also rate their own successes and failures, and complete measures of beliefs and feelings toward unfamiliar groups.", "Most participants say the rude driver is simply a bad person, while explaining their own rude driving as caused by being in a rush. They credit their own good grades to ability but blame bad grades on unfair tests. In a separate task, teachers who are told that certain randomly chosen students are gifted later rate those students as higher achievers, and those students improve."], "source_ref": "OpenStax Psychology 2e, Ch. 12 (Social Psychology)", "questions": [{"stem": "Participants call the rude driver a bad person while blaming their own rude driving on being rushed. Their judgment of the other driver reflects which of the following?", "choices": ["The self-serving bias", "The fundamental attribution error", "The just-world hypothesis", "Deindividuation"], "answer": 1, "explain": "The fundamental attribution error is the tendency to overweight personal, dispositional causes and underweight situational causes when explaining others' behavior.", "concept": "8B", "cover_story": "attribution survey", "b": 0.1}, {"stem": "The contrast between blaming the other driver's character but blaming the situation for one's own identical behavior is best labeled as which of the following?", "choices": ["Actor-observer bias", "Cognitive dissonance", "Stereotype threat", "Social facilitation"], "answer": 0, "explain": "The actor-observer bias is the tendency to attribute others' actions to disposition while attributing our own to the situation.", "concept": "8B", "cover_story": "attribution survey", "b": 0.5}, {"stem": "Participants credit their good grades to ability but blame bad grades on unfair tests. This pattern is best described as which of the following?", "choices": ["The fundamental attribution error", "The self-serving bias", "The actor-observer bias", "The halo effect"], "answer": 1, "explain": "The self-serving bias protects self-esteem by attributing successes to internal factors and failures to external ones.", "concept": "8B", "cover_story": "attribution survey", "b": -0.2}, {"stem": "Teachers told that random students are gifted later rate them as higher achievers, and those students improve. This outcome best illustrates which of the following?", "choices": ["Stereotype threat", "A self-fulfilling prophecy", "The just-world hypothesis", "Out-group homogeneity"], "answer": 1, "explain": "A self-fulfilling prophecy occurs when an initially false expectation changes behavior in ways that make the expectation come true.", "concept": "8B", "cover_story": "attribution survey", "b": 0.4}, {"stem": "A participant believes an unfamiliar group is lazy, dislikes them, and refuses to hire them. The refusal to hire is best classified as which of the following?", "choices": ["A stereotype", "Prejudice", "Discrimination", "Ethnocentrism"], "answer": 2, "explain": "Discrimination is the behavioral component, unequal treatment based on group membership, distinct from the cognitive stereotype and the affective prejudice.", "concept": "8B", "cover_story": "attribution survey", "b": -0.1}, {"stem": "Reminding students of a negative stereotype about their group right before a test lowers their scores, even though nothing about the test changed. This effect is best described as which of the following?", "choices": ["Stereotype threat", "The self-serving bias", "A self-fulfilling prophecy created by the teacher", "Out-group bias"], "answer": 0, "explain": "Stereotype threat is the drop in performance that arises when people fear confirming a negative stereotype about their own group.", "concept": "8B", "cover_story": "attribution survey", "b": 0.9}]}, {"label": "Hospital roles", "paragraphs": ["A sociologist observes a busy teaching hospital. A resident is a physician to patients, a student to attending doctors, and a mentor to nurses in training, and she sometimes struggles to meet all of these expectations at once. Staff behave formally and reassuringly at the bedside but joke and vent in the break room.", "The sociologist notes that some positions, like being born into a wealthy family, are assigned at birth, while others, like becoming a lead surgeon, are earned. A new nurse carefully manages how he dresses and speaks to appear competent to patients and supervisors."], "source_ref": "OpenStax Introduction to Sociology 3e, Ch. 4 (Society and Social Interaction)", "questions": [{"stem": "The resident struggles to satisfy the different demands of being a physician, a student, and a mentor at the same time. This clash between the expectations of her different statuses is best called which of the following?", "choices": ["Role strain", "Role conflict", "Role exit", "Status inconsistency"], "answer": 1, "explain": "Role conflict arises from incompatible demands of two or more different statuses a person holds at once, unlike role strain, which comes from a single role.", "concept": "8C", "cover_story": "hospital roles", "b": 0.4}, {"stem": "Suppose instead the resident feels torn by competing demands within the single role of physician, such as being both efficient and caring. This tension within one role is best labeled as which of the following?", "choices": ["Role conflict", "Role strain", "Role exit", "Master status"], "answer": 1, "explain": "Role strain is the tension among the various demands of a single role, whereas role conflict is between separate roles.", "concept": "8C", "cover_story": "hospital roles", "b": 0.6}, {"stem": "Staff act formal and reassuring at the bedside but joke and vent in the break room. In Goffman's dramaturgical approach, the break room functions as which of the following?", "choices": ["The front stage", "The back stage", "A total institution", "A reference group"], "answer": 1, "explain": "In dramaturgical analysis, the back stage is where people relax and drop the managed performance they present on the front stage.", "concept": "8C", "cover_story": "hospital roles", "b": 0.2}, {"stem": "The new nurse carefully manages his dress and speech to appear competent to patients and supervisors. This effort is best described as which of the following?", "choices": ["Impression management", "Role exit", "Resocialization", "Deindividuation"], "answer": 0, "explain": "Impression management is the process of controlling how one presents oneself in order to shape others' perceptions.", "concept": "8C", "cover_story": "hospital roles", "b": -0.4}, {"stem": "Being born into a wealthy family versus becoming a lead surgeon illustrates the difference between which pair?", "choices": ["Master status and role set", "Ascribed status and achieved status", "Front stage and back stage", "Primary group and secondary group"], "answer": 1, "explain": "An ascribed status is assigned without effort, such as by birth, while an achieved status is earned through one's actions.", "concept": "8C", "cover_story": "hospital roles", "b": -0.6}, {"stem": "For one physician, being a famous surgeon overshadows all her other statuses in how others treat her. A status that dominates others in this way is best called which of the following?", "choices": ["An ascribed status", "A master status", "A reference group", "A role set"], "answer": 1, "explain": "A master status is the status that dominates how a person is perceived and organizes their social identity above their other statuses.", "concept": "8C", "cover_story": "hospital roles", "b": 0.1}]}, {"label": "Paradigms on schooling", "paragraphs": ["A sociology seminar asks students to explain public schooling using different theoretical lenses. One student argues that schools exist because they perform useful functions for society, such as teaching skills and sorting people into jobs. Another argues that schools mainly reproduce the advantages of wealthy families and keep power unequal.", "A third student focuses on the small-scale meanings created in classrooms, such as how a label like troublemaker shapes a student's self-image and behavior. The seminar also notes that openly socializing children is a benefit everyone recognizes, while keeping young people out of the job market is a less obvious effect."], "source_ref": "OpenStax Introduction to Sociology 3e, Ch. 1 (An Introduction to Sociology)", "questions": [{"stem": "The student who says schools exist because they perform useful functions like teaching skills and sorting workers is using which theoretical approach?", "choices": ["Conflict theory", "Structural functionalism", "Symbolic interactionism", "Rational choice theory"], "answer": 1, "explain": "Structural functionalism explains social institutions by the functions they perform to maintain the stability of society as a whole.", "concept": "9A", "cover_story": "paradigms on schooling", "b": -0.3}, {"stem": "The student who argues that schools mainly reproduce the advantages of the wealthy and preserve unequal power is using which approach?", "choices": ["Functionalism", "Conflict theory", "Symbolic interactionism", "Social exchange theory"], "answer": 1, "explain": "Conflict theory, rooted in Marx, emphasizes how institutions maintain inequality and serve the interests of powerful groups.", "concept": "9A", "cover_story": "paradigms on schooling", "b": -0.1}, {"stem": "The student focused on how a label like troublemaker shapes a student's self-image in everyday classroom interactions is using which approach?", "choices": ["Macrosociology", "Symbolic interactionism", "Functionalism", "Conflict theory"], "answer": 1, "explain": "Symbolic interactionism is a micro-level approach that studies how people create and respond to shared meanings and labels in interaction.", "concept": "9A", "cover_story": "paradigms on schooling", "b": 0.2}, {"stem": "Openly socializing children is a benefit everyone recognizes, while keeping young people out of the job market is a hidden effect. These two are best described as which pair?", "choices": ["Manifest function and latent function", "Function and dysfunction", "Norm and sanction", "Value and belief"], "answer": 0, "explain": "A manifest function is an intended, recognized consequence, while a latent function is an unintended, less obvious one.", "concept": "9A", "cover_story": "paradigms on schooling", "b": 0.5}, {"stem": "Which pair of approaches is best matched to a macro-level, large-scale analysis of schooling rather than a micro-level one?", "choices": ["Symbolic interactionism and dramaturgy", "Functionalism and conflict theory", "Labeling theory and exchange theory", "Ethnomethodology and interactionism"], "answer": 1, "explain": "Functionalism and conflict theory are macro-level paradigms that analyze large social structures, while symbolic interactionism is micro-level.", "concept": "9A", "cover_story": "paradigms on schooling", "b": 0.7}, {"stem": "A researcher predicts that unequal school funding will widen the gap between rich and poor neighborhoods over time. This prediction follows most directly from which approach?", "choices": ["Functionalism", "Conflict theory", "Symbolic interactionism", "Rational choice theory"], "answer": 1, "explain": "Conflict theory predicts that institutional arrangements like unequal funding will reproduce and deepen social inequality.", "concept": "9A", "cover_story": "paradigms on schooling", "b": 0.1}]}, {"label": "Country dataset", "paragraphs": ["A demographer compares two countries. Country A has high birth rates and high death rates and a young population. Country B has low birth rates, low death rates, and a growing share of older adults. Over 50 years, Country A's death rate falls sharply due to better sanitation while births stay high, and its population surges.", "The demographer also studies movement of people. Many young workers leave rural areas of Country A because there are few jobs, and they move to cities in Country B that offer employment. Some analysts warn that population may outgrow the food supply, while others point to new farming technology as a solution."], "source_ref": "OpenStax Introduction to Sociology 3e, Ch. 20 (Population, Urbanization, and the Environment)", "questions": [{"stem": "Country A's death rate falls sharply while birth rates stay high, causing its population to surge. This pattern is characteristic of which of the following?", "choices": ["The final stage of the demographic transition", "An early stage of the demographic transition", "A post-industrial equilibrium", "Zero population growth"], "answer": 1, "explain": "In an early transition stage, death rates drop due to improvements like sanitation while birth rates remain high, producing rapid population growth.", "concept": "9B", "cover_story": "country dataset", "b": 0.4}, {"stem": "Country B has low birth and death rates and a rising share of older adults. A useful tool for displaying this age-and-sex structure is which of the following?", "choices": ["A population pyramid", "A Punnett square", "A dependency contract", "A sociogram"], "answer": 0, "explain": "A population pyramid displays the distribution of a population by age and sex, revealing patterns such as an aging society.", "concept": "9B", "cover_story": "country dataset", "b": -0.2}, {"stem": "Young workers leave rural Country A because of scarce jobs and move to cities in Country B that offer work. The scarce jobs at home are best described as which of the following?", "choices": ["A pull factor", "A push factor", "Chain migration", "Net migration"], "answer": 1, "explain": "Push factors drive people away from an origin, such as a lack of jobs, while pull factors attract them to a destination.", "concept": "9B", "cover_story": "country dataset", "b": -0.3}, {"stem": "The analysts who warn that population may outgrow the food supply are drawing on which perspective?", "choices": ["Malthusian theory", "Demographic transition theory", "The cornucopian view", "World-systems theory"], "answer": 0, "explain": "Malthusian theory warns that population, growing geometrically, can outpace food production, which grows more slowly.", "concept": "9B", "cover_story": "country dataset", "b": 0.3}, {"stem": "The large-scale movement of people from the countryside into the cities of Country B is best described as which of the following?", "choices": ["Suburbanization", "Urbanization", "Gentrification", "Assimilation"], "answer": 1, "explain": "Urbanization is the growing concentration of a population in cities, often driven by rural-to-urban migration for work.", "concept": "9B", "cover_story": "country dataset", "b": -0.6}, {"stem": "The analysts who respond that new farming technology can keep pace with population growth best represent which view?", "choices": ["Malthusian theory", "The cornucopian view", "The first stage of the demographic transition", "Zero population growth"], "answer": 1, "explain": "The cornucopian view holds that human innovation and technology will continue to solve resource limits as population grows.", "concept": "9B", "cover_story": "country dataset", "b": 0.8}]}, {"label": "Mobility study", "paragraphs": ["A sociologist studies how people move up or down the social ladder. In one country, a person's position is fixed at birth by the family they are born into and cannot change, no matter their effort. In another, people can move between levels based on education and work, though family background still shapes their chances.", "The study finds that children of college-educated parents are far more likely to attend college themselves, partly because they grow up with books, museum visits,
