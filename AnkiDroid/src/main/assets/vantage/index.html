<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><style>/* Copyright: Ankitects Pty Ltd and contributors

/* Vantage dashboard. Flat Design system (no shadows, color blocks, Outfit). */

:root {
  --bg: #ffffff;
  --fg: #111827;
  --primary: #3b82f6;
  --primary-600: #2563eb;
  --primary-50: #eff6ff;
  --secondary: #10b981;
  --secondary-600: #059669;
  --secondary-50: #ecfdf5;
  --accent: #f59e0b;
  --accent-600: #d97706;
  --accent-50: #fffbeb;
  --muted: #f3f4f6;
  --muted-200: #e5e7eb;
  --border: #e5e7eb;
  --gray-500: #6b7280;
  --gray-900: #111827;
  --radius-md: 6px;
  --radius-lg: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01';
}

.app { padding-bottom: 4rem; }
/* The masthead spans the full window width; everything below it stays in a
   centered reading column so lines don't stretch across a wide monitor. */
.app__body { max-width: 80rem; margin: 0 auto; }

/* ---------- Header (dark color block, poster look) ---------- */
.masthead {
  position: relative;
  overflow: hidden;
  background: var(--gray-900);
  color: #fff;
  /* Full-bleed banner: fills the window width, but its content lines up with the
     centered body column -- side padding grows to match the column on wide screens
     and floors at 2.5rem on narrow ones. Uses % (of .app = body width, excludes the
     scrollbar) rather than vw, so it never triggers a horizontal scrollbar. */
  padding: 2.5rem max(2.5rem, calc((100% - 80rem) / 2 + 2.5rem)) 2rem;
}
.masthead__deco { position: absolute; inset: 0; pointer-events: none; }
.masthead__deco span {
  position: absolute; border-radius: 9999px; opacity: 0.06; background: #fff;
}
.masthead__deco .c1 { width: 22rem; height: 22rem; right: -6rem; top: -9rem; }
.masthead__deco .c2 { width: 12rem; height: 12rem; right: 9rem; bottom: -6rem; opacity: 0.05; }
.masthead__deco .sq {
  position: absolute; width: 10rem; height: 10rem; left: 40%; top: -4rem;
  background: var(--primary); opacity: 0.10; transform: rotate(20deg); border-radius: var(--radius-lg);
}
.masthead__row { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand__mark { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.brand__mark .dot { color: var(--primary); }

.toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.btn {
  font-family: inherit; font-weight: 600; font-size: 0.9rem; border: 0; cursor: pointer;
  border-radius: var(--radius-md); padding: 0 1.1rem; height: 2.75rem;
  display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap;
  transition: background-color 150ms ease;
}
.btn svg { width: 1.05rem; height: 1.05rem; flex: none; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary); }
.btn--primary { background: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-600); }
.btn--ghost { background: rgba(255,255,255,0.12); color: #fff; }
.btn--ghost:hover { background: rgba(255,255,255,0.22); }
.btn--practice { background: #7c3aed; color: #fff; }
.btn--practice:hover { background: #6d28d9; }

/* meta chips */
.chips { position: relative; display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.45rem;
  background: rgba(255,255,255,0.1); color: #f9fafb; font-weight: 500; font-size: 0.85rem;
  padding: 0.4rem 0.8rem; border-radius: 9999px;
}
.chip svg { width: 1rem; height: 1rem; }

/* ---------- Section scaffolding ---------- */
.section { padding: 2rem 2.5rem 0; }
.section__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.1rem; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: var(--gray-500); }
.section__title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
/* Top-level group headers (e.g. "Knowledge check") take the product's uppercase tracked
   label register so they read as a tier above the mixed-case panel titles inside them. */
.section__title--group { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray-900); }

/* ---------- Score cards (color blocks) ---------- */
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
.card {
  border-radius: var(--radius-lg); padding: 1.75rem; border: 0;
}
.card--memory { background: var(--primary-50); }
.card--perf { background: var(--secondary-50); }
.card--ready { background: var(--accent-50); }
.card--abstain { background: var(--muted); }

.card__top { display: flex; align-items: center; gap: 0.85rem; margin-bottom: 1.1rem; }
.iconwrap {
  width: 3.25rem; height: 3.25rem; border-radius: 9999px; background: #fff;
  display: grid; place-items: center; flex: none;
}
.iconwrap svg { width: 1.6rem; height: 1.6rem; stroke-width: 2.4; }
.i-memory { color: var(--primary-600); }
.i-perf { color: var(--secondary-600); }
.i-ready { color: var(--accent-600); }
.i-abstain { color: var(--gray-500); }
.card__label { text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; font-size: 0.8rem; color: var(--gray-500); }
.card__sub { font-size: 0.82rem; color: var(--gray-500); font-weight: 500; }

.metricline { display: flex; align-items: baseline; justify-content: flex-start; gap: 0.55rem; margin-top: 0.35rem; }
.metricline__val { font-size: 3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.card--memory .metricline__val { color: var(--primary-600); }
.card--perf .metricline__val { color: var(--secondary-600); }
.metricline__range { color: var(--gray-500); font-weight: 500; font-size: 1rem; }

.reasons { list-style: none; margin-top: 1.1rem; display: grid; gap: 0.4rem; }
.reasons li { position: relative; padding-left: 1rem; color: #374151; font-size: 0.9rem; font-weight: 400; }
.reasons li::before { content: ""; position: absolute; left: 0; top: 0.55rem; width: 0.4rem; height: 0.4rem; border-radius: 9999px; background: currentColor; opacity: 0.4; }

/* confidence ("how sure") + coverage, shown on every score */
.cardmeta { margin-top: 1.1rem; display: grid; gap: 0.35rem; }
.conf { font-weight: 700; font-size: 0.9rem; }
.conf--high { color: var(--secondary-600); }
.conf--medium { color: var(--accent-600); }
.conf--low { color: #6b7280; }
.conf--insufficient { color: #374151; }
.cover { color: var(--gray-500); font-weight: 500; font-size: 0.85rem; }

/* abstain state */
.abstain__title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--accent-600); }
.abstain__lead { margin-top: 0.4rem; color: #374151; font-weight: 500; }
.card__cta {
  margin-top: 1.1rem; font-family: inherit; font-weight: 700; font-size: 0.9rem; color: #fff;
  background: #7c3aed; border: 0; border-radius: var(--radius-md); padding: 0.6rem 1.1rem; cursor: pointer;
}
.card__cta:hover { background: #6d28d9; }
.card__cta:focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }

/* ---------- Coverage ---------- */
.coverage { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.25rem; align-items: stretch; }
.coverblock { background: var(--muted); border-radius: var(--radius-lg); padding: 1.75rem; }
.cover__overall { display: flex; align-items: baseline; gap: 0.6rem; }
.cover__num { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; }
.cover__of { color: var(--gray-500); font-weight: 600; }
.bars { margin-top: 1.4rem; display: grid; gap: 1.05rem; }
.bar__head { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem; }
.bar__track { height: 0.9rem; background: var(--muted-200); border-radius: 9999px; overflow: hidden; }
.bar__fill { height: 100%; border-radius: 9999px; transition: width 300ms ease; }
.bar--chem_phys .bar__fill { background: var(--primary); }
.bar--bio_biochem .bar__fill { background: var(--secondary); }
.bar--psych_soc .bar__fill { background: var(--accent); }

/* finer topic breakdown under the section bars: the areas with the most topics
   left, each a thinner bar so the section bars stay the primary read */
.tgaps { margin-top: 1.6rem; display: grid; gap: 0.85rem; }
.tgaps__head { font-weight: 700; font-size: 0.9rem; color: var(--gray-500); }
.tgap__head { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem; }
.tgap__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tgap__name b { font-weight: 800; margin-right: 0.35rem; }
.tgap__count { flex: none; color: var(--gray-500); font-variant-numeric: tabular-nums; }
.tgap .bar__track { height: 0.5rem; }

/* best next topic block (bold accent) */
.nextblock { background: var(--gray-900); color: #fff; border-radius: var(--radius-lg); padding: 1.75rem; position: relative; overflow: hidden; }
.nextblock .deco { position: absolute; width: 12rem; height: 12rem; right: -4rem; bottom: -5rem; border-radius: 9999px; background: var(--accent); opacity: 0.14; }
.nextblock__eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: #9ca3af; }
.nextblock__title { position: relative; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.5rem; }
.nextblock__meta { position: relative; margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tag { background: rgba(255,255,255,0.12); color: #fff; font-weight: 600; font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 9999px; }
.tag--accent { background: var(--accent); color: #442c04; }

/* "where to study" resource pointers inside the next-topic block */
.nextblock__where { position: relative; margin-top: 1.1rem; padding-top: 0.9rem; border-top: 1px solid rgba(255,255,255,0.14); display: grid; gap: 0.5rem; }
.where__row { display: flex; gap: 0.6rem; align-items: baseline; font-size: 0.9rem; color: #e5e7eb; font-weight: 500; }
.where__k { flex: none; min-width: 4.75rem; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; color: #9ca3af; font-weight: 600; }
.where__val { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.where__row--book { align-items: flex-start; }
.where__book { font-weight: 600; color: #e5e7eb; }
.where__chapter { font-size: 0.82rem; color: #cbd5e1; }
.bookpick { flex: none; margin-left: auto; align-self: flex-start; max-width: 11rem;
  background: rgba(255,255,255,0.08); color: #e5e7eb; font: inherit; font-size: 0.78rem; font-weight: 600;
  border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 0.28rem 0.5rem; cursor: pointer; }
.bookpick:hover { border-color: rgba(255,255,255,0.4); }
.where__links { display: flex; flex-wrap: wrap; gap: 0.35rem 0.55rem; align-items: baseline; }
.where__sep { color: #6b7280; }
.where__cap { font-size: 0.76rem; color: #9ca3af; font-weight: 500; }
.nextblock__where a { color: #93c5fd; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
.nextblock__where a:hover { text-decoration: underline; }

/* pager: step through the ranked next topics */
.nextblock__head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.nextpager { display: flex; align-items: center; gap: 0.5rem; flex: none; }
.nextpager__count { font-size: 0.78rem; font-weight: 600; color: #9ca3af; font-variant-numeric: tabular-nums; }
.nextnav { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border: 0; border-radius: 9999px; background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; }
.nextnav:hover { background: rgba(255,255,255,0.22); }
.nextnav:disabled { opacity: 0.35; cursor: default; }
.nextnav svg { width: 1rem; height: 1rem; }
.nextnav:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,0.5); }

/* ---------- readiness sections mini-bars ---------- */
.subsections { margin-top: 1.25rem; display: grid; gap: 0.95rem; }
.subrow { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
.subrow__label { font-weight: 600; font-size: 0.95rem; }
.subrow__score { display: flex; align-items: baseline; gap: 0.55rem; }
.subrow__val { font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; color: var(--accent-600); }
.subrow__range { color: var(--gray-500); font-weight: 500; font-size: 0.85rem; }

/* ---------- Study & practice (per-section launcher) ---------- */
.studygrid { display: grid; gap: 0.75rem; }
.srow {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--muted); border-radius: var(--radius-lg); padding: 1.05rem 1.35rem;
  border-left: 4px solid var(--muted-200);
}
.srow--chem_phys { border-left-color: var(--primary); }
.srow--bio_biochem { border-left-color: var(--secondary); }
.srow--psych_soc { border-left-color: var(--accent); }
.srow--cars { border-left-color: #7c3aed; }
.srow--all { background: var(--gray-900); color: #fff; border-left-color: var(--primary); }
.srow__meta { min-width: 0; }
.srow__name { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
.srow__sub { color: var(--gray-500); font-size: 0.85rem; font-weight: 500; margin-top: 2px; }
.srow--all .srow__sub { color: #9ca3af; }
.srow__actions { display: flex; gap: 0.5rem; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.btn--study { background: var(--primary); color: #fff; }
.btn--study:hover { background: var(--primary-600); }
.btn--reason { background: #7c3aed; color: #fff; }
.btn--reason:hover { background: #6d28d9; }
.srow .btn { height: 2.55rem; }

/* ---------- exam countdown + daily plan ---------- */
.plancard { background: var(--primary-50); color: var(--fg); border-radius: var(--radius-lg); padding: 1.75rem; position: relative; overflow: hidden; }
.plan__eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; font-size: 0.78rem; color: var(--gray-500); }
.plan__count { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.35rem; color: var(--fg); }
.plan__days { font-size: 2.6rem; color: var(--primary-600); }
.plan__daterow { margin-top: 0.55rem; display: flex; align-items: center; gap: 0.75rem; color: var(--gray-500); font-weight: 600; font-size: 0.9rem; }
.plan__setrow { margin-top: 0.55rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.plan__title { font-size: 1.15rem; font-weight: 700; }
.datein { font-family: inherit; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.5rem 0.7rem; background: #fff; color: var(--fg); color-scheme: light; cursor: pointer; }
.plan__grid { margin-top: 1.4rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.plan__item { display: flex; align-items: baseline; gap: 0.6rem; background: #fff; border-radius: var(--radius-md); padding: 0.95rem 1.1rem; }
.plan__num { font-size: 2rem; font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.plan__lbl { font-weight: 600; font-size: 0.9rem; color: var(--fg); display: flex; flex-direction: column; }
.plan__hint { color: var(--gray-500); font-weight: 500; font-size: 0.78rem; margin-top: 2px; }
.plan__note { margin-top: 1.15rem; color: var(--gray-500); font-size: 0.85rem; font-weight: 500; }

/* ---------- pacing coach ---------- */
.pacelist { display: grid; gap: 0.7rem; }
.pacerow { display: grid; grid-template-columns: 8rem 1fr auto; align-items: baseline; gap: 1rem; }
.pacerow__sec { font-weight: 700; font-size: 0.95rem; }
.pacerow__you { font-weight: 800; font-variant-numeric: tabular-nums; }
.pacerow__you--ok { color: var(--secondary-600); }
.pacerow__you--off { color: var(--accent-600); }
.pacerow__t { color: var(--gray-500); font-size: 0.85rem; font-weight: 500; }
.pacerow__verdict { font-size: 0.85rem; font-weight: 600; text-align: right; }
.pacerow__verdict--ok { color: var(--secondary-600); }
.pacerow__verdict--off { color: var(--accent-600); }

/* ---------- score trajectory ---------- */
.trajstats { display: flex; gap: 1.75rem; flex-wrap: wrap; }
.trajstat { display: flex; flex-direction: column; }
.trajstat__num { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.trajstat__lbl { font-size: 0.78rem; color: var(--gray-500); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.targetin { font-family: inherit; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.4rem 0.6rem; width: 6rem; color: var(--fg); }

/* ---------- learn first vs ready to practice ---------- */
.plansplit { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.plancol { background: var(--muted); border-radius: var(--radius-lg); padding: 1.4rem 1.5rem; border-left: 4px solid var(--muted-200); }
.plancol--ready { border-left-color: var(--secondary); }
.plancol__h { font-weight: 700; font-size: 0.98rem; margin-bottom: 0.95rem; }
.planchips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.planchip { background: #fff; border: 1px solid var(--border); border-radius: 9999px; padding: 0.4rem 0.85rem; font-size: 0.85rem; font-weight: 600; }
.planempty { color: var(--gray-500); font-weight: 500; font-size: 0.9rem; }

/* ---------- memory vs. real performance (two-bar comparison) ---------- */
.calibsummary { font-size: 1.05rem; line-height: 1.5; margin-bottom: 1.25rem; }
.calibsummary b { font-weight: 700; }
.calibverdict--ok b { color: var(--secondary-600); }
.calibverdict--off b { color: var(--accent-600); }
.calib { display: grid; gap: 0.7rem; }
.calibbar { display: grid; grid-template-columns: 9rem 1fr 3rem; align-items: center; gap: 0.8rem; }
.calibbar__k { font-size: 0.8rem; color: var(--gray-500); font-weight: 600; }
.calibbar__track { height: 0.85rem; background: var(--muted-200); border-radius: 9999px; overflow: hidden; }
.calibbar__fill { height: 100%; border-radius: 9999px; }
.calibbar__fill--pred { background: var(--primary); }
.calibbar__fill--obs { background: var(--secondary); }
.calibbar__v { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- fluency illusion (recall vs applying it, per concept) ---------- */
.flulist { display: grid; gap: 1.15rem; }
.flurow { display: grid; gap: 0.45rem; }
.flurow__head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
.flurow__name { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
.fluchip { flex: none; background: #fff; border: 1px solid var(--border); color: var(--gray-500); font-weight: 600; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 9999px; }
.flubar { display: grid; grid-template-columns: 6.5rem 1fr 3rem; align-items: center; gap: 0.8rem; }
.flubar__k { font-size: 0.8rem; color: var(--gray-500); font-weight: 600; }
.flubar__track { height: 0.75rem; background: var(--muted-200); border-radius: 9999px; overflow: hidden; }
.flubar__fill { height: 100%; border-radius: 9999px; }
.flubar__fill--rec { background: var(--primary); }
.flubar__fill--app { background: var(--secondary); }
.flubar__v { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- top outlook: exam countdown + score trajectory side by side ---------- */
.outlook { display: grid; grid-template-columns: 1fr; gap: 1.25rem; padding: 2rem 2.5rem 0; align-items: stretch; }
.outlook .section { padding: 0; display: flex; flex-direction: column; }
/* keep the two outlook cards level: the shorter one grows to match the taller */
.outlook .plancard, .outlook .coverblock { flex: 1 1 auto; }

/* ---------- grouped insight rows ---------- */
/* Each themed group is a single row of 2-3 analysis cards under its own heading,
   so the six panels read as distinct sections instead of one long wall. A single
   row of cards ending at different heights reads fine; the ragged whitespace only
   appeared when many panels wrapped into multiple grid rows. */
.insightgrid { display: grid; gap: 1rem; align-items: start; }
.insightgrid .section { padding: 0; min-width: 0; }
.insightgrid--3 { grid-template-columns: 1fr; }
.insightgrid--2 { grid-template-columns: 1fr; }
/* the two Test-day readiness cards fill the row's height so their boxes match */
.insightgrid--2 { align-items: stretch; }
.insightgrid--2 .section { display: flex; flex-direction: column; }
.insightgrid--2 .coverblock { flex: 1 1 auto; }
@media (min-width: 700px) {
  .insightgrid--2 { grid-template-columns: repeat(2, 1fr); }
  .insightgrid--3 { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 960px) {
  .outlook { grid-template-columns: 1.4fr 1fr; }
  .insightgrid--3 { grid-template-columns: repeat(3, 1fr); }
}

.footmeta { margin: 1.25rem 2.5rem 0; color: var(--gray-500); font-size: 0.82rem; font-weight: 500; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

@media (max-width: 900px) {
  .scores { grid-template-columns: 1fr; }

/* Vantage CARS practice. Flat Design, shares the dashboard's tokens and adds a
   distinct section accent for CARS so it reads as its own part of the exam. */
:root {
  --fg: #111827;
  --gray-600: #4b5563;
  --gray-500: #6b7280;
  --gray-400: #9ca3af;
  --gray-200: #e5e7eb;
  --muted: #f3f4f6;
  --bg: #ffffff;
  --cars: #7c3aed;
  --cars-600: #6d28d9;
  --cars-50: #f5f3ff;
  --ok: #059669;
  --ok-50: #ecfdf5;
  --no: #dc2626;
  --no-50: #fef2f2;
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--fg);
  font-family: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 72rem; margin: 0 auto; padding: 0 2rem 4rem; }

/* top bar */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: 1.75rem 0 1.25rem; flex-wrap: wrap; }
.top__title { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; }
.top__right { display: flex; align-items: baseline; gap: 1.25rem; }
.progress { color: var(--gray-500); font-weight: 600; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.progress--met { color: var(--ok); }  /* today's reasoning goal reached (going over is fine) */
.linkbtn { font-family: inherit; font-weight: 600; font-size: 0.9rem; color: var(--gray-500); background: none; border: 0; cursor: pointer; padding: 0.3rem 0; }
.linkbtn:hover { color: var(--fg); }
.linkbtn:focus-visible { outline: 2px solid var(--cars); outline-offset: 3px; border-radius: 4px; }

/* progress bar */
.pbar { height: 0.3rem; background: var(--gray-200); border-radius: 999px; overflow: hidden; }
.pbar__fill { height: 100%; background: var(--cars); border-radius: 999px; transition: width 250ms ease; }

/* two-column reading layout */
.grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2.25rem; margin-top: 1.75rem; align-items: start; }
.passage__label { font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gray-400); margin-bottom: 0.8rem; }
.passage__body p { max-width: 40rem; line-height: 1.72; margin-bottom: 1.05rem; font-size: 1.02rem; color: #1f2937; }
.passage__src { margin-top: 0.5rem; font-size: 0.78rem; color: var(--gray-400); font-style: italic; }

/* question card */
.qcard { background: var(--muted); border-radius: var(--radius); padding: 1.6rem; position: sticky; top: 1rem; }
.qcard__stem { font-weight: 700; font-size: 1.12rem; line-height: 1.45; margin-bottom: 1.2rem; }
.choices { display: grid; gap: 0.6rem; }
.choice {
  display: flex; gap: 0.7rem; align-items: flex-start; text-align: left; width: 100%;
  font-family: inherit; font-size: 0.98rem; font-weight: 500; color: var(--fg);
  background: var(--bg); border: 2px solid var(--gray-200); border-radius: var(--radius);
  padding: 0.85rem 1rem; cursor: pointer; transition: border-color 120ms ease, background-color 120ms ease;
}
.choice:hover { border-color: var(--cars); }
.choice:focus-visible { outline: 2px solid var(--cars); outline-offset: 2px; }
.choice[aria-pressed="true"] { border-color: var(--cars); background: var(--cars-50); }
.choice__key { font-weight: 800; color: var(--cars-600); flex: none; min-width: 1rem; }
.choice[disabled] { cursor: default; }
.choice--correct { border-color: var(--ok); background: var(--ok-50); }
.choice--correct .choice__key { color: var(--ok); }
.choice--wrong { border-color: var(--no); background: var(--no-50); }
.choice--wrong .choice__key { color: var(--no); }

/* feedback + action */
.feedback { margin-top: 1.15rem; font-weight: 700; font-size: 0.95rem; }
.feedback--ok { color: var(--ok); }
.feedback--no { color: var(--no); }
.explain { margin-top: 0.5rem; color: var(--gray-600); font-weight: 400; font-size: 0.92rem; line-height: 1.55; }
.actions { margin-top: 1.4rem; display: flex; justify-content: flex-end; }
.pbtn {
  font-family: inherit; font-weight: 700; font-size: 0.95rem; border: 0; border-radius: var(--radius);
  padding: 0 1.35rem; height: 2.8rem; cursor: pointer; background: var(--cars); color: #fff;
  transition: background-color 120ms ease;
}
.pbtn:hover { background: var(--cars-600); }
.pbtn:focus-visible { outline: 2px solid var(--cars); outline-offset: 3px; }
.pbtn[disabled] { background: var(--gray-200); color: var(--gray-400); cursor: default; }
.pbtn--ghost { background: var(--bg); color: var(--fg); border: 2px solid var(--gray-200); }
.pbtn--ghost:hover { background: var(--muted); border-color: var(--gray-400); }

/* results */
.summary { margin-top: 2rem; background: var(--muted); border-radius: var(--radius); padding: 2.25rem; }
.summary__score { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; }
.summary__sub { color: var(--gray-500); font-weight: 500; margin-top: 0.35rem; }
.summary__actions { margin-top: 1.6rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }

/* confidence chips (metacognition: mark how sure before checking) */
.confrow { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.1rem; flex-wrap: wrap; }
.confrow__label { font-size: 0.85rem; color: var(--gray-500, #6b7280); font-weight: 600; }
.confchips { display: flex; gap: 0.4rem; }
.conf { font-family: inherit; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--gray-200, #e5e7eb); background: var(--bg, #fff); color: var(--fg, #111827); border-radius: 9999px; padding: 0.4rem 0.9rem; cursor: pointer; }
.conf--on { background: var(--fg, #111827); color: #fff; border-color: var(--fg, #111827); }
.conf:disabled { opacity: 0.55; cursor: default; }

/* miss reason (how you lose points) */
.missrow { margin-top: 1.1rem; padding: 1rem 1.1rem; background: var(--accent-50, #fffbeb); border-radius: var(--radius, 8px); }
.missrow__q { font-weight: 700; font-size: 0.92rem; margin-bottom: 0.65rem; }
.missbtns { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.missbtn { font-family: inherit; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--gray-200, #e5e7eb); background: var(--bg, #fff); color: var(--fg, #111827); border-radius: 8px; padding: 0.5rem 0.85rem; cursor: pointer; }
.missbtn:hover { background: var(--fg, #111827); color: #fff; border-color: var(--fg, #111827); }

@media (max-width: 820px) {
  .grid { grid-template-columns: 1fr; gap: 1.5rem; }
  .qcard { position: static; }
}

  }

  // Documented, anchored, monotonic transform ability(0..1) -> 118..132, then
  // clamped to the section scale. Mirrors scoring.map_ability_to_scale.
  function mapAbilityToScale(ability) {
    const spanA = CFG.map_high_ability - CFG.map_low_ability;
    const spanS = CFG.map_high_scale - CFG.map_low_scale;
    const scaled = CFG.map_low_scale + ((ability - CFG.map_low_ability) / spanA) * spanS;
    return clamp(scaled, CFG.section_scale_min, CFG.section_scale_max);
  }

  // Readiness: a per-section projection onto the 118..132 scale, gated and ranged,
  // mirroring scoring.readiness. Abstains unless there are enough graded reviews,
  // enough of the exam covered, AND enough exam-style practice outcomes. Each
  // usable science section blends its reasoning accuracy (evidence) with its
  // recall (a weak prior of strength kappa); CARS is never modeled. The range is
  // a deterministic normal approximation of each section's posterior spread
  // (exact Monte-Carlo parity with desktop is not feasible on-device), summed to
  // the partial composite.
  function readinessScore(outcomes, sectionRecall, coverage, nReviews, totalOutcomes) {
    const reasons = [];
    if (nReviews < CFG.giveup_min_reviews)
      reasons.push(`${CFG.giveup_min_reviews} graded reviews (you have ${nReviews})`);
    if (coverage < CFG.giveup_min_coverage)
      reasons.push(`${Math.round(CFG.giveup_min_coverage * 100)}% of the exam covered (you have ${Math.round(coverage * 100)}%)`);
    if (totalOutcomes < CFG.min_outcomes_performance)
      reasons.push(`${CFG.min_outcomes_performance} exam-style practice questions answered (you have ${totalOutcomes})`);
    if (reasons.length) {
      return { abstained: true, how_sure: 'insufficient', n: nReviews, reasons, sections: {}, cars_modeled: false };
    }

    const kappa = CFG.projection_prior_strength;
    const kn = { chem_phys: { k: 0, n: 0 }, bio_biochem: { k: 0, n: 0 }, psych_soc: { k: 0, n: 0 } };
    for (const o of outcomes) {
      if (!(o.section in kn)) continue; // science sections only, never CARS
      kn[o.section].n += 1;
      if (o.correct) kn[o.section].k += 1;
    }

    const sections = {};
    let point = 0, low = 0, high = 0, widthSum = 0, usable = 0, weakest = null, weakestPt = Infinity;
    for (const s of ['chem_phys', 'bio_biochem', 'psych_soc']) {
      const k = kn[s].k, n = kn[s].n;
      if (n < CFG.min_outcomes_readiness) continue;
      const m = clamp(sectionRecall[s] || 0, 0, 1); // 0 if the section has no recall yet
      const ability = (k + m * kappa) / (n + kappa);
      const std = Math.sqrt((ability * (1 - ability)) / (n + kappa));
      const sp = mapAbilityToScale(ability);
      const sl = mapAbilityToScale(ability - Z90 * std);
      const sh = mapAbilityToScale(ability + Z90 * std);
      sections[s] = { point: round1(sp), low: round1(sl), high: round1(sh) };
      point += sp; low += sl; high += sh; widthSum += sh - sl; usable += 1;
      if (sp < weakestPt) { weakestPt = sp; weakest = s; }
    }

    if (!usable) {
      return { abstained: true, how_sure: 'insufficient', n: nReviews, reasons: [`at least ${CFG.min_outcomes_readiness} practice questions in one science section`], sections: {}, cars_modeled: false };
    }

    const avgWidth = widthSum / usable;
    const how = avgWidth <= CFG.ready_high_max_width && coverage >= CFG.ready_high_min_coverage ? 'high' : avgWidth <= 2 * CFG.ready_high_max_width ? 'medium' : 'low';
    const reasonsOut = [
      `projected across ${usable} of 3 science sections`,
      `${Math.round(coverage * 100)}% of the exam covered`,
    ];
    if (weakest) reasonsOut.push(`weakest section so far: ${OUTLINE.sections[weakest]} (${kn[weakest].k}/${kn[weakest].n} questions)`);
    return {
      abstained: false, how_sure: how, n: nReviews, cars_modeled: false,
      point: round1(point), low: round1(low), high: round1(high),
      sections, reasons: reasonsOut,
    };
  }

  // --------------------------------------------------------------------------- //
  // IRT latent-ability readiness (2PL item-response model, EAP over a fixed grid)
  // A faithful, deterministic port of scoring.irt_* (irt_prob, irt_information,
  // _irt_grid, irt_estimate, theta_to_scale, irt_readiness). Expected A Posteriori
  // over a FIXED quadrature grid with a normal prior -- no PRNG anywhere -- so the
  // phone reproduces theta, its posterior SD, and every section/composite band
  // bit-for-bit against the desktop core (the parity mandate). Ability is estimated
  // from WHICH items were right (each with a difficulty b and discrimination a),
  // not merely how many, and the per-item Fisher information gives a first-class
  // abstain gate (too little information -> no number).
  // --------------------------------------------------------------------------- //

  // Inverse standard-normal CDF (Acklam's rational approximation). The IRT path
  // uses THIS for its z (as scoring.irt_readiness does via _inv_norm_cdf), not the
  // Z90 literal, so z == scoring._inv_norm_cdf(0.95) to full precision and the
  // section/composite bands agree with desktop.
  function invNormCdf(p) {
    if (!(p > 0 && p < 1)) throw new Error('p must be in (0,1)');
    const a = [-3.969683028665376e1, 2.209460984245205e2, -2.759285104469687e2, 1.38357751867269e2, -3.066479806614716e1, 2.506628277459239e0];
    const b = [-5.447609879822406e1, 1.615858368580409e2, -1.556989798598866e2, 6.680131188771972e1, -1.328068155288572e1];
    const c = [-7.784894002430293e-3, -3.223964580411365e-1, -2.400758277161838e0, -2.549732539343734e0, 4.374664141464968e0, 2.938163982698783e0];
    const d = [7.784695709041462e-3, 3.224671290700398e-1, 2.445134137142996e0, 3.754408661907416e0];
    const plow = 0.02425, phigh = 1 - plow;
    let q, r;
    if (p < plow) {
      q = Math.sqrt(-2 * Math.log(p));
      return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
        ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
    if (p > phigh) {
      q = Math.sqrt(-2 * Math.log(1 - p));
      return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
        ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
    q = p - 0.5; r = q * q;
    return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /
      (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
  }

  // 2PL probability of a correct response: logistic in a * (theta - b).
  function irtProb(theta, a, b) { return 1 / (1 + Math.exp(-a * (theta - b))); }
  // Fisher information one 2PL item carries at theta: a^2 * p * (1 - p).
  function irtInformation(theta, a, b) { const p = irtProb(theta, a, b); return a * a * p * (1 - p); }
  function normalPdf(x, mu, sd) { const z = (x - mu) / sd; return Math.exp(-0.5 * z * z) / (sd * Math.sqrt(2 * Math.PI)); }
  // The fixed (node, prior-weight) quadrature grid: evenly spaced nodes over
  // [theta_min, theta_max] with the normal-prior density as each weight. The
  // absolute normalization cancels in the EAP ratio, so this rebuilds the same
  // grid desktop uses (_irt_grid).
  function irtGrid() {
    const n = CFG.irt_grid_points;
    const lo = CFG.irt_theta_min, hi = CFG.irt_theta_max;
    const step = (hi - lo) / (n - 1);
    const g = [];
    for (let i = 0; i < n; i++) {
      const x = lo + step * i;
      g.push([x, normalPdf(x, CFG.irt_prior_mean, CFG.irt_prior_sd)]);
    }
    return g;
  }
  // EAP estimate of latent ability from 2PL responses (irt_estimate). posterior is
  // prior(theta) * prod_i P_i^u_i (1-P_i)^(1-u_i), evaluated on the fixed grid in
  // log-space with a max-subtraction so a long item list can't underflow. Returns
  // theta (posterior mean), theta_sd (its SD), information (2PL test info at theta).
  // items: [{ correct: 0|1, a, b }]. Fully deterministic (no PRNG).
  function nowStamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function irtEstimate(items) {
    const grid = irtGrid();
    const logPost = [];
    for (let gi = 0; gi < grid.length; gi++) {
      const x = grid[gi][0], w = grid[gi][1];
      let ll = w > 0 ? Math.log(w) : -Infinity;
      for (let ii = 0; ii < items.length; ii++) {
        const it = items[ii];
        const p = clamp(irtProb(x, it.a, it.b), 1e-12, 1 - 1e-12);
        ll += it.correct ? Math.log(p) : Math.log(1 - p);
      }
      logPost.push(ll);
    }
    let maxLl = -Infinity;
    for (let i = 0; i < logPost.length; i++) if (logPost[i] > maxLl) maxLl = logPost[i];
    const weights = logPost.map((lp) => Math.exp(lp - maxLl));
    let total = 0; for (let i = 0; i < weights.length; i++) total += weights[i];
    if (total <= 0) return { theta: CFG.irt_prior_mean, theta_sd: CFG.irt_prior_sd, information: 0, n: items.length };
    let theta = 0; for (let i = 0; i < grid.length; i++) theta += grid[i][0] * weights[i]; theta /= total;
    let varSum = 0; for (let i = 0; i < grid.length; i++) { const dv = grid[i][0] - theta; varSum += weights[i] * dv * dv; } varSum /= total;
    const sd = Math.sqrt(Math.max(0, varSum));
    let info = 0; for (let i = 0; i < items.length; i++) info += irtInformation(theta, items[i].a, items[i].b);
    return { theta, theta_sd: sd, information: info, n: items.length };
  }
  // Documented monotonic transform theta -> 118..132 as midpoint + per_theta*theta,
  // clamped to the section band (theta = 0 -> the scale midpoint). Mirrors theta_to_scale.
  function thetaToScale(theta) {
    const scaled = CFG.irt_scale_midpoint + CFG.irt_scale_per_theta * theta;
    return clamp(scaled, CFG.section_scale_min, CFG.section_scale_max);
  }
  // Readiness via 2PL IRT latent ability (irt_readiness): per science section plus a
  // labeled 3-section partial composite, each with an honest range. Same honesty
  // gates as the classic path (give-up rule + minimum total items + a per-section
  // minimum item COUNT). A section the student aces carries little Fisher
  // information, so IRT can't pin its score -- that shows as a wide range, not a
  // dropped section. Section range is thetaToScale(theta +/- z*sd) (monotone map),
  // and the composite range propagates the independent section bands. CARS is never
  // modeled. sectionItems: { section: [{ correct, a, b }] }.
  function irtReadiness(sectionItems, coverage, nReviews, totalItems) {
    const reasons = [];
    if (nReviews < CFG.giveup_min_reviews)
      reasons.push(`${CFG.giveup_min_reviews} graded reviews (you have ${nReviews})`);
    if (coverage < CFG.giveup_min_coverage)
      reasons.push(`${Math.round(CFG.giveup_min_coverage * 100)}% of the exam covered (you have ${Math.round(coverage * 100)}%)`);
    if (totalItems < CFG.min_outcomes_performance)
      reasons.push(`${CFG.min_outcomes_performance} exam-style practice questions answered (you have ${totalItems})`);
    if (reasons.length) {
      return { abstained: true, how_sure: 'insufficient', n: nReviews, reasons, sections: {}, cars_modeled: false };
    }
    const z = invNormCdf(1 - (1 - CFG.ci_mass) / 2);
    const sections = {};
    const est = {};
    const usable = [];
    // Score the three science sections plus CARS: CARS joins the composite (lifting
    // it toward the full 4-section 472-528 scale) only once it has enough answered
    // reasoning items; the activation gate above keys on the science sections.
    for (const s of ['chem_phys', 'bio_biochem', 'psych_soc', 'cars']) {
      const items = sectionItems[s] || [];
      // include a section once it has enough answered items (matches the classic
      // count gate); a section the student aces yields little Fisher information,
      // so IRT can't pin the score -> a wide honest range, not a dropped section.
      if (items.length < CFG.min_outcomes_readiness) continue;
      const e = irtEstimate(items);
      sections[s] = {
        point: round1(thetaToScale(e.theta)),
        low: round1(thetaToScale(e.theta - z * e.theta_sd)),
        high: round1(thetaToScale(e.theta + z * e.theta_sd)),
      };
      est[s] = e;
      usable.push(s);
    }
    if (!usable.length) {
      return {
        abstained: true, how_sure: 'insufficient', n: nReviews, sections: {}, cars_modeled: false,
        reasons: ['not enough exam-style practice in one science section yet to estimate a score'],
      };
    }
    const compLo = usable.length * CFG.section_scale_min;
    const compHi = usable.length * CFG.section_scale_max;
    let compPoint = 0; for (const s of usable) compPoint += sections[s].point;
    let sig2 = 0; for (const s of usable) { const w = (sections[s].high - sections[s].low) / (2 * z); sig2 += w * w; }
    const compSigma = Math.sqrt(sig2);
    const point = round1(compPoint);
    const low = round1(clamp(compPoint - z * compSigma, compLo, compHi));
    const high = round1(clamp(compPoint + z * compSigma, compLo, compHi));
    let widthSum = 0; for (const s of usable) widthSum += sections[s].high - sections[s].low;
    const avgWidth = widthSum / usable.length;
    const how = avgWidth <= CFG.ready_high_max_width && coverage >= CFG.ready_high_min_coverage ? 'high' : avgWidth <= 2 * CFG.ready_high_max_width ? 'medium' : 'low';
    const reasonsOut = [
      `projected across ${usable.length} section(s)`,
      `${Math.round(coverage * 100)}% of the exam covered`,
    ];
    let weakest = null, weakestPt = Infinity;
    for (const s of usable) if (sections[s].point < weakestPt) { weakestPt = sections[s].point; weakest = s; }
    if (weakest) reasonsOut.push(`weakest section so far: ${OUTLINE.sections[weakest] || (weakest === 'cars' ? 'CARS' : weakest)} (${est[weakest].n} questions)`);
    const r4 = (x) => Math.round(x * 1e4) / 1e4;
    const carsModeled = usable.indexOf('cars') !== -1;
    return {
      abstained: false, how_sure: how, n: nReviews, cars_modeled: carsModeled,
      point, low, high, sections, reasons: reasonsOut,
      // Parity with desktop _readiness: expose the IRT metadata so the readiness
      // card shows practice-question wording AND practice.js adaptiveOrder can read
      // each section's latent theta to serve the most-informative item first.
      model: 'irt_2pl_eap',
      modeled_sections: usable.slice(),
      scale_note: carsModeled ? 'full 4-section 472-528 composite' : `${usable.length}-section partial of the 472-528 scale; CARS not yet scored`,
      irt: usable.reduce((o, s) => {
        o[s] = { theta: r4(est[s].theta), theta_sd: r4(est[s].theta_sd), information: r4(est[s].information), n: est[s].n };
        return o;
      }, {}),
    };
  }

  // --------------------------------------------------------------------------- //
  // paraphrase test (transfer gap: memory vs application on the same material).
  // transferGap mirrors scoring.transfer_gap (per section); conceptTransferGaps
  // mirrors scoring.concept_transfer_gaps (per concept -- the "fluency illusion"
  // list). A large positive gap means the student recalls the fact but cannot yet
  // use it. Reported only with a memory signal AND enough application items.
  // --------------------------------------------------------------------------- //
  function transferGap(sectionRecall, sectionApp) {
    const out = {};
    for (const s of ['chem_phys', 'bio_biochem', 'psych_soc']) {
      const recall = sectionRecall[s];
      const outs = sectionApp[s] || [];
      if (recall === undefined || recall === null || outs.length < CFG.min_outcomes_transfer) continue;
      const application = outs.reduce((a, b) => a + b, 0) / outs.length;
      const r = clamp(recall, 0, 1);
      const gap = r - application;
      out[s] = {
        section: s, recall: round3(r), application: round3(application),
        gap: round3(gap), n_app: outs.length, fluency_risk: gap >= CFG.fluency_gap_threshold,
      };
    }
    return out;
  }
  // Card-level paraphrase test, per concept: recall vs application accuracy, worst
  // fluency illusion first (gap descending, then concept id). conceptRecall keys the
  // iteration, so a concept with application items but no memory signal is excluded.
  function conceptTransferGaps(conceptRecall, conceptApp, conceptSection) {
    const out = [];
    for (const cid in conceptRecall) {
      const outs = conceptApp[cid] || [];
      if (outs.length < CFG.min_outcomes_transfer_card) continue;
      const application = outs.reduce((a, b) => a + b, 0) / outs.length;
      const r = clamp(conceptRecall[cid], 0, 1);
      const gap = r - application;
      const c = byId[cid.toLowerCase()];
      out.push({
        concept_id: cid, name: (c && c.name) || cid, section: conceptSection[cid] || (c && c.section) || '',
        recall: round3(r), application: round3(application), gap: round3(gap),
        n_app: outs.length, fluency_risk: gap >= CFG.fluency_gap_threshold,
      });
    }
    // worst fluency illusion first, then a stable tiebreak by concept id (matches
    // Python's sort key (-gap, concept_id), using the rounded gap).
    out.sort((x, y) => (y.gap - x.gap) || (x.concept_id < y.concept_id ? -1 : x.concept_id > y.concept_id ? 1 : 0));
    return out;
  }

  function nextTopics(covered, conceptR, top) {
    const items = OUTLINE.concepts.map((c) => {
      const rs = conceptR[c.id] || [];
      const mastery = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
      return {
        concept_id: c.id, name: c.name, section: c.section, weight: c.weight,
        mastery: round3(mastery), covered: covered.has(c.id), priority: round3(c.weight * (1 - mastery)),
        subject: SUBJECT_BY_CONCEPT[c.id] || '',
        topics: (c.aliases || []).slice(0, 4).map((a) => a.replace(/_/g, ' ')),
      };
    });
    items.sort((a, b) => b.priority - a.priority);
    return items.slice(0, top || 6);
  }

  function calibration(pairs) {
    const n = pairs.length;
    if (n < CFG.min_outcomes_calibration) {
      return { abstained: true, how_sure: 'insufficient', n, bins: [] };
    }
    const meanPred = pairs.reduce((s, p) => s + p[0], 0) / n;
    const meanObs = pairs.reduce((s, p) => s + p[1], 0) / n;
    const well = Math.abs(meanPred - meanObs) <= CFG.calibration_well_within;
    const how = n >= 60 ? 'high' : n >= 2 * CFG.min_outcomes_calibration ? 'medium' : 'low';
    return {
      abstained: false, how_sure: how, n,
      mean_predicted: round3(meanPred), mean_observed: round3(meanObs), well_calibrated: well, bins: [],
    };
  }

  function confidenceCalibration(outcomes) {
    const ok = ['guess', 'unsure', 'sure'];
    const labeled = outcomes.filter((o) => ok.includes(o.confidence));
    const n = labeled.length;
    if (n < CFG.min_confidence_items) return { abstained: true, n, levels: [] };
    const by = { guess: [], unsure: [], sure: [] };
    labeled.forEach((o) => by[o.confidence].push(o.correct ? 1 : 0));
    const rate = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
    const levels = [];
    for (const lvl of ok) if (by[lvl].length) levels.push({ level: lvl, n: by[lvl].length, rate: round3(rate(by[lvl])) });
    let insight = 'Your confidence lines up with your results.';
    if (by.sure.length >= 3 && rate(by.sure) < CFG.overconfident_sure_max) {
      insight = `When you felt sure you were right ${Math.round(rate(by.sure) * 100)}%. Slow down on the ones you are sure about.`;
    } else if (by.guess.length >= 3 && rate(by.guess) > CFG.underconfident_guess_min) {
      insight = `You got ${Math.round(rate(by.guess) * 100)}% of your guesses right. Trust your reasoning more, and move faster.`;
    }
    return { abstained: false, n, levels, insight };
  }

  function mistakeTaxonomy(outcomes) {
    const reasons = ['content', 'misread', 'trap', 'time', 'math'];
    const wrong = outcomes.filter((o) => !o.correct && reasons.includes(o.reason));
    const n = wrong.length;
    if (n < CFG.min_mistakes) return { abstained: true, n_wrong: n, items: [] };
    const by = {};
    wrong.forEach((o) => { by[o.reason] = (by[o.reason] || 0) + 1; });
    const items = Object.keys(by).map((r) => ({ reason: r, count: by[r] })).sort((a, b) => b.count - a.count);
    const top = items[0].reason;
    const sec = {};
    wrong.filter((o) => o.reason === top).forEach((o) => { sec[o.section] = (sec[o.section] || 0) + 1; });
    const topSection = Object.keys(sec).sort((a, b) => sec[b] - sec[a])[0] || null;
    return { abstained: false, n_wrong: n, items, top_reason: top, top_section: topSection };
  }

  function studyPlanJS(covered, conceptR) {
    const study = [], practice = [];
    for (const c of OUTLINE.concepts) {
      const rs = conceptR[c.id] || [];
      const recall = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
      if (recall === null || recall < CFG.content_ready_recall) {
        study.push({ concept_id: c.id, name: c.name, section: c.section, recall: recall === null ? null : round3(recall), priority: c.weight * (1 - (recall || 0)) });
      } else {
        practice.push({ concept_id: c.id, name: c.name, section: c.section, recall: round3(recall), priority: c.weight });
      }
    }
    study.sort((a, b) => b.priority - a.priority);
    practice.sort((a, b) => b.priority - a.priority);
    return { study: study.slice(0, 5), practice: practice.slice(0, 5) };
  }

  const SECTION_TIMING = { chem_phys: [59, 95], bio_biochem: [59, 95], psych_soc: [59, 95], cars: [53, 90] };
  function median(xs) {
    const s = xs.slice().sort((a, b) => a - b);
    const n = s.length, m = n >> 1;
    return n % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function pacingCoach(outcomes) {
    const timed = outcomes.filter((o) => o.ms && o.ms > 0);
    if (timed.length < 8) return { abstained: true, n: timed.length, sections: [] };
    const by = {};
    timed.forEach((o) => { (by[o.section] = by[o.section] || []).push(o.ms / 1000); });
    const sections = [];
    for (const s in by) {
      const vals = by[s];
      if (vals.length < 3 || !SECTION_TIMING[s]) continue;
      const med = median(vals);
      const q = SECTION_TIMING[s][0], limit = SECTION_TIMING[s][1] * 60, target = limit / q;
      if (med <= target) {
        sections.push({ section: s, n: vals.length, median_sec: Math.round(med * 10) / 10, target_sec: Math.round(target * 10) / 10, on_pace: true, projected_left: 0, spare_min: Math.round(((limit - med * q) / 60) * 10) / 10 });
      } else {
        sections.push({ section: s, n: vals.length, median_sec: Math.round(med * 10) / 10, target_sec: Math.round(target * 10) / 10, on_pace: false, projected_left: Math.max(0, q - Math.floor(limit / med)), spare_min: 0 });
      }
    }
    if (!sections.length) return { abstained: true, n: timed.length, sections: [] };
    return { abstained: false, n: timed.length, sections, overall_on_pace: sections.every((x) => x.on_pace) };
  }

  function studyPace(raw, reasoningDone, conceptsToPractice, cardsStudied, reasoningToday) {
    const target = CFG.pace_reasoning_target;

// active, describe the projection from how the student actually answered (which
// questions, not just how many) and how settled it is, never naming the model or
// its internals. Otherwise keep the reviews-and-coverage phrasing.
function readinessReason(s, d) {
  if (s.model === 'irt_2pl_eap' && s.irt) {
    let nApp = 0;
    Object.keys(s.irt).forEach((k) => { nApp += (s.irt[k] && s.irt[k].n) || 0; });
    const settle = s.how_sure === 'high' ? 'settled'
      : s.how_sure === 'medium' ? 'still settling'
      : 'still moving a lot';
    return nApp > 0
      ? `${settle} after ${nApp} practice question${nApp === 1 ? '' : 's'}`
      : settle;
  }
  return `based on ${d.n_reviews} reviews`;
}

function readinessCard(s, labels, d) {
  const head = `<div class="card__top"><div class="iconwrap i-${s.abstained ? 'abstain' : 'ready'}">${svg('gauge')}</div>
      <div><div class="card__label">Readiness</div><div class="card__sub">your projected section scores</div></div></div>`;
  if (s.abstained) {
    const items = [];
    if (d.n_reviews < d.thresholds.reviews)
      items.push(`${d.thresholds.reviews} graded reviews (you have ${d.n_reviews})`);
    if (d.coverage < d.thresholds.coverage)
      items.push(`${pct(d.thresholds.coverage)} of the exam covered (you have ${pct(d.coverage)})`);
    if (d.performance.n < d.thresholds.performance_outcomes)
      items.push(`${d.thresholds.performance_outcomes} exam-style practice questions answered (you have ${d.performance.n})`);
    // The gates above can all be met yet readiness still abstains (e.g. no single
    // section has enough answered items yet). Never show an empty "You need:" list.
    if (!items.length) items.push('a bit more exam-style practice, spread across sections');
    return `<div class="card card--abstain">${head}
      <div class="abstain__title">No score yet</div>
      <p class="abstain__lead">You need:</p>${bullets(items)}
      <button class="card__cta" onclick="vpractice.open()">Start practice</button></div>`;
  }
  const subs = Object.entries(s.sections || {}).map(([k, b]) => {
    return `<div class="subrow"><div class="subrow__label">${esc(labels[k] || (k === 'cars' ? 'CARS' : k))}</div>
      <div class="subrow__score"><span class="subrow__val">${Math.round(b.point)}</span><span class="subrow__range">(${Math.round(b.low)}&ndash;${Math.round(b.high)})</span></div></div>`;
  }).join('');
  const reason = readinessReason(s, d);
  return `<div class="card card--ready">${head}
    <div class="subsections">${subs}</div>
    ${meta(s.how_sure, reason)}</div>`;
}

function coverageBlock(d) {
  // Depth-aware, topic-grain coverage: the headline % and the per-section bars are
  // computed from how many AAMC topics actually have cards (falls back to the
  // category number only if the topic field is absent). This is now honest -- the
  // deck hierarchy is mapped to topics -- so "% covered" and "topics left" agree.
  const labels = d.section_labels;
  const bySec = d.topic_coverage_by_section || d.coverage_by_section || {};
  const bars = Object.keys(labels).map((k) => {
    const v = bySec[k] || 0;
    return `<div class="bar bar--${k}"><div class="bar__head"><span>${esc(labels[k])}</span><span>${pct(v)}</span></div>
      <div class="bar__track"><div class="bar__fill" style="width:${Math.round(v * 100)}%"></div></div></div>`;
  }).join('');
  const gaps = (d.topic_gaps || []).map((g) => {
    const w = g.total ? Math.round((g.covered / g.total) * 100) : 0;
    return `<div class="tgap bar--${g.section}">
      <div class="tgap__head"><span class="tgap__name"><b>${esc(g.concept_id)}</b> ${esc(g.name)}</span><span class="tgap__count">${g.covered}/${g.total}</span></div>
      <div class="bar__track"><div class="bar__fill" style="width:${w}%"></div></div></div>`;
  }).join('');
  const gapBlock = gaps
    ? `<div class="tgaps"><div class="tgaps__head">Most topics left to study</div>${gaps}</div>`
    : '';
  const overall = typeof d.topic_coverage === 'number' ? d.topic_coverage : d.coverage;
  return `<div class="coverblock">
    <div class="cover__overall"><span class="cover__num">${pct(overall)}</span><span class="cover__of">of the exam covered</span></div>
    <div class="bars">${bars}</div>${gapBlock}</div>`;
}

function studyRow(key, label, sub, opts) {
  const acts = [];
  if (opts.flashcards) acts.push(`<button class="btn btn--study" onclick="vpy('study:${key}')">${svg('play')} Flashcards</button>`);
  if (opts.cram) acts.push(`<button class="btn btn--ghost" onclick="vpy('cram:${key}')">Study all</button>`);
  if (opts.reason) acts.push(`<button class="btn btn--reason" onclick="vpractice.open('${key}')">${svg('book')} Reasoning</button>`);
  const subHtml = sub ? `<div class="srow__sub">${esc(sub)}</div>` : '';
  return `<div class="srow srow--${key}">
    <div class="srow__meta"><div class="srow__name">${esc(label)}</div>${subHtml}</div>
    <div class="srow__actions">${acts.join('')}</div></div>`;
}

// The place to click into studying: flashcards for the 3 science sections,
// reasoning for all 4 (CARS included), and one interleaved-everything option.
function studyBlock(d) {
  const labels = d.section_labels || {};
  const rows = [];
  rows.push(`<div class="srow srow--all">
    <div class="srow__meta"><div class="srow__name">Interleaved review</div></div>
    <div class="srow__actions"><button class="btn btn--study" onclick="vpy('study:interleave')">${svg('layers')} Start mixed review</button></div></div>`);
  Object.keys(labels).forEach((k) => {
    rows.push(studyRow(k, labels[k], '', { flashcards: true, cram: true, reason: true }));
  });
  rows.push(studyRow('cars', 'CARS', '', { flashcards: false, reason: true }));
  return `<section class="section">
    <div class="section__head"><div class="section__title section__title--group">Study &amp; practice</div></div>
    <div class="studygrid">${rows.join('')}</div>
  </section>`;
}

function bookBrand(d) {
  return d && d.book_set && BOOK_SETS[d.book_set] ? d.book_set : 'kaplan';
}
// Khan Academy has no public deep-link API, but its search reliably resolves a
// concept keyword to the right lesson(s). We link each focus topic to a search
// for that exact term, so "Study this next" points at real lessons, not a
// generic landing page. Encode ' too (encodeURIComponent leaves it) so the URL
// is safe inside the single-quoted onclick handler.
const KHAN_SEARCH = 'https://www.khanacademy.org/search?page_search_query=';
function khanQuery(q) {
  return encodeURIComponent(String(q)).replace(/'/g, '%27');
}
function khanClick(q) {
  return `vpy('open:${KHAN_SEARCH}${khanQuery(q)}');return false`;
}

let nextIdx = 0;

function nextList(d) {
  if (d.next_topics && d.next_topics.length) return d.next_topics;
  return d.best_next ? [d.best_next] : [];
}

// One ranked topic at a time, with prev/next paging through the rest.
function renderNextTopic(d) {
  const list = nextList(d);
  if (!list.length) return '<div class="deco"></div><div class="nextblock__eyebrow">Study this next</div><div class="nextblock__title">All caught up</div>';
  if (nextIdx >= list.length) nextIdx = 0;
  const bn = list[nextIdx];
  const total = list.length;
  const state = bn.covered ? `${pct(bn.mastery)} recalled` : 'not studied yet';
  const subject = bn.subject || '';
  const brandKey = bookBrand(d);
  const book = subject ? BOOK_SETS[brandKey].books[subject] || '' : '';
  const byBook = CHAPTER_BY_BOOK[bn.concept_id] || {};
  const chapter = byBook[brandKey] || CHAPTER_TOPIC[bn.concept_id] || (bn.topics && bn.topics[0]) || '';
  const unit = brandKey === 'ek' ? 'lecture' : 'chapter'; // Examkrackers numbers "lectures"
  const picker = `<select class="bookpick" aria-label="Your MCAT book set" onchange="vbook(this.value)">${Object.keys(
    BOOK_SETS,
  )
    .map((k) => `<option value="${k}"${k === brandKey ? ' selected' : ''}>${esc(BOOK_SETS[k].label)}</option>`)
    .join('')}</select>`;
  const readRow = book
    ? `<div class="where__row where__row--book"><span class="where__k">Read</span><span class="where__val">
         <span class="where__book">${esc(book)}</span>
         ${chapter ? `<span class="where__chapter">${esc(chapter)} ${unit}</span>` : ''}</span>${picker}</div>`
    : '';
  const topicList = bn.topics && bn.topics.length ? bn.topics : [];
  const topicLinks = topicList
    .map((t) => `<a href="#" onclick="${khanClick(t)}">${esc(t)}</a>`)
    .join('<span class="where__sep">&middot;</span>');
  const focusRow = topicLinks
    ? `<div class="where__row"><span class="where__k">Focus on</span><span class="where__val">
         <span class="where__links">${topicLinks}</span>
         <span class="where__cap">Each opens a free Khan Academy lesson</span></span></div>`
    : '';
  const where = subject ? `<div class="nextblock__where">
      ${readRow}
      ${focusRow}
    </div>` : '';
  const pager = total > 1 ? `<div class="nextpager">
      <button class="nextnav" ${nextIdx === 0 ? 'disabled' : ''} onclick="vnext(-1)" aria-label="Previous topic">${svg('back')}</button>
      <span class="nextpager__count">${nextIdx + 1} of ${total}</span>
      <button class="nextnav" ${nextIdx === total - 1 ? 'disabled' : ''} onclick="vnext(1)" aria-label="Next topic">${svg('fwd')}</button>
    </div>` : '';
  return `<div class="deco"></div>
    <div class="nextblock__head"><div class="nextblock__eyebrow">Study this next</div>${pager}</div>
    <div class="nextblock__title">${esc(bn.name)}</div>
    <div class="nextblock__meta">
      <span class="tag tag--accent">${esc((d.section_labels && d.section_labels[bn.section]) || bn.section)}</span>
      <span class="tag">${esc(state)}</span>
      ${bn.topics_total ? `<span class="tag">${bn.topics_covered}/${bn.topics_total} topics studied</span>` : ''}
    </div>
    ${where}`;
}

function nextBlock(d) {
  nextIdx = 0;
  return `<div class="nextblock" id="nextblock">${renderNextTopic(d)}</div>`;
}

window.vnext = function (dir) {
  const d = window.__VANTAGE__ || (window.__VANTAGE_LIVE__ ? null : MOCK);
  if (!d) return;
  const list = nextList(d);
  nextIdx = Math.max(0, Math.min(list.length - 1, nextIdx + dir));
  const el = document.getElementById('nextblock');
  if (el) el.innerHTML = renderNextTopic(d);
};

// Switch the student's book set. Update the display in place (keeping the paged
// topic) and persist the choice; the host stores it without forcing a reload.
window.vbook = function (brand) {
  const d = window.__VANTAGE__ || (window.__VANTAGE_LIVE__ ? null : MOCK);
  if (!d) return;
  d.book_set = brand;
  const el = document.getElementById('nextblock');
  if (el) el.innerHTML = renderNextTopic(d);
  if (window.pycmd) vpy('bookset:' + brand);
};

function planItem(num, label, hint) {
  return `<div class="plan__item"><div class="plan__num">${num}</div>
    <div class="plan__lbl">${esc(label)}<span class="plan__hint">${esc(hint)}</span></div></div>`;
}

// Countdown to the exam plus a transparent daily target (a stated heuristic).
function planBlock(d) {
  const p = d.study_pace;
  if (!p) return '';
  const input = `<input class="datein" type="date" value="${esc(p.exam_date || '')}" oninput="vpy('examdatesave:' + this.value)" onchange="vpy('examdate:' + this.value)">`;
  if (!p.has_exam_date || p.passed) {
    const msg = p.message || 'Set your exam date to get a daily study target.';
    return `<section class="section"><div class="plancard plancard--set">
      <div class="plan__eyebrow">Exam countdown</div>
      <div class="plan__setrow"><div class="plan__title">${esc(msg)}</div><div>${input}</div></div>
    </div></section>`;
  }
  const dayWord = p.days_left === 1 ? 'day' : 'days';
  const s = (n) => (n === 1 ? '' : 's');
  const dl = p.days_left && p.days_left > 0 ? p.days_left : 1;
  // Pace scales with how close the exam is: the same work spread over fewer days
  // means more per day. When it works out to less than one a day, show a weekly
  // cadence so the number still moves as you change the date.
  const pace = (remaining, noun, hint) => {
    const rate = remaining / dl;
    if (rate >= 1) {
      const n = Math.ceil(rate);
      return planItem(n, `${noun}${s(n)} a day`, hint);
    }
    const n = Math.max(1, Math.ceil(rate * 7));
    return planItem(n, `${noun}${s(n)} a week`, hint);
  };
  const flash = p.flashcards_per_day || p.reviews_due;
  const flashHint = flash > p.reviews_due ? 'to get through your deck by exam day' : 'chosen for you today';
  const items = [planItem(flash, `flashcard${s(flash)} to study today`, flashHint)];
  if (p.new_remaining > 0) items.push(pace(p.new_remaining, 'new card', `${p.new_remaining} new cards left`));
  // Reasoning is a real daily study goal (a few a day, more as the exam nears),
  // so show the backend's per-day number, not a countdown to the confidence bar.
  if (p.reasoning_per_day > 0) {
    const n = p.reasoning_per_day;
    const hint = p.reasoning_remaining > 0 ? `${p.reasoning_remaining} more to a confident score` : 'keeps your score sharp';
    items.push(planItem(n, `reasoning question${s(n)} a day`, hint));
  }
  // Cumulative "before exam day" totals: unlike the per-day numbers (flashcards =
  // today's FSRS-due count, reasoning floored at a few a day), these scale with the
  // exam date, so pushing the date out visibly leaves more to do.
  const fmt = (n) => (n || 0).toLocaleString();
  const leftBits = [];
  if (p.flashcards_to_exam > 0)
    leftBits.push(`<b>${fmt(p.flashcards_to_exam)}</b> flashcard review${s(p.flashcards_to_exam)}`);
  if (p.reasoning_to_exam > 0)
    leftBits.push(`<b>${fmt(p.reasoning_to_exam)}</b> reasoning question${s(p.reasoning_to_exam)}`);
  const leftNote = leftBits.length
    ? `<div class="plan__note plan__note--left">About ${leftBits.join(' and ')} between now and exam day at this pace.</div>`
    : '';
  return `<section class="section"><div class="plancard">
    <div class="plan__eyebrow">Exam countdown</div>
    <div class="plan__count"><span class="plan__days">${p.days_left}</span> ${dayWord} until your MCAT</div>
    <div class="plan__daterow">${input}</div>
    <div class="plan__grid">${items.join('')}</div>
    ${leftNote}
  </div></section>`;
}

// Compares recall (what you remember) with accuracy on real questions. A gap
// means recognizing an answer is not the same as reasoning to it. Student-facing:
// no model or statistics terms, just the two numbers and what they mean.
function calibrationBlock(d) {
  const c = d.calibration;
  if (!c) return '';
  const head = '<div class="section__head"><div class="section__title">Memory vs. real performance</div></div>';
  if (c.abstained) {
    return `<section class="section">${head}
      <div class="coverblock">
        <div class="abstain__title">Not enough practice yet</div>
        <p class="abstain__lead">Answer a few more practice questions to see whether what you remember holds up on new questions.</p>
      </div></section>`;
  }
  const ok = c.well_calibrated;
  const verdict = ok
    ? 'What you remember lines up with how you do on questions.'
    : 'You remember more than you can use on new questions yet.';
  const fromMem = Math.round(c.mean_predicted * 100);
  const onReal = Math.round(c.mean_observed * 100);
  return `<section class="section">${head}
    <div class="coverblock">
      <div class="calibsummary calibverdict--${ok ? 'ok' : 'off'}"><b>${verdict}</b></div>
      <div class="calib">
        <div class="calibbar"><span class="calibbar__k">From memory</span><div class="calibbar__track"><div class="calibbar__fill calibbar__fill--pred" style="width:${fromMem}%"></div></div><span class="calibbar__v">${fromMem}%</span></div>
        <div class="calibbar"><span class="calibbar__k">On real questions</span><div class="calibbar__track"><div class="calibbar__fill calibbar__fill--obs" style="width:${onReal}%"></div></div><span class="calibbar__v">${onReal}%</span></div>
      </div>
      ${meta(c.how_sure, 'based on ' + c.n + ' questions')}
    </div></section>`;
}

// The fluency illusion, concept by concept: topics recalled well on cards but
// missed once the question is reworded. The app's core thesis, made specific.
// The scoring layer lists a concept only after enough real answers and puts the
// widest gap first, so an empty list is honest silence, not a blank slate.
function fluencyPanel(d) {
  const items = d.fluency_items || [];
  const head = '<div class="section__head"><div class="section__title">Recall vs. using it</div></div>';
  const risks = items.filter((x) => x.fluency_risk);
  if (!risks.length) {
    const lead = items.length
      ? 'On the concepts you have practiced, your recall and your answers line up. Nothing to flag here.'
      : 'Answer a few reworded questions on concepts you have studied. Any recall you cannot yet apply will show up here.';
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">No recall gaps to flag</div>
      <p class="abstain__lead">${lead}</p>
    </div></section>`;
  }
  const rows = risks.slice(0, 5).map((x) => {
    const name = x.name || x.concept_id;
    const label = (d.section_labels && d.section_labels[x.section]) || x.section || '';
    const rec = Math.round(x.recall * 100);
    const app = Math.round(x.application * 100);
    return `<div class="flurow">
      <div class="flurow__head"><span class="flurow__name">${esc(name)}</span>${label ? `<span class="fluchip">${esc(label)}</span>` : ''}</div>
      <div class="flubar"><span class="flubar__k">Recall</span><div class="flubar__track"><div class="flubar__fill flubar__fill--rec" style="width:${rec}%"></div></div><span class="flubar__v">${rec}%</span></div>
      <div class="flubar"><span class="flubar__k">On questions</span><div class="flubar__track"><div class="flubar__fill flubar__fill--app" style="width:${app}%"></div></div><span class="flubar__v">${app}%</span></div>
    </div>`;
  }).join('');
  const n = risks.length;
  return `<section class="section">${head}<div class="coverblock">
    <div class="calibsummary"><b>You recall these well but miss them when the wording changes.</b> Practice them as questions, not just cards.</div>
    <div class="flulist">${rows}</div>
    <div class="cover" style="margin-top:0.85rem">${n === 1 ? '1 concept' : n + ' concepts'} where recall runs ahead of what you can apply</div>
  </div></section>`;
}

const CONF_LABELS = { guess: 'Guessing', unsure: 'Unsure', sure: 'Sure' };
const CONF_ORDER = { guess: 0, unsure: 1, sure: 2 };
const MISS_LABELS = { content: 'Content gap', misread: 'Misread the question', trap: 'Trap answer', time: 'Rushed the reasoning', math: 'Arithmetic slip' };

// Metacognition: did feeling sure line up with being right?
function confidencePanel(d) {
  const c = d.confidence;
  if (!c) return '';
  const head = '<div class="section__head"><div class="section__title">Confidence check</div></div>';
  if (c.abstained) {
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">Not enough answers yet</div>
      <p class="abstain__lead">Mark how sure you are on each practice question. After a few, you'll see whether your confidence matches your results.</p>
    </div></section>`;
  }
  const rows = (c.levels || []).slice().sort((a, b) => CONF_ORDER[a.level] - CONF_ORDER[b.level]).map((l) => `<div class="calibbar">
      <span class="calibbar__k">${CONF_LABELS[l.level] || l.level} (${l.n})</span>
      <div class="calibbar__track"><div class="calibbar__fill calibbar__fill--obs" style="width:${Math.round(l.rate * 100)}%"></div></div>
      <span class="calibbar__v">${pct(l.rate)}</span></div>`).join('');
  return `<section class="section">${head}<div class="coverblock">
    <div class="calibsummary"><b>${esc(c.insight)}</b></div>
    <div class="calib">${rows}</div>
    <div class="cover" style="margin-top:0.85rem">based on ${c.n} answers</div>
  </div></section>`;
}

// Diagnosis: which failure mode costs the most points, and where.
function mistakesPanel(d) {
  const m = d.mistakes;
  if (!m) return '';
  const head = '<div class="section__head"><div class="section__title">How you lose points</div></div>';
  if (m.abstained) {
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">Not enough misses to diagnose</div>
      <p class="abstain__lead">When you miss a question, tag why. You'll see which kind of mistake costs you the most points.</p>
    </div></section>`;
  }
  const max = Math.max(...(m.items || []).map((x) => x.count), 1);
  const rows = (m.items || []).map((x) => `<div class="calibbar">
      <span class="calibbar__k">${esc(MISS_LABELS[x.reason] || x.reason)}</span>
      <div class="calibbar__track"><div class="calibbar__fill calibbar__fill--pred" style="width:${Math.round((x.count / max) * 100)}%"></div></div>
      <span class="calibbar__v">${x.count}</span></div>`).join('');
  const secLabel = (d.section_labels && d.section_labels[m.top_section]) || m.top_section || '';
  const topLabel = (MISS_LABELS[m.top_reason] || m.top_reason || '').toLowerCase();
  const lead = m.top_reason ? `Most points lost to <b>${esc(topLabel)}</b>${secLabel ? ', mostly in ' + esc(secLabel) : ''}.` : '';
  return `<section class="section">${head}<div class="coverblock">
    <div class="calibsummary">${lead}</div>
    <div class="calib">${rows}</div>
    <div class="cover" style="margin-top:0.85rem">based on ${m.n_wrong} missed questions</div>
  </div></section>`;
}

// Content before transfer: learn on flashcards first, then practice reasoning.
function planPanel(d) {
  const p = d.study_plan;
  if (!p || (!(p.study || []).length && !(p.practice || []).length)) return '';
  const chips = (list, empty) => (list && list.length ? list.slice(0, 5).map((x) => `<span class="planchip">${esc(x.name)}</span>`).join('') : `<span class="planempty">${empty}</span>`);
  return `<section class="section">
    <div class="section__head"><div class="section__title section__title--group">Where to focus</div></div>
    <div class="plansplit">
      <div class="plancol"><div class="plancol__h">Study these</div><div class="planchips">${chips(p.study, 'nothing pressing')}</div></div>
      <div class="plancol plancol--ready"><div class="plancol__h">Ready to practice</div><div class="planchips">${chips(p.practice, 'study a bit more first')}</div></div>
    </div>
  </section>`;
}

// Pace-to-finish: your median time per question vs the real section budget.
function pacingPanel(d) {
  const p = d.pacing;
  if (!p) return '';
  const head = '<div class="section__head"><div class="section__title">Pacing</div></div>';
  if (p.abstained) {
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">Not enough timed questions yet</div>
      <p class="abstain__lead">Each practice question is timed. After a few, you'll see whether you'd finish each section before time runs out.</p>
    </div></section>`;
  }
  const rows = (p.sections || []).map((s) => {
    const label = (d.section_labels && d.section_labels[s.section]) || (s.section === 'cars' ? 'CARS' : s.section);
    const verdict = s.on_pace ? `finishes with ${s.spare_min} min to spare` : `runs out with ${s.projected_left} unanswered`;
    return `<div class="pacerow">
      <div class="pacerow__sec">${esc(label)}</div>
      <div class="pacerow__nums"><span class="pacerow__you pacerow__you--${s.on_pace ? 'ok' : 'off'}">${Math.round(s.median_sec)}s</span><span class="pacerow__t"> / ${Math.round(s.target_sec)}s budget</span></div>
      <div class="pacerow__verdict pacerow__verdict--${s.on_pace ? 'ok' : 'off'}">${esc(verdict)}</div>
    </div>`;
  }).join('');
  const lead = p.overall_on_pace ? 'You are finishing sections in time.' : 'At this pace you would not finish every section.';
  return `<section class="section">${head}<div class="coverblock">
    <div class="calibsummary"><b>${lead}</b></div>
    <div class="pacelist">${rows}</div>
    <div class="cover" style="margin-top:0.85rem">your typical time per question vs each section's time budget</div>
  </div></section>`;
}

// Project the readiness composite to exam day at your current rate of improvement.
function trajectoryPanel(d) {
  const t = d.trajectory;
  if (!t) return '';
  // Label sits INSIDE the card as an eyebrow (like the Exam countdown) so the two
  // outlook cards line up at the top instead of an outside title pushing this down.
  const eyebrow = '<div class="plan__eyebrow" style="margin-bottom:0.85rem">Score trajectory</div>';
  // The target lives on the scale of the sections you're currently modeling: the 3
  // science sections (354-396), or the full 472-528 once you've practiced CARS.
  const lo = t.scale_lo || 354;
  const hi = t.scale_hi || 396;
  const input = `<input class="targetin" type="number" min="${lo}" max="${hi}" placeholder="target" value="${t.target || ''}" oninput="vpy('targetsave:' + this.value)" onchange="vpy('target:' + this.value)">`;
  if (t.abstained) {
    return `<section class="section"><div class="coverblock">${eyebrow}
      <div class="plan__setrow"><div class="plan__title">${esc(t.reason || 'Set a target score and an exam date.')}</div><div>Target (${lo}\u2013${hi}): ${input}</div></div>
    </div></section>`;
  }
  const secName = t.weakest_section === 'cars' ? 'CARS' : ((d.section_labels && d.section_labels[t.weakest_section]) || t.weakest_section || '');
  const verdict = t.on_pace ? 'On pace to hit your target.' : `Behind your target${secName ? ', focus on ' + esc(secName) : ''}.`;
  const wk = (t.per_week > 0 ? '+' : '') + t.per_week;
  return `<section class="section"><div class="coverblock">${eyebrow}
    <div class="calibsummary calibverdict--${t.on_pace ? 'ok' : 'off'}"><b>${verdict}</b></div>
    <div class="trajstats">
      <div class="trajstat"><span class="trajstat__num">${t.projected}</span><span class="trajstat__lbl">projected by exam day</span></div>
      <div class="trajstat"><span class="trajstat__num">${t.target}</span><span class="trajstat__lbl">your target</span></div>
      <div class="trajstat"><span class="trajstat__num">${wk}</span><span class="trajstat__lbl">points per week</span></div>
    </div>
    <div class="cover" style="margin-top:0.85rem">Change target (${lo}\u2013${hi}): ${input}</div>
  </div></section>`;
}
