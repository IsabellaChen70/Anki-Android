function bookBrand(d) {
  return d && d.book_set && BOOK_SETS[d.book_set] ? d.book_set : 'kaplan';
}
// Khan Academy has no public deep-link API, but its search reliably resolves a
// concept keyword to the right lesson(s). We link each focus topic to a search
// for that exact term, so "Study this next" points at real lessons, not a
// generic landing page. Encode ' too (encodeURIComponent leaves it) so the URL
// is safe inside the single-quoted onclick handler.
const KHAN_SEARCH = 'https://www.khanacademy.org/search?page_search_query=';
function khanQuery(q) {
  return encodeURIComponent(String(q)).replace(/'/g, '%27');
}
function khanClick(q) {
  return `vpy('open:${KHAN_SEARCH}${khanQuery(q)}');return false`;
}

let nextIdx = 0;
// How many topics show before the "see all" toggle: enough to read the near-term
// queue at a glance without listing everything at once. The rest are one tap away.
const NEXT_SHOWN = 4;
let nextShowAll = false;

function nextList(d) {
  if (d.next_topics && d.next_topics.length) return d.next_topics;
  return d.best_next ? [d.best_next] : [];
}

// Where to study the open topic: the student's own book and chapter (with the
// book-set picker) plus per-topic Khan Academy lesson links. Same data and the
// same handlers (vbook, khanClick) as before, now housed inside the open row.
function nextWhere(d, bn) {
  const subject = bn.subject || '';
  if (!subject) return '';
  const brandKey = bookBrand(d);
  const book = BOOK_SETS[brandKey].books[subject] || '';
  const byBook = CHAPTER_BY_BOOK[bn.concept_id] || {};
  const chapter = byBook[brandKey] || CHAPTER_TOPIC[bn.concept_id] || (bn.topics && bn.topics[0]) || '';
  const unit = brandKey === 'ek' ? 'lecture' : 'chapter'; // Examkrackers numbers "lectures"
  const picker = `<select class="bookpick" aria-label="Your MCAT book set" onchange="vbook(this.value)">${Object.keys(
    BOOK_SETS,
  )
    .map((k) => `<option value="${k}"${k === brandKey ? ' selected' : ''}>${esc(BOOK_SETS[k].label)}</option>`)
    .join('')}</select>`;
  const readRow = book
    ? `<div class="where__row where__row--book"><span class="where__k">Read</span><span class="where__val">
         <span class="where__book">${esc(book)}</span>
         ${chapter ? `<span class="where__chapter">${esc(chapter)} ${unit}</span>` : ''}</span>${picker}</div>`
    : '';
  const topicList = bn.topics && bn.topics.length ? bn.topics : [];
  const topicLinks = topicList
    .map((t) => `<a href="#" onclick="${khanClick(t)}">${esc(t)}</a>`)
    .join('<span class="where__sep">&middot;</span>');
  const focusRow = topicLinks
    ? `<div class="where__row"><span class="where__k">Focus on</span><span class="where__val">
         <span class="where__links">${topicLinks}</span>
         <span class="where__cap">Each opens a free Khan Academy lesson</span></span></div>`
    : '';
  if (!readRow && !focusRow) return '';
  return `<div class="nextblock__where">${readRow}${focusRow}</div>`;
}

// One topic in the queue: rank, name, section, and how well studied so far. The
// open row (accordion) also carries the where-to-study detail below its header.
function nextRow(d, bn, idx, open) {
  const labels = d.section_labels || {};
  const state = bn.covered ? `${pct(bn.mastery)} recalled` : 'not studied yet';
  const secLabel = labels[bn.section] || bn.section || '';
  const topicsTag = bn.topics_total
    ? `<span class="nextrow__count">${bn.topics_covered}/${bn.topics_total} topics</span>` : '';
  return `<div class="nextrow nextrow--${esc(bn.section)}${open ? ' nextrow--open' : ''}">
    <button class="nextrow__head" onclick="vpick(${idx})" aria-expanded="${open ? 'true' : 'false'}">
      <span class="nextrow__rank">${idx + 1}</span>
      <span class="nextrow__body">
        <span class="nextrow__name">${esc(bn.name)}</span>
        <span class="nextrow__meta"><span class="nextrow__sec">${esc(secLabel)}</span><span class="nextrow__state">${esc(state)}</span>${topicsTag}</span>
      </span>
      <span class="nextrow__chev">${svg('fwd')}</span>
    </button>
    ${open ? nextWhere(d, bn) : ''}
  </div>`;
}

// The near-term study queue: the backend's ranked topics as a compact stack, so
// the next few priorities read at a glance instead of one page at a time. The
// order and the topics are the backend's, untouched; this only lays them out.
function renderNextInner(d) {
  const list = nextList(d);
  if (!list.length) {
    return '<div class="deco"></div><div class="nextblock__eyebrow">Study this next</div><div class="nextblock__title nextblock__title--empty">All caught up</div>';
  }
  if (nextIdx >= list.length) nextIdx = 0;
  const total = list.length;
  const showAll = nextShowAll || total <= NEXT_SHOWN;
  const visible = showAll ? list : list.slice(0, NEXT_SHOWN);
  const count = total > 1 ? `<span class="nextblock__count">${total} topics</span>` : '';
  const rows = visible.map((bn, i) => nextRow(d, bn, i, i === nextIdx)).join('');
  const more = total > NEXT_SHOWN
    ? `<button class="nextmore" onclick="vmore()">${showAll ? 'Show fewer' : `See all ${total} topics`}</button>`
    : '';
  return `<div class="deco"></div>
    <div class="nextblock__head"><div class="nextblock__eyebrow">Study this next</div>${count}</div>
    <div class="nextstack">${rows}</div>${more}`;
}

function nextBlock(d) {
  nextIdx = 0;
  nextShowAll = false;
  return `<div class="nextblock" id="nextblock">${renderNextInner(d)}</div>`;
}

// Toggle the full queue vs the first few. Keeps the open row visible when
// collapsing back so the where-to-study detail never hides itself.
window.vmore = function () {
  const d = window.__VANTAGE__ || (window.__VANTAGE_LIVE__ ? null : MOCK);
  if (!d) return;
  nextShowAll = !nextShowAll;
  if (!nextShowAll && nextIdx >= NEXT_SHOWN) nextIdx = 0;
  const el = document.getElementById('nextblock');
  if (el) el.innerHTML = renderNextInner(d);
};

// Open a topic in the queue. Accordion: exactly one row open at a time, with its
// where-to-study detail underneath. Re-renders in place so the rest is untouched.
window.vpick = function (idx) {
  const d = window.__VANTAGE__ || (window.__VANTAGE_LIVE__ ? null : MOCK);
  if (!d) return;
  const list = nextList(d);
  if (idx < 0 || idx >= list.length) return;
  nextIdx = idx;
  const el = document.getElementById('nextblock');
  if (el) el.innerHTML = renderNextInner(d);
};

// Switch the student's book set. Update the display in place (keeping the open
// topic) and persist the choice; the host stores it without forcing a reload.
window.vbook = function (brand) {
  const d = window.__VANTAGE__ || (window.__VANTAGE_LIVE__ ? null : MOCK);
  if (!d) return;
  d.book_set = brand;
  const el = document.getElementById('nextblock');
  if (el) el.innerHTML = renderNextInner(d);
  if (window.pycmd) vpy('bookset:' + brand);
};

function planItem(num, label, hint) {
  return `<div class="plan__item"><div class="plan__num">${num}</div>
    <div class="plan__lbl">${esc(label)}<span class="plan__hint">${esc(hint)}</span></div></div>`;
}

// Countdown to the exam plus a transparent daily target (a stated heuristic).
function planBlock(d) {
  const p = d.study_pace;
  if (!p) return '';
  const input = `<input class="datein" type="date" value="${esc(p.exam_date || '')}" oninput="vpy('examdatesave:' + this.value)" onchange="vpy('examdate:' + this.value)">`;
  if (!p.has_exam_date || p.passed) {
    const msg = p.message || 'Set your exam date to get a daily study target.';
    return `<section class="section"><div class="plancard plancard--set">
      <div class="plan__eyebrow">Exam countdown</div>
      <div class="plan__setrow"><div class="plan__title">${esc(msg)}</div><div>${input}</div></div>
    </div></section>`;
  }
  const dayWord = p.days_left === 1 ? 'day' : 'days';
  const s = (n) => (n === 1 ? '' : 's');
  const dl = p.days_left && p.days_left > 0 ? p.days_left : 1;
  // Pace scales with how close the exam is: the same work spread over fewer days
  // means more per day. When it works out to less than one a day, show a weekly
  // cadence so the number still moves as you change the date.
  const pace = (remaining, noun, hint) => {
    const rate = remaining / dl;
    if (rate >= 1) {
      const n = Math.ceil(rate);
      return planItem(n, `${noun}${s(n)} a day`, hint);
    }
    const n = Math.max(1, Math.ceil(rate * 7));
    return planItem(n, `${noun}${s(n)} a week`, hint);
  };
  const flash = p.flashcards_per_day || p.reviews_due;
  const flashHint = flash > p.reviews_due ? 'to get through your deck by exam day' : 'chosen for you today';
  const items = [planItem(flash, `flashcard${s(flash)} to study today`, flashHint)];
  if (p.new_remaining > 0) items.push(pace(p.new_remaining, 'new card', `${p.new_remaining} new cards left`));
  // Reasoning is a real daily study goal (a few a day, more as the exam nears),
  // so show the backend's per-day number, not a countdown to the confidence bar.
  if (p.reasoning_per_day > 0) {
    const n = p.reasoning_per_day;
    const hint = p.reasoning_remaining > 0 ? `${p.reasoning_remaining} more to a confident score` : 'keeps your score sharp';
    items.push(planItem(n, `reasoning question${s(n)} a day`, hint));
  }
  return `<section class="section"><div class="plancard">
    <div class="plan__eyebrow">Exam countdown</div>
    <div class="plan__count"><span class="plan__days">${p.days_left}</span> ${dayWord} until your MCAT</div>
    <div class="plan__daterow">${input}</div>
    <div class="plan__grid">${items.join('')}</div>
  </div></section>`;
}

// Compares recall (what you remember) with accuracy on real questions. A gap
// means recognizing an answer is not the same as reasoning to it. Student-facing:
// no model or statistics terms, just the two numbers and what they mean.
function calibrationBlock(d) {
  const c = d.calibration;
  if (!c) return '';
  const head = '<div class="section__head"><div class="section__title">Memory vs. real performance</div></div>';
  if (c.abstained) {
    return `<section class="section">${head}
      <div class="coverblock">
        <div class="abstain__title">Not enough practice yet</div>
        <p class="abstain__lead">Answer a few more practice questions to see whether what you remember holds up on new questions.</p>
      </div></section>`;
  }
  const ok = c.well_calibrated;
  const verdict = ok
    ? 'What you remember lines up with how you do on questions.'
    : 'You remember more than you can use on new questions yet.';
  const fromMem = Math.round(c.mean_predicted * 100);
  const onReal = Math.round(c.mean_observed * 100);
  return `<section class="section">${head}
    <div class="coverblock">
      <div class="calibsummary calibverdict--${ok ? 'ok' : 'off'}"><b>${verdict}</b></div>
      <div class="calib">
        <div class="calibbar"><span class="calibbar__k">From memory</span><div class="calibbar__track"><div class="calibbar__fill calibbar__fill--pred" style="width:${fromMem}%"></div></div><span class="calibbar__v">${fromMem}%</span></div>
        <div class="calibbar"><span class="calibbar__k">On real questions</span><div class="calibbar__track"><div class="calibbar__fill calibbar__fill--obs" style="width:${onReal}%"></div></div><span class="calibbar__v">${onReal}%</span></div>
      </div>
      ${meta(c.how_sure, 'based on ' + c.n + ' questions')}
    </div></section>`;
}

// The fluency illusion, concept by concept: topics recalled well on cards but
// missed once the question is reworded. The app's core thesis, made specific.
// The scoring layer lists a concept only after enough real answers and puts the
// widest gap first, so an empty list is honest silence, not a blank slate.
function fluencyPanel(d) {
  const items = d.fluency_items || [];
  const head = '<div class="section__head"><div class="section__title">Recall vs. using it</div></div>';
  const risks = items.filter((x) => x.fluency_risk);
  if (!risks.length) {
    const lead = items.length
      ? 'On the concepts you have practiced, your recall and your answers line up. Nothing to flag here.'
      : 'Answer a few reworded questions on concepts you have studied. Any recall you cannot yet apply will show up here.';
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">No recall gaps to flag</div>
      <p class="abstain__lead">${lead}</p>
    </div></section>`;
  }
  const rows = risks.slice(0, 5).map((x) => {
    const name = x.name || x.concept_id;
    const label = (d.section_labels && d.section_labels[x.section]) || x.section || '';
    const rec = Math.round(x.recall * 100);
    const app = Math.round(x.application * 100);
    return `<div class="flurow">
      <div class="flurow__head"><span class="flurow__name">${esc(name)}</span>${label ? `<span class="fluchip">${esc(label)}</span>` : ''}</div>
      <div class="flubar"><span class="flubar__k">Recall</span><div class="flubar__track"><div class="flubar__fill flubar__fill--rec" style="width:${rec}%"></div></div><span class="flubar__v">${rec}%</span></div>
      <div class="flubar"><span class="flubar__k">On questions</span><div class="flubar__track"><div class="flubar__fill flubar__fill--app" style="width:${app}%"></div></div><span class="flubar__v">${app}%</span></div>
    </div>`;
  }).join('');
  const n = risks.length;
  return `<section class="section">${head}<div class="coverblock">
    <div class="calibsummary"><b>You recall these well but miss them when the wording changes.</b> Practice them as questions, not just cards.</div>
    <div class="flulist">${rows}</div>
    <div class="cover" style="margin-top:0.85rem">${n === 1 ? '1 concept' : n + ' concepts'} where recall runs ahead of what you can apply</div>
  </div></section>`;
}

const CONF_LABELS = { guess: 'Guessing', unsure: 'Unsure', sure: 'Sure' };
const CONF_ORDER = { guess: 0, unsure: 1, sure: 2 };
const MISS_LABELS = { content: 'Content gap', misread: 'Misread the question', trap: 'Trap answer', time: 'Rushed the reasoning', math: 'Arithmetic slip' };
// The AAMC reasoning skills, in plain words: the second axis of a miss (what the
// question tested), alongside the cause above (why the point was lost).
const SKILL_LABELS = { concepts: 'Applying concepts', reasoning: 'Scientific reasoning', research: 'Experiment design', data: 'Evaluating data' };

// Metacognition: did feeling sure line up with being right?
function confidencePanel(d) {
  const c = d.confidence;
  if (!c) return '';
  const head = '<div class="section__head"><div class="section__title">Confidence check</div></div>';
  if (c.abstained) {
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">Not enough answers yet</div>
      <p class="abstain__lead">Mark how sure you are on each practice question. After a few, you'll see whether your confidence matches your results.</p>
    </div></section>`;
  }
  const rows = (c.levels || []).slice().sort((a, b) => CONF_ORDER[a.level] - CONF_ORDER[b.level]).map((l) => `<div class="calibbar">
      <span class="calibbar__k">${CONF_LABELS[l.level] || l.level} (${l.n})</span>
      <div class="calibbar__track"><div class="calibbar__fill calibbar__fill--obs" style="width:${Math.round(l.rate * 100)}%"></div></div>
      <span class="calibbar__v">${pct(l.rate)}</span></div>`).join('');
  return `<section class="section">${head}<div class="coverblock">
    <div class="calibsummary"><b>${esc(c.insight)}</b></div>
    <div class="calib">${rows}</div>
    <div class="cover" style="margin-top:0.85rem">based on ${c.n} answers</div>
  </div></section>`;
}

// One labelled bar group for a miss axis (cause or skill). `items` is the
// serialized [{<key>, count}] list; `labels` maps the key to plain words; `fill`
// is the bar color class. Shared so both axes render identically.
function missBars(items, keyName, labels, fill) {
  const list = items || [];
  const max = Math.max(...list.map((x) => x.count), 1);
  return list.map((x) => `<div class="calibbar">
      <span class="calibbar__k">${esc(labels[x[keyName]] || x[keyName])}</span>
      <div class="calibbar__track"><div class="calibbar__fill ${fill}" style="width:${Math.round((x.count / max) * 100)}%"></div></div>
      <span class="calibbar__v">${x.count}</span></div>`).join('');
}

// Diagnosis: not just WHERE points go, but WHY (the mistake cause) and WHAT KIND
// of thinking the missed question tested (the AAMC reasoning skill). Two axes of
// the same misses, each with its own honest give-up state.
function mistakesPanel(d) {
  const m = d.mistakes;
  const s = d.skills;
  if (!m && !s) return '';
  const head = '<div class="section__head"><div class="section__title">How you lose points</div></div>';
  // Both axes still thin: one honest empty state, no invented pattern.
  if ((!m || m.abstained) && (!s || s.abstained)) {
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">Not enough misses to diagnose</div>
      <p class="abstain__lead">When you miss a question, tag why. Once you have a few, you'll see which kind of mistake costs you the most points, and which reasoning skill they test.</p>
    </div></section>`;
  }
  // Cause axis: why the point was lost.
  let causeBlock = '';
  if (m && !m.abstained) {
    const secLabel = (d.section_labels && d.section_labels[m.top_section]) || m.top_section || '';
    const topLabel = (MISS_LABELS[m.top_reason] || m.top_reason || '').toLowerCase();
    const lead = m.top_reason ? `Most points lost to <b>${esc(topLabel)}</b>${secLabel ? ', mostly in ' + esc(secLabel) : ''}.` : '';
    causeBlock = `<div class="calibsummary">${lead}</div>
      <div class="calib">${missBars(m.items, 'reason', MISS_LABELS, 'calibbar__fill--pred')}</div>`;
  }
  // Skill axis: what kind of thinking the misses tested. The actionable contrast,
  // e.g. the points are lost on evaluating data, not on the facts themselves.
  let skillBlock = '';
  if (s && !s.abstained) {
    const topLabel = (SKILL_LABELS[s.top_skill] || s.top_skill || '').toLowerCase();
    const lead = s.top_skill
      ? (s.top_skill === 'concepts'
        ? `These mostly come down to <b>applying concepts</b>.`
        : `You lose more to <b>${esc(topLabel)}</b> than to the facts themselves.`)
      : '';
    skillBlock = `<div class="calibsummary" style="margin-top:0.85rem">${lead}</div>
      <div class="calib">${missBars(s.items, 'skill', SKILL_LABELS, 'calibbar__fill--obs')}</div>`;
  } else if (s && s.abstained && m && !m.abstained) {
    // Cause is ready but skill isn't: name the gap honestly instead of guessing.
    skillBlock = `<div class="cover" style="margin-top:0.85rem">Keep practicing to see which reasoning skill these misses test.</div>`;
  }
  const basis = (m && !m.abstained) ? m.n_wrong : (s ? s.n_wrong : 0);
  return `<section class="section">${head}<div class="coverblock">
    ${causeBlock}
    ${skillBlock}
    <div class="cover" style="margin-top:0.85rem">based on ${basis} missed questions</div>
  </div></section>`;
}

// Content before transfer: learn on flashcards first, then practice reasoning.
function planPanel(d) {
  const p = d.study_plan;
  if (!p || (!(p.study || []).length && !(p.practice || []).length)) return '';
  const chips = (list, empty) => (list && list.length ? list.slice(0, 5).map((x) => `<span class="planchip">${esc(x.name)}</span>`).join('') : `<span class="planempty">${empty}</span>`);
  return `<section class="section">
    <div class="section__head"><div class="section__title section__title--group">Where to focus</div></div>
    <div class="plansplit">
      <div class="plancol"><div class="plancol__h">Study these</div><div class="planchips">${chips(p.study, 'nothing pressing')}</div></div>
      <div class="plancol plancol--ready"><div class="plancol__h">Ready to practice</div><div class="planchips">${chips(p.practice, 'study a bit more first')}</div></div>
    </div>
  </section>`;
}

// Pace-to-finish: your median time per question vs the real section budget.
function pacingPanel(d) {
  const p = d.pacing;
  if (!p) return '';
  const head = '<div class="section__head"><div class="section__title">Pacing</div></div>';
  if (p.abstained) {
    return `<section class="section">${head}<div class="coverblock">
      <div class="abstain__title">Not enough timed questions yet</div>
      <p class="abstain__lead">Each practice question is timed. After a few, you'll see whether you'd finish each section before time runs out.</p>
    </div></section>`;
  }
  const rows = (p.sections || []).map((s) => {
    const label = (d.section_labels && d.section_labels[s.section]) || (s.section === 'cars' ? 'CARS' : s.section);
    const verdict = s.on_pace ? `finishes with ${s.spare_min} min to spare` : `runs out with ${s.projected_left} unanswered`;
    return `<div class="pacerow">
      <div class="pacerow__sec">${esc(label)}</div>
      <div class="pacerow__nums"><span class="pacerow__you pacerow__you--${s.on_pace ? 'ok' : 'off'}">${Math.round(s.median_sec)}s</span><span class="pacerow__t"> / ${Math.round(s.target_sec)}s budget</span></div>
      <div class="pacerow__verdict pacerow__verdict--${s.on_pace ? 'ok' : 'off'}">${esc(verdict)}</div>
    </div>`;
  }).join('');
  const lead = p.overall_on_pace ? 'You are finishing sections in time.' : 'At this pace you would not finish every section.';
  // CARS reading pace, stated per passage (a speed signal, never a score). CARS is
  // pure reading comprehension, so the honest unit is minutes per passage, not per
  // question. Shown only when there is enough timed CARS practice; it stays quiet
  // otherwise rather than guessing, and never claims a humanities vs social sciences
  // split, which the answered items do not carry.
  const c = p.cars;
  let carsCallout = '';
  if (c && !c.abstained) {
    const pp = c.per_passage_min;
    const tgt = Math.round(c.target_passage_min);
    const line = c.on_pace
      ? `CARS reading pace: about ${pp} minutes per passage, inside the ${tgt} minute budget.`
      : `CARS reading pace: about ${pp} minutes per passage, ${c.over_budget_pct}% over the ${tgt} minute budget.`;
    const sub = c.on_pace
      ? 'Your reading pace is on track. Keep it steady on test day.'
      : 'CARS is really a reading speed test, so pace yourself by the passage and work on reading a little faster.';
    carsCallout = `<div class="calibsummary calibverdict--${c.on_pace ? 'ok' : 'off'}" style="margin-top:0.85rem"><b>${line}</b></div>
    <div class="cover" style="margin-top:0.35rem">${sub}</div>`;
  }
  return `<section class="section">${head}<div class="coverblock">
    <div class="calibsummary"><b>${lead}</b></div>
    <div class="pacelist">${rows}</div>
    <div class="cover" style="margin-top:0.85rem">your typical time per question vs each section's time budget</div>
    ${carsCallout}
  </div></section>`;
}

// Project the readiness composite to exam day at your current rate of improvement.
function trajectoryPanel(d) {
  const t = d.trajectory;
  if (!t) return '';
  // Label sits INSIDE the card as an eyebrow (like the Exam countdown) so the two
  // outlook cards line up at the top instead of an outside title pushing this down.
  const eyebrow = '<div class="plan__eyebrow" style="margin-bottom:0.85rem">Score trajectory</div>';
  // The target lives on the scale of the sections you're currently modeling: the 3
  // science sections (354-396), or the full 472-528 once you've practiced CARS.
  const lo = t.scale_lo || 354;
  const hi = t.scale_hi || 396;
  const input = `<input class="targetin" type="number" min="${lo}" max="${hi}" placeholder="target" value="${t.target || ''}" oninput="vpy('targetsave:' + this.value)" onchange="vpy('target:' + this.value)">`;
  if (t.abstained) {
    return `<section class="section"><div class="coverblock">${eyebrow}
      <div class="plan__setrow"><div class="plan__title">${esc(t.reason || 'Set a target score and an exam date.')}</div><div>Target (${lo}\u2013${hi}): ${input}</div></div>
    </div></section>`;
  }
  const secName = t.weakest_section === 'cars' ? 'CARS' : ((d.section_labels && d.section_labels[t.weakest_section]) || t.weakest_section || '');
  const verdict = t.on_pace ? 'On pace to hit your target.' : `Behind your target${secName ? ', focus on ' + esc(secName) : ''}.`;
  // Qualitative pace from the SAME projected-vs-target the trajectory already
  // computed (no new metric); replaces the raw points-per-week rate. A one-point
  // band around the target reads as "on pace" rather than exact-tie only.
  const proj = typeof t.projected === 'number' ? t.projected : null;
  const tgt = typeof t.target === 'number' ? t.target : null;
  let pace = t.on_pace ? 'on' : 'behind';
  if (proj !== null && tgt !== null) pace = proj < tgt ? 'behind' : proj > tgt + 1 ? 'ahead' : 'on';
  const paceLabel = pace === 'behind' ? 'Behind pace' : pace === 'ahead' ? 'Ahead of pace' : 'On pace';
  // Actionable pointer: reuse the weakest section and the daily reasoning target
  // already shown under Exam countdown. Never a new points-to-effort conversion.
  const sp = d.study_pace;
  const rday = sp && typeof sp.reasoning_per_day === 'number' && sp.reasoning_per_day > 0 ? sp.reasoning_per_day : 0;
  const qWord = rday === 1 ? 'question' : 'questions';
  let hint;
  if (pace === 'behind') {
    if (secName && rday) hint = `Aim today's ${rday} reasoning ${qWord} at ${secName}, your weakest section.`;
    else if (secName) hint = `Put your reasoning practice into ${secName}, your weakest section.`;
    else if (rday) hint = `Get through today's ${rday} reasoning ${qWord} to catch up.`;
    else hint = 'Keep up your daily reasoning and flashcards to catch up.';
  } else if (pace === 'ahead') {
    hint = 'Nice work. Keep your daily practice steady.';
  } else {
    hint = rday
      ? `Right on track. Keep today's ${rday} reasoning ${qWord} and your due flashcards going.`
      : 'Right on track. Keep your daily practice steady.';
  }
  return `<section class="section"><div class="coverblock">${eyebrow}
    <div class="calibsummary calibverdict--${t.on_pace ? 'ok' : 'off'}"><b>${verdict}</b></div>
    <div class="trajstats">
      <div class="trajstat"><span class="trajstat__num">${t.projected}</span><span class="trajstat__lbl">projected by exam day</span></div>
      <div class="trajstat"><span class="trajstat__num">${t.target}</span><span class="trajstat__lbl">your target</span></div>
    </div>
    <div class="pacestatus pacestatus--${pace}">
      <span class="pacestatus__badge">${paceLabel}</span>
      <span class="pacestatus__hint">${esc(hint)}</span>
    </div>
    <div class="cover" style="margin-top:0.85rem">Change target (${lo}\u2013${hi}): ${input}</div>
  </div></section>`;
}

// Honest empty state: the live app failed to compute scores. Never fall back to
// the demo numbers here, that would show fabricated results as if they were real.
function errorCard() {
  const msg = window.__VANTAGE_ERR__ || 'Something went wrong computing your scores. Tap Refresh to try again.';
  return `
  <header class="masthead">
    <div class="masthead__deco"><span class="c1"></span><span class="c2"></span><span class="sq"></span></div>
    <div class="masthead__row">
      <div><div class="brand__mark">Vantage<span class="dot">.</span></div></div>
      <div class="toolbar">
        <button class="btn btn--ghost" onclick="vpy('back')">${svg('back')} Back to Anki</button>
      </div>
    </div>
  </header>
  <div class="app__body">
  <section class="section">
    <div class="card card--abstain">
      <div class="abstain__title">Couldn't load your scores</div>
      <p class="abstain__lead">${esc(msg)}</p>
      <button class="card__cta" onclick="vpy('refresh')">Refresh</button>
    </div>
  </section>
  </div>`;
}

// A dashboard-open reminder: how many flashcards are due to review today. Reuses
// the SAME value the plan shows (d.study_pace.reviews_due) so the banner and the
// plan never diverge. Hidden when nothing is due; no fabricated number. "Study
// now" launches the due-card review directly (the same vStudyLaunch('interleave')
// the studyBlock "Start mixed review" uses, so the session-length cap is honored
// and both hosts open the real flashcard reviewer), not just a tab switch.
function dueBanner(d) {
  const sp = d.study_pace;
  const due = sp && typeof sp.reviews_due === 'number' ? sp.reviews_due : 0;
  if (!(due > 0)) return '';
  return `<div class="duebanner" role="status">
    <span class="duebanner__dot"></span>
    <span class="duebanner__text"><b>${due}</b> flashcard${due === 1 ? '' : 's'} due to review today</span>
    <button class="duebanner__btn" onclick="vStudyLaunch('interleave')">Study now</button>
  </div>`;
}

// ============================================================================
// Redesign: Dashboard "where to go next" banner + the Progress report card.
// Everything here is presentation. It classifies and phrases numbers the scoring
// core already produced (statusOf + the existing panels) and reuses the existing
// handlers verbatim. No new number is computed.
// ============================================================================

// The single next action, from the reddest signal the app already computes: the
// measured weakest section (lowest application accuracy), else the pace/focus
// suggestion. Returns null -- and the banner then hides -- when there is not
// enough to point anywhere yet, so the CTA is never fabricated. Routes through the
// SAME handlers the section launchers use (vpractice.open / vstudy).
function nextStep(d) {
  const w = weakestSection(d);
  const choice = focusNowChoice(d);
  let sec;
  let action;
  let reason;
  if (w) {
    sec = w.section;
    action = 'reasoning';
    const pctRight = Math.round(w.accuracy * 100);
    const off = d.pacing && !d.pacing.abstained && (d.pacing.sections || []).some((x) => x.section === sec && !x.on_pace);
    reason = off
      ? `Your weakest area at ${pctRight}%, and you're short on time there.`
      : `Your lowest section so far at ${pctRight}% correct.`;
  } else if (choice) {
    sec = choice.sec;
    action = choice.action;
  } else {
    return null;
  }
  const label = (d.section_labels && d.section_labels[sec]) || (sec === 'cars' ? 'CARS' : sec);
  const click = action === 'flashcards' ? `vstudy('${sec}')` : `vpractice.open('${sec}')`;
  const title = action === 'flashcards' ? `Study ${label} flashcards` : `Practice ${label} reasoning`;
  const btn = action === 'flashcards' ? `Start ${label} flashcards` : `Start ${label} reasoning`;
  const why = 'This is your weakest area by the answers you have logged so far, so a little focused work here moves your score the most.';
  return { title, reason, click, btn, why };
}

function nextStepBanner(d) {
  const ns = nextStep(d);
  if (!ns) return '';
  return `<div class="vnext" role="region" aria-label="Where to go next">
    <div class="vnext__body">
      <div class="vnext__eyebrow"><span class="vnext__dot"></span>Where to go next</div>
      <div class="vnext__title">${esc(ns.title)}</div>
      ${ns.reason ? `<div class="vnext__reason">${esc(ns.reason)}</div>` : ''}
      <div class="vnext__why-detail" id="vnextwhy" hidden>${esc(ns.why)}</div>
    </div>
    <div class="vnext__actions">
      <button class="vnext__go" onclick="${ns.click}">${esc(ns.btn)}</button>
      <button class="vnext__why" onclick="vwhy()" aria-controls="vnextwhy" aria-expanded="false">Why this?</button>
    </div>
  </div>`;
}
// Reveal the one-line rationale under the banner. Client-only; no bridge command.
window.vwhy = function () {
  const el = document.getElementById('vnextwhy');
  const btn = document.querySelector('.vnext__why');
  if (!el) return;
  const show = el.hasAttribute('hidden');
  if (show) el.removeAttribute('hidden'); else el.setAttribute('hidden', '');
  if (btn) btn.setAttribute('aria-expanded', show ? 'true' : 'false');
};

// ---- The Progress report card: one graded tile per area, grouped by status ----
// Each tile derives its status (red/amber/green, or neutral when the area still
// abstains) and a one-line verdict from the SAME data its drawer shows; the drawer
// is the existing panel builder, unchanged, so every honest-abstain state and
// handler inside it is preserved.
const MISS_SHORT = { content: 'Content gaps', misread: 'Misreads', trap: 'Trap answers', time: 'Rushing', math: 'Arithmetic slips' };

function coverageTile(d) {
  const overall = typeof d.topic_coverage === 'number' ? d.topic_coverage : (d.coverage || 0);
  const labels = d.section_labels || {};
  const bySec = d.topic_coverage_by_section || d.coverage_by_section || {};
  let weak = null;
  Object.keys(labels).forEach((k) => {
    const v = bySec[k];
    if (typeof v === 'number' && (!weak || v < weak.v)) weak = { k, v };
  });
  const detail = weak ? `${labels[weak.k]} is your least covered at ${pct(weak.v)}` : 'Across every section of the exam';
  const drawer = `${planPanel(d)}<div class="coverage">${coverageBlock(d)}${nextBlock(d)}</div>`;
  return { id: 'cov', name: 'Coverage', status: statusOf(overall), verdict: `${pct(overall)} of the exam covered`, detail, drawer };
}

function recallTile(d) {
  const items = d.fluency_items || [];
  const risks = items.filter((x) => x.fluency_risk);
  const drawer = fluencyPanel(d);
  if (!items.length) return { id: 'recall', name: 'Recall vs. using it', status: 'neutral', verdict: 'Not enough practice yet', detail: 'Answer a few reworded questions to compare recall with using it', drawer };
  if (!risks.length) return { id: 'recall', name: 'Recall vs. using it', status: 'green', verdict: 'Recall and answers line up', detail: 'Nothing you recall slips when the wording changes', drawer };
  const worst = risks[0];
  const name = worst.name || worst.concept_id;
  const n = risks.length;
  return {
    id: 'recall', name: 'Recall vs. using it', status: 'amber',
    verdict: `${n} concept${n === 1 ? '' : 's'} slip${n === 1 ? 's' : ''} when reworded`,
    detail: `${name}: ${pct(worst.recall)} recall, ${pct(worst.application)} on questions`,
    drawer,
  };
}

function loseTile(d) {
  const m = d.mistakes;
  const s = d.skills;
  const drawer = mistakesPanel(d);
  if ((!m || m.abstained) && (!s || s.abstained)) {
    return { id: 'lose', name: 'How you lose points', status: 'neutral', verdict: 'Not enough misses to diagnose', detail: 'Tag why you miss questions to see the pattern', drawer };
  }
  const nWrong = (m && !m.abstained) ? m.n_wrong : (s ? s.n_wrong : 0);
  const reason = (m && !m.abstained && m.top_reason) ? m.top_reason : null;
  const secKey = m && m.top_section;
  const secLabel = secKey ? ((d.section_labels && d.section_labels[secKey]) || (secKey === 'cars' ? 'CARS' : secKey)) : '';
  return {
    id: 'lose', name: 'How you lose points', status: 'amber',
    verdict: reason ? `${MISS_SHORT[reason] || 'Mistakes'} cost the most` : 'Where your points go',
    detail: `${nWrong} missed question${nWrong === 1 ? '' : 's'}${secLabel ? ', mostly ' + secLabel : ''}`,
    drawer,
  };
}

function memoryTile(d) {
  const c = d.calibration;
  const drawer = calibrationBlock(d);
  if (!c || c.abstained) return { id: 'mem', name: 'Memory', status: 'neutral', verdict: 'Not enough practice yet', detail: 'Answer more questions to compare memory with real performance', drawer };
  const recall = c.mean_predicted;
  const status = statusOf(recall);
  const word = status === 'green' ? 'solid' : status === 'amber' ? 'building' : 'still low';
  return {
    id: 'mem', name: 'Memory', status,
    verdict: `Your recall is ${word} at ${pct(recall)}`,
    detail: c.well_calibrated ? 'It lines up with how you do on questions' : 'But you use less of it on new questions',
    drawer,
  };
}

function confidenceTile(d) {
  const c = d.confidence;
  const drawer = confidencePanel(d);
  if (!c || c.abstained) return { id: 'conf', name: 'Confidence', status: 'neutral', verdict: 'Not enough answers yet', detail: 'Mark how sure you are to calibrate your confidence', drawer };
  const levels = c.levels || [];
  const sure = levels.find((l) => l.level === 'sure');
  const rate = sure ? sure.rate : (levels.length ? levels[levels.length - 1].rate : 0);
  return {
    id: 'conf', name: 'Confidence', status: statusOf(rate),
    verdict: sure ? `Right ${pct(sure.rate)} when you felt sure` : 'Your certainty vs. your results',
    detail: 'How well feeling sure matches being right',
    drawer,
  };
}

function pacingTile(d) {
  const p = d.pacing;
  const drawer = pacingPanel(d);
  if (!p || p.abstained) return { id: 'pace', name: 'Pacing', status: 'neutral', verdict: 'Not enough timed questions yet', detail: 'Each practice question is timed; a few more shows your pace', drawer };
  if (p.overall_on_pace) return { id: 'pace', name: 'Pacing', status: 'green', verdict: 'You finish sections in time', detail: 'Your pace is on track across sections', drawer };
  let worst = null;
  (p.sections || []).forEach((s) => {
    if (!s.on_pace && (!worst || (s.projected_left || 0) > (worst.projected_left || 0))) worst = s;
  });
  const carsOff = p.cars && !p.cars.abstained && !p.cars.on_pace;
  let verdict = 'You would not finish every section';
  let detail = 'At this pace you would not finish every section in time';
  if (worst) {
    const label = (d.section_labels && d.section_labels[worst.section]) || (worst.section === 'cars' ? 'CARS' : worst.section);
    verdict = `You'd run out of time in ${label}`;
    detail = `${Math.round(worst.median_sec)}s vs a ${Math.round(worst.target_sec)}s budget, ${worst.projected_left} question${worst.projected_left === 1 ? '' : 's'} left unanswered`;
  } else if (carsOff) {
    verdict = "You'd run out of time in CARS";
    detail = `About ${p.cars.per_passage_min} minutes per passage, ${p.cars.over_budget_pct}% over the reading budget`;
  }
  return { id: 'pace', name: 'Pacing', status: 'red', verdict, detail, drawer };
}

function progressTile(t, open) {
  const st = t.status;
  const pill = st === 'neutral' ? '' : `<span class="rtile__pill rtile__pill--${st}">${STATUS_PILL[st]}</span>`;
  const head = `<div class="rtile__head"><span class="rtile__name">${esc(t.name)}</span>${pill}</div>`;
  const verdict = `<div class="rtile__verdict">${esc(t.verdict)}</div>`;
  const detail = `<div class="rtile__detail">${esc(t.detail)}</div>`;
  if (st === 'red') {
    return `<button class="rtile rtile--red" onclick="vprog('${t.id}')" aria-expanded="${open ? 'true' : 'false'}">
      <div class="rtile__body">${head}${verdict}${detail}</div>
      <span class="rtile__open">${open ? 'Close' : 'Open'} &rsaquo;</span>
    </button>`;
  }
  return `<button class="rtile rtile--${st}" onclick="vprog('${t.id}')" aria-expanded="${open ? 'true' : 'false'}">${head}${verdict}${detail}</button>`;
}

function progressCard(d) {
  const open = window.__vProgOpen || null;
  const tiles = [coverageTile(d), recallTile(d), loseTile(d), memoryTile(d), confidenceTile(d), pacingTile(d)];
  const by = { red: [], amber: [], green: [], neutral: [] };
  tiles.forEach((t) => { (by[t.status] || by.neutral).push(t); });
  const groups = [
    { status: 'red', label: 'Needs attention', cls: '' },
    { status: 'amber', label: 'Keep an eye on', cls: 'rtiles--3' },
    { status: 'green', label: 'Doing well', cls: 'rtiles--2' },
    { status: 'neutral', label: 'Not enough data yet', cls: 'rtiles--3' },
  ];
  const parts = [];
  groups.forEach((g) => {
    const list = by[g.status];
    if (!list.length) return;
    parts.push(`<div class="rgroup__label"><span class="rgroup__dot rgroup__dot--${g.status}"></span>${esc(g.label)}</div>`);
    if (g.status === 'red') {
      // Red tiles are prominent full-width cards; the open one's drawer sits right
      // beneath it.
      list.forEach((t) => {
        parts.push(progressTile(t, open === t.id));
        if (open === t.id) parts.push(`<div class="pdrawer">${t.drawer}</div>`);
      });
    } else {
      parts.push(`<div class="rtiles ${g.cls}">${list.map((t) => progressTile(t, open === t.id)).join('')}</div>`);
      const openT = list.find((t) => t.id === open);
      if (openT) parts.push(`<div class="pdrawer">${openT.drawer}</div>`);
    }
  });
  const hint = open ? '' : '<div class="rhint">Tap a card for the detail.</div>';
  return `<div class="rcard">${parts.join('')}${hint}</div>`;
}
// Toggle the open report-card tile (one at a time) and re-render the Progress pane
// in place, so the rest of the page and the current tab are untouched.
window.vprog = function (id) {

// ---- Sync button: additive to auto-sync. Fires the host's real sync, shows a
// brief "Syncing..." state, then the host either reloads (success) or calls
// vantageSyncDone(false) so we show a plain-language error. ----
window.vsync = function () {
  const btn = document.getElementById('vsyncbtn');
  const lbl = document.getElementById('vsynclbl');
  if (btn && btn.dataset.busy === '1') return;
  if (btn) { btn.dataset.busy = '1'; btn.classList.add('btn--busy'); }
  if (lbl) lbl.textContent = 'Syncing...';
  const ago = document.getElementById('vsyncago');
  if (ago) ago.textContent = 'Syncing now';
  clearTimeout(window.__vsyncTimer);

  window.__vsyncTimer = setTimeout(function () { window.vantageSyncDone(false); }, 45000);

};
window.vantageSyncDone = function (ok) {

  const lbl = document.getElementById('vsynclbl');
  if (btn) { btn.dataset.busy = ''; btn.classList.remove('btn--busy'); }
  if (lbl) lbl.textContent = 'Sync';

  // label from the unchanged col.ls the host injected.
  vSyncAgoRefresh();
  vmsg("Couldn't sync, check your connection");
};

// ---- "Last synced Xm ago" indicator. Reads the collection's core `ls` value
// (window.__VANTAGE__.last_sync_ms, ms) the host injects; never fabricates a time.
// 0 / absent -> "Never synced". Clock skew (a server mtime slightly ahead of the
// local clock) clamps to "just now". ----
function vSyncAgoText(ms, nowMs) {
  const t = Number(ms) || 0;
  if (t <= 0) return 'Never synced';
  let sec = Math.round((nowMs - t) / 1000);
  if (sec < 0) sec = 0;
  if (sec < 45) return 'Synced just now';
  const min = Math.round(sec / 60);
  if (min < 60) return 'Synced ' + min + 'm ago';
  const hr = Math.round(min / 60);
  if (hr < 24) return 'Synced ' + hr + 'h ago';
  return 'Synced ' + Math.round(hr / 24) + 'd ago';
}
function vSyncAgoRefresh() {
  const el = document.getElementById('vsyncago');
  if (!el) return;
  // Resolve the data source the same way render() does, so the offline MOCK preview
  // reads MOCK.last_sync_ms and the live app reads the injected window.__VANTAGE__.
  const d = window.__VANTAGE__ || (window.__VANTAGE_LIVE__ ? null : (typeof MOCK !== 'undefined' ? MOCK : null));
  el.textContent = vSyncAgoText(d && d.last_sync_ms, Date.now());
}

// Small bottom-center message (sync errors, etc.). Self-contained, no stylesheet
// dependency beyond .vmsg in dashboard.css.
function vmsg(text) {
  let el = document.getElementById('vmsg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'vmsg';
    el.className = 'vmsg';
    (document.body || document.documentElement).appendChild(el);
  }
  el.textContent = text;
  el.classList.add('vmsg--show');
  clearTimeout(window.__vmsgTimer);
  window.__vmsgTimer = setTimeout(function () { el.classList.remove('vmsg--show'); }, 3400);
}
window.vmsg = vmsg;

s itself a faculty we cannot step outside to check. Pushed to its conclusion, the demand for certainty does not purify our knowledge; it abolishes it, leaving us unable to claim that we know the sun will rise or that the floor will hold. A standard so severe that nothing can meet it tells us less about knowledge than about the standard.", "A more modest proposal is that knowing does not require the impossibility of error, only its responsible exclusion. On this view I can know that the floor will hold even while granting that, in some far-fetched sense, it might not, because knowledge is not a fortress immune to every conceivable assault but a claim held on good grounds and open to revision. This is harder to accept than it sounds, for it asks us to live with a permanent gap between being justified and being guaranteed. Yet the alternative, waiting for a certainty that never comes, is not caution but paralysis. The fallibilist does not abandon the pursuit of truth; he abandons only the fantasy that truth must announce itself with a seal no doubt can break. To know, on this account, is to have earned a belief, not to have escaped forever the possibility of being wrong."], "source_ref": "OpenStax Introduction to Philosophy (Epistemology)", "questions": [{"stem": "The passage's central argument is that", "choices": ["genuine knowledge requires the complete impossibility of error", "we can never know anything at all", "knowledge can rest on good grounds without ruling out every conceivable error", "the senses are a reliable source of absolute certainty"], "answer": 2, "explain": "The author endorses the 'modest proposal' that knowing 'does not require the impossibility of error, only its responsible exclusion.'", "cover_story": "knowledge and doubt", "b": -1.3}, {"stem": "The statement that a standard 'so severe that nothing can meet it tells us less about knowledge than about the standard' serves to", "choices": ["reject the demand for certainty by turning its own failure back on itself", "prove that the senses never deceive us", "defend the view that knowledge is impossible", "argue that all standards of knowledge are equally useful"], "answer": 0, "explain": "The line uses the standard's own failure, that 'nothing can meet it,' as grounds for doubting the standard rather than knowledge.", "cover_story": "knowledge and doubt", "b": 0.7}, {"stem": "The author's attitude toward the demand for absolute certainty is", "choices": ["reverent, treating it as the only path to truth", "critical, regarding it as self-defeating", "playful and unserious", "entirely neutral and undecided"], "answer": 1, "explain": "The author says the demand 'does not purify our knowledge; it abolishes it,' a self-defeating result.", "cover_story": "knowledge and doubt", "b": 0.0}, {"stem": "As used in the passage, 'indubitable' most nearly means", "choices": ["difficult to understand", "widely believed by everyone", "impossible to doubt", "only recently discovered"], "answer": 2, "explain": "The philosopher strips away 'everything that doubt can touch until only the indubitable remains,' meaning what cannot be doubted.", "cover_story": "knowledge and doubt", "b": 0.2}, {"stem": "It can be inferred that the author would regard the belief that the sun will rise as", "choices": ["mere opinion with no claim to be knowledge", "something we can know despite its bare possibility of being false", "certain beyond any conceivable doubt", "impossible to hold responsibly"], "answer": 1, "explain": "The fallibilist can 'know that the floor will hold even while granting that ... it might not,' and the sun is treated the same way.", "cover_story": "knowledge and doubt", "b": 0.6}, {"stem": "Which of the following, if true, would most undermine the fallibilist position the author defends?", "choices": ["that people sometimes revise beliefs they once held with confidence", "that no belief can count as knowledge unless error in it is strictly impossible", "that the senses occasionally mislead us", "that some claims are held on better grounds than others"], "answer": 1, "explain": "Fallibilism depends on denying that knowledge requires the impossibility of error; if that requirement held, the position would collapse.", "cover_story": "knowledge and doubt", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["The shift from foraging to farming is usually told as an ascent, the moment our ancestors stopped wandering after their food and learned at last to command it. Fields replaced the hunt, granaries replaced the chase, and on the surplus so gathered rose everything we call civilization: cities, writing, priesthoods, kings. It is a satisfying story, and parts of it are true. But the bones tell a more ambiguous tale. The first farmers were often shorter, sicker, and more worn by labor than the foragers they succeeded, their teeth marked by a narrower diet, their bodies by the new diseases that crowding and cattle brought. A people who had once drawn on the whole variety of a landscape now staked their survival on a few domesticated grains, and when those grains failed, there was no wilderness left to fall back upon.", "Why, then, did farming spread, if it cost so much? Part of the answer is that its costs were invisible to those who paid them, accruing slowly across generations that had no memory of another way to live. Part is that farming, for all its burdens, could feed more mouths from the same ground, and a crowded village, however unhealthy, could outlast and overrun a thinner band of hunters. What triumphed, in other words, was not the happier life but the more numerous one, and the two are easily confused. To read the rise of agriculture as simple progress is to assume that whatever wins must have been better, when the record suggests only that it was better at multiplying. The lesson is less comforting than the usual story, and harder to unlearn: a way of life can conquer the world without ever having made its people well."], "source_ref": "OpenStax World History Volume 1: to 1500 (the Neolithic Revolution and early agricultural societies)", "questions": [{"stem": "The central point of the passage is that", "choices": ["the shift to agriculture was an unambiguous improvement in human life", "farming spread because it made human life healthier and easier", "agriculture prevailed by supporting larger populations, not by making people better off", "foraging societies were incapable of producing any surplus"], "answer": 2, "explain": "The author concludes that 'what triumphed ... was not the happier life but the more numerous one,' distinguishing success from improvement.", "cover_story": "the farming bargain", "b": -1.4}, {"stem": "The description of the first farmers as 'shorter, sicker, and more worn by labor' functions primarily to", "choices": ["complicate the familiar story of agriculture as pure progress", "prove that foragers never suffered from any disease", "argue that farming produced no surplus at all", "show that modern diets are healthier than ancient ones"], "answer": 0, "explain": "The bodily evidence is offered as 'a more ambiguous tale' against the story of farming as an unqualified 'ascent.'", "cover_story": "the farming bargain", "b": 0.7}, {"stem": "The author's attitude toward the familiar story of farming as an 'ascent' is", "choices": ["wholly accepting of it", "skeptical, granting its partial truth while resisting its conclusion", "outraged at those who tell it", "wholly indifferent to it"], "answer": 1, "explain": "The author calls the story 'satisfying' and admits 'parts of it are true,' yet insists 'the bones tell a more ambiguous tale.'", "cover_story": "the farming bargain", "b": -0.1}, {"stem": "As used in the passage, 'accruing' most nearly means", "choices": ["disappearing over time", "accumulating gradually", "being paid off in full", "becoming visible all at once"], "answer": 1, "explain": "The costs were 'invisible' because they were 'accruing slowly across generations,' meaning building up little by little.", "cover_story": "the farming bargain", "b": 0.1}, {"stem": "It can be inferred that the author considers the spread of farming to be evidence that", "choices": ["the way of life that prevails is not necessarily the one that serves people best", "human beings always choose whatever improves their health", "population size has no effect on which societies endure", "foraging was doomed by its own inefficiency"], "answer": 0, "explain": "The author warns against assuming 'that whatever wins must have been better,' since farming was merely 'better at multiplying.'", "cover_story": "the farming bargain", "b": 0.6}, {"stem": "Which modern situation is most analogous to the pattern the author identifies?", "choices": ["a technology that spreads widely because it lets more people be supported, even though it lowers the quality of their daily lives", "a craft that dies out because no one is willing to practice it", "a diet adopted because rigorous studies prove it extends lifespan", "a custom preserved purely for its beauty despite serving no function"], "answer": 0, "explain": "The pattern is a way of life prevailing by 'multiplying' rather than by improving lives, which the spreading technology mirrors.", "cover_story": "the farming bargain", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["When two worlds that had developed in isolation were joined after 1492, the traffic between them was not only in ships and soldiers but in seeds, animals, and unseen microbes, and it is this quieter cargo that reshaped the planet most profoundly. Maize and the potato crossed one way and would eventually feed populations from Ireland to China; horses, wheat, and sugarcane crossed the other and remade the diets and landscapes of two continents. To narrate the encounter only as a story of conquest and gold is to miss the deeper rearrangement, in which the very biology of the world was shuffled and dealt out again. Whole cuisines we now think of as ancient and national, the tomato in Italy, the chili in India, are the recent offspring of this collision, so thoroughly naturalized that their foreign birth has been forgotten.", "Yet the same exchange that enriched the world's tables also emptied its villages. The microbes that traveled with the newcomers found populations with no inherited defense against them, and across the Americas disease did what no army could have, killing on a scale that beggars the vocabulary of war. To celebrate the new abundance without reckoning this loss would be a kind of accounting fraud, crediting the ledger while hiding the debit. What the period demands of us is a double vision, the capacity to see that the same event was, at once, one of the great enrichments and one of the great catastrophes of human history, and that these are not two stories to be told in turn but one story that refuses to resolve into either. The exchange gave and it took, and it did not consult the people whose worlds it remade."], "source_ref": "OpenStax World History Volume 2: from 1400 (the Columbian Exchange and early modern global connections)", "questions": [{"stem": "The passage is chiefly concerned with arguing that", "choices": ["the joining of the two worlds was primarily a story of conquest and gold", "the exchange after 1492 was at once a great enrichment and a great catastrophe that cannot be separated", "the movement of crops mattered far more than the movement of people", "the new diseases were a minor footnote to an era of abundance"], "answer": 1, "explain": "The author calls for 'a double vision' seeing 'one of the great enrichments and one of the great catastrophes' as 'one story that refuses to resolve into either.'", "cover_story": "the great exchange", "b": -1.3}, {"stem": "The mention of the tomato in Italy and the chili in India serves primarily to", "choices": ["show how thoroughly the exchange reshaped even cuisines now thought ancient and native", "prove that Italian and Indian cooking are superior to others", "argue that the exchange had no lasting effects", "suggest that these foods were always present in those places"], "answer": 0, "explain": "These dishes are 'the recent offspring of this collision, so thoroughly naturalized that their foreign birth has been forgotten.'", "cover_story": "the great exchange", "b": 0.6}, {"stem": "The author regards celebrating the new abundance without acknowledging the loss as", "choices": ["a reasonable emphasis on the exchange's benefits", "a form of dishonest accounting", "the only responsible way to tell the story", "a harmless simplification"], "answer": 1, "explain": "To celebrate abundance without the loss 'would be a kind of accounting fraud, crediting the ledger while hiding the debit.'", "cover_story": "the great exchange", "b": 0.1}, {"stem": "As used in the passage, 'naturalized' most nearly means", "choices": ["returned to a wild state", "granted legal citizenship", "so absorbed into a place that it seems native", "studied by natural scientists"], "answer": 2, "explain": "The foods are 'so thoroughly naturalized that their foreign birth has been forgotten,' meaning they now seem native.", "cover_story": "the great exchange", "b": 0.2}, {"stem": "It can be inferred that the author considers the 'quieter cargo' of seeds and microbes to have been", "choices": ["less important than the movement of soldiers and gold", "more transformative of the world than the conquest itself", "beneficial in every one of its effects", "unrelated to the demographic collapse in the Americas"], "answer": 1, "explain": "The author says 'it is this quieter cargo that reshaped the planet most profoundly,' beyond the story 'of conquest and gold.'", "cover_story": "the great exchange", "b": 0.7}, {"stem": "Which of the following, if true, would most support the author's call for a 'double vision' of the exchange?", "choices": ["a region whose population was devastated by imported disease in the same decades that its farmland grew far more productive from imported crops", "a region that received new crops but was never touched by any new disease", "a war whose casualties were caused entirely by soldiers rather than illness", "a cuisine that developed in complete isolation from foreign ingredients"], "answer": 0, "explain": "A single region enriched and devastated at once embodies the claim that gain and loss were 'one story that refuses to resolve into either.'", "cover_story": "the great exchange", "b": 1.3}]}, {"label": "Passage", "paragraphs": ["For a brief span after the war, the country attempted something it had never seriously tried before: to remake a society founded on bondage into one founded on equal citizenship, and to do so by law, in a single generation. Amendments were written into the Constitution that abolished slavery, promised equal protection, and forbade the denial of the vote on account of race. Men who had been counted as property a decade earlier now sat in legislatures and sent representatives to the capital. Read forward from its beginning, the period can look like the opening of a door long held shut. But history is not read forward by those who live it, and the same door, we know, would be forced closed again within a dozen years, its promises left standing on the page while the world beneath them was quietly rearranged to defeat them.", "What defeated Reconstruction was not the repeal of its guarantees, for they were never repealed; it was the discovery that a right written down is not yet a right secured. A vote that cannot be safely cast is a vote in name only, and an equality announced by the state but unenforced by it becomes a kind of official fiction, more useful to the comfortable than to those it was meant to protect. The lesson later generations drew from the period was accordingly double-edged. It showed how much could be achieved by law, and how little, when law is severed from the power and the will to make it real. To honor Reconstruction as a triumph or dismiss it as a failure is equally to miss its instruction, which is that the two can inhabit the same events, and that a promise and its betrayal are sometimes written in the same hand."], "source_ref": "OpenStax U.S. History (Reconstruction, 1865 to 1877)", "questions": [{"stem": "The central claim of the passage is that Reconstruction", "choices": ["succeeded completely in remaking Southern society", "collapsed because its constitutional amendments were formally repealed", "showed both how much law can achieve and how little it achieves when unenforced", "proved that written guarantees are always sufficient to secure rights"], "answer": 2, "explain": "The period 'showed how much could be achieved by law, and how little, when law is severed from the power and the will to make it real.'", "cover_story": "reconstruction's promise", "b": -1.4}, {"stem": "The image of a 'door long held shut' that 'would be forced closed again' primarily serves to", "choices": ["capture both the opening of new possibilities and their subsequent defeat", "argue that no progress of any kind was made during the period", "suggest that the amendments were never actually written", "prove that doors are a common feature of legislatures"], "answer": 0, "explain": "The door 'long held shut' that is then 'forced closed again' figures both the promise and its reversal.", "cover_story": "reconstruction's promise", "b": 0.8}, {"stem": "The author regards the labels 'triumph' and 'failure' as applied to Reconstruction as", "choices": ["equally mistaken because both miss the period's real lesson", "accurate depending only on one's political views", "useful shorthand that captures the period well", "irrelevant to any serious study of history"], "answer": 0, "explain": "To 'honor Reconstruction as a triumph or dismiss it as a failure is equally to miss its instruction.'", "cover_story": "reconstruction's promise", "b": 0.0}, {"stem": "As used in the passage, 'severed' most nearly means", "choices": ["cut off or separated", "sharply criticized", "formally approved", "briefly interrupted"], "answer": 0, "explain": "Law 'severed from the power and the will to make it real' means law cut off from enforcement.", "cover_story": "reconstruction's promise", "b": 0.1}, {"stem": "The author would most likely agree that a legal right is genuinely secured only when", "choices": ["it has been written into a constitution", "it is backed by the power and will to enforce it", "it is popular with the comfortable majority", "it has never been challenged in a court"], "answer": 1, "explain": "'A right written down is not yet a right secured'; what was missing was 'the power and the will to make it real.'", "cover_story": "reconstruction's promise", "b": 0.6}, {"stem": "Which contemporary situation best illustrates the lesson the author draws from Reconstruction?", "choices": ["a law guaranteeing a benefit that goes unclaimed because the state provides no means to enforce it", "a law that is formally repealed by a later legislature", "a right that is both written down and vigorously protected in practice", "a custom that persists even though no law requires it"], "answer": 0, "explain": "The lesson is that 'a right written down is not yet a right secured'; an unenforced guarantee is a right 'in name only.'", "cover_story": "reconstruction's promise", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["Before the factory and the canal, most people worked to a rhythm set by the sun and the season, and the line between labor and life was blurred by a hundred small liberties: the errand run midmorning, the task set down when a neighbor called, the long idleness of winter. The transformations of the early nineteenth century did not merely move this work from farm to workshop; they rebuilt its very measure. Where a task had once been finished when it was done, it was now timed, and the clock on the wall became a quiet sovereign, dividing the day into units that could be bought. To sell one's labor by the hour is to accept that the hour belongs, for its duration, to another, and this was a stranger bargain than it now appears to a people who had rarely thought of their time as a thing that could be owned at all.", "It would be sentimental to mourn the older way without remembering its poverty, for the same market that disciplined the worker also filled the shops with goods that no previous generation could have dreamed of owning, and offered, to some, an escape from the narrow fate of birth. The honest reckoning is not a lament but a balance. Something was gained in abundance and mobility, and something was lost in autonomy and rhythm, and the gain and the loss fell, as they usually do, on different people and in different measure. What makes the period worth studying is precisely that it will not sit still as either a rise or a fall. It was the hinge on which a whole way of living turned, and those who lived through it felt, often at once, the promise of the new order and the quiet expropriation of a freedom they had not known they possessed until it was gone."], "source_ref": "OpenStax U.S. History (the market revolution and the transformation of Northern labor)", "questions": [{"stem": "The passage principally argues that the changes it describes", "choices": ["improved daily life in every important respect", "simply relocated existing work without altering its nature", "brought both new abundance and a loss of autonomy that fell unevenly on different people", "were mourned by everyone who lived through them"], "answer": 2, "explain": "The author calls for 'a balance': 'something was gained in abundance and mobility, and something was lost in autonomy and rhythm.'", "cover_story": "the market revolution", "b": -1.3}, {"stem": "The description of the clock as 'a quiet sovereign' primarily serves to", "choices": ["convey how thoroughly measured time came to govern the working day", "praise the punctuality of nineteenth-century workers", "argue that clocks were a brand-new invention of the period", "suggest that workers came to admire their employers"], "answer": 0, "explain": "The clock 'divid[es] the day into units that could be bought,' ruling the day as a 'sovereign' would.", "cover_story": "the market revolution", "b": 0.7}, {"stem": "The author's attitude toward mourning the older rhythm of work is", "choices": ["wholehearted, treating the change as pure loss", "guarded, warning that such mourning forgets the older way's poverty", "dismissive of the idea that anything was lost", "indifferent to the question entirely"], "answer": 1, "explain": "The author calls it 'sentimental to mourn the older way without remembering its poverty' and insists on 'a balance.'", "cover_story": "the market revolution", "b": -0.1}, {"stem": "As used in the passage, 'expropriation' most nearly means", "choices": ["a fair exchange of goods", "a taking away of something once possessed", "a sudden increase in wealth", "a public celebration"], "answer": 1, "explain": "The 'expropriation of a freedom' names a freedom that was lost, taken from those who 'had not known they possessed' it.", "cover_story": "the market revolution", "b": 0.2}, {"stem": "It can be inferred that, before the changes described, most people generally", "choices": ["thought of their time as something that could be bought and sold", "did not conceive of their time as a possession that could be owned", "worked longer and more tightly regulated hours than afterward", "enjoyed a greater abundance of manufactured goods than afterward"], "answer": 1, "explain": "The bargain seemed strange 'to a people who had rarely thought of their time as a thing that could be owned at all.'", "cover_story": "the market revolution", "b": 0.6}, {"stem": "Which of the following, if true, would most weaken the author's characterization of the change in work?", "choices": ["evidence that farm labor before the period was already governed by strict, externally imposed schedules just as rigid as the factory's", "evidence that factories filled shops with new kinds of goods", "evidence that some workers escaped the fate of their birth", "evidence that winters were often idle on many farms"], "answer": 0, "explain": "The author's contrast depends on older work being loosely timed; if it was already rigidly scheduled, the claimed transformation dissolves.", "cover_story": "the market revolution", "b": 1.3}]}, {"label": "Passage", "paragraphs": ["There is a reflex, older than any argument, by which we take the customs of our own people as the plain shape of the human and treat every departure from them as a deviation to be explained. The food others eat is strange, their manners are wrong, their gods are false, and the measure by which all this is judged is simply the way things are done at home, mistaken for the way things are. Sociologists have a name for this reflex and for the discipline meant to correct it. To see one's own culture as the natural center of the world is ethnocentrism; to suspend that judgment and try to understand a practice within the web of meaning that gives it sense is the harder work of cultural relativism. The first comes to us for free. The second must be learned, and is never learned completely.", "Yet relativism, pressed too far, dissolves into a paralysis of its own. If every practice can be judged only from inside its own culture, then no practice can ever be criticized from without, and the cruelties that some societies have visited on the weak acquire an immunity merely by being customary. The observer who set out to cure arrogance arrives, by an unwanted road, at an inability to object to anything at all. The way through is not to abandon understanding but to distinguish it from endorsement. To grasp why a practice makes sense to those who follow it is one act; to decide whether it should continue is another, and the first does not settle the second. Relativism at its best is a method of seeing, not a verdict of approval, and the confusion of the two has done as much harm to the idea as any of its enemies."], "source_ref": "OpenStax Introduction to Sociology 3e (Culture)", "questions": [{"stem": "The passage's central argument is that cultural relativism", "choices": ["requires approving of every practice one studies", "is a method for understanding practices, not a verdict approving them", "is simply another name for ethnocentrism", "should be abandoned in favor of judging all cultures by one's own"], "answer": 1, "explain": "The author holds that 'relativism at its best is a method of seeing, not a verdict of approval.'", "cover_story": "judging other cultures", "b": -1.3}, {"stem": "The observation that some cruelties can 'acquire an immunity merely by being customary' serves to", "choices": ["show the danger of pressing relativism too far", "prove that all cultures are equally cruel", "defend ethnocentrism as the safer attitude", "argue that customs can never be criticized on any grounds"], "answer": 0, "explain": "The line exposes how relativism 'pressed too far' leaves one with 'an inability to object to anything at all.'", "cover_story": "judging other cultures", "b": 0.7}, {"stem": "The author's attitude toward the ethnocentric reflex is", "choices": ["approving, since it places one's own culture at the natural center", "critical, treating it as an error that discipline must correct", "neutral and merely descriptive", "admiring of its honesty"], "answer": 1, "explain": "Ethnocentrism is the 'reflex' that relativism, 'the harder work,' is 'meant to correct.'", "cover_story": "judging other cultures", "b": -0.1}, {"stem": "As used in the passage, 'reflex' most nearly means", "choices": ["a careful and deliberate decision", "an automatic, unexamined response", "a reflected mirror image", "a physical injury"], "answer": 1, "explain": "The 'reflex' is a response that 'comes to us for free,' unlike the relativism that 'must be learned.'", "cover_story": "judging other cultures", "b": 0.1}, {"stem": "It can be inferred that the author sees understanding a practice and endorsing it as", "choices": ["two distinct acts, the first of which does not determine the second", "one and the same act", "equally impossible to achieve", "steps that must always occur in reverse order"], "answer": 0, "explain": "'To grasp why a practice makes sense ... is one act; to decide whether it should continue is another, and the first does not settle the second.'", "cover_story": "judging other cultures", "b": 0.6}, {"stem": "Which response to an unfamiliar custom best reflects relativism as the author defines it?", "choices": ["studying the custom to understand its meaning to insiders, while reserving judgment about whether it is right", "condemning the custom immediately because it differs from one's own", "praising the custom simply because it belongs to another culture", "refusing to learn anything about the custom at all"], "answer": 0, "explain": "Relativism as 'a method of seeing' means understanding a practice from inside while keeping that 'distinct' from approval.", "cover_story": "judging other cultures", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["We like to believe that the self is the one thing we bring into the world already ours, a core of pure individuality that society then either nurtures or represses. The study of socialization suggests something less flattering and more interesting: that the self is not the raw material of social life but one of its products. The child does not arrive with a finished identity awaiting expression; she assembles one, gradually, out of the responses of others, learning who she is by watching who they take her to be. We come to see ourselves, in a sense, reflected in the faces around us, and the image we call our personality is in part a portrait painted by other hands. To say this is not to deny that we are individuals. It is to notice that individuality itself is something we are taught.", "This has a consequence we are reluctant to accept, which is that the line between the self and society, so firm in our everyday speech, does not survive close inspection. The values we call our own were once instructions we absorbed before we could weigh them; the desires we experience as most intimately ours were shaped by a world that was choosing them for us long before we imagined we were choosing. None of this makes freedom an illusion, but it does relocate it. Freedom is not the possession of a self that stands outside society, for there is no such self to possess it. It is, more modestly, the capacity to examine what we have been made into and to revise it, a work that uses the very tools society gave us. We are its creatures, and our only route to self-authorship runs through, not around, that fact."], "source_ref": "OpenStax Introduction to Sociology 3e (Socialization)", "questions": [{"stem": "The central claim of the passage is that", "choices": ["the self exists fully formed before any social influence", "the self is largely a product of socialization rather than a pre-social core", "society has no real influence on individual identity", "human freedom is entirely an illusion"], "answer": 1, "explain": "The author holds 'the self is not the raw material of social life but one of its products,' assembled 'out of the responses of others.'", "cover_story": "the social self", "b": -1.4}, {"stem": "The image of 'a portrait painted by other hands' primarily serves to", "choices": ["convey that our sense of self is shaped by how others regard us", "argue that people cannot recognize their own faces", "prove that painting is more truthful than other arts", "suggest that personality is entirely inherited at birth"], "answer": 0, "explain": "We 'see ourselves ... reflected in the faces around us,' so identity is 'in part a portrait painted by other hands.'", "cover_story": "the social self", "b": 0.7}, {"stem": "The author's attitude toward the belief in a self that exists before society is", "choices": ["accepting, treating it as obviously correct", "skeptical, regarding it as flattering but unsupported by close inspection", "hostile toward anyone who questions it", "wholly indifferent"], "answer": 1, "explain": "The belief is 'flattering,' but the author says the self and society line 'does not survive close inspection.'", "cover_story": "the social self", "b": 0.0}, {"stem": "As used in the passage, 'creatures' most nearly means", "choices": ["wild animals", "beings shaped and produced by something else", "imaginary monsters", "wholly independent inventors"], "answer": 1, "explain": "To be society's 'creatures' is to be its products, beings it 'made,' consistent with the self as something assembled by others.", "cover_story": "the social self", "b": 0.2}, {"stem": "It can be inferred that the author locates human freedom in", "choices": ["a self that stands entirely outside society", "the capacity to examine and revise what socialization has made of us", "the complete rejection of every value one was taught", "the impossibility of ever changing one's identity"], "answer": 1, "explain": "Freedom is 'the capacity to examine what we have been made into and to revise it,' using 'the very tools society gave us.'", "cover_story": "the social self", "b": 0.7}, {"stem": "Which finding, if true, would most challenge the author's account of the self?", "choices": ["evidence that core features of a person's identity are fixed at birth and remain unchanged regardless of how others treat them", "evidence that children imitate the adults around them", "evidence that people absorb values before they can evaluate them", "evidence that individuals can later reflect on their upbringing"], "answer": 0, "explain": "The author claims the self is shaped by others' responses; an identity fixed at birth and immune to them would undermine that claim.", "cover_story": "the social self", "b": 1.3}]}, {"label": "Passage", "paragraphs": ["To the untrained eye, kinship looks like biology wearing a few local costumes. Everywhere there are mothers and fathers, everywhere children, and the anthropologist who catalogues the world's family systems can seem to be merely recording the same natural facts in a hundred dialects. But the closer one looks, the more the biology recedes and the costume turns out to be the substance. In many societies the man a child calls father is not the one who begot him but his mother's brother, or a line of ancestors, or whoever occupies a certain social role; the word we translate as mother may extend to a whole class of women. What counts as a relative, and what that relation demands, is decided not by blood but by rules that vary from people to people, rules that blood by itself could never dictate.", "This is why the anthropologist resists the easy assumption that our own arrangement, the small household bound by shared genes, is the natural form from which others deviate. It is one form among many, no more written into nature than the rest, and it answers needs that other systems answer differently. Kinship, properly understood, is less a map of who is related to whom than a scheme for assigning duties, inheritance, loyalty, and care, a way of organizing the cooperation without which no human group survives. Blood may furnish the raw metaphor, but it is the culture that decides what the metaphor will mean, drawing the circle of obligation now wide, now narrow, and filling it with persons that no genealogist would recognize as kin. To study kinship is thus to study not nature's dictates but one of the oldest and most inventive of human institutions."], "source_ref": "OpenStax Introduction to Anthropology (kinship and descent)", "questions": [{"stem": "The passage chiefly argues that kinship is", "choices": ["simply a record of biological relationships common to all of humanity", "a cultural institution that assigns obligations rather than a mere map of blood ties", "identical
