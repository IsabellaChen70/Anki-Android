s", "cover_story": "self study", "b": 0.6}, {"stem": "As children mature, they internalize the attitudes and expectations of society as a whole, not just those of a single playmate. Mead called this internalized set of expectations which of the following?", "choices": ["The generalized other", "The looking-glass self", "The hidden curriculum", "A reference group"], "answer": 0, "explain": "Mead's generalized other is the internalized sense of the expectations of the wider group or society, which guides behavior once role-taking is fully developed.", "concept": "8A", "skill": "concepts", "cover_story": "self study", "b": 0.9}, {"stem": "The researcher concludes that the self emerges through social experience rather than being present at birth. This conclusion best supports which view?", "choices": ["The self is innate and fixed from birth", "The self is a social product built through interaction", "The self is determined solely by genes", "The self cannot change after early childhood"], "answer": 1, "explain": "Both Mead and Cooley argued that the self is a social product that arises through interaction with others, not an innate trait present at birth.", "concept": "8A", "skill": "concepts", "cover_story": "self study", "b": -0.7}]}, {"label": "Two communities study", "paragraphs": ["A research team studies attitudes between two neighboring communities, the Reds and the Blues, who rarely mix. Members of each group tend to describe their own group as varied and full of unique individuals, but they describe the other group as all alike. When shown a news story about a single Blue who committed a crime, many Reds quickly conclude that Blues in general are dishonest. Surveys reveal that most Reds hold strongly negative feelings toward Blues even though few of them have ever spoken with a Blue in person. Some Reds go further and say they would refuse to hire a Blue applicant no matter how well qualified that person might be.", "The team also tracks how these attitudes change over time. During an economic downturn, Reds increasingly blame Blues for their lost jobs, even though the layoffs were plainly caused by a distant factory closing. In a separate program, small groups of Reds and Blues are brought together to work as equals toward a shared goal, such as repairing a flooded community park. After weeks of genuine cooperation, the Reds who took part report far warmer views of Blues than Reds who did not participate. The researchers stress that simply placing the two groups in the same room was not enough; only meaningful cooperation toward a common aim reduced the hostility."], "source_ref": "OpenStax Introduction to Sociology 3e, Ch. 11 (Race and Ethnicity)", "questions": [{"stem": "Members of each group see their own group as full of unique individuals but view the other group as all alike. This tendency is best called which of the following?", "choices": ["The out-group homogeneity effect", "The self-serving bias", "The fundamental attribution error", "Deindividuation"], "answer": 0, "explain": "The out-group homogeneity effect is the tendency to see members of an out-group as more similar to one another than members of one's own in-group, who appear more varied.", "concept": "8B", "skill": "concepts", "cover_story": "two communities", "b": 0.4}, {"stem": "The warm loyalty Reds feel toward fellow Reds, paired with suspicion of Blues, best reflects which of the following?", "choices": ["In-group favoritism", "Role strain", "The looking-glass self", "Altruism"], "answer": 0, "explain": "In-group favoritism, or in-group bias, is the tendency to favor and trust members of one's own group over those of an out-group.", "concept": "8B", "skill": "concepts", "cover_story": "two communities", "b": -0.4}, {"stem": "Seeing one Blue commit a crime and concluding that Blues in general are dishonest is best described as which of the following?", "choices": ["Applying a stereotype", "Discrimination", "Cognitive dissonance", "The contact hypothesis"], "answer": 0, "explain": "A stereotype is an overgeneralized belief applied to a whole group; discrimination would be an action, such as unequal treatment, rather than a belief.", "concept": "8B", "skill": "concepts", "cover_story": "two communities", "b": -0.6}, {"stem": "Some Reds say they would refuse to hire any Blue applicant regardless of qualifications. This refusal is best classified as which of the following?", "choices": ["Prejudice", "Discrimination", "A stereotype", "Out-group homogeneity"], "answer": 1, "explain": "Discrimination is unequal treatment based on group membership, the behavioral component, distinct from prejudice, which is the negative attitude or feeling.", "concept": "8B", "skill": "concepts", "cover_story": "two communities", "b": 0.2}, {"stem": "During the downturn, Reds blame Blues for job losses that were actually caused by a distant factory closing. This displacement of blame onto a vulnerable group best illustrates which of the following?", "choices": ["Scapegoating", "The self-fulfilling prophecy", "The mere exposure effect", "Role conflict"], "answer": 0, "explain": "Scapegoat theory holds that a frustrated group blames a vulnerable out-group for problems it did not cause, as when Reds fault Blues for layoffs due to a factory closing.", "concept": "8B", "skill": "concepts", "cover_story": "two communities", "b": 0.7}, {"stem": "Hostility falls only after Reds and Blues cooperate as equals toward a shared goal, not merely from sharing a room. This finding best supports which of the following?", "choices": ["The contact hypothesis, which stresses cooperative, equal-status contact", "The just-world hypothesis", "Social loafing", "The out-group homogeneity effect"], "answer": 0, "explain": "The contact hypothesis holds that intergroup prejudice drops when groups meet under conditions of equal status and cooperation toward common goals, not from mere exposure alone.", "concept": "8B", "skill": "concepts", "cover_story": "two communities", "b": 1.0}]}, {"label": "Small town networks", "paragraphs": ["A sociologist maps the social ties of people living in a small town. She notes that each resident keeps a close circle of family and lifelong friends, a circle marked by warmth, deep loyalty, and steady face-to-face care. Each person also belongs to larger, more impersonal circles, such as a workplace or a professional association, where the ties are built around shared tasks rather than affection. The researcher pays special attention to group size, comparing a married couple with a three-person planning committee and with a two-hundred-member club, and she carefully records how the intimacy, stability, and decision making of these groupings differ from one another as members are added.", "The study also looks at how groups shape everyday behavior. A local sports team feels intense pride in its own members and a sharp rivalry toward a neighboring team across the river. Several residents, though far from wealthy, judge their own success by constantly comparing themselves to a circle of famous entrepreneurs they follow online but have never met. The town's main employer is a large agency run by written rules, ranked offices, and formal procedures, where workers are hired and promoted on documented qualifications. One manager there leads by seeking group input and building consensus, while another simply issues orders and expects them to be obeyed."], "source_ref": "OpenStax Introduction to Sociology 3e, Ch. 6 (Groups and Organization)", "questions": [{"stem": "The close circle of family and lifelong friends, marked by warmth and deep loyalty, is best described as which of the following?", "choices": ["A primary group", "A secondary group", "An out-group", "A formal organization"], "answer": 0, "explain": "A primary group is small, enduring, and emotionally close, such as family and close friends; secondary groups are larger and more impersonal.", "concept": "8C", "skill": "concepts", "cover_story": "small town networks", "b": -0.7}, {"stem": "A workplace or professional association, where ties are built around shared tasks rather than affection, is best described as which of the following?", "choices": ["A primary group", "A secondary group", "A reference group", "A dyad"], "answer": 1, "explain": "Secondary groups are larger, more impersonal, and organized around specific goals or tasks, in contrast to the intimate bonds of a primary group.", "concept": "8C", "skill": "concepts", "cover_story": "small town networks", "b": -0.3}, {"stem": "The researcher finds the two-person couple more intimate but more fragile than the three-person committee. Compared with larger groups, a two-person group, or dyad, is best described as which of the following?", "choices": ["The most stable and least intimate group", "The most intimate but least stable group", "Identical in stability to a triad", "A secondary group by definition"], "answer": 1, "explain": "As Simmel noted, a dyad is the most intimate grouping but also the least stable, since it collapses if either member leaves; adding a third person increases stability.", "concept": "8C", "skill": "concepts", "cover_story": "small town networks", "b": 1.0}, {"stem": "The sports team feels pride in its own members and rivalry toward a neighboring team. From the first team's view, the rival team is best described as which of the following?", "choices": ["An in-group", "An out-group", "A primary group", "A reference group"], "answer": 1, "explain": "An out-group is a group toward which one feels competition or opposition, whereas the in-group is the group one identifies with and feels loyalty toward.", "concept": "8C", "skill": "concepts", "cover_story": "small town networks", "b": -0.1}, {"stem": "Residents judge their own success by comparing themselves to famous entrepreneurs they follow but have never met. These entrepreneurs serve as which of the following?", "choices": ["A reference group", "A primary group", "An in-group", "A dyad"], "answer": 0, "explain": "A reference group is one people use as a standard for self-evaluation, even when they are not members; primary and in-groups instead involve actual membership or identification.", "concept": "8C", "skill": "concepts", "cover_story": "small town networks", "b": 0.3}, {"stem": "The large employer, run by written rules, ranked offices, formal procedures, and hiring based on documented qualifications, best fits which concept?", "choices": ["A bureaucracy", "A primary group", "A total institution", "A dyad"], "answer": 0, "explain": "A bureaucracy is a formal organization marked by written rules, a clear hierarchy of offices, and impersonal, merit-based procedures, as Weber described.", "concept": "8C", "skill": "concepts", "cover_story": "small town networks", "b": 0.5}]}, {"label": "Two cultures study", "paragraphs": ["A cultural anthropologist compares daily life in two different societies. She carefully catalogs each group's physical objects, such as its tools, clothing, and buildings, and separately records their shared ideas, such as beliefs about honesty, family, and the afterlife. In one society, facing your open palm outward is a warm greeting, while in the other the very same gesture is a grave insult. The researcher notes that a red traffic light means stop in both places only because the people there agree that it does. Throughout her fieldwork she is careful to describe each custom in its own terms rather than measuring it against the standards of her home country.", "The study distinguishes several kinds of social rules. Chewing loudly at dinner draws only mild frowns and quiet disapproval, while stealing from a neighbor brings severe punishment, and harming a child is treated as an unspeakable wrong that people will not even discuss. The anthropologist also finds that technology often races ahead of shared beliefs: one society has acquired powerful new medical machines but has not yet worked out the ethical rules for using them. Within the larger society, a small group of artists shares a distinctive style of dress and slang while still accepting most of the wider culture's basic rules and values."], "source_ref": "OpenStax Introduction to Sociology 3e, Ch. 3 (Culture)", "questions": [{"stem": "The physical objects a society makes, such as its tools, clothing, and buildings, are best described as which of the following?", "choices": ["Material culture", "Nonmaterial culture", "Mores", "Symbols"], "answer": 0, "explain": "Material culture consists of the tangible objects a society produces, whereas nonmaterial culture consists of intangible ideas, values, and beliefs.", "concept": "9A", "skill": "concepts", "cover_story": "two cultures", "b": -0.8}, {"stem": "A red traffic light means stop in both societies only because the people there agree that it does. An object or gesture that carries such an agreed-upon meaning is best called which of the following?", "choices": ["A symbol", "A value", "A taboo", "A sanction"], "answer": 0, "explain": "A symbol is anything, such as a gesture or a colored light, that carries a shared, agreed-upon meaning within a culture; values are instead abstract standards of what is good or desirable.", "concept": "9A", "skill": "concepts", "cover_story": "two cultures", "b": -0.2}, {"stem": "Chewing loudly draws only mild disapproval, while stealing from a neighbor brings severe punishment. In order, these two kinds of norms are best described as which of the following?", "choices": ["Folkways and mores", "Mores and folkways", "Taboos and folkways", "Values and beliefs"], "answer": 0, "explain": "Folkways are everyday customs whose violation brings mild disapproval, while mores are norms with strong moral weight whose violation brings serious sanctions.", "concept": "9A", "skill": "concepts", "cover_story": "two cultures", "b": 0.6}, {"stem": "Harming a child is treated as an unspeakable wrong that people will not even discuss. Such a norm, whose violation triggers deep revulsion, is best called which of the following?", "choices": ["A folkway", "A taboo", "A value", "A symbol"], "answer": 1, "explain": "A taboo is the strongest kind of norm, one so deeply held that its violation is met with disgust; folkways are far milder everyday customs.", "concept": "9A", "skill": "concepts", "cover_story": "two cultures", "b": 0.4}, {"stem": "One society has advanced medical machines but has not yet developed ethical rules for using them, so its technology has outpaced its beliefs. This gap is best described as which of the following?", "choices": ["Cultural lag", "Culture shock", "Ethnocentrism", "Cultural diffusion"], "answer": 0, "explain": "Cultural lag is the delay between a change in material culture, such as new technology, and the adjustment of nonmaterial culture, such as norms and ethics.", "concept": "9A", "skill": "concepts", "cover_story": "two cultures", "b": 1.0}, {"stem": "The anthropologist describes each custom in its own terms rather than judging it against her home country's standards. This approach is best called which of the following?", "choices": ["Ethnocentrism", "Cultural relativism", "Assimilation", "Xenocentrism"], "answer": 1, "explain": "Cultural relativism assesses a culture by its own standards rather than those of another culture; ethnocentrism instead judges other cultures by one's own.", "concept": "9A", "skill": "concepts", "cover_story": "two cultures", "b": 0.2}]}, {"label": "Social movements study", "paragraphs": ["A sociologist studies how large groups of people push for social change. In one city, residents who compare their own stagnant wages to the soaring wealth of a nearby district grow deeply angry and begin to organize protests, even though their own incomes have not actually fallen. A well-funded organization then provides meeting space, legal help, and media contacts, and the movement grows quickly as a result. The researcher classifies the various efforts by their aims: some seek only small changes to a single law, while others seek to overturn the entire political and economic order. Still other groups form mainly to block a change that is already underway in the city.", "The study also examines broader, slower shifts. Faster travel, expanding global trade, and instant communication increasingly link the city's fortunes to distant events on the other side of the world. When a rumor spreads online that a local bank is failing, thousands of people rush to withdraw their money within hours, and the panic itself very nearly topples the bank. The researcher observes that newer movements often coordinate through social media, allowing strangers scattered across many countries to organize a single coordinated day of protest. Over decades, all of these forces gradually reshape the city's institutions, its laws, and the shared expectations of its residents."], "source_ref": "OpenStax Introduction to Sociology 3e, Ch. 21 (Social Movements and Social Change)", "questions": [{"stem": "Residents grow angry after comparing their wages to a wealthier district, even though their own incomes have not fallen. This sense of unfair disadvantage is best described as which of the following?", "choices": ["Relative deprivation", "Absolute poverty", "Social facilitation", "Cultural lag"], "answer": 0, "explain": "Relative deprivation is the feeling of being unfairly worse off compared with others, which can spark movements even when conditions have not objectively declined; absolute poverty is instead a fixed lack of basic necessities.", "concept": "9B", "skill": "concepts", "cover_story": "social movements study", "b": 0.4}, {"stem": "The movement grows quickly once an organization supplies meeting space, legal help, and media contacts. This emphasis on organized assets is central to which perspective?", "choices": ["Resource mobilization theory", "Relative deprivation theory", "Demographic transition theory", "The looking-glass self"], "answer": 0, "explain": "Resource mobilization theory holds that a movement's success depends on access to resources such as money, organization, and media, not on shared grievances alone.", "concept": "9B", "skill": "concepts", "cover_story": "social movements study", "b": 1.0}, {"stem": "A movement that seeks only a small change to a single law, rather than a sweeping overhaul, is best classified as which of the following?", "choices": ["A reform movement", "A revolutionary movement", "A resistance movement", "A countercultural movement"], "answer": 0, "explain": "Reform movements seek limited change within the existing system, whereas revolutionary movements aim to transform the entire social or political order.", "concept": "9B", "skill": "concepts", "cover_story": "social movements study", "b": 0.0}, {"stem": "A movement that seeks to overturn the entire political and economic order is best classified as which of the following?", "choices": ["A reform movement", "A revolutionary movement", "An alternative movement", "A redemptive movement"], "answer": 1, "explain": "Revolutionary movements aim to replace the whole existing system, a far broader goal than the limited aims of a reform movement.", "concept": "9B", "skill": "concepts", "cover_story": "social movements study", "b": 0.3}, {"stem": "Faster travel, global trade, and instant communication increasingly tie the city's fortunes to distant events. This growing interconnection of societies is best described as which of the following?", "choices": ["Globalization", "Urbanization", "Assimilation", "Gentrification"], "answer": 0, "explain": "Globalization is the increasing economic, political, and cultural interconnection of societies across the world; urbanization instead refers to population growth concentrated in cities.", "concept": "9B", "skill": "concepts", "cover_story": "social movements study", "b": -0.6}, {"stem": "A rumor spreads online and thousands rush to withdraw money within hours, and the panic itself nearly topples the bank. This rapid, unplanned group reaction is best described as which of the following?", "choices": ["Collective behavior", "A revolutionary movement", "A bureaucracy", "A total institution"], "answer": 0, "explain": "Collective behavior is the spontaneous, relatively unstructured response of many people to an ambiguous or threatening situation, such as a bank panic driven by rumor; a social movement is far more organized and sustained.", "concept": "9B", "skill": "concepts", "cover_story": "social movements study", "b": 0.6}]}, {"label": "Global inequality study", "paragraphs": ["An economist compares nations sitting at very different levels of wealth. A small number of rich countries own most of the world's factories, banks, and advanced technology, and they buy cheap raw materials from poorer nations. A middle tier of countries is industrializing rapidly, while the poorest nations mainly export raw materials and depend heavily on the wealthy ones for finished goods. In several of the poorest countries, families struggle to survive on less than what is needed for adequate food, clean water, and shelter. The researcher contrasts them with a wealthy country where even the poorest residents have far more than the global poor, yet still feel deprived compared with their richer neighbors down the street.", "Analysts offer competing explanations for these gaps. Some argue that poor nations stay poor because wealthy nations exploit them, extracting resources and cheap labor while keeping the profits for themselves. Others argue that poor nations simply need to adopt the technology, schooling, and cultural habits that once let rich nations industrialize. The researcher also documents striking health differences: children born in the poorest nations die far younger and suffer more preventable disease than children in the richest ones. Even within a single wealthy city, residents of a neglected and polluted district face far worse health than people living just ", "The culture of poverty"], "answer": 1, "explain": "Relative poverty is measured against the living standards of one's own society, so people can be relatively poor even while meeting basic survival needs.", "concept": "10A", "skill": "concepts", "cover_story": "global inequality study", "b": 0.3}, {"stem": "The claim that poor nations stay poor because wealthy nations exploit their resources and labor best reflects which perspective?", "choices": ["Dependency theory", "Modernization theory", "The Davis-Moore thesis", "The cornucopian view"], "answer": 0, "explain": "Dependency theory argues that global poverty results from wealthy nations exploiting poorer ones; modernization theory instead attributes poverty to poor nations' own institutions and culture.", "concept": "10A", "skill": "concepts", "cover_story": "global inequality study", "b": 1.1}, {"stem": "Children in the poorest nations die younger and suffer more preventable disease than those in rich nations, and neglected districts within a city fare worse than nearby wealthy ones. These patterns are best described as which of the following?", "choices": ["Health disparities tied to social and spatial inequality", "Random variation unrelated to social class", "The demographic transition", "Absolute mobility"], "answer": 0, "explain": "Systematic differences in health that track wealth and neighborhood are health disparities produced by social and spatial inequality, not random variation.", "concept": "10A", "skill": "concepts", "cover_story": "global inequality study", "b": 0.0}]}, {"label": "Testing a study-skills claim", "paragraphs": ["A learning researcher wants to test the popular claim that spacing study out over several days beats cramming it into one night. In a first version, volunteers pick whichever schedule they prefer: one group studies a word list in a single massed evening, another studies the same list spread across four evenings. Everyone is given a recall test later.", "A reviewer points o nged, and its effect can be overcome by adding a large excess of substrate, which outcompetes the inhibitor.", "source": "Concept: reversible enzyme inhibition and its effect on kinetic parameters. Verify against OpenStax Biology 2e, ch. 6 'Metabolism'.", "locator": "src_enzyme_inhibition#s1-s2"}, "To work out whether the drug is a competitive or a noncompetitive inhibitor, the most informative experiment measures the reaction rate:": {"text": "A competitive inhibitor can be overcome by a large excess of substrate while a noncompetitive inhibitor cannot, so measuring the rate with and without the drug across substrate concentrations distinguishes the two.", "source": "Concept: reversible enzyme inhibition and its effect on kinetic parameters. Verify against OpenStax Biology 2e, ch. 6 'Metabolism'.", "locator": "src_enzyme_inhibition#s0-s5"}}, "psych_soc": {"Students quizzed during learning later outperform those who only reread. This finding is best labeled as which of the following?": {"text": "The testing effect, also called retrieval practice, is the finding that actively recalling information strengthens memory more than simply rereading it.", "source": "Concept: the testing effect. Verify against Roediger & Karpicke (2006), Psychological Science 17(3), 249-255.", "locator": "src_testing_effect#s0"}, "Participants credit their good grades to ability but blame bad grades on unfair tests. This pattern is best described as which of the following?": {"text": "The self-serving bias attributes one's own successes to internal factors like ability and one's failures to external factors like circumstances.", "source": "Concept: attribution biases. Verify against Ross (1977), Advances in Experimental Social Psychology 10, 173-220.", "locator": "src_attribution#s0"}, "Participants call the rude driver a bad person while blaming their own rude driving on being rushed. Their judgment of the other driver reflects which of the following?": {"text": "The fundamental attribution           { stem: "The author's overall stance toward \"never being bored\" is:", choices: ["approving", "critical, viewing it as a hidden loss", "neutral", "celebratory"], answer: 1, explain: "The essay frames curing boredom as a loss of mental freedom, a critical stance." },
