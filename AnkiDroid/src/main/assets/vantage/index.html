 in structure across every human society", "an arrangement with no connection to cooperation or survival"], "answer": 1, "explain": "Kinship is 'less a map of who is related to whom than a scheme for assigning duties,' one of 'the oldest ... human institutions.'", "cover_story": "kinship and belonging", "b": -1.3}, {"stem": "The examples of a child's 'father' being the mother's brother, or 'mother' extending to many women, serve primarily to", "choices": ["show that kinship categories are set by cultural rules rather than by blood", "prove that people in other societies are confused about biology", "argue that everyone in the world has the same family structure", "demonstrate that language has no effect on kinship"], "answer": 0, "explain": "These cases show that 'what counts as a relative ... is decided not by blood but by rules that vary from people to people.'", "cover_story": "kinship and belonging", "b": 0.7}, {"stem": "The author's attitude toward treating the small household bound by shared genes as the natural family form is", "choices": ["accepting, since it is written into nature", "resistant, viewing it as merely one form among many", "hostile toward those who live in such households", "uninterested in the question"], "answer": 1, "explain": "The anthropologist 'resists the easy assumption' that this arrangement is 'the natural form,' calling it 'one form among many.'", "cover_story": "kinship and belonging", "b": 0.0}, {"stem": "As used in the passage, 'furnish' most nearly means", "choices": ["to decorate with objects", "to provide or supply", "to conceal from view", "to pay for in advance"], "answer": 1, "explain": "'Blood may furnish the raw metaphor' means blood supplies it, while culture decides its meaning.", "cover_story": "kinship and belonging", "b": 0.1}, {"stem": "It can be inferred that the author regards the relationship between blood and kinship as one in which", "choices": ["blood determines exactly who counts as kin", "culture decides what a biological connection is taken to mean", "biology and culture play no role at all", "kinship terms perfectly track genetic relatedness everywhere"], "answer": 1, "explain": "'Blood may furnish the raw metaphor, but it is the culture that decides what the metaphor will mean.'", "cover_story": "kinship and belonging", "b": 0.6}, {"stem": "Which practice best supports the author's view of kinship?", "choices": ["a society in which adopted outsiders take on the full duties and inheritance rights of blood relatives", "a society in which family membership is determined solely by genetic testing", "a community that keeps no record of ancestry at all", "a group in which no one owes anything to relatives"], "answer": 0, "explain": "Adopted members gaining full kin duties shows kinship as 'a scheme for assigning duties' filled with 'persons that no genealogist would recognize.'", "cover_story": "kinship and belonging", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["In the marketplace a transaction is designed to end. I pay, you deliver, and the moment the exchange is balanced our obligation to each other is discharged; we may walk away as strangers, owing nothing. The gift works by the opposite principle. To give is not to settle an account but to open one, to place the receiver under a debt that a return, when it comes, will not so much cancel as continue. Anthropologists who studied the exchange of gifts in many societies noticed that its purpose was rarely the efficient movement of goods, which markets accomplish better, but the weaving of a bond. What travels in the gift is not only the object but a piece of the relationship, and to refuse to give, to receive, or in time to give back is to decline the relationship itself.", "It is tempting to read this as a charming inefficiency, a primitive stage that the invention of money and price at last cleared away. But the temptation should be resisted, for the logic of the gift has not vanished; it has only retreated into the regions of life we most care about. We still give at birthdays and weddings, still bristle at the friend who tries to repay a dinner in exact cash, still sense that to reduce certain exchanges to their market value is to insult them. What the anthropology of the gift reveals is not a curiosity of distant peoples but a grammar we ourselves still speak, one in which the deliberate refusal to balance the books is the very thing that turns a transaction into a tie. The market ends relationships on purpose. The gift, on purpose, refuses to let them end."], "source_ref": "OpenStax Introduction to Anthropology (economic anthropology: exchange and reciprocity)", "questions": [{"stem": "The central contrast the passage draws is between", "choices": ["gifts, which build lasting bonds, and market transactions, which are designed to conclude", "ancient economies, which were efficient, and modern ones, which are wasteful", "generous people and selfish people", "goods that are useful and goods that are merely decorative"], "answer": 0, "explain": "A market transaction 'is designed to end,' whereas 'to give ... is to open' an account and weave 'a bond.'", "cover_story": "the logic of gifts", "b": -1.3}, {"stem": "The example of the friend who 'tries to repay a dinner in exact cash' serves primarily to", "choices": ["show that the logic of the gift still operates in modern life", "argue that people should never spend money on their friends", "prove that cash is the most polite form of thanks", "illustrate the efficiency of the modern market"], "answer": 0, "explain": "That we 'bristle' at exact repayment shows 'the logic of the gift has not vanished' but persists among us.", "cover_story": "the logic of gifts", "b": 0.8}, {"stem": "The author regards the view that the gift is a 'primitive stage' cleared away by money as", "choices": ["convincing and well supported", "a temptation that should be resisted", "the main thesis of the passage", "irrelevant to modern life"], "answer": 1, "explain": "The author writes 'the temptation should be resisted, for the logic of the gift has not vanished.'", "cover_story": "the logic of gifts", "b": -0.1}, {"stem": "As used in the passage, 'discharged' most nearly means", "choices": ["dismissed from a job", "released or fulfilled so that nothing remains owed", "increased in size", "recorded for later collection"], "answer": 1, "explain": "When 'the exchange is balanced our obligation ... is discharged,' meaning it is settled and nothing is owed.", "cover_story": "the logic of gifts", "b": 0.1}, {"stem": "It can be inferred that the author considers the 'inefficiency' of gift exchange to be", "choices": ["a flaw that money rightly corrected", "the very feature that allows it to create lasting ties", "proof that gift-giving societies were poorer", "unrelated to the building of relationships"], "answer": 1, "explain": "'The deliberate refusal to balance the books is the very thing that turns a transaction into a tie.'", "cover_story": "the logic of gifts", "b": 0.7}, {"stem": "Which observation, if true, would most strengthen the author's claim that the logic of the gift persists in modern life?", "choices": ["that people in wealthy market societies feel offended when an intimate favor is met with an exact cash payment", "that modern shoppers reliably prefer the lowest available price", "that gift exchange has disappeared entirely from industrial societies", "that ancient peoples used money for some of their purchases"], "answer": 0, "explain": "Offense at repaying an intimate favor in cash is exactly the persistence of gift logic the author describes.", "cover_story": "the logic of gifts", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["Power, in its rawest form, is only the ability to make others do what they would not otherwise choose, and a state that possessed nothing more than this would be indistinguishable from a well-armed robber. What separates the two is not the amount of force at their disposal but a quality harder to see, which political thinkers call legitimacy: the widespread belief that a power has the right to command and that its commands ought to be obeyed. A government rules far less by the soldiers it can deploy than by the conviction, carried quietly in the minds of the governed, that its rule is proper. When that conviction is present, laws are mostly kept without the need to enforce them; when it drains away, no quantity of police can supply its absence, and a regime that must compel every act of obedience has already begun to fall.", "This exposes a paradox at the heart of political order. The state appears to be the strongest thing in society, and in a sense it is; yet its strength rests on something it cannot simply manufacture, a belief in its right to rule that must be granted by the very people it governs. Legitimacy cannot be seized the way a palace can. It is earned, or inherited, or slowly squandered, and a ruler who forgets this, mistaking the machinery of coercion for the source of his authority, saws at the branch that holds him. The most durable power is thus the power least often used, the authority so accepted that it seldom needs to show its hand. What looks like weakness, the dependence of the mighty on the opinion of the governed, turns out to be the hidden condition of every stable rule, and the tyrant's error is to believe he has escaped it."], "source_ref": "OpenStax Introduction to Political Science (power, authority, and legitimacy)", "questions": [{"stem": "The passage's central claim is that a stable government depends less on force than on", "choices": ["the size of its army and police", "the governed's belief that its rule is rightful", "the personal wealth of its rulers", "the complete absence of any laws"], "answer": 1, "explain": "A government 'rules far less by the soldiers it can deploy than by the conviction ... that its rule is proper.'", "cover_story": "power and legitimacy", "b": -1.4}, {"stem": "The comparison of a merely powerful state to 'a well-armed robber' serves primarily to", "choices": ["distinguish naked power from legitimate authority", "argue that all governments are essentially criminal", "prove that robbers are as effective as governments", "praise states for their superior weaponry"], "answer": 0, "explain": "The robber has force but lacks 'legitimacy,' the quality that 'separates the two.'", "cover_story": "power and legitimacy", "b": 0.7}, {"stem": "The author's attitude toward a ruler who trusts coercion as the source of his authority is", "choices": ["approving of his realism", "critical, seeing him as undermining his own rule", "indifferent to his fate", "envious of his power"], "answer": 1, "explain": "Such a ruler 'saws at the branch that holds him,' mistaking 'the machinery of coercion for the source of his authority.'", "cover_story": "power and legitimacy", "b": 0.0}, {"stem": "As used in the passage, 'squandered' most nearly means", "choices": ["carefully saved", "wastefully lost", "forcibly seized", "legally transferred"], "answer": 1, "explain": "Legitimacy is 'earned, or inherited, or slowly squandered,' set against being gained, so squandered means wastefully lost.", "cover_story": "power and legitimacy", "b": 0.2}, {"stem": "It can be inferred that the author regards a regime that 'must compel every act of obedience' as", "choices": ["at the very height of its strength", "already in the process of losing its authority", "more legitimate than one that is freely obeyed", "wholly unaffected by the opinion of the governed"], "answer": 1, "explain": "Such a regime 'has already begun to fall,' because coercion 'cannot supply' the missing conviction.", "cover_story": "power and legitimacy", "b": 0.7}, {"stem": "Which situation best illustrates the author's account of legitimacy?", "choices": ["a long-standing government whose laws are widely obeyed even where enforcement is thin", "an occupying force that controls territory only where its troops are physically present", "a wealthy ruler admired chiefly for his personal fortune", "a leader who stays in power purely by paying his soldiers well"], "answer": 0, "explain": "Laws 'kept without the need to enforce them' exemplify authority resting on 'the conviction ... that its rule is proper.'", "cover_story": "power and legitimacy", "b": 1.3}]}, {"label": "Passage", "paragraphs": ["No one ever signed the social contract, and this is the first objection every student raises against it. There was no gathering of free individuals in a state of nature who, weary of mutual fear, agreed to trade a portion of their liberty for the protection of a common power. The scene is a fiction, and its authors mostly knew it. But to dismiss the idea on these grounds is to misunderstand what kind of claim it makes. The contract was never offered as a historical event to be dated and verified; it is a device for asking a question that history cannot answer, namely what arrangements free and equal people could accept as binding on themselves. Its truth, if it has one, is not in the past but in the present, in whether the order we actually live under could have been agreed to by those it governs.", "Read this way, the contract becomes less a story about how states began than a standard by which they may be judged. A government that could not have won the consent of reasonable people, that rests on the plain subjection of some to the advantage of others, fails a test the metaphor quietly sets, whatever its origins in conquest or inheritance. This is why the fiction has outlived every attempt to refute it on factual grounds. It was doing something other than reporting facts. It was giving political obligation a foundation in agreement rather than in mere force or custom, and thereby handing the governed a question they could put to any power above them: not merely can you compel me, but could I have consented to this? A regime that cannot bear the question has told us something about itself, and the imaginary contract has done its wholly real work."], "source_ref": "OpenStax Introduction to Political Science (the social contract tradition)", "questions": [{"stem": "The central argument of the passage is that the social contract", "choices": ["should be rejected because no such agreement ever historically occurred", "is best understood as a standard for judging governments, not a historical event", "describes a real meeting of people in a state of nature", "proves that all existing governments are legitimate"], "answer": 1, "explain": "The contract 'becomes less a story about how states began than a standard by which they may be judged.'", "cover_story": "the social contract", "b": -1.4}, {"stem": "The author raises the objection that 'no one ever signed the social contract' primarily in order to", "choices": ["set up a misunderstanding that he then corrects", "concede that the idea is worthless", "prove that governments arise only by force", "show that students rarely study political theory"], "answer": 0, "explain": "The objection 'misunderstand[s] what kind of claim' the contract makes, which the author goes on to clarify.", "cover_story": "the social contract", "b": 0.7}, {"stem": "The author's attitude toward the social contract is best described as", "choices": ["dismissive of it as an exploded fiction", "defensive of its value once its purpose is properly understood", "indifferent to whether it is true or useful", "convinced that it records real historical events"], "answer": 1, "explain": "The author says 'the fiction has outlived every attempt to refute it' because it does 'wholly real work' as a standard.", "cover_story": "the social contract", "b": 0.0}, {"stem": "As used in the passage, 'device' most nearly means", "choices": ["a mechanical instrument", "a means for accomplishing a purpose", "a decorative emblem", "a clever deception"], "answer": 1, "explain": "The contract is 'a device for asking a question,' meaning a tool or means, not a machine or a trick.", "cover_story": "the social contract", "b": 0.2}, {"stem": "It can be inferred that the author would judge a government illegitimate if", "choices": ["it could not have won the consent of reasonable people", "it did not originate in a signed written agreement", "it was founded by conquest but now rules by consent", "it asks its citizens difficult questions"], "answer": 0, "explain": "A government 'that could not have won the consent of reasonable people ... fails a test the metaphor quietly sets.'", "cover_story": "the social contract", "b": 0.7}, {"stem": "Which of the following, if established, would most weaken the author's defense of the social contract?", "choices": ["that judging governments by hypothetical consent yields no clearer verdict than judging them by force or custom does", "that no historical assembly ever met to sign a contract", "that some governments arose through conquest", "that students often object to the idea when they first meet it"], "answer": 0, "explain": "The defense rests on the contract providing a usable standard of legitimacy; if it yields no clearer verdict, that defense fails.", "cover_story": "the social contract", "b": 1.3}]}, {"label": "Passage", "paragraphs": ["The most disenchanting idea in economics is also its most honest: that we cannot have everything, and that every choice is therefore a small act of loss. Because our time, money, and attention are finite while our wants are not, to spend a resource on one thing is necessarily to withhold it from another, and the true cost of anything is not the price on its tag but the best alternative we gave up to obtain it. Economists call this the opportunity cost, and it is easy to say and hard to feel. The hour spent on one task is not merely an hour; it is every other task that hour might have held. Seen clearly, no choice is free, not because someone charges for it, but because the world will not let us do two things with the same resource at the same time.", "There is a temptation to find this bleak, as though economics had come to announce that life is a ledger of sacrifices. But the same principle that names the cost also clarifies the value. If choosing one thing means forgoing another, then to choose well is to know what we are willing to give up, and a person who refuses ever to accept a cost is not richer in possibilities but poorer in direction, forever unwilling to trade any option for any outcome. The discipline of opportunity cost is thus not a counsel of gloom but of seriousness. It asks us to price our choices in the only currency that finally matters, the other lives we might have led, and to decide, knowing the exchange rate, which of them we are prepared to let go. To grasp scarcity is not to mourn abundance but to take one's freedom seriously enough to spend it."], "source_ref": "OpenStax Principles of Economics 3e (scarcity, choice, and opportunity cost)", "questions": [{"stem": "The passage principally argues that the idea of opportunity cost", "choices": ["proves that economic life is nothing but a series of losses", "shows that careful choice requires knowing what one is willing to give up", "demonstrates that resources are effectively unlimited", "means that the true cost of a thing is simply its price"], "answer": 1, "explain": "The author reframes opportunity cost as 'a counsel ... of seriousness,' asking us to know 'what we are willing to give up.'", "cover_story": "scarcity and choice", "b": -1.3}, {"stem": "The statement that an hour spent on one task 'is every other task that hour might have held' serves primarily to", "choices": ["make vivid the idea that the cost of a choice is the alternative forgone", "argue that people should work fewer hours", "prove that time can be created whenever it is needed", "show that all tasks are equally valuable"], "answer": 0, "explain": "It illustrates opportunity cost: the hour's 'true cost' is 'the best alternative we gave up.'", "cover_story": "scarcity and choice", "b": 0.7}, {"stem": "The author's attitude toward the view that opportunity cost makes life 'a ledger of sacrifices' is", "choices": ["full agreement with its gloom", "resistant, reframing the idea as one of seriousness rather than gloom", "indifferent to how the idea is felt", "convinced that the idea is simply false"], "answer": 1, "explain": "The author calls the discipline 'not a counsel of gloom but of seriousness,' resisting the bleak reading.", "cover_story": "scarcity and choice", "b": 0.0}, {"stem": "As used in the passage, 'forgoing' most nearly means", "choices": ["giving up or doing without", "paying a fee for", "looking forward to", "completing well in advance"], "answer": 0, "explain": "'Choosing one thing means forgoing another,' that is, giving up the alternative.", "cover_story": "scarcity and choice", "b": 0.1}, {"stem": "It can be inferred that the author regards a person who 'refuses ever to accept a cost' as", "choices": ["wisely preserving every possible option", "lacking direction rather than gaining freedom", "the model of good economic reasoning", "immune to the demands of scarcity"], "answer": 1, "explain": "Such a person is 'not richer in possibilities but poorer in direction, forever unwilling to trade any option for any outcome.'", "cover_story": "scarcity and choice", "b": 0.6}, {"stem": "Which decision best reflects the 'seriousness' the author recommends?", "choices": ["turning down an appealing job after recognizing it would cost time one values more elsewhere", "accepting every opportunity offered so as to keep all options open", "choosing an option solely because it carries the lowest price tag", "refusing to decide until every possible cost has been eliminated"], "answer": 0, "explain": "Weighing the job against 'the other lives we might have led' and knowingly letting one go is exactly the 'seriousness' the author urges.", "cover_story": "scarcity and choice", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["The oldest lesson in economics is that a task broken into parts and shared among specialists is done far more abundantly than by each worker laboring alone. One person drawing the wire, another straightening it, a third cutting, a fourth pointing, and a pin factory produces in a day what a single artisan could scarcely make in a year. From this simple observation an enormous prosperity has been argued into being, and the argument is sound: specialization multiplies output, lowers cost, and has lifted more people from want than any decree of charity ever could. The wealth of modern societies is in large part the compounded yield of this one principle, applied and reapplied until the making of almost anything is divided among hands that never meet and often do not know what the others are for.", "And yet the same division that enriches the society can diminish the worker within it. The man who spends his life performing a single motion, one operation of the dozens a finished object requires, gains dexterity at that motion and loses, slowly, the fuller competence of the artisan who once saw a thing through from raw stuff to finished form. He grows rich in output and narrow in scope, a specialist who may no longer understand the whole to which he contributes. To notice this is not to wish the division of labor away, for its fruits are too real and too widely shared to renounce. It is to insist that the ledger has a second column, that the productivity we celebrate is purchased in part with a certain fragmentation of the person, and that a society honest about its wealth will count that cost even as it keeps the gains."], "source_ref": "OpenStax Principles of Economics 3e (the division of labor and gains from specialization)", "questions": [{"stem": "The passage's central claim is that the division of labor", "choices": ["should be abolished because it harms workers", "produces great abundance while also narrowing the individual worker", "has no real effect on the wealth of societies", "makes every worker into a complete artisan"], "answer": 1, "explain": "The author affirms specialization's 'enormous prosperity' yet insists 'the ledger has a second column,' a 'fragmentation of the person.'", "cover_story": "the divided worker", "b": -1.4}, {"stem": "The description of the pin factory serves primarily to", "choices": ["illustrate how dividing a task among specialists multiplies output", "argue that pins are an especially important product", "prove that a lone artisan works faster than a factory", "show that specialization lowers the quality of goods"], "answer": 0, "explain": "The factory 'produces in a day what a single artisan could scarcely make in a year,' showing that 'specialization multiplies output.'", "cover_story": "the divided worker", "b": 0.6}, {"stem": "The author's overall attitude toward the division of labor is", "choices": ["wholly celebratory, denying that it has any costs", "appreciative of its gains while insisting on counting its costs", "hostile, urging its abolition", "indifferent to both its benefits and its harms"], "answer": 1, "explain": "The author calls its 'fruits ... too real ... to renounce' yet asks that a society 'count that cost even as it keeps the gains.'", "cover_story": "the divided worker", "b": -0.1}, {"stem": "As used in the passage, 'dexterity' most nearly means", "choices": ["skill at a physical task", "financial wealth", "moral goodness", "breadth of general knowledge"], "answer": 0, "explain": "The worker 'gains dexterity at that motion,' meaning skill at the repeated operation, even as his scope narrows.", "cover_story": "the divided worker", "b": 0.2}, {"stem": "It can be inferred that the author sees the specialized worker's loss chiefly as a loss of", "choices": ["physical skill at his particular task", "the broad competence to make something from start to finish", "any share in the society's growing wealth", "the desire to work at all"], "answer": 1, "explain": "He 'loses ... the fuller competence of the artisan who once saw a thing through from raw stuff to finished form.'", "cover_story": "the divided worker", "b": 0.7}, {"stem": "Which of the following, if true, would most weaken the author's claim about the cost of specialization?", "choices": ["evidence that highly specialized workers typically retain or develop a broad, integrated understanding of the whole production process", "evidence that specialization increases total output", "evidence that factory goods are cheaper than handmade ones", "evidence that few independent artisans remain in modern economies"], "answer": 0, "explain": "The author's cost is that specialization narrows the worker; if specialists keep a broad grasp of the whole, that cost disappears.", "cover_story": "the divided worker", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["Students are taught to think of revision as the stage where a writer fixes mistakes, tidying commas and repairing spelling once the real work of writing is done. This picture is not merely incomplete; it inverts the truth. The corrections we call editing are the least of what revision means, and to stop there is to polish the surface of a house whose walls are in the wrong place. Real revision is not correction but re-vision, a literal seeing again, in which the writer returns to the draft as a stranger might and asks not whether the sentences are clean but whether the thing is doing what it set out to do. Often the answer is no, and the honest reviser must be willing to move a paragraph that took an hour to write, or to cut it, or to discover that the argument he meant to make is not the one that actually arrived on the page.", "This is why revision is harder than drafting, and why so many avoid it. To draft is to bring something into being, which is exhilarating; to revise is to judge what one has made, which requires a colder eye turned on one's own warm labor. The attachment we feel to our sentences, especially the clever ones, is precisely the obstacle, for the phrase we are proudest of is often the one doing the least work, kept not because the writing needs it but because we do. The reviser's discipline is to serve the reader rather than the ego, to ask of every passage what it gives to the person who will read it and to remove whatever survives only because its author loves it. Writing, on this understanding, is not a single act of expression but a long argument between the writer and the draft, and it is in that argument, not the first burst of composition, that most of the meaning is made."], "source_ref": "OpenStax Writing Guide with Handbook (the writing process: revising and editing)", "questions": [{"stem": "The central claim of the passage is that revision", "choices": ["is mainly a matter of correcting grammar and spelling", "is a process of re-seeing a draft to judge whether it does what it should", "is less important than the first act of drafting", "should preserve every sentence the writer is proud of"], "answer": 1, "explain": "'Real revision is not correction but re-vision, a literal seeing again,' asking 'whether the thing is doing what it set out to do.'", "cover_story": "the work of revision", "b": -1.4}, {"stem": "The image of polishing 'the surface of a house whose walls are in the wrong place' serves primarily to", "choices": ["show the inadequacy of treating revision as mere correction", "argue that writers ought to study architecture", "prove that surface errors do not matter at all", "suggest that drafting is a waste of time"], "answer": 0, "explain": "Tidying the surface while the structure is wrong illustrates why 'to stop there' at editing misses what revision means.", "cover_story": "the work of revision", "b": 0.7}, {"stem": "The author regards a writer's attachment to his cleverest sentences as", "choices": ["a virtue that should be encouraged", "an obstacle that revision must overcome", "irrelevant to the quality of the writing", "proof of genuine talent"], "answer": 1, "explain": "'The attachment we feel to our sentences ... is precisely the obstacle,' since the proudest phrase 'is often the one doing the least work.'", "cover_story": "the work of revision", "b": 0.0}, {"stem": "As used in the passage, 'inverts' most nearly means", "choices": ["slightly improves", "turns into its opposite", "carefully explains", "repeats exactly"], "answer": 1, "explain": "The common picture 'inverts the truth,' getting it backwards, since editing 'is the least of what revision means.'", "cover_story": "the work of revision", "b": 0.2}, {"stem": "It can be inferred that the author considers the hardest part of revision to be", "choices": ["correcting punctuation and spelling", "judging one's own work coldly enough to cut what one loves", "producing the first draft quickly", "praising the reader's intelligence"], "answer": 1, "explain": "Revision 'requires a colder eye turned on one's own warm labor,' removing 'whatever survives only because its author loves it.'", "cover_story": "the work of revision", "b": 0.7}, {"stem": "Which action best exemplifies revision as the author defines it?", "choices": ["cutting a well-written paragraph after realizing it does not serve the essay's actual argument", "running a spell-check over an otherwise finished draft", "keeping a favorite sentence because the writer is proud of it", "adding decorative phrases to make the prose sound more impressive"], "answer": 0, "explain": "Cutting good writing that fails the argument is exactly serving 'the reader rather than the ego,' the reviser's discipline.", "cover_story": "the work of revision", "b": 1.2}]}, {"label": "Passage", "paragraphs": ["We speak of good writing as though it were a property of the words themselves, a quality that a sentence either has or lacks the way a stone has weight. But no sentence is good in the abstract; it is good for someone, in some situation, toward some end. The plain instruction that saves a life in an emergency would be a failure as a poem, and the poem that moves us to tears would be a catastrophe printed on the side of a medicine bottle. What we are really judging when we praise writing is the fit between a text and its occasion, the match between what was said and the reader, purpose, and moment it was meant to serve. Rhetoric gives this cluster a name, the rhetorical situation, and its first lesson is that there is no writing so excellent that it cannot be made wrong by being addressed to the wrong audience at the wrong time.", "This unsettles a flattering belief, that the writer is a solitary craftsman answerable only to his art. In truth the reader is a silent collaborator in every sentence, and to write well is to hold that other person constantly in mind, to anticipate what she knows, fears, doubts, and needs, and to shape the words to meet her. This is not a betrayal of honesty for the sake of persuasion; it is the condition of being understood at all. A truth flung at a reader who is not ready to receive it does not become more true for being ignored. The writer who refuses to consider his audience, priding himself on indifference to their responses, has not risen above rhetoric but merely practiced it badly, addressing no one and reaching them. To take the audience seriously is not to flatter them but to grant that communication, unlike private self-expression, is something that must be completed by another."], "source_ref": "OpenStax Writing Guide with Handbook (the rhetorical situation: audience, purpose, and context)", "questions": [{"stem": "The passage principally argues that the quality of writing", "choices": ["is a property of the words themselves, independent of any reader", "depends on the fit between a text and its audience, purpose, and occasion", "matters only in emergencies and in poetry", "cannot be judged at all"], "answer": 1, "explain": "What we judge 'is the fit between a text and its occasion,' since 'no sentence is good in the abstract.'", "cover_story": "writing and audience", "b": -1.3}, {"stem": "The contrast between an emergency instruction and a poem serves primarily to", "choices": ["show that the same text can succeed or fail depending on its occasion", "argue that poems are less useful than instructions", "prove that good writing is the same in every context", "suggest that emergencies are the best subject for writing"], "answer": 0, "explain": "The life-saving instruction 'would be a failure as a poem,' and the poem 'a catastrophe' on a medicine bottle, showing quality depends on 'fit.'", "cover_story": "writing and audience", "b": 0.7}, {"stem": "The author's attitude toward the belief that the writer is a 'solitary craftsman answerable only to his art' is", "choices": ["endorsing, treating it as the mark of integrity", "critical, viewing it as flattering but false", "neutral, neither agreeing nor disagreeing", "admiring of the writers who hold it"], "answer": 1, "explain": "The author calls it 'a flattering belief' and argues 'the reader is a silent collaborator in every sentence.'", "cover_story": "writing and audience", "b": 0.0}, {"stem": "As used in the passage, 'anticipate' most nearly means", "choices": ["to look forward to with pleasure", "to foresee and prepare for in advance", "to argue against", "to remember afterward"], "answer": 1, "explain": "To 'anticipate what she knows, fears, doubts, and needs' is to foresee the reader's state and shape the words for it.", "cover_story": "writing and audience", "b": 0.2}, {"stem": "It can be inferred that the author regards considering one's audience as", "choices": ["a dishonest compromise of the truth for the sake of persuasion", "a necessary condition of being understood", "an optional refinement for skilled writers only", "a distraction from the real work of self-expression"], "answer": 1, "explain": "Holding the reader in mind 'is not a betrayal of honesty' but 'the condition of being understood at all.'", "cover_story": "writing and audience", "b": 0.7}, {"stem": "Which of the following, if true, would most strengthen the author's view that writing must be completed by its audience?", "choices": ["a clearly true and well-crafted message that fails entirely because its intended readers lack the background to understand it", "a poem admired by critics purely for its technical skill", "an instruction manual written without regard for its users that they nonetheless follow easily", "a writer who becomes famous for openly ignoring his readers"], "answer": 0, "explain": "A true, skilled message that fails for lack of a ready audience shows communication 'must be completed by another,' as the author claims.", "cover_story": "writing and audience", "b": 1.3}]}]}, "chem_phys": {"title": "Chem/Phys reasoning", "passages": [{"label": "Cart on a ramp", "paragraphs": ["A teaching lab studies motion with a 2.0 kg cart on a straight track tilted 30 degrees above the horizontal. The track is nearly frictionless, and a motion sensor records the cart after it is released from rest. Students use g = 10 m/s^2 and ignore air resistance.", "In one run the cart starts 1.0 m up the track, measured along the incline, and slides to the bottom. A light spring bumper there briefly stops the cart and pushes it back. The class then repeats the run with a stiffer spring."], "source_ref": "OpenStax University Physics Vol 1, Ch. 5-8 (Newton's Laws, Work, and Energy)", "questions": [{"stem": "The cart is released from rest and slides 1.0 m down the incline. Using energy conservation, what is its speed at the bottom?", "choices": ["2.2 m/s", "3.2 m/s", "4.5 m/s", "5.0 m/s"], "answer": 1, "explain": "Only the vertical drop counts: h = 1.0 sin 30 = 0.5 m, so v = sqrt(2gh) = sqrt(10) which is about 3.2 m/s. Using the full 1.0 m as the height gives the too large 4.5 m/s.", "concept": "4A", "skill": "reasoning", "cover_story": "cart on a ramp", "b": -0.3}, {"stem": "While the cart slides down the frictionless incline, how does the normal force from the track compare with the cart's weight?", "choices": ["Greater than the weight", "Equal to the weight", "Zero", "Less than the weight"], "answer": 3, "explain": "On an incline the normal force is mg cos 30, which is smaller than mg because cos 30 is less than 1. It equals the weight only on level ground.", "concept": "4A", "skill": "concepts", "cover_story": "cart on a ramp", "b": -0.9}, {"stem": "What is the magnitude of the cart's acceleration down the frictionless incline?", "choices": ["2.5 m/s^2", "5.0 m/s^2", "8.7 m/s^2", "10 m/s^2"], "answer": 1, "explain": "On a frictionless incline a = g sin(theta) = 10 times 0.5 = 5 m/s^2. The value 8.7 comes from wrongly using cos 30.", "concept": "4A", "skill": "reasoning", "cover_story": "cart on a ramp", "b": -0.5}, {"stem": "How much work does gravity do on the 2.0 kg cart as it slides the 1.0 m down to the bottom?", "choices": ["5 J", "10 J", "17 J", "20 J"], "answer": 1, "explain": "Work by gravity is mgh with h = 0.5 m, so 2 times 10 times 0.5 = 10 J. Using the 1.0 m path length as the height double counts and gives 20 J.", "concept": "4A", "skill": "reasoning", "cover_story": "cart on a ramp", "b": -0.3}, {"stem": "The cart reaches the spring and compresses it until it stops for an instant. If a stiffer spring (larger force constant k) is used for the same incoming speed, the maximum compression of the spring will be:", "choices": ["Smaller", "Larger", "Unchanged", "Zero"], "answer": 0, "explain": "The kinetic energy delivered is fixed, and it all becomes spring energy one half k x squared, so a larger k forces a smaller maximum compression x.", "concept": "4A", "skill": "concepts", "cover_story": "cart on a ramp", "b": 0.4}, {"stem": "In a later run the cart takes 2.0 s to reach the bottom, and the drop releases 10 J of gravitational potential energy. What is the average power delivered by gravity during the slide?", "choices": ["2.5 W", "5 W", "10 W", "20 W"], "answer": 1, "explain": "Average power is work over time, 10 J divided by 2.0 s = 5 W.", "concept": "4A", "skill": "reasoning", "cover_story": "cart on a ramp", "b": -0.6}]}, {"label": "IV line and blood flow", "paragraphs": ["A nurse hangs a bag of saline for an intravenous drip. A tube carries fluid from the bag down to a needle in a patient's arm. The saline has about the density of water, 1000 kg/m^3, and it flows because the bag sits above the arm. Use g = 10 m/s^2.", "In a separate model of a partly blocked artery, a rigid tube narrows so that the radius of the narrow segment is half the radius of the wide segment. The fluid is treated as incompressible and the flow as steady."], "source_ref": "OpenStax University Physics Vol 1, Ch. 14 (Fluid Mechanics)", "questions": [{"stem": "Raising the saline bag higher above the arm increases the flow into the vein mainly by increasing the:", "choices": ["density of the saline", "viscosity of the saline", "surface tension of the saline", "hydrostatic pressure driving the flow"], "answer": 3, "explain": "The driving pressure is the hydrostatic head rho g h, so a greater height h means more pressure pushing fluid into the vein.", "concept": "4B", "skill": "concepts", "cover_story": "IV drip and a narrowed vessel", "b": -1.2}, {"stem": "If the bag hangs 1.0 m above the needle, about how much pressure does that height add at the needle?", "choices": ["100 Pa", "1,000 Pa", "10,000 Pa", "100,000 Pa"], "answer": 2, "explain": "Hydrostatic pressure is rho g h = 1000 times 10 times 1.0 = 10,000 Pa.", "concept": "4B", "skill": "reasoning", "cover_story": "IV drip and a narrowed vessel", "b": -0.6}, {"stem": "In the narrowed artery model the radius drops to half. By the continuity equation, the fluid speed in the narrow segment becomes about:", "choices": ["half the wide-segment speed", "twice the wide-segment speed", "four times the wide-segment speed", "eight times the wide-segment speed"], "answer": 2, "explain": "Continuity keeps area times speed constant. Halving the radius cuts the area to one quarter, so the speed must rise fourfold.", "concept": "4B", "skill": "reasoning", "cover_story": "IV drip and a narrowed vessel", "b": 0.5}, {"stem": "Compared with the wide segment, the fluid pressure in the fast, narrow segment is best predicted by Bernoulli's principle to be:", "choices": ["Lower than in the wide segment", "Higher than in the wide segment", "The same as in the wide segment", "Zero"], "answer": 0, "explain": "For an ideal fluid, faster flow goes with lower pressure, so the narrow, high-speed region has lower pressure than the wide region.", "concept": "4B", "skill": "concepts", "cover_story": "IV drip and a narrowed vessel", "b": 0.2}, {"stem": "Blood is actually viscous. If a vessel keeps the same pressure difference but its radius falls to half, Poiseuille's law predicts the volume flow rate falls to about:", "choices": ["one half", "one quarter", "one eighth", "one sixteenth"], "answer": 3, "explain": "Poiseuille flow scales with the radius to the fourth power, so halving the radius gives (1/2) to the fourth = 1/16 of the flow.", "concept": "4B", "skill": "reasoning", "cover_story": "IV drip and a narrowed vessel", "b": 1.0}, {"stem": "A sealed drug capsule with a density less than saline is dropped into the bag and floats. The buoyant force on the floating capsule is:", "choices": ["Greater than the capsule's weight", "Equal to the capsule's weight", "Less than the capsule's weight", "Zero"], "answer": 1, "explain": "A floating object is in equilibrium, so the buoyant force exactly balances its weight.", "concept": "4B", "skill": "concepts", "cover_story": "IV drip and a narrowed vessel", "b": -0.5}]}, {"label": "Sensor circuit and a magnet", "paragraphs": ["A bioinstrumentation student powers a small sensor from a 9 V battery. She can wire two resistors, 100 ohm and 200 ohm, either in series or in parallel, and she adds a 2 microfarad parallel-plate capacitor to store a little charge.", "Nearby she studies how charges behave. She measures the force between two fixed point charges as she changes their separation, and she watches a positive ion drift to the right through a region where a magnetic field points out of the page."], "source_ref": "OpenStax University Physics Vol 2, Ch. 5-11 (Electric Charges and Fields through Magnetic Forces)", "questions": [{"stem": "The student doubles the distance between two fixed point charges. The electric force between them becomes:", "choices": ["twice as large", "half as large", "one quarter as large", "four times as large"], "answer": 2, "explain": "Coulomb's law makes the force scale as 1 over distance squared, so doubling the distance cuts the force to one quarter.", "concept": "4C", "skill": "reasoning", "cover_story": "a sensor circuit", "b": -0.5}, {"stem": "With the 100 ohm and 200 ohm resistors in series across the 9 V battery, what current flows from the battery?", "choices": ["0.01 A", "0.03 A", "0.09 A", "0.30 A"], "answer": 1, "explain": "Series resistances add to 300 ohm, so I = V over R = 9 divided by 300 = 0.03 A.", "concept": "4C", "skill": "reasoning", "cover_story": "a sensor circuit", "b": -0.4}, {"stem": "If instead the two resistors are wired in parallel, the total resistance is:", "choices": ["less than 100 ohm", "exactly 150 ohm", "exactly 300 ohm", "more than 300 ohm"], "answer": 0, "explain": "Resistors in parallel always give a total smaller than the smallest branch, so less than 100 ohm (about 67 ohm here).", "concept": "4C", "skill": "reasoning", "cover_story": "a sensor circuit", "b": -0.6}, {"stem": "One 100 ohm resistor carries a current of 0.03 A. About how much power does it dissipate as heat?", "choices": ["0.03 W", "0.09 W", "0.3 W", "9 W"], "answer": 1, "explain": "Power is I squared times R = (0.03) squared times 100 = 0.09 W.", "concept": "4C", "skill": "reasoning", "cover_story": "a sensor circuit", "b": 0.5}, {"stem": "The 2 microfarad capacitor sits across the full 9 V. How much charge does it store?", "choices": ["about 4.5 microcoulombs", "about 11 microcoulombs", "about 18 microcoulombs", "about 36 microcoulombs"], "answer": 2, "explain": "Stored charge is Q = C times V = 2 microfarad times 9 V = 18 microcoulombs.", "concept": "4C", "skill": "reasoning", "cover_story": "a sensor circuit", "b": 0.1}, {"stem": "The positive ion moves to the right while the magnetic field points out of the page. The magnetic force on the ion points:", "choices": ["toward the top of the page", "in the same direction it is moving", "opposite to its motion", "toward the bottom of the page"], "answer": 3, "explain": "Using F = q v cross B with velocity to the right and field out of the page, the right-hand rule gives a force toward the bottom of the page. The magnetic force is always perpendicular to the velocity, so it cannot point along the motion.", "concept": "4C", "skill": "concepts", "cover_story": "a sensor circuit", "b": 1.1}]}, {"label": "Endoscope optics", "paragraphs": ["An endoscope guides light along thin glass fibers and uses small lenses to form images inside the body. Light passes from glass, where it travels slower, into tissue, where it travels faster, and it also reflects back into the fibers.", "One converging lens in the tip has a focal length of 2 cm, and a small structure sits 6 cm in front of it. The doctor also compares red and blue light and checks the optics with a pair of narrow slits."], "source_ref": "OpenStax University Physics Vol 3, Ch. 1-4 (The Nature of Light, Geometric Optics, Interference, and Diffraction)", "questions": [{"stem": "Light passes from glass into tissue, where it travels faster. As it crosses the boundary, the light bends:", "choices": ["toward the normal", "away from the normal", "straight back the way it came", "not at all"], "answer": 1, "explain": "Moving into a medium with a lower index, light speeds up and bends away from the normal, as Snell's law requires.", "concept": "4D", "skill": "concepts", "cover_story": "inside an endoscope", "b": 0.1}, {"stem": "Light stays trapped inside the glass fiber because, when it strikes the fiber wall at a shallow angle, it undergoes:", "choices": ["Complete absorption", "Refraction out of the fiber", "Total internal reflection", "A Doppler shift"], "answer": 2, "explain": "Beyond the critical angle, light in the denser glass is totally internally reflected, so it stays inside the fiber.", "concept": "4D", "skill": "concepts", "cover_story": "inside an endoscope", "b": -0.5}, {"stem": "For the 2 cm focal length lens with the object 6 cm away, the image distance (using 1/f = 1/do + 1/di) is:", "choices": ["1.5 cm", "3 cm", "6 cm", "12 cm"], "answer": 1, "explain": "1/di = 1/f - 1/do = 1/2 - 1/6 = 1/3, so di = 3 cm.", "concept": "4D", "skill": "reasoning", "cover_story": "inside an endoscope", "b": 0.6}, {"stem": "That image, formed by a converging lens with the object outside the focal length, is:", "choices": ["Virtual and upright", "Virtual and inverted", "Real and inverted", "Real and upright"], "answer": 2, "explain": "For a converging lens with the object beyond the focal length, the image is real and inverted.", "concept": "4D", "skill": "concepts", "cover_story": "inside an endoscope", "b": 0.3}, {"stem": "The doctor compares blue light and red light. Because blue light has a higher frequency, each blue photon carries:", "choices": ["Less energy than a red photon", "The same energy as a red photon", "No energy", "More energy than a red photon"], "answer": 3, "explain": "Photon energy E = h times f rises with frequency, so higher-frequency blue photons carry more energy than red ones.", "concept": "4D", "skill": "concepts", "cover_story": "inside an endoscope", "b": -0.6}, {"stem": "In the double-slit alignment check, if the two slits are moved closer together, the bright fringes on the screen will be:", "choices": ["Spaced farther apart", "Spaced closer together", "Unchanged", "Removed entirely"], "answer": 0, "explain": "Fringe spacing is inversely proportional to slit separation, so bringing the slits closer spreads the fringes farther apart.", "concept": "4D", "skill": "concepts", "cover_story": "inside an endoscope", "b": 0.7}]}, {"label": "Radiotracer and the periodic table", "paragraphs": ["A hospital uses a radioactive tracer with a half-life of 6 hours. A technician prepares a dose and reviews the chemistry of the elements involved, including where they sit on the periodic table and how their atoms are built.", "One isotope decays by turning a neutron into a proton while emitting a light negative particle. The technician also plans a simple labeling reaction and counts the atoms it needs."], "source_ref": "OpenStax Chemistry 2e, Ch. 3, 6, and 21 (Composition of Substances, Electronic Structure, and Nuclear Chemistry)", "questions": [{"stem": "A sample of the tracer starts with 80 mg. After 12 hours (two half-lives of 6 hours each), how much remains?", "choices": ["40 mg", "20 mg", "10 mg", "0 mg"], "answer": 1, "explain": "Each 6-hour half-life halves the amount: 80 to 40 after 6 hours, then 40 to 20 after 12 hours.", "concept": "4E", "skill": "reasoning", "cover_story": "a hospital radiotracer", "b": -0.6}, {"stem": "An isotope decays by converting a neutron into a proton and emitting a light negative particle. This is:", "choices": ["Alpha decay", "Gamma decay", "Electron capture", "Beta-minus decay"], "answer": 3, "explain": "Turning a neutron into a proton while emitting an electron (a beta particle) is beta-minus decay, and it raises the atomic number by one.", "concept": "4E", "skill": "concepts", "cover_story": "a hospital radiotracer", "b": 0.0}, {"stem": "When a different nucleus emits an alpha particle, its mass number changes by:", "choices": ["unchanged", "increases by 2", "decreases by 2", "decreases by 4"], "answer": 3, "explain": "An alpha particle carries away 2 protons and 2 neutrons, so the mass number drops by 4 (and the atomic number by 2).", "concept": "4E", "skill": "concepts", "cover_story": "a hospital radiotracer", "b": -0.5}, {"stem": "Moving from left to right across a period of the periodic table, atomic radius generally:", "choices": ["Decreases", "Increases", "Stays the same", "Doubles"], "answer": 0, "explain": "Across a period the nuclear charge felt by the outer electrons rises while they stay in the same shell, pulling them inward, so the radius shrinks.", "concept": "4E", "skill": "concepts", "cover_story": "a hospital radiotracer", "b": -0.7}, {"stem": "An element in group 16, such as oxygen or sulfur, typically gains how many electrons to reach a noble-gas configuration?", "choices": ["1", "2", "3", "6"], "answer": 1, "explain": "Group 16 atoms have six valence electrons and gain two to complete an octet.", "concept": "4E", "skill": "concepts", "cover_story": "a hospital radiotracer", "b": -0.4}, {"stem": "Labeling one molecule of the tracer needs 2 atoms of the isotope. If the technician has 6 atoms of isotope and unlimited target molecules, how many labeled molecules can be made, and what runs out first?", "choices": ["6 molecules, with isotope limiting", "3 molecules, with the target limiting", "3 molecules, with isotope limiting", "12 molecules, with neither limiting"], "answer": 2, "explain": "Each product needs 2 isotope atoms, so 6 atoms make 3 labeled molecules and the isotope is the limiting reactant.", "concept": "4E", "skill": "reasoning", "cover_story": "a hospital radiotracer", "b": 0.5}]}, {"label": "Buffers and titration", "paragraphs": ["A student prepares buffers and runs titrations. One buffer is made from a weak acid with a pKa of 4.7 and its conjugate base. The student measures pH and watches how it responds to small additions of acid or base.", "In a titration, a weak acid in the flask is neutralized by a strong base added from a burette. The student also studies a sparingly soluble salt to see how added ions change its solubility."], "source_ref": "OpenStax Chemistry 2e, Ch. 14-15 (Acid-Base Equilibria and Equilibria of Other Reaction Classes)", "questions": [{"stem": "A 0.01 M solution of a strong acid that fully dissociates has a pH of about:", "choices": ["1", "2", "7", "12"], "answer": 1, "explain": "A strong acid gives a hydrogen ion concentration of 0.01 = 10 to the minus 2 M, so pH = 2.", "concept": "5A", "skill": "concepts", "cover_story": "the buffer bench", "b": -0.8}, {"stem": "In the buffer, when the concentrations of weak acid and conjugate base are equal, the pH equals:", "choices": ["0", "4.7", "7.0", "9.3"], "answer": 1, "explain": "By Henderson-Hasselbalch, pH = pKa plus log(base over acid), and when the two are equal the log term is zero, so pH = pKa = 4.7.", "concept": "5A", "skill": "concepts", "cover_story": "the buffer bench", "b": -0.5}, {"stem": "To hold the buffer's pH above its pKa, the ratio of conjugate base to weak acid must be:", "choices": ["Greater than 1", "Exactly 1", "Less than 1", "Zero"], "answer": 0, "explain": "pH exceeds pKa only when log(base over acid) is positive, which means more conjugate base than acid.", "concept": "5A", "skill": "concepts", "cover_story": "the buffer bench", "b": 0.5}, {"stem": "Adding a small amount of strong acid to the buffer barely changes its pH because the added protons are mostly:", "choices": ["Ignored by the solution", "Converted to water with no reaction", "Consumed by the conjugate base", "Released as a gas"], "answer": 2, "explain": "The conjugate base reacts with the added hydrogen ions, soaking up most of the protons so the pH shifts only slightly.", "concept": "5A", "skill": "concepts", "cover_story": "the buffer bench", "b": 0.1}, {"stem": "At the equivalence point of a weak acid titrated with a strong base, the pH is:", "choices": ["Exactly 7", "Less than 7", "Exactly equal to the pKa", "Greater than 7"], "answer": 3, "explain": "At equivalence only the conjugate base remains, and it makes the solution basic, so the pH is above 7.", "concept": "5A", "skill": "concepts", "cover_story": "the buffer bench", "b": 0.8}, {"stem": "A sparingly soluble salt MX sits in water. Adding more X-minus ions from a separate soluble salt will make the solubility of MX:", "choices": ["Increase", "Decrease", "Stay exactly the same", "Become infinite"], "answer": 1, "explain": "By the common-ion effect, extra X-minus pushes the dissolution equilibrium back toward solid, lowering solubility.", "concept": "5A", "skill": "concepts", "cover_story": "the buffer bench", "b": 0.5}]}, {"label": "Building a drug molecule", "paragraphs": ["A chemist studies a small drug molecule. She examines its Lewis structure, the shape around each central atom, whether the molecule is polar, and how its molecules attract one another. These features shape how the drug dissolves and how easily it evaporates.", "One carbon in the molecule is bonded to four different groups. She also compares two similar molecules, one that can form hydrogen bonds and one that cannot."], "source_ref": "OpenStax Chemistry 2e, Ch. 7-10 and 20 (Chemical Bonding, Molecular Geometry, Intermolecular Forces, and Organic Chemistry)", "questions": [{"stem": "A carbon atom bonded to four other atoms with no lone pairs has what shape around it?", "choices": ["Linear", "Trigonal planar", "Tetrahedral", "Bent"], "answer": 2, "explain": "Four bonding groups and no lone pairs point to the corners of a tetrahedron, with angles near 109.5 degrees.", "concept": "5B", "skill": "concepts", "cover_story": "designing a drug molecule", "b": -0.7}, {"stem": "A molecule has polar bonds but is so symmetric that the bond dipoles cancel. The molecule as a whole is:", "choices": ["Nonpolar", "Polar", "Ionic", "Positively charged"], "answer": 0, "explain": "When symmetry makes the bond dipoles cancel, there is no net dipole and the molecule is nonpolar, as in carbon dioxide.", "concept": "5B", "skill": "concepts", "cover_story": "designing a drug molecule", "b": 0.2}, {"stem": "Two Lewis structures for the molecule differ only in where a double bond and a lone pair sit, not in where the atoms are. These are best described as:", "choices": ["Different molecules", "Isotopes of each other", "Structural isomers", "Resonance structures of one molecule"], "answer": 3, "explain": "Structures that differ only by the placement of electrons, not atoms, are resonance forms of the same molecule.", "concept": "5B", "skill": "concepts", "cover_story": "designing a drug molecule", "b": 0.0}, {"stem": "A carbon in a carbon-carbon double bond that is bonded to three groups total is best described as:", "choices": ["sp", "sp2", "sp3", "sp3d"], "answer": 1, "explain": "Three regions of electron density (the double bond counts as one region plus two single bonds) means sp2 hybridization and trigonal planar geometry.", "concept": "5B", "skill": "concepts", "cover_story": "designing a drug molecule", "b": -0.4}, {"stem": "Two molecules are similar in size, but one can form hydrogen bonds and the other cannot. The hydrogen-bonding molecule will most likely have a:", "choices": ["Lower boiling point", "The same boiling point", "Higher boiling point", "No boiling point at all"], "answer": 2, "explain": "Hydrogen bonding is a strong intermolecular attraction, so more energy is needed to separate the molecules, which raises the boiling point.", "concept": "5B", "skill": "concepts", "cover_story": "designing a drug molecule", "b": -0.6}, {"stem": "The carbon bonded to four different groups makes the molecule:", "choices": ["Achiral", "A resonance form", "A structural isomer", "Chiral, with a nonsuperimposable mirror image"], "answer": 3, "explain": "A carbon with four different groups is a chirality center, so the molecule has a nonsuperimposable mirror image, an enantiomer.", "concept": "5B", "skill": "concepts", "cover_story": "designing a drug molecule", "b": 0.5}]}, {"label": "Purifying a plant compound", "paragraphs": ["A lab isolates a compound from a plant. The team uses liquid-liquid extraction, distillation, thin-layer chromatography, and gel electrophoresis of the sample's proteins. Each method sorts molecules by a different physical property.", "The target is a weak carboxylic acid. The team shakes the mixture with water and an immiscible organic solvent, then adjusts the pH to move the compound from one layer to the other."], "source_ref": "OpenStax Chemistry 2e, Ch. 10-11 and 14 (Liquids and Solids, Solutions and Colloids, and Acid-Base Equilibria)", "questions": [{"stem": "Simple distillation separates two liquids mainly by differences in their:", "choices": ["Boiling point", "Color", "Density", "Molar mass only"], "answer": 0, "explain": "Distillation exploits boiling point differences, so the more volatile component with the lower boiling point vaporizes first.", "concept": "5C", "skill": "concepts", "cover_story": "purifying a plant extract", "b": -0.7}, {"stem": "In the extraction, a nonpolar target compound will tend to collect in:", "choices": ["The polar water layer", "The solid residue", "The nonpolar organic layer", "The gas phase"], "answer": 2, "explain": "Like dissolves like, so a nonpolar compound favors the nonpolar organic layer over water.", "concept": "5C", "skill": "concepts", "cover_story": "purifying a plant extract", "b": -0.5}, {"stem": "The target is a weak carboxylic acid. Adding base to the aqueous layer converts it to its charged carboxylate form, which will:", "choices": ["Move into the organic layer", "Precipitate out at once", "Evaporate as a gas", "Move into the water layer"], "answer": 3, "explain": "Deprotonating the acid makes a charged, water-soluble carboxylate, so it shifts into the aqueous layer.", "concept": "5C", "skill": "concepts", "cover_story": "purifying a plant extract", "b": 0.7}, {"stem": "On normal-phase thin-layer chromatography with a polar plate and a nonpolar solvent, a very polar compound will:", "choices": ["Barely move from the baseline", "Travel far up the plate", "Evaporate off the plate", "Move faster than nonpolar compounds"], "answer": 0, "explain": "A polar compound binds tightly to the polar plate, so it moves only a little and has a low Rf.", "concept": "5C", "skill": "concepts", "cover_story": "purifying a plant extract", "b": 0.6}, {"stem": "In gel electrophoresis, charged molecules migrate through the gel toward the opposite charge. Compared with large molecules, small ones generally:", "choices": ["Move less far through the gel", "Not move at all", "Move farther through the gel", "Move toward the same-sign electrode"], "answer": 2, "explain": "Smaller molecules slip through the gel mesh more easily, so they travel farther in a given time.", "concept": "5C", "skill": "concepts", "cover_story": "purifying a plant extract", "b": 0.0}, {"stem": "Column chromatography separates molecules based mainly on how strongly each one:", "choices": ["Glows under ultraviolet light", "Conducts electricity", "Reflects heat", "Sticks to the stationary phase versus the moving solvent"], "answer": 3, "explain": "Separation comes from the balance between each compound's attraction to the stationary phase and its tendency to travel with the mobile solvent.", "concept": "5C", "skill": "concepts", "cover_story": "purifying a plant extract", "b": -0.2}]}, {"label": "Functional groups of a metabolite", "paragraphs": ["A biochemist studies a small metabolite that carries several functional groups: a hydroxyl group, a carbonyl group, and a carboxylic acid group. She looks at how each group reacts.", "She compares the acidity of the groups, carefully oxidizes an alcohol, and links the acid to an alcohol to form a new bond. She also reviews the building blocks of common biomolecules."], "source_ref": "OpenStax Chemistry 2e, Ch. 20 (Organic Chemistry)", "questions": [{"stem": "A carbon that is double-bonded to one oxygen and also bonded to an OH group is which functional group?", "choices": ["Alcohol", "Carboxylic acid", "Ketone", "Aldehyde"], "answer": 1, "explain": "A carbonyl carbon that also carries an OH is a carboxylic acid group.", "concept": "5D", "skill": "concepts", "cover_story": "reactions of a metabolite", "b": -0.6}, {"stem": "Which group in the metabolite is the most acidic, meaning it gives up a proton most readily?", "choices": ["The carboxylic acid", "The hydroxyl (alcohol)", "The carbon-carbon bonds", "The C-H bonds"], "answer": 0, "explain": "The carboxylic acid is far more acidic than an alcohol because its conjugate base, the carboxylate, is stabilized by resonance.", "concept": "5D", "skill": "concepts", "cover_story": "reactions of a metabolite", "b": 0.2}, {"stem": "Careful, controlled oxidation of a primary alcohol first gives which product?", "choices": ["A ketone", "An ester", "An aldehyde", "An alkane"], "answer": 2, "explain": "A primary alcohol oxidizes first to an aldehyde and can go further to a carboxylic acid, whereas a secondary alcohol would give a ketone.", "concept": "5D", "skill": "concepts", "cover_story": "reactions of a metabolite", "b": 0.5}, {"stem": "Reacting the carboxylic acid with an alcohol under acid catalysis forms an ester and releases a molecule of:", "choices": ["Carbon dioxide", "Hydrogen gas", "Ammonia", "Water"], "answer": 3, "explain": "Ester formation from an acid and an alcohol is a condensation that splits out a molecule of water.", "concept": "5D", "skill": "concepts", "cover_story": "reactions of a metabolite", "b": 0.1}, {"stem": "Unlike an aldehyde, a ketone resists mild oxidation because its carbonyl carbon:", "choices": ["Has no hydrogen attached to the carbonyl carbon", "Carries a full negative charge", "Is aromatic", "Is an ion"], "answer": 0, "explain": "An aldehyde's carbonyl carbon bears a hydrogen that is removed during oxidation, but a ketone's carbonyl carbon is bonded to two carbons and has no such hydrogen, so it resists mild oxidation.", "concept": "5D", "skill": "concepts", "cover_story": "reactions of a metabolite", "b": 1.0}, {"stem": "Every amino acid contains an amine group and which other functional group on its central carbon?", "choices": ["A ketone", "An ether", "A carboxylic acid", "A nitro group"], "answer": 2, "explain": "Each amino acid has both an amino group and a carboxylic acid group on the same central carbon.", "concept": "5D", "skill": "concepts", "cover_story": "reactions of a metabolite", "b": -0.6}]}, {"label": "Reaction energetics and a cell", "paragraphs": ["A chemist studies a reaction's energy and speed. She measures the enthalpy and entropy changes, tests how a catalyst changes the rate, and uses Le Chatelier's principle to predict shifts in equilibrium.", "She also builds a simple galvanic cell from two metals in their salt solutions and traces the path of the electrons it produces."], "source_ref": "OpenStax Chemistry 2e, Ch. 12-17 (Kinetics, Equilibrium, Thermodynamics, and Electrochemistry)", "questions": [{"stem": "A reaction has a negative enthalpy change and a positive entropy change. This reaction is:", "choices": ["Nonspontaneous at all temperatures", "Spontaneous only at high temperature", "Spontaneous only at low temperature", "Spontaneous at all temperatures"], "answer": 3, "explain": "With enthalpy change negative and entropy change positive, the Gibbs free energy change (enthalpy minus temperature times entropy) is negative at every temperature, so the reaction is always spontaneous.", "concept": "5E", "skill": "concepts", "cover_story": "reaction energetics and a cell", "b": 0.6}, {"stem": "A reaction converts 2 moles of gas into 1 mole of gas. The entropy change of the system is most likely:", "choices": ["Negative", "Positive", "Zero", "Infinite"], "answer": 0, "explain": "Fewer gas molecules means fewer ways to spread energy and position, so the system's entropy decreases.", "concept": "5E", "skill": "concepts", "cover_story": "reaction energetics and a cell", "b": 0.2}, {"stem": "For a reaction with the rate law rate = k[A], doubling the concentration of A changes the rate by a factor of:", "choices": ["stays the same", "quadruples", "doubles", "increases eightfold"], "answer": 2, "explain": "The reaction is first order in A, so doubling the concentration of A doubles the rate.", "concept": "5E", "skill": "reasoning", "cover_story": "reaction energetics and a cell", "b": -0.3}, {"stem": "A catalyst, such as an enzyme, speeds up a reaction mainly by:", "choices": ["Lowering the activation energy", "Increasing the temperature", "Making the products more stable", "Raising the activation energy"], "answer": 0, "explain": "A catalyst provides a path with a lower activation energy so more collisions succeed, and it does not change the energy of the reactants or products.", "concept": "5E", "skill": "concepts", "cover_story": "reaction energetics and a cell", "b": -0.6}, {"stem": "For the equilibrium N2 + 3 H2 gives 2 NH3, adding more N2 shifts the equilibrium:", "choices": ["Toward the reactants (less NH3)", "No shift at all", "Toward the products (more NH3)", "It stops the reaction"], "answer": 2, "explain": "Adding a reactant pushes the equilibrium toward the products to partly offset the change, making more ammonia.", "concept": "5E", "skill": "concepts", "cover_story": "reaction energetics and a cell", "b": -0.1}, {"stem": "In her galvanic cell, oxidation happens at the anode and reduction at the cathode. Through the external wire, electrons flow:", "choices": ["From the anode to the cathode", "From the cathode to the anode", "From the cathode to the salt bridge only", "They do not flow at all"], "answer": 0, "explain": "Electrons are released by oxidation at the anode and travel through the external wire to the cathode, where reduction occurs.", "concept": "4C", "skill": "concepts", "cover_story": "reaction energetics and a cell", "b": 0.0}]}, {"label": "The bicarbonate buffer in blood", "paragraphs": ["Blood holds a nearly constant pH using the bicarbonate buffer system. Dissolved carbon dioxide reacts with water to form carbonic acid, which splits into hydrogen ions and bicarbonate: CO2 + H2O gives H+ + HCO3-. The enzyme carbonic anhydrase speeds the first step.", "During hard exercise, muscles add more carbon dioxide and acid to the blood, and the lungs and kidneys respond to keep the pH near 7.4. Treat the dissolved gases as ideal and the reactions as reversible."], "source_ref": "OpenStax Chemistry 2e, Ch. 9, 12, and 14 (Gases, Kinetics, and Acid-Base Equilibria)", "questions": [{"stem": "During intense exercise, extra carbon dioxide dissolves in the blood. By the equilibrium shown, this tends to make the blood:", "choices": ["More basic (higher pH)", "Exactly neutral", "Unable to change its pH", "More acidic (lower pH)"], "answer": 3, "explain": "More carbon dioxide pushes the equilibrium to the right, releasing more hydrogen ions, which lowers the pH toward acidosis.", "concept": "5A", "skill": "concepts", "cover_story": "blood as a buffer", "b": 0.2}, {"stem": "When the lungs exhale faster and remove carbon dioxide from the blood, the equilibrium CO2 + H2O gives H+ + HCO3- shifts:", "choices": ["To the left, consuming H+ and raising pH", "To the right, releasing more H+", "Not at all", "Toward making more carbon dioxide"], "answer": 0, "explain": "Removing carbon dioxide pulls the equilibrium to the left, using up hydrogen ions and raising the pH, which is how faster breathing counters acidosis.", "concept": "5E", "skill": "concepts", "cover_story": "blood as a buffer", "b": 0.6}, {"stem": "In the lungs, gas exchange depends on partial pressures. In a mixture of gases, the partial pressure of carbon dioxide equals:", "choices": ["The total pressure times its mole fraction", "Always equal to the total pressure", "Independent of how much carbon dioxide is present", "Zero unless carbon dioxide is the only gas"], "answer": 0, "explain": "By Dalton's law, each gas's partial pressure is the total pressure times that gas's mole fraction.", "concept": "4B", "skill": "concepts", "cover_story": "blood as a buffer", "b": 0.1}, {"stem": "Carbonic anhydrase speeds the conversion of carbon dioxide and water to carbonic acid. As a catalyst, it changes the reaction's:", "choices": ["Rate but not the final equilibrium position", "Final equilibrium position but not the rate", "Overall enthalpy change", "Products into different molecules"], "answer": 0, "explain": "A catalyst lowers the activation energy and speeds the forward and reverse steps equally, so it changes the rate but not where the equilibrium settles.", "concept": "5E", "skill": "concepts", "cover_story": "blood as a buffer", "b": 0.3}, {"stem": "Each carbon dioxide that reacts can release one hydrogen ion and one bicarbonate ion. If 4 millimoles of carbon dioxide react this way, how many millimoles of bicarbonate form?", "choices": ["1 millimole", "2 millimoles", "4 millimoles", "8 millimoles"], "answer": 2, "explain": "The stoichiometry is one to one, so 4 millimoles of reacting carbon dioxide yields 4 millimoles of bicarbonate.", "concept": "4E", "skill": "concepts", "cover_story": "blood as a buffer", "b": -0.5}, {"stem": "The bicarbonate buffer holds pH near 7.4 best when the ratio of bicarbonate to dissolved carbon dioxide is kept roughly:", "choices": ["At exactly 1 to 1", "As large as possible", "Constant, since pH depends on the base-to-acid ratio", "As small as possible"], "answer": 2, "explain": "Henderson-Hasselbalch says pH tracks the ratio of conjugate base (bicarbonate) to acid (dissolved carbon dioxide), so holding that ratio steady holds the pH steady.", "concept": "5A", "skill": "concepts", "cover_story": "blood as a buffer", "b": 0.9}]}, {"label": "Crash test collisions", "paragraphs": ["An automotive safety lab studies collisions using an instrumented test car with a total mass of 1000 kg. The car rolls along a level, nearly frictionless track toward a rigid barrier while high-speed cameras and force sensors record the impact. Engineers use g = 10 m/s^2 and ignore air resistance during the short approach. In one baseline trial the car reaches the barrier moving at 20 m/s and is brought fully to rest by its crushing front end. The team then repeats the trial after adding an airbag and a padded barrier, so they can compare how the average stopping force depends on how quickly the car is halted and how that protects the dummy inside.", "In a second experiment two carts collide on the same level track. A 2.0 kg cart moving at 3.0 m/s strikes a stationary 1.0 kg cart. In some runs a bit of clay makes the carts stick together and move off as one after impact, while in other runs a spring bumper lets them bounce apart. The team measures the total momentum and the total kinetic energy just before and just after each collision to classify it as elastic or inelastic. They treat the two carts as an isolated system, so the total momentum immediately before the collision should equal the total momentum immediately after, no matter what happens to the kinetic energy."], "source_ref": "OpenStax University Physics Vol 1, Ch. 9 (Linear Momentum and Collisions)", "questions": [{"stem": "The test car has a mass of 1000 kg and reaches the barrier at 20 m/s. What is the magnitude of its momentum?", "choices": ["20,000 kg m/s", "10,000 kg m/s", "200,000 kg m/s", "400,000 kg m/s"], "answer": 0, "explain": "Momentum is mass times velocity, 1000 times 20 = 20,000 kg m/s. The value 200,000 is the kinetic energy in joules, not the momentum.", "concept": "4A", "skill": "reasoning", "cover_story": "a crash test lab", "b": -0.8}, {"stem": "Using the same 1000 kg mass and 20 m/s speed, what is the car's kinetic energy just before impact?", "choices": ["400,000 J", "100,000 J", "200,000 J", "20,000 J"], "answer": 2, "explain": "Kinetic energy is one half m v squared = 0.5 times 1000 times 20 squared = 200,000 J. Forgetting the factor of one half gives the too large 400,000 J.", "concept": "4A", "skill": "reasoning", "cover_story": "a crash test lab", "b": 0.1}, {"stem": "The barrier brings the car from 20 m/s to rest. What is the magnitude of the impulse the barrier delivers to the car?", "choices": ["20,000 N s", "2,000 N s", "10,000 N s", "200,000 N s"], "answer": 0, "explain": "Impulse equals the change in momentum, from 20,000 kg m/s down to zero, so 20,000 N s. The 200,000 figure again confuses energy with momentum.", "concept": "4A", "skill": "reasoning", "cover_story": "a crash test lab", "b": 0.3}, {"stem": "If the crushing front end stops the car in 0.10 s, what average force does the barrier exert on it?", "choices": ["2,000 N", "20,000 N", "2,000,000 N", "200,000 N"], "answer": 3, "explain": "Average force is impulse over time, 20,000 N s divided by 0.10 s = 200,000 N. Dividing by 0.01 s by mistake gives the too large 2,000,000 N.", "concept": "4A", "skill": "reasoning", "cover_story": "a crash test lab", "b": 0.6}, {"stem": "Adding an airbag and padded barrier lengthens the time over which the car stops. For the same change in momentum, the average force on the car is:", "choices": ["Larger, because the padding adds force", "Unchanged, because the mass is the same", "Smaller, because the same impulse is spread over a longer time", "Zero, because the airbag absorbs all the momentum"], "answer": 2, "explain": "The impulse (change in momentum) is fixed, and force is impulse over time, so a longer stopping time means a smaller average force. That is why airbags reduce injury.", "concept": "4A", "skill": "concepts", "cover_story": "a crash test lab", "b": 0.5}, {"stem": "In the run where the carts stick together, a 2.0 kg cart at 3.0 m/s strikes a stationary 1.0 kg cart. Their common speed just after impact is:", "choices": ["5.0 m/s", "2.0 m/s", "3.0 m/s", "1.0 m/s"], "answer": 1, "explain": "Momentum is conserved: 2.0 times 3.0 = 6.0 kg m/s is shared by the combined 3.0 kg, giving 2.0 m/s. Assuming the speed is unchanged at 3.0 m/s ignores the added mass.", "concept": "4A", "skill": "reasoning", "cover_story": "a crash test lab", "b": 0.7}]}, {"label": "Scuba diver at depth", "paragraphs": ["A diving instructor explains how pressure changes underwater. Seawater has a density close to 1000 kg/m^3, and the diver uses g = 10 m/s^2. At the surface the air presses down with an atmospheric pressure of about 100,000 Pa, which is taken as 1 atm. As the diver descends, the weight of the water above adds to this atmospheric pressure, so the total pressure on the diver's body grows with depth. The instructor notes that this pressure acts equally in all directions at a given depth and depends on how deep the diver is, not on the size or shape of the body of water. Students calculate the pressure at several depths and check how it compares with the pressure at the surface.", "The instructor also explains buoyancy. A buoyancy control device lets the diver hover at one depth by balancing forces: the upward buoyant force from the displaced water is set equal to the diver's weight, so the diver neither rises nor sinks. By Archimedes' principle, that buoyant force equals the weight of the water the diver and gear push aside. The class also notes that pressure in the water is transmitted throughout and acts on every surface, and that at a given depth the pressure is the same in every direction. Because the pressure grows steadily with depth, the diver feels it most strongly on the deepest parts of the body."], "source_ref": "OpenStax University Physics Vol 1, Ch. 14 (Fluid Mechanics)", "questions": [{"stem": "Seawater has a density of about 1000 kg/m^3. How much pressure does a 10 m column of it add at the diver's depth (use g = 10 m/s^2)?", "choices": ["10,000 Pa", "50,000 Pa", "100,000 Pa", "1,000,000 Pa"], "answer": 2, "explain": "Hydrostatic pressure is rho g h = 1000 times 10 times 10 = 100,000 Pa. Using only 1000 times 10 leaves out the depth and gives 10,000 Pa.", "concept": "4B", "skill": "reasoning", "cover_story": "a scuba dive", "b": -1.1}, {"stem": "Including the atmosphere pressing on the surface, the absolute pressure
